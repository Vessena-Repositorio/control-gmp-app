name: Deploy to Coolify

# Hay un solo recurso de Coolify. La rama que construye se elige en Coolify, no
# aca: el webhook despliega la rama que ese recurso tenga configurada. Hoy es
# migracion-postgres; cuando el corte termine sera main, y este workflow no
# necesita cambiar.
#
# Ojo: produccion hoy es GitHub Pages, que sirve main por su cuenta y no pasa
# por aca. Un push a main no toca Coolify mas que para reconstruirlo.
on:
  push:
    branches:
      - main
      - migracion-postgres
  # Permite dispararlo a mano desde la pestana Actions, sin tener que commitear
  # algo para forzar un redeploy.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, coolify]
    steps:
      # El deploy va PRIMERO y sin depender de nada del repo: es un curl y nada
      # mas. Si un paso previo fallara (checkout, red, permisos), el deploy no
      # llegaria a ocurrir, que es peor que no verificarlo.
      - name: Disparar deploy en Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --request GET "$WEBHOOK" --header "Authorization: Bearer $TOKEN"

      # Recien ahora se baja el repo, que solo hace falta para el script de
      # verificacion.
      - uses: actions/checkout@v4

      - name: Verificar que quedo sano
        env:
          URL: ${{ vars.URL_APP }}
        run: bash .github/scripts/verificar-deploy.sh
