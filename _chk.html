        <div class="unit">${overUmbral?`Por encima del umbral ${c.umbralGlobal}%`:`Dentro del umbral ${c.umbralGlobal}%`}</div>
        <div class="divider"></div>
        <div class="desc">Mide el peso real del problema sobre el volumen comercial promedio del trimestre.</div>
      </div>
    </div>
  `);

  // Datos críticos (alerta + ≥corte) — para slides 4 y 5
  const crit = criticosData(c, mes, anio);

  // SLIDE 4 — CATEGORY CHARTS de SKU CRÍTICOS
  const totalDevCrit = crit.itemsDev.reduce((a,s)=>a+s.dev,0);
  const totalRotCrit = crit.itemsRot.reduce((a,s)=>a+s.rot,0);
  slides.push(`
    <div class="slide-eyebrow">Foco crítico · por categoría</div>
    <h2>Dónde se concentra el <em>impacto</em></h2>
    <p class="lead">SKU en alerta (tasa &gt; ${c.umbral}%) con devoluciones o roturas internas ≥ ${crit.corte} unidades. Agrupados por categoría del Maestro.</p>
    <div class="slide-charts">
      <div class="slide-chart">
        <h4>Devoluciones de cliente — críticas</h4>
        <div class="sub">${fmt(totalDevCrit)} unidades · ${crit.itemsDev.length} SKU</div>
        <div class="chart-wrap"><canvas id="pmChartDev"></canvas></div>
      </div>
      <div class="slide-chart">
        <h4>Roturas internas — críticas</h4>
        <div class="sub">${fmt(totalRotCrit)} unidades · ${crit.itemsRot.length} SKU</div>
        <div class="chart-wrap"><canvas id="pmChartRot"></canvas></div>
      </div>
    </div>
  `);

  // SLIDE 5 — MOTIVOS CHARTS
  const sinMotivoDev = totalDevCrit - crit.motivosDev.reduce((a,m)=>a+m.unid,0);
  const sinMotivoRot = totalRotCrit - crit.motivosRot.reduce((a,m)=>a+m.unid,0);
  const hayMotivos = crit.motivosDev.length > 0 || crit.motivosRot.length > 0;
  if(hayMotivos){
    slides.push(`
      <div class="slide-eyebrow">Foco crítico · por motivo</div>
      <h2>Por qué <em>vuelven</em> o se <em>rompen</em></h2>
      <p class="lead">Distribución por motivo cargado en reunión con Jefa de Logística. ${sinMotivoDev+sinMotivoRot > 0 ? `<b>${fmt(sinMotivoDev+sinMotivoRot)} unidades</b> aún sin motivo asignado.` : 'Relevamiento completo ✓'}</p>
      <div class="slide-charts">
        <div class="slide-chart">
          <h4>Devoluciones — por motivo</h4>
          <div class="sub">${crit.motivosDev.length} motivos · ${fmt(crit.motivosDev.reduce((a,m)=>a+m.unid,0))} unidades clasificadas</div>
          <div class="chart-wrap"><canvas id="pmChartMotDev"></canvas></div>
        </div>
        <div class="slide-chart">
          <h4>Roturas internas — por motivo</h4>
          <div class="sub">${crit.motivosRot.length} motivos · ${fmt(crit.motivosRot.reduce((a,m)=>a+m.unid,0))} unidades clasificadas</div>
          <div class="chart-wrap"><canvas id="pmChartMotRot"></canvas></div>
        </div>
      </div>
    `);
  } else {
    slides.push(`
      <div class="slide-eyebrow">Foco crítico · por motivo</div>
      <h2>Motivos <em>pendientes</em> de carga</h2>
      <p class="lead">Aún no se cargaron motivos para los SKU críticos. Completá la sección "Motivos por SKU" del tablero después de la reunión con Logística para que este slide se rellene automáticamente.</p>
      <div style="background:var(--paper-2);border:1px solid var(--line);padding:60px;text-align:center;border-radius:2px;color:var(--muted);font-family:'Fraunces',serif;font-style:italic;font-size:18px">
        Sin motivos cargados — slide vacío
      </div>
    `);
  }

  // SLIDE 6 — LISTADO COMPLETO DE SKU CRÍTICOS (un solo listado: dev + rot + motivos)
  const criticosPres = c.skus
    .filter(s => s.tasa > c.umbral && (s.dev >= crit.corte || s.rot >= crit.corte))
    .sort((a,b) => (b.dev + b.rot) - (a.dev + a.rot));
  if(criticosPres.length > 0){
    const motivosMap = crit.motivosMap;
    const totDev = criticosPres.reduce((a,s)=>a+s.dev,0);
    const totRot = criticosPres.reduce((a,s)=>a+s.rot,0);
    const fmtMotivo = (mObj) => mObj && mObj.motivo
      ? (mObj.nota ? `<b>${mObj.motivo}</b><div style="font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:400">${mObj.nota.replace(/</g,'&lt;')}</div>` : `<b>${mObj.motivo}</b>`)
      : '<span style="color:#A8B0BC;font-style:italic">— por completar</span>';

    const rows = criticosPres.slice(0,10).map((s,i)=>{
      const mDev = motivosMap[s.codigo] && motivosMap[s.codigo].dev;
      const mRot = motivosMap[s.codigo] && motivosMap[s.codigo].rot;
      const devCrit = s.dev >= crit.corte;
      const rotCrit = s.rot >= crit.corte;
      const motDevHtml = devCrit ? fmtMotivo(mDev) : '<span style="color:#CBD2DA">—</span>';
      const motRotHtml = rotCrit ? fmtMotivo(mRot) : '<span style="color:#CBD2DA">—</span>';
      const motDevBg = (devCrit && mDev && mDev.motivo) ? 'background:#F0FAF4;' : '';
      const motRotBg = (rotCrit && mRot && mRot.motivo) ? 'background:#F0FAF4;' : '';
      return `
      <tr>
        <td><span class="rank-rank">${i+1}</span></td>
        <td class="sku-code">${s.codigo}</td>
        <td class="prod" title="${(s.producto||'').replace(/"/g,'&quot;')}">${s.producto||'—'}</td>
        <td><span class="pill">${s.categoria}</span></td>
        <td class="num" style="${devCrit?'color:#C2410C;font-weight:700':''}">${fmt(s.dev)}</td>
        <td class="num" style="${rotCrit?'color:var(--red);font-weight:700':''}">${s.rot>0?fmt(s.rot):'—'}</td>
        <td class="num alert">${pct(s.tasa,2)}</td>
        <td style="font-size:11.5px;line-height:1.35;padding:8px 10px;${motDevBg}">${motDevHtml}</td>
        <td style="font-size:11.5px;line-height:1.35;padding:8px 10px;${motRotBg}">${motRotHtml}</td>
      </tr>`;
    }).join("");

    // Resumen de motivos: combinar dev + rot
    const motivoTotals = {};
    criticosPres.forEach(sk => {
      const mD = motivosMap[sk.codigo] && motivosMap[sk.codigo].dev;
      const mR = motivosMap[sk.codigo] && motivosMap[sk.codigo].rot;
      if(mD && mD.motivo) motivoTotals[mD.motivo] = (motivoTotals[mD.motivo]||0) + sk.dev;
      if(mR && mR.motivo) motivoTotals[mR.motivo] = (motivoTotals[mR.motivo]||0) + sk.rot;
    });
    const topMotivos = Object.entries(motivoTotals).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const motivosChips = topMotivos.length > 0
      ? `<div style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap">${topMotivos.map(([m,u])=>`<div style="background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--gold);padding:8px 14px;border-radius:2px"><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600">${m}</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:18px;color:var(--ink)">${fmt(u)} <span style="font-size:11px;color:var(--muted);font-style:italic">unidades</span></div></div>`).join("")}</div>`
      : "";

    slides.push(`
      <div class="slide-eyebrow">SKU críticos · tasa > ${c.umbral}% y ≥ ${crit.corte} u.</div>
      <h2>${criticosPres.length} SKU críticos del mes</h2>
      <p class="lead">Devoluciones: <b>${fmt(totDev)}</b> u. · Roturas internas: <b>${fmt(totRot)}</b> u. · Ordenados por impacto total. ${criticosPres.length>10?`Mostrando los 10 primeros — listado completo en el Excel.`:''}</p>
      ${motivosChips}
      <div class="slide-table-wrap">
        <table class="rank-table">
          <thead><tr>
            <th>#</th><th>SKU</th><th>Producto</th><th>Categoría</th>
            <th style="text-align:right">Dev.</th><th style="text-align:right">Rot.</th><th style="text-align:right">Tasa</th>
            <th>Motivo devolución</th><th>Motivo rotura</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `);
  } else {
    slides.push(`
      <div class="slide-eyebrow">SKU críticos</div>
      <h2>Sin SKU críticos del mes</h2>
      <p class="lead">Ningún SKU supera el ${c.umbral}% con devoluciones o roturas ≥ ${crit.corte} unidades. Comportamiento dentro del rango aceptable.</p>
      <div style="background:#F0FAF4;border:1px solid var(--green-soft);padding:60px;text-align:center;border-radius:2px">
        <div style="font-family:'Fraunces',serif;font-size:96px;color:var(--green);font-weight:500">✓</div>
      </div>
    `);
  }

  // (Slides finales "Hallazgos & próximos pasos" y "Gracias" eliminados:
  //  esta presentación es parte de un comité más amplio, no termina acá.)

  // Render to DOM
  stage.innerHTML = slides.map((html, i) => `<div class="pm-slide ${i===0?'active':''}" data-idx="${i}">${html}</div>`).join("");
  STATE.totalSlides = slides.length;
  STATE.currentSlide = 0;
  $("pmTot").textContent = slides.length;
  $("pmCur").textContent = 1;

  // Render charts inside slide 4 (only when slide visible — deferred)
  setTimeout(() => mountPresentCharts(c), 50);
}

function mountPresentCharts(c){
  const fontFamily = "Inter Tight, sans-serif";
  const mes = STATE.mes, anio = STATE.anio;
  const crit = criticosData(c, mes, anio);

  const emptyMsg = (titulo, detalle) => `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px"><div style="font-family:'Fraunces',serif;font-size:54px;color:var(--green-soft);font-weight:500;line-height:1;margin-bottom:14px">∅</div><div style="font-family:'Fraunces',serif;font-weight:500;font-size:16px;color:var(--ink);margin-bottom:8px">${titulo}</div><div style="font-size:12px;color:var(--muted);line-height:1.5;max-width:280px">${detalle}</div></div>`;

  // === Categoría — Devoluciones críticas (donut) ===
  const devEl = $("pmChartDev");
  if(devEl && crit.catsDev.length > 0){
    STATE.presentCharts.dev = new Chart(devEl, {
      type:"doughnut",
      data:{labels:crit.catsDev.map(x=>x.cat), datasets:[{data:crit.catsDev.map(x=>x.unid), backgroundColor:PALETTE.slice(0,crit.catsDev.length), borderColor:"#fff", borderWidth:3}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"60%",
        plugins:{legend:{position:"right",labels:{font:{family:fontFamily,size:13},color:"#2D3B52",boxWidth:14,padding:14}},
          tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return `${ctx.label}: ${fmt(ctx.parsed)} u (${((ctx.parsed/t)*100).toFixed(1)}%)`;}}}}}
    });
  } else if(devEl){
    devEl.parentElement.innerHTML = emptyMsg("Sin devoluciones críticas", `Ningún SKU supera el ${c.umbral}% de tasa con ≥ ${crit.corte} unidades de devolución en el mes.`);
  }

  // === Categoría — Roturas críticas (bar horizontal) ===
  const rotEl = $("pmChartRot");
  if(rotEl && crit.catsRot.length > 0){
    STATE.presentCharts.rot = new Chart(rotEl, {
      type:"bar",
      data:{labels:crit.catsRot.map(x=>x.cat), datasets:[{data:crit.catsRot.map(x=>x.unid), backgroundColor:"#991B1B", borderRadius:2}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmt(ctx.parsed.x)} unidades`}}},
        scales:{x:{grid:{color:"#EEF0F2"},ticks:{font:{family:fontFamily,size:12},color:"#6B7A8F",callback:v=>fmt(v)}},
          y:{grid:{display:false},ticks:{font:{family:fontFamily,size:13},color:"#2D3B52"}}}}
    });
  } else if(rotEl){
    rotEl.parentElement.innerHTML = emptyMsg("Sin roturas críticas", `Ningún SKU supera el ${c.umbral}% de tasa con ≥ ${crit.corte} unidades de rotura interna en el mes.`);
  }

  // === Motivo — Devoluciones (donut) ===
  const motDevEl = $("pmChartMotDev");
  if(motDevEl && crit.motivosDev.length > 0){
    STATE.presentCharts.motDev = new Chart(motDevEl, {
      type:"doughnut",
      data:{labels:crit.motivosDev.map(x=>x.motivo), datasets:[{data:crit.motivosDev.map(x=>x.unid), backgroundColor:PALETTE.slice(0,crit.motivosDev.length), borderColor:"#fff", borderWidth:3}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"60%",
        plugins:{legend:{position:"right",labels:{font:{family:fontFamily,size:13},color:"#2D3B52",boxWidth:14,padding:14}},
          tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return `${ctx.label}: ${fmt(ctx.parsed)} u (${((ctx.parsed/t)*100).toFixed(1)}%)`;}}}}}
    });
  } else if(motDevEl){
    const hayCriticos = crit.itemsDev.length > 0;
    motDevEl.parentElement.innerHTML = emptyMsg(
      hayCriticos ? "Motivos pendientes" : "Sin devoluciones críticas",
      hayCriticos
        ? `${crit.itemsDev.length} SKU críticos de devolución sin motivo cargado. Completá la sección "Motivos por SKU" del tablero.`
        : `Ningún SKU cumple el criterio de devolución crítica este mes.`
    );
  }

  // === Motivo — Roturas (bar horizontal) ===
  const motRotEl = $("pmChartMotRot");
  if(motRotEl && crit.motivosRot.length > 0){
    STATE.presentCharts.motRot = new Chart(motRotEl, {
      type:"bar",
      data:{labels:crit.motivosRot.map(x=>x.motivo), datasets:[{data:crit.motivosRot.map(x=>x.unid), backgroundColor:"#991B1B", borderRadius:2}]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${fmt(ctx.parsed.x)} unidades`}}},
        scales:{x:{grid:{color:"#EEF0F2"},ticks:{font:{family:fontFamily,size:12},color:"#6B7A8F",callback:v=>fmt(v)}},
          y:{grid:{display:false},ticks:{font:{family:fontFamily,size:13},color:"#2D3B52"}}}}
    });
  } else if(motRotEl){
    const hayCriticos = crit.itemsRot.length > 0;
    motRotEl.parentElement.innerHTML = emptyMsg(
      hayCriticos ? "Motivos pendientes" : "Sin roturas críticas",
      hayCriticos
        ? `${crit.itemsRot.length} SKU críticos de rotura sin motivo cargado. Completá la sección "Motivos por SKU" del tablero.`
        : `Ningún SKU cumple el criterio de rotura crítica este mes.`
    );
  }
}

function goToSlide(idx){
  if(idx < 0 || idx >= STATE.totalSlides) return;
  document.querySelectorAll(".pm-slide").forEach((s,i) => s.classList.toggle("active", i===idx));
  STATE.currentSlide = idx;
  $("pmCur").textContent = idx + 1;
}
function nextSlide(){ goToSlide(STATE.currentSlide + 1); }
function prevSlide(){ goToSlide(STATE.currentSlide - 1); }

function openPresent(){
  if(!STATE.computed) return;
  buildPresentation();
  $("presentMode").classList.add("active");
  document.body.classList.add("presenting");
}
function closePresent(){
  $("presentMode").classList.remove("active");
  document.body.classList.remove("presenting");
}
$("btnPresent")?.addEventListener("click", openPresent);
$("pmExit").addEventListener("click", closePresent);
$("pmNext").addEventListener("click", nextSlide);
$("pmPrev").addEventListener("click", prevSlide);
document.addEventListener("keydown", e => {
  if(!$("presentMode").classList.contains("active")) return;
  if(e.key === "Escape") closePresent();
  else if(e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); nextSlide(); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prevSlide(); }
});
/* ============================================================
   GENERAR EXCEL — con fórmulas vivas
   ============================================================ */
function generateExcel(c, monitor, mov, mes, anio){
  const wb = XLSX.utils.book_new();

  const sheetVta = `vta ultimos 3M ${mes}`;
  const sheetMov = `${mes} ${anio}`;
  const sheetTD  = `TD ${mes}`;
  const sheetRes = `RESUMEN ${mes} ${anio}`;

  // ---------- SHEET: vta ultimos 3M MES ----------
  {
    const headers = ["Código Producto","Producto", monitor.mesHeaders[0]||"Mes -3", monitor.mesHeaders[1]||"Mes -2", monitor.mesHeaders[2]||"Mes -1", "Promedio 3 meses"];
    const data = [headers];
    const zeroNeg = $("zeroNeg").checked;
    const z = (x) => (zeroNeg && Number(x) < 0) ? 0 : x;
    monitor.ventas.forEach((v) => {
      // Si zeroNeg activo, negativos → 0 en m1/m2/m3. El promedio NO se recalcula:
      // se escribe tal cual viene del Monitor.
      data.push([v.codigo, v.producto, z(v.m1), z(v.m2), z(v.m3), v.promedio]);
    });
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{wch:14},{wch:50},{wch:12},{wch:12},{wch:12},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws, sheetVta);
  }

  // ---------- SHEET: MES ANIO (movimientos brutos) ----------
  {
    // Replicar layout original — colocar columnas en A..N
    // Necesitamos: A Grupo, B Estado, C Código, D Almacén, E Nombre, F Fecha, G Documento, H N°Doc, I UM, J Socio, K Stock Inicial, L Entrada, M Salida, N Acumulado
    const headers = ["Grupo Empresarial","Estado de Stock","Código Producto","Almacén","Nombre Producto","Fecha Movimiento","Documento","Número Doc.","UM","Socio de Negocio","Stock Inicial","Entrada","Salida","Acumulado"];
    const data = [headers];
    // Mapear desde mov.rawAOA usando los índices ya detectados en parseMovimientos.
    // Si el archivo trae fila de encabezados la buscamos; si no, asumimos las posiciones
    // fijas del export crudo de Idempiere.
    const headSrc = (mov.rawAOA[0] || []).map(h => norm(h));
    const hasHeader = headSrc.some(h => h && h.includes("documento"))
                   && headSrc.some(h => h && h.startsWith("entrada"));
    const idx = {};
    if(hasHeader){
      const find = (...needles) => {
        for(const n of needles){
          const i = headSrc.findIndex(h => h && h.includes(norm(n)));
          if(i >= 0) return i;
        }
        return -1;
      };
      idx.grupo  = find("grupo empresarial","grupo");
      idx.estado = find("estado de stock","estado");
      idx.codigo = find("codigo producto","código producto");
      idx.alma   = find("almacen","almacén");
      idx.nom    = find("nombre producto","producto");
      idx.fecha  = find("fecha movimiento","fecha");
      idx.doc    = find("documento");
      idx.ndoc   = find("numero doc","número doc","nro doc","n° doc");
      idx.um     = find("um","unidad");
      idx.socio  = find("socio de negocio","socio");
      idx.si     = find("stock inicial");
      idx.ent    = find("entrada");
      idx.sal    = find("salida");
      idx.acu    = find("acumulado");
    } else {
      // Export crudo Idempiere — posiciones fijas
      idx.grupo=0; idx.estado=1; idx.codigo=2; idx.alma=3; idx.nom=4;
      idx.fecha=5; idx.doc=6; idx.ndoc=7; idx.um=8; idx.socio=9;
      idx.si=10; idx.ent=11; idx.sal=12; idx.acu=13;
    }

    const startRow = (typeof mov.dataStart === "number" && mov.dataStart > 0) ? mov.dataStart : 1;
    for(let r=startRow; r<mov.rawAOA.length; r++){
      const src = mov.rawAOA[r];
      if(!src || src.every(c => c==null||c==="")) continue;
      const doc = (src[idx.doc] || "").toString().trim();
      if(!doc) continue;
      if(norm(doc).includes("movimiento de inventario")) continue;
      data.push([
        idx.grupo>=0?src[idx.grupo]:"",
        idx.estado>=0?src[idx.estado]:"",
        idx.codigo>=0?src[idx.codigo]:"",
        idx.alma>=0?src[idx.alma]:"",
        idx.nom>=0?src[idx.nom]:"",
        idx.fecha>=0?src[idx.fecha]:"",
        doc,
        idx.ndoc>=0?src[idx.ndoc]:"",
        idx.um>=0?src[idx.um]:"",
        idx.socio>=0?src[idx.socio]:"",
        idx.si>=0?(Number(src[idx.si])||0):0,
        idx.ent>=0?(Number(src[idx.ent])||0):0,
        idx.sal>=0?(Number(src[idx.sal])||0):0,
        idx.acu>=0?(Number(src[idx.acu])||0):0,
      ]);
    }
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = [{wch:12},{wch:12},{wch:12},{wch:24},{wch:36},{wch:12},{wch:32},{wch:12},{wch:8},{wch:24},{wch:10},{wch:10},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws, sheetMov);
  }

  // ---------- SHEET: TD MES — Tabla dinámica con fórmulas vivas ----------
  {
    const headers = ["SKU","Producto","Categoría","Marca","Unidades Devueltas","Unidades Rotura Interna","Total Unidades","Promedio Venta 3M","Tasa Devolución %","Estado"];
    const data = [headers];
    // Para cada SKU con movimiento → fila con fórmulas
    c.skus.forEach((s) => {
      data.push([s.codigo, s.producto, s.categoria, s.marca, null, null, null, null, null, null]);
    });
    const ws = XLSX.utils.aoa_to_sheet(data);
    for(let r = 2; r <= data.length; r++){
      ws[`E${r}`] = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!C:C,A${r},'${sheetMov}'!G:G,"DEVOLUCIÓN DE CLIENTE")`};
      ws[`F${r}`] = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!C:C,A${r},'${sheetMov}'!G:G,"TRANSFERENCIA LOGISTICA-ROTURA")`};
      ws[`G${r}`] = {t:"n", f:`E${r}+F${r}`};
      ws[`H${r}`] = {t:"n", f:`IFERROR(VLOOKUP(VALUE(A${r}),'${sheetVta}'!A:F,6,FALSE),0)`};
      ws[`I${r}`] = {t:"n", f:`IFERROR(ROUND(E${r}/H${r}*100,2),0)`, z:"0.00"};
      ws[`J${r}`] = {t:"s", f:`IF(I${r}>${c.umbral},"ALERTA","OK")`};
    }
    ws["!cols"] = [{wch:12},{wch:48},{wch:22},{wch:16},{wch:14},{wch:14},{wch:14},{wch:16},{wch:14},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, sheetTD);
  }

  // ---------- SHEET: RESUMEN ----------
  {
    const data = [];
    data.push([`INFORME DE DEVOLUCIONES Y ROTURAS INTERNAS — ${mes} ${anio}`]);
    data.push([]);
    data.push(["1. RESUMEN EJECUTIVO"]);
    data.push([]);
    data.push(["Indicador", "Valor", "Fórmula / Origen"]);
    const ROW_RESUMEN_START = data.length + 1; // próximas filas tienen fórmulas
    // Filas con fórmulas
    data.push(["Total devoluciones de cliente", null, `=SUMIFS('${sheetMov}'!L:L,...)`]);
    data.push(["Total roturas internas", null, `=SUMIFS('${sheetMov}'!L:L,...)`]);
    data.push(["Total general (dev + rot)", null, `=B${ROW_RESUMEN_START}+B${ROW_RESUMEN_START+1}`]);
    data.push(["SKU con devoluciones", null, `=COUNTIF(...)`]);
    data.push(["SKU con roturas internas", null, `=COUNTIF(...)`]);
    data.push(["Promedio unidades devueltas / SKU", null, `=B${ROW_RESUMEN_START}/B${ROW_RESUMEN_START+3}`]);
    data.push(["Suma promedio venta 3M (todos los SKU)", null, `=SUM('${sheetVta}'!F:F)`]);
    data.push(["Tasa global (dev + rot) %", null, `=B${ROW_RESUMEN_START+2}/B${ROW_RESUMEN_START+6}*100`]);
    data.push([`SKU en alerta (tasa > ${c.umbral}%)`, null, `=COUNTIF('${sheetTD}'!J:J,"ALERTA")`]);
    data.push([]);
    // Sección 2
    // Calcular corte (default 50) y filtrar críticos
    const _corteEl = document.getElementById("corteMotivos");
    const _corte = _corteEl ? (Number(_corteEl.value)>0 ? Number(_corteEl.value) : 50) : 50;
    const _criticos = c.skus
      .filter(s => s.tasa > c.umbral && (s.dev >= _corte || s.rot >= _corte))
      .sort((a,b) => b.dev - a.dev);
    data.push([`2. SKU CRÍTICOS — TASA > ${c.umbral}% Y DEV. ó ROT. ≥ ${_corte} U.`]);
    data.push([]);
    data.push(["SKU","Producto","Categoría","Marca","Unidades Devueltas","Promedio Venta 3M","Tasa %","Motivo"]);
    const ALERTA_HEADER_ROW = data.length;
    // Cargar motivos del localStorage (v2 schema)
    let _motivosExcel = {};
    _motivosExcel = (mes===STATE.mes && anio===STATE.anio) ? getMotivos() : (function(){ try{ return JSON.parse(localStorage.getItem(`motivos_${APP_VERSION}:${mes}_${anio}`)||"{}"); }catch(e){return {};} })();
    _criticos.forEach(s => {
      const mot = _motivosExcel[s.codigo] && _motivosExcel[s.codigo].dev;
      const motivoTxt = mot && mot.motivo ? (mot.nota ? `${mot.motivo} — ${mot.nota}` : mot.motivo) : "";
      data.push([s.codigo, s.producto, s.categoria, s.marca, null, null, null, motivoTxt]);
    });
    const ALERTA_END_ROW = data.length;
    data.push([]);
    // Sección 3
    data.push(["3. DEVOLUCIONES POR CATEGORÍA"]);
    data.push([]);
    data.push(["Categoría","Unidades Devueltas","Participación %"]);
    const CAT_DEV_HEADER = data.length;
    const catsDev = [...c.categorias].sort((a,b) => b.dev - a.dev).filter(x => x.dev > 0);
    catsDev.forEach(cat => {
      data.push([cat.cat, cat.dev, null]);
    });
    const CAT_DEV_END = data.length;
    data.push([]);
    // Sección 4
    data.push(["4. ROTURAS INTERNAS — POR CATEGORÍA Y TOP SKU"]);
    data.push([]);
    data.push(["Categoría","Unidades Rotura Interna","Participación %"]);
    const CAT_ROT_HEADER = data.length;
    const catsRot = [...c.categorias].sort((a,b) => b.rot - a.rot).filter(x => x.rot > 0);
    catsRot.forEach(cat => {
      data.push([cat.cat, cat.rot, null]);
    });
    const CAT_ROT_END = data.length;
    data.push([]);
    data.push(["Top 10 SKU con mayor rotura interna"]);
    data.push(["SKU","Producto","Categoría","Marca","Unidades Rotura"]);
    const TOP_ROT_HEADER = data.length;
    c.topRot.forEach(s => {
      data.push([s.codigo, s.producto, s.categoria, s.marca, null]);
    });
    const TOP_ROT_END = data.length;
    data.push([]);
    // Sección 5
    data.push(["5. OBSERVACIONES Y HALLAZGOS"]);
    data.push([]);
    data.push(["• Tasa global del mes: ", null]);
    data.push(["• SKU en alerta concentran: ", null]);
    data.push(["• Categoría con mayor incidencia (devoluciones): ", catsDev[0]?.cat || "—"]);
    data.push(["• Categoría con mayor incidencia (roturas): ", catsRot[0]?.cat || "—"]);
    data.push([]);
    data.push(["Notas metodológicas:"]);
    data.push(["— Tasa SKU = unidades devueltas / promedio venta 3M × 100 (solo devoluciones, no roturas)."]);
    data.push(["— Tasa global = (devoluciones + roturas) / suma del promedio venta 3M de todos los SKU activos."]);
    data.push(["— Movimientos del tipo 'MOVIMIENTO DE INVENTARIO' se excluyen del análisis."]);
    data.push([`— Umbral de alerta: tasa > ${c.umbral}%.`]);

    const ws = XLSX.utils.aoa_to_sheet(data);

    // Ahora inyectar fórmulas en las celdas correctas
    // Resumen ejecutivo
    ws[`B${ROW_RESUMEN_START}`]   = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!G:G,"DEVOLUCIÓN DE CLIENTE")`};
    ws[`B${ROW_RESUMEN_START+1}`] = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!G:G,"TRANSFERENCIA LOGISTICA-ROTURA")`};
    ws[`B${ROW_RESUMEN_START+2}`] = {t:"n", f:`B${ROW_RESUMEN_START}+B${ROW_RESUMEN_START+1}`};
    ws[`B${ROW_RESUMEN_START+3}`] = {t:"n", f:`COUNTIF('${sheetTD}'!E:E,">0")`};
    ws[`B${ROW_RESUMEN_START+4}`] = {t:"n", f:`COUNTIF('${sheetTD}'!F:F,">0")`};
    ws[`B${ROW_RESUMEN_START+5}`] = {t:"n", f:`IFERROR(B${ROW_RESUMEN_START}/B${ROW_RESUMEN_START+3},0)`, z:"0.00"};
    ws[`B${ROW_RESUMEN_START+6}`] = {t:"n", f:`SUM('${sheetVta}'!F:F)`};
    ws[`B${ROW_RESUMEN_START+7}`] = {t:"n", f:`IFERROR(B${ROW_RESUMEN_START+2}/B${ROW_RESUMEN_START+6}*100,0)`, z:"0.00"};
    ws[`B${ROW_RESUMEN_START+8}`] = {t:"n", f:`COUNTIF('${sheetTD}'!J:J,"ALERTA")`};

    // SKU EN ALERTA — fórmulas en E (unid), F (prom), G (tasa)
    for(let r = ALERTA_HEADER_ROW + 1; r <= ALERTA_END_ROW; r++){
      ws[`E${r}`] = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!C:C,A${r},'${sheetMov}'!G:G,"DEVOLUCIÓN DE CLIENTE")`};
      ws[`F${r}`] = {t:"n", f:`IFERROR(VLOOKUP(VALUE(A${r}),'${sheetVta}'!A:F,6,FALSE),0)`};
      ws[`G${r}`] = {t:"n", f:`IFERROR(ROUND(E${r}/F${r}*100,2),0)`, z:"0.00"};
    }

    // CATEGORÍAS DEV — participación
    for(let r = CAT_DEV_HEADER + 1; r <= CAT_DEV_END; r++){
      ws[`C${r}`] = {t:"n", f:`IFERROR(ROUND(B${r}/SUM(B${CAT_DEV_HEADER+1}:B${CAT_DEV_END})*100,1),0)`, z:"0.0"};
    }
    // CATEGORÍAS ROT — participación
    for(let r = CAT_ROT_HEADER + 1; r <= CAT_ROT_END; r++){
      ws[`C${r}`] = {t:"n", f:`IFERROR(ROUND(B${r}/SUM(B${CAT_ROT_HEADER+1}:B${CAT_ROT_END})*100,1),0)`, z:"0.0"};
    }
    // TOP ROT — unidades
    for(let r = TOP_ROT_HEADER + 1; r <= TOP_ROT_END; r++){
      ws[`E${r}`] = {t:"n", f:`SUMIFS('${sheetMov}'!L:L,'${sheetMov}'!C:C,A${r},'${sheetMov}'!G:G,"TRANSFERENCIA LOGISTICA-ROTURA")`};
    }

    // Observaciones — referencias dinámicas
    // Buscar fila de obs (después de top rot)
    const obsRowGlobal = TOP_ROT_END + 4; // +1 vacía, +1 título "5.", +1 vacía, +1 = obs
    ws[`B${obsRowGlobal}`]   = {t:"n", f:`B${ROW_RESUMEN_START+7}`, z:'0.00"%"'};
    ws[`B${obsRowGlobal+1}`] = {t:"n", f:`SUMIF('${sheetTD}'!J:J,"ALERTA",'${sheetTD}'!E:E)`};

    // Estilos: column widths
    ws["!cols"] = [{wch:42},{wch:18},{wch:28},{wch:18},{wch:20},{wch:18},{wch:14},{wch:28}];

    // Merges para títulos
    ws["!merges"] = ws["!merges"] || [];
    ws["!merges"].push({s:{r:0,c:0},e:{r:0,c:7}}); // Título principal

    XLSX.utils.book_append_sheet(wb, ws, sheetRes);

    // Reordenar: RESUMEN primero
    wb.SheetNames = [sheetRes, sheetVta, sheetMov, sheetTD];
  }

  // Generar archivo
  const fileName = `Devoluciones_y_Roturas_${mes}_${anio}.xlsx`;
  XLSX.writeFile(wb, fileName, {cellStyles:true});
  return fileName;
}

/* ============================================================
   GENERAR PPT — basada en build_ppt.js con datos reales
   ============================================================ */
function generatePPT(c, monitor, mes, anio){
  const pres = new PptxGenJS();
  pres.layout = "LAYOUT_WIDE";
  pres.title = "Devoluciones y Roturas Internas";

  const C = {
    navy: "0B1F3A", navyAlt: "13294B", ink: "1E2A44", body: "374151",
    muted: "6B7280", line: "E5E7EB", bg: "FFFFFF", surface: "F7F8FA",
    amber: "D97706", amberSoft: "FEF3C7", red: "B91C1C", green: "047857",
    greenSoft: "D1FAE5", accent: "C9A14A", yellowFill: "FFF7CC",
  };
  const SW = 13.33, SH = 7.5;
  const fmtP = (n) => Number(n||0).toLocaleString("es-AR", {maximumFractionDigits:0});
  const pctP = (n,d=2) => `${Number(n||0).toFixed(d)}%`;
  const mesCap = mes.charAt(0) + mes.slice(1).toLowerCase();
  const overUmbral = c.tasaGlobal > c.umbralGlobal;

  function addFooter(s, pageNum){
    s.addShape(pres.shapes.RECTANGLE, {x:0, y:SH-0.35, w:SW, h:0.02, fill:{color:C.line}, line:{type:"none"}});
    s.addText("Análisis Devoluciones & Roturas Internas", {x:0.5, y:SH-0.32, w:6, h:0.3, fontSize:9, fontFace:"Calibri", color:C.muted, margin:0});
    s.addText(`${mes} ${anio}   ·   Confidencial`, {x:SW-4, y:SH-0.32, w:3, h:0.3, fontSize:9, fontFace:"Calibri", color:C.muted, align:"right", margin:0});
    s.addText(String(pageNum), {x:SW-0.8, y:SH-0.32, w:0.3, h:0.3, fontSize:9, fontFace:"Calibri", color:C.muted, align:"right", margin:0});
  }
  function eyebrow(s, text){
    s.addText(text, {x:0.5, y:0.4, w:8, h:0.3, fontSize:10, fontFace:"Calibri", color:C.accent, bold:true, charSpacing:4, margin:0});
  }
  function slideTitle(s, text){
    s.addText(text, {x:0.5, y:0.7, w:SW-1, h:0.6, fontSize:26, fontFace:"Georgia", color:C.ink, bold:true, margin:0});
  }
  function slideSubtitle(s, text){
    s.addText(text, {x:0.5, y:1.25, w:SW-1, h:0.35, fontSize:12, fontFace:"Calibri", color:C.muted, margin:0});
  }

  // ============== SLIDE 1 — PORTADA ==============
  {
    const s = pres.addSlide();
    s.background = {color: C.navy};
    s.addShape(pres.shapes.RECTANGLE, {x:0, y:0, w:0.18, h:SH, fill:{color:C.accent}, line:{type:"none"}});
    s.addText("INFORME EJECUTIVO", {x:0.9, y:1.6, w:8, h:0.4, fontSize:12, fontFace:"Calibri", color:C.accent, bold:true, charSpacing:8, margin:0});
    s.addText("Devoluciones y Roturas Internas", {x:0.9, y:2.1, w:11, h:1.5, fontSize:44, fontFace:"Georgia", color:"FFFFFF", bold:true, margin:0});
    s.addText(`${mes} ${anio}`, {x:0.9, y:3.6, w:11, h:0.6, fontSize:28, fontFace:"Georgia", color:"FFFFFF", italic:true, margin:0});
    s.addShape(pres.shapes.RECTANGLE, {x:0.9, y:4.6, w:1.2, h:0.03, fill:{color:C.accent}, line:{type:"none"}});
    s.addText("Análisis mensual de tasas de devolución por SKU, identificación de desvíos y\nseguimiento de roturas internas en el centro de distribución.", {x:0.9, y:4.85, w:9, h:1.2, fontSize:14, fontFace:"Calibri", color:"CADCFC", margin:0});
    s.addText("Preparado para Gerencia   ·   Operaciones & Supply Chain", {x:0.9, y:SH-0.9, w:9, h:0.3, fontSize:10, fontFace:"Calibri", color:"9CA3AF", charSpacing:4, margin:0});
  }

  // ============== SLIDE 2 — RESUMEN EJECUTIVO ==============
  {
    const s = pres.addSlide();
    s.background = {color: C.bg};
    eyebrow(s, "RESUMEN EJECUTIVO");
    slideTitle(s, `Panorama del mes — ${mesCap} ${anio}`);
    slideSubtitle(s, "Indicadores clave consolidados a partir del Monitor de Ventas y los movimientos de stock.");

    const kpis = [
      {label:"Venta promedio 3M", value:fmtP(c.sumaProm), sub:"unidades / mes", color:C.navy},
      {label:"Devoluciones de cliente", value:fmtP(c.totalDev), sub:`${c.skuConDev} SKU afectados`, color:C.ink},
      {label:"Roturas internas", value:fmtP(c.totalRot), sub:`${c.skuConRot} SKU afectados`, color:C.ink},
      {label:"Tasa global dev. + rot.", value:pctP(c.tasaGlobal,2), sub:overUmbral?`Por encima del umbral ${c.umbralGlobal}%`:`Dentro del umbral ${c.umbralGlobal}%`, color:overUmbral?C.red:C.green},
    ];
    const cardY=1.85, cardH=1.6, cardW=2.9, gap=0.25;
    const startX = (SW - (cardW*4 + gap*3))/2;
    kpis.forEach((k,i) => {
      const x = startX + i*(cardW+gap);
      s.addShape(pres.shapes.RECTANGLE, {x, y:cardY, w:cardW, h:cardH, fill:{color:C.surface}, line:{color:C.line, width:0.75}});
      s.addShape(pres.shapes.RECTANGLE, {x, y:cardY, w:0.06, h:cardH, fill:{color:k.color}, line:{type:"none"}});
      s.addText(k.label.toUpperCase(), {x:x+0.25, y:cardY+0.15, w:cardW-0.35, h:0.3, fontSize:9, fontFace:"Calibri", color:C.muted, bold:true, charSpacing:3, margin:0});
      s.addText(k.value, {x:x+0.25, y:cardY+0.45, w:cardW-0.35, h:0.7, fontSize:32, fontFace:"Georgia", color:k.color, bold:true, margin:0});
      s.addText(k.sub, {x:x+0.25, y:cardY+1.15, w:cardW-0.35, h:0.35, fontSize:10, fontFace:"Calibri", color:C.body, italic:true, margin:0});
    });

    const bandY = 3.85;
    s.addShape(pres.shapes.RECTANGLE, {x:0.5, y:bandY, w:SW-1, h:2.3, fill:{color:C.navy}, line:{type:"none"}});
    s.addText("LECTURA DEL MES", {x:0.85, y:bandY+0.25, w:6, h:0.3, fontSize:10, fontFace:"Calibri", color:C.accent, bold:true, charSpacing:4, margin:0});
    s.addText(`Se registraron ${fmtP(c.total)} unidades afectadas entre devoluciones y roturas, equivalentes al ${pctP(c.tasaGlobal,2)} de la venta promedio de los últimos 3 meses. ${c.alertas.length} SKU superan el umbral del ${c.umbral}% y concentran el principal foco de gestión.`,
      {x:0.85, y:bandY+0.6, w:SW-1.7, h:0.9, fontSize:15, fontFace:"Georgia", color:"FFFFFF", italic:true, margin:0});

    const ministats = [
      {v: String(c.alertas.length), l:`SKU en alerta (tasa > ${c.umbral}%)`},
      {v: fmtP(Math.round(c.promDevSku)), l:"Promedio devoluciones / SKU"},
      {v: pctP(c.total > 0 ? (c.totalRot/c.total)*100 : 0, 1), l:"Participación roturas internas"},
    ];
    const msY = bandY+1.55, msW=3.8;
    ministats.forEach((m,i) => {
      const x = 0.85 + i*(msW+0.2);
      s.addText(m.v, {x, y:msY, w:msW, h:0.45, fontSize:22, fontFace:"Georgia", color:C.accent, bold:true, margin:0});
      s.addText(m.l, {x, y:msY+0.42, w:msW, h:0.3, fontSize:10, fontFace:"Calibri", color:"CADCFC", margin:0});
    });
    addFooter(s, 2);
  }

  // ============== SLIDE 3 — ANÁLISIS GENERAL (cascada) ==============
  {
    const s = pres.addSlide();
    s.background = {color: C.bg};
    eyebrow(s, "ANÁLISIS GENERAL");
    slideTitle(s, "Del volumen vendido al volumen impactado");
    slideSubtitle(s, "Cascada: cuánto se vende en promedio, cuánto vuelve o se rompe, y qué % representa.");

    const cards = [
      {label:"VENTA PROMEDIO 3M", value:fmtP(c.sumaProm), unit:"unidades / mes", desc:`Suma del promedio mensual de venta de los ${monitor.ventas.length} SKU activos en los últimos 3 meses.`, color:C.navy},
      {label:"UNIDADES AFECTADAS", value:fmtP(c.total), unit:`Devoluciones ${fmtP(c.totalDev)}  ·  Roturas ${fmtP(c.totalRot)}`, desc:"Total de unidades retiradas del flujo comercial durante el mes (clientes + roturas internas).", color:"B45309"},
      {label:"TASA SOBRE VENTA", value:pctP(c.tasaGlobal,2), unit:overUmbral?`Por encima del umbral aceptable (${c.umbralGlobal}%)`:`Dentro del umbral aceptable (${c.umbralGlobal}%)`, desc:"Mide el peso real del problema sobre el volumen comercial promedio.", color:overUmbral?C.red:C.green},
    ];
    const cy=1.95, ch=3.6, cw=3.7, cgap=0.45;
    const sx = (SW - (cw*3 + cgap*2))/2;
    cards.forEach((card,i) => {
      const x = sx + i*(cw+cgap);
      s.addShape(pres.shapes.RECTANGLE, {x, y:cy, w:cw, h:ch, fill:{color:card.color}, line:{type:"none"}, shadow:{type:"outer", color:"000000", blur:10, offset:3, angle:90, opacity:0.18}});
      s.addText(String(i+1), {x:x+0.25, y:cy+0.25, w:0.6, h:0.5, fontSize:28, fontFace:"Georgia", color:C.accent, bold:true, italic:true, margin:0});
      s.addText(card.label, {x:x+0.3, y:cy+0.85, w:cw-0.4, h:0.35, fontSize:10, fontFace:"Calibri", color:"FFFFFF", bold:true, charSpacing:3, margin:0});
      s.addText(card.value, {x:x+0.3, y:cy+1.25, w:cw-0.6, h:1.0, fontSize:44, fontFace:"Georgia", color:"FFFFFF", bold:true, margin:0});
      s.addText(card.unit, {x:x+0.3, y:cy+2.25, w:cw-0.6, h:0.4, fontSize:11, fontFace:"Calibri", color:"FFFFFF", italic:true, margin:0});
      s.addShape(pres.shapes.RECTANGLE, {x:x+0.3, y:cy+2.75, w:0.5, h:0.02, fill:{color:C.accent}, line:{type:"none"}});
      s.addText(card.desc, {x:x+0.3, y:cy+2.85, w:cw-0.6, h:0.7, fontSize:10, fontFace:"Calibri", color:"E5E7EB", margin:0});
      if(i < 2){
        const ax = x+cw+0.05, ay = cy + ch/2 - 0.15;
        s.addShape(pres.shapes.RIGHT_TRIANGLE, {x:ax, y:ay, w:0.35, h:0.3, fill:{color:C.accent}, line:{type:"none"}, rotate:90});
      }
    });
    s.addText(`Tasa global = (Devoluciones + Roturas) / Venta promedio 3M  →  (${fmtP(c.totalDev)} + ${fmtP(c.totalRot)}) / ${fmtP(c.sumaProm)} = ${pctP(c.tasaGlobal,2)}`,
      {x:0.5, y:6.0, w:SW-1, h:0.4, fontSize:11, fontFace:"Consolas", color:C.muted, align:"center", italic:true, margin:0});
    addFooter(s, 3);
  }

  // ============== SLIDE 4 — FOCO CRÍTICO POR CATEGORÍA ==============
  // Datos críticos: SKU en alerta (tasa > umbral) Y unidades ≥ corte (50 default)
  const critPpt = (() => {
    const corteEl = document.getElementById("corteMotivos");
    const corte = corteEl ? (Number(corteEl.value)>0 ? Number(corteEl.value) : 50) : 50;
    let motivosMap = {};
    motivosMap = (mes===STATE.mes && anio===STATE.anio) ? getMotivos() : (function(){ try{ return JSON.parse(localStorage.getItem(`motivos_${APP_VERSION}:${mes}_${anio}`)||"{}"); }catch(e){return {};} })();
    const itemsDev = c.skus.filter(s => s.tasa > c.umbral && s.dev >= corte).sort((a,b)=>b.dev-a.dev);
    const itemsRot = c.skus.filter(s => s.tasa > c.umbral && s.rot >= corte).sort((a,b)=>b.rot-a.rot);
    const aggCat = (items, key) => {
      const m = new Map();
      items.forEach(s => { m.set(s.categoria, (m.get(s.categoria)||0) + s[key]); });
      return [...m.entries()].map(([cat,unid]) => ({cat, unid})).sort((a,b)=>b.unid-a.unid);
    };
    const aggMotivo = (items, tipo) => {
      const m = new Map();
      items.forEach(s => {
        const mot = motivosMap[s.codigo]?.[tipo]?.motivo;
        if(!mot) return;
        m.set(mot, (m.get(mot)||0) + (tipo==="dev"?s.dev:s.rot));
      });
      return [...m.entries()].map(([motivo,unid]) => ({motivo, unid})).sort((a,b)=>b.unid-a.unid);
    };
    return {corte, itemsDev, itemsRot,
      catsDev: aggCat(itemsDev,"dev"), catsRot: aggCat(itemsRot,"rot"),
      motivosDev: aggMotivo(itemsDev,"dev"), motivosRot: aggMotivo(itemsRot,"rot"),
      motivosMap};

    if(catsDev.length > 0){
      s.addChart(pres.charts.DOUGHNUT,
        [{name:"Devoluciones", labels:catsDev.map(x => x.cat), values:catsDev.map(x => x.unid)}],

    if(catsRot.length > 0){

    const unidsAlertaTotal = criticosPpt.reduce((a,s) => a+s.dev, 0);
    const sinCargar = unidsAlertaTotal - totalConMotivo;

    // Top motivos para mostrar como resumen
    const topMotivos = Object.entries(motivoTotals).sort((a,b) => b[1]-a[1]);

    // Chips superiores

    const chips = [

       c: topMotivos[0] ? C.green : C.muted},
    ];
    const chipY=1.75, chipH=0.7, chipW=4.05, chipGap=0.18;
    const chipSX = (SW - (chipW*3 + chipGap*2))/2;
    chips.forEach((ch,i) => {
      const x = chipSX + i*(chipW+chipGap);
      s.addShape(pres.shapes.RECTANGLE, {x, y:chipY, w:chipW, h:chipH, fill:{color:ch.c}, line:{type:"none"}});
      s.addText(ch.t, {x:x+0.2, y:chipY+0.08, w:chipW-0.4, h:0.28, fontSize:9, fontFace:"Calibri", color:"FFFFFF", bold:true, charSpacing:3, margin:0});
      s.addText(ch.v, {x:x+0.2, y:chipY+0.35, w:chipW-0.4, h:0.3, fontSize:14, fontFace:"Georgia", color:"FFFFFF", bold:true, margin:0});
    });

    // Tabla — listado completo (dev + rot + motivos para ambos)
    const headerOpts = {bold:true, color:"FFFFFF", fill:{color:C.navy}, align:"center", valign:"middle", fontSize:9.5, fontFace:"Calibri"};
    const headers = ["SKU","Categoría","Producto","Dev.","Rot.","Tasa %","Motivo dev.","Motivo rot."].map(h => ({text:h, options:headerOpts}));
    const rows = [headers];
    skusChunk.forEach((sk, idx) => {
      const zebra = idx % 2 === 0 ? C.bg : C.surface;
      const baseCell = (txt, opts={}) => ({
        text: String(txt),
        options: {fontSize:9, fontFace:"Calibri", color:C.ink, fill:{color:zebra}, valign:"middle", margin:3, ...opts}
      });
      const devCrit = sk.dev >= critPpt.corte;
      const rotCrit = sk.rot >= critPpt.corte;
      // Motivos para cada tipo
      const mDev = motivosMap[sk.codigo] && motivosMap[sk.codigo].dev;
      const mRot = motivosMap[sk.codigo] && motivosMap[sk.codigo].rot;
      const motDevTxt = (devCrit && mDev && mDev.motivo)
        ? (mDev.nota ? `${mDev.motivo} — ${mDev.nota}` : mDev.motivo)
        : (devCrit ? "" : "—");
      const motRotTxt = (rotCrit && mRot && mRot.motivo)
        ? (mRot.nota ? `${mRot.motivo} — ${mRot.nota}` : mRot.motivo)
        : (rotCrit ? "" : "—");
      // colores
      const devCellOpts = {align:"right", bold:devCrit};
      if(devCrit) devCellOpts.color = "B45309";
      const rotCellOpts = {align:"right", bold:rotCrit};
      if(rotCrit) rotCellOpts.color = C.red;
      const motDevFill = (devCrit && motDevTxt) ? "F0FAF4" : (devCrit ? C.yellowFill : zebra);
      const motRotFill = (rotCrit && motRotTxt) ? "F0FAF4" : (rotCrit ? C.yellowFill : zebra);
      rows.push([
        baseCell(sk.codigo, {bold:true, color:C.navy}),
        baseCell(sk.categoria),
        baseCell(sk.producto || ""),
        baseCell(fmtP(sk.dev), devCellOpts),
        baseCell(sk.rot > 0 ? fmtP(sk.rot) : "—", rotCellOpts),
        baseCell(pctP(sk.tasa,2), {align:"right", bold:true, color:C.red, fill:{color:"FEE2E2"}}),
        baseCell(motDevTxt, {fill:{color:motDevFill}, color: motDevTxt && motDevTxt !== "—" ? C.ink : C.muted, fontSize:8.5, italic: !motDevTxt}),
        baseCell(motRotTxt, {fill:{color:motRotFill}, color: motRotTxt && motRotTxt !== "—" ? C.ink : C.muted, fontSize:8.5, italic: !motRotTxt}),
      ]);

    s.addTable(rows, {
      x:0.3, y:2.65, w:SW-0.6,
      colW:[0.95, 1.40, 3.20, 0.85, 0.85, 0.95, 2.45, 2.45],
      rowH:0.36,
      border:{type:"solid", pt:0.5, color:C.line},
      fontFace:"Calibri",
    });
    // Recalcular sinCargar incluyendo motivos de rotura
    const totalSinCargarRot = criticosPpt.reduce((a,sk) => {
      const mR = motivosMap[sk.codigo] && motivosMap[sk.codigo].rot;
      if(sk.rot >= critPpt.corte && (!mR || !mR.motivo)) return a + sk.rot;

    const totalSinCargarDev = criticosPpt.reduce((a,sk) => {
      const mD = motivosMap[sk.codigo] && motivosMap[sk.codigo].dev;
      if(sk.dev >= critPpt.corte && (!mD || !mD.motivo)) return a + sk.dev;
      return a;
    }, 0);
    const totalSinCargarTodo = totalSinCargarDev + totalSinCargarRot;
    s.addShape(pres.shapes.RECTANGLE, {x:0.4, y:SH-0.85, w:0.18, h:0.18, fill:{color:totalSinCargarTodo > 0 ? C.yellowFill : "F0FAF4"}, line:{color:C.line, width:0.5}});
    const legendTxt = totalSinCargarTodo > 0
      ? `Quedan ${fmtP(totalSinCargarTodo)} unidades sin motivo cargado — completar en reunión con Logística.`
      : `Motivos completados para todos los SKU críticos — relevamiento finalizado.`;
    s.addText(legendTxt,
      {x:0.65, y:SH-0.88, w:10, h:0.25, fontSize:9, fontFace:"Calibri", color:C.muted, italic:true, margin:0});
    addFooter(s, globalPage);

  // SKU CRÍTICOS para los slides de alerta: tasa > umbral Y (dev ≥ corte O rot ≥ corte)
  const criticosPpt = c.skus
    .filter(s => s.tasa > c.umbral && (s.dev >= critPpt.corte || s.rot >= critPpt.corte))

  if(criticosPpt.length > 0){

    const chunks = [];
    for(let i = 0; i < criticosPpt.length; i += PER_PAGE){
      chunks.push(criticosPpt.slice(i, i+PER_PAGE));

    chunks.forEach((chunk, idx) => {

    const s = pres.addSlide();
    s.background = {color: C.bg};
    eyebrow(s, "SKU EN ALERTA");
    slideTitle(s, `Sin SKU críticos (tasa > ${c.umbral}% con dev ó rot ≥ ${critPpt.corte} u.)`);
    slideSubtitle(s, "Comportamiento del mes dentro del rango aceptable a nivel SKU.");
    s.addShape(pres.shapes.RECTANGLE, {x:0.5, y:2.0, w:SW-1, h:4, fill:{color:C.greenSoft}, line:{type:"none"}});

      {x:1, y:4.0, w:SW-2, h:1, fontSize:18, fontFace:"Georgia", color:C.ink, italic:true, align:"center", margin:0});

  // (El antiguo slide "ROTURAS INTERNAS — DETALLE" se eliminó:
  //  las roturas ahora se muestran en la misma tabla que las devoluciones críticas,
  //  con sus motivos correspondientes.)

  // (Los slides finales "HALLAZGOS & PRÓXIMOS PASOS" y "GRACIAS / CIERRE"
  //  se eliminaron: esta presentación es parte de un comité más amplio
  //  y no termina acá. Se incorpora a la presentación del comité general.)

  const fileName = `Devoluciones_y_Roturas_${mes}_${anio}.pptx`;
  pres.writeFile({fileName});
  return fileName;

/* ============================================================
   EXPORTACIONES COMPARATIVAS (Excel + PPT con varios meses)
   ============================================================ */
// Rellena campos faltantes en un snapshot viejo para que no rompa el export.
// Ante todo, si tasaGlobal está ausente se recalcula: (totalDev+totalRot)/sumaProm*100.
function normalizeSnapshot(raw){
  const it = Object.assign({}, raw || {});
  it.mes = it.mes || "";
  it.anio = Number(it.anio) || 0;
  it.totalDev = Number(it.totalDev) || 0;
  it.totalRot = Number(it.totalRot) || 0;
  it.sumaProm = Number(it.sumaProm) || 0;
  it.umbral = Number(it.umbral) || 3;
  // Retrocompatibilidad: snapshots viejos no tienen umbralGlobal.
  // Se usa 1% como default para la tasa global (independiente del umbral SKU crítico).
  it.umbralGlobal = Number.isFinite(Number(it.umbralGlobal)) && Number(it.umbralGlobal) > 0
    ? Number(it.umbralGlobal)
    : 1;
  it.corte = Number(it.corte) || 50;
  it.skuConDev = Number(it.skuConDev) || 0;
  it.skuConRot = Number(it.skuConRot) || 0;
  it.criticosDev = Number(it.criticosDev) || 0;
  it.criticosRot = Number(it.criticosRot) || 0;
  it.unidsCritDev = Number(it.unidsCritDev) || 0;
  it.unidsCritRot = Number(it.unidsCritRot) || 0;
  if(!Number.isFinite(it.tasaGlobal)){
    it.tasaGlobal = it.sumaProm > 0 ? ((it.totalDev + it.totalRot) / it.sumaProm) * 100 : 0;
  }
  it.topCatDev = Array.isArray(it.topCatDev) ? it.topCatDev : [];
  it.topCatRot = Array.isArray(it.topCatRot) ? it.topCatRot : [];
  it.motivosResumen = it.motivosResumen || {dev:{}, rot:{}};
  it.motivosResumen.dev = it.motivosResumen.dev || {};
  it.motivosResumen.rot = it.motivosResumen.rot || {};
  it.criticos = Array.isArray(it.criticos) ? it.criticos.map(s => ({
    codigo: s?.codigo ?? "",
    producto: s?.producto ?? "",
    categoria: s?.categoria ?? "",
    marca: s?.marca ?? "",
    dev: Number(s?.dev) || 0,
    rot: Number(s?.rot) || 0,
    tasa: Number(s?.tasa) || 0,
    promedio: Number(s?.promedio) || 0,
    motivoDev: s?.motivoDev ?? "",
    notaDev: s?.notaDev ?? "",
    motivoRot: s?.motivoRot ?? "",
    notaRot: s?.notaRot ?? "",
  })) : [];

  // Retro-fix: si el snapshot fue guardado con la versión vieja, "Otros" quedó
  // como bucket agregado en motivosResumen aunque el SKU crítico tuviera nota.
  // Reasignamos ese bucket usando las notas de los críticos que corresponden.
  const mr = it.motivosResumen;
  if(mr.dev && mr.dev["Otros"]){
    it.criticos.forEach(s => {
      if(s.motivoDev === "Otros" && (s.notaDev||"").trim() && s.dev > 0){
        const key = s.notaDev.trim();
        mr.dev[key] = (mr.dev[key]||0) + s.dev;
        mr.dev["Otros"] = Math.max(0, (mr.dev["Otros"]||0) - s.dev);
      }
    });
    if(mr.dev["Otros"] <= 0.5) delete mr.dev["Otros"];
  }
  if(mr.rot && mr.rot["Otros"]){
    it.criticos.forEach(s => {
      if(s.motivoRot === "Otros" && (s.notaRot||"").trim() && s.rot > 0){
        const key = s.notaRot.trim();
        mr.rot[key] = (mr.rot[key]||0) + s.rot;
        mr.rot["Otros"] = Math.max(0, (mr.rot["Otros"]||0) - s.rot);
      }
    });
    if(mr.rot["Otros"] <= 0.5) delete mr.rot["Otros"];
  }

  return it;
}

function buildComparativaData(h, keys){
  const items = keys.map(k => normalizeSnapshot(h[k]));

  // SKU recurrentes (todos los críticos de todos los meses, agrupados)
  const skuMap = new Map();
  items.forEach(it => {
    (it.criticos || []).forEach(sk => {
      const k = String(sk.codigo);
      if(!skuMap.has(k)){
        skuMap.set(k, {codigo:sk.codigo, producto:sk.producto, categoria:sk.categoria, marca:sk.marca,
          meses:[], totalDev:0, totalRot:0, motivosDev:new Set(), motivosRot:new Set()});
      }
      const e = skuMap.get(k);
      e.meses.push({mes:it.mes, anio:it.anio, dev:sk.dev, rot:sk.rot, tasa:sk.tasa,
        motivoDev:sk.motivoDev, notaDev:sk.notaDev, motivoRot:sk.motivoRot, notaRot:sk.notaRot});
      e.totalDev += sk.dev; e.totalRot += sk.rot;
      if(sk.motivoDev) e.motivosDev.add(sk.motivoDev);
      if(sk.motivoRot) e.motivosRot.add(sk.motivoRot);
    });
  });
  const minMeses = items.length >= 2 ? 2 : 1;
  const recurSkus = [...skuMap.values()]
    .filter(s => s.meses.length >= minMeses)
    .sort((a,b) => b.meses.length - a.meses.length || (b.totalDev+b.totalRot)-(a.totalDev+a.totalRot));

  // Categorías
  const catMap = new Map();
  items.forEach(it => {
    (it.topCatDev || []).forEach(c => {
      if(!catMap.has(c.cat)) catMap.set(c.cat, {cat:c.cat, mesesDev:new Set(), mesesRot:new Set(), totalDev:0, totalRot:0});
      catMap.get(c.cat).mesesDev.add(`${it.mes} ${it.anio}`); catMap.get(c.cat).totalDev += c.unid;
    });
    (it.topCatRot || []).forEach(c => {
      if(!catMap.has(c.cat)) catMap.set(c.cat, {cat:c.cat, mesesDev:new Set(), mesesRot:new Set(), totalDev:0, totalRot:0});
      catMap.get(c.cat).mesesRot.add(`${it.mes} ${it.anio}`); catMap.get(c.cat).totalRot += c.unid;
    });
  });
  const cats = [...catMap.values()].sort((a,b) => (b.totalDev+b.totalRot)-(a.totalDev+a.totalRot));

  // Motivos
  const motMap = new Map();
  items.forEach(it => {
    const r = it.motivosResumen || {};
    Object.entries(r.dev || {}).forEach(([m,u]) => {
      if(!motMap.has(m)) motMap.set(m, {motivo:m, dev:0, rot:0, meses:new Set()});
      motMap.get(m).dev += u; motMap.get(m).meses.add(`${it.mes} ${it.anio}`);
    });
    Object.entries(r.rot || {}).forEach(([m,u]) => {
      if(!motMap.has(m)) motMap.set(m, {motivo:m, dev:0, rot:0, meses:new Set()});
      motMap.get(m).rot += u; motMap.get(m).meses.add(`${it.mes} ${it.anio}`);
    });
  });
  const motivos = [...motMap.values()].sort((a,b) => (b.dev+b.rot)-(a.dev+a.rot));

  // Totales
  const totDev = items.reduce((a,it)=>a+it.totalDev,0);
  const totRot = items.reduce((a,it)=>a+it.totalRot,0);
  const sumProm = items.reduce((a,it)=>a+it.sumaProm,0);
  const tasaAcum = sumProm > 0 ? ((totDev+totRot)/sumProm)*100 : 0;

  return {items, recurSkus, cats, motivos, totDev, totRot, sumProm, tasaAcum};
}

function generateExcelComparativa(h, keys){
  const data = buildComparativaData(h, keys);
  const wb = XLSX.utils.book_new();
  const items = data.items;
  const firstMes = items[0], lastMes = items[items.length-1];
  const periodo = items.length === 1
    ? `${cap(firstMes.mes)} ${firstMes.anio}`
    : `${cap(firstMes.mes)} ${firstMes.anio} — ${cap(lastMes.mes)} ${lastMes.anio}`;

  // --- Hoja 1: RESUMEN ---
  const res = [
    [`COMPARATIVA DEVOLUCIONES & ROTURAS — ${periodo}`],
    [`Generado: ${new Date().toLocaleString("es-AR")}  ·  ${items.length} meses comparados`],
    [],
    ["INDICADORES DEL PERÍODO"],
    ["Devoluciones acumuladas", data.totDev],
    ["Roturas internas acumuladas", data.totRot],
    ["Suma promedio venta 3M", data.sumProm],
    ["Tasa promedio del período (ponderada)", `${data.tasaAcum.toFixed(2)}%`],
    ["Meses sobre umbral", items.filter(it => it.tasaGlobal > it.umbralGlobal).length],
    ["SKU críticos acumulados (dev+rot)", items.reduce((a,it)=>a+it.criticosDev+it.criticosRot,0)],
    [],
    ["DETALLE POR MES"],
    ["Mes", "Año", "Fecha análisis", "Devoluciones", "Roturas", "Venta promedio 3M", "Tasa global %", "Umbral %", "Críticos dev", "Críticos rot", "Cat. líder dev", "Cat. líder rot"],
  ];
  items.forEach(it => {
    res.push([
      cap(it.mes), it.anio,
      it.fechaAnalisis ? new Date(it.fechaAnalisis).toLocaleDateString("es-AR") : "",
      it.totalDev, it.totalRot, it.sumaProm, Number((Number(it.tasaGlobal)||0).toFixed(2)), it.umbral,
      it.criticosDev, it.criticosRot,
      it.topCatDev[0]?.cat || "—", it.topCatRot[0]?.cat || "—"
    ]);
  });
  const wsR = XLSX.utils.aoa_to_sheet(res);
  wsR["!cols"] = [{wch:18},{wch:8},{wch:14},{wch:14},{wch:12},{wch:18},{wch:14},{wch:10},{wch:14},{wch:14},{wch:24},{wch:24}];
  XLSX.utils.book_append_sheet(wb, wsR, "RESUMEN");

  // --- Hoja 2: SKU RECURRENTES ---
  const skuHead = ["SKU", "Producto", "Categoría", "Marca", "Meses críticos", "Σ Devoluciones", "Σ Roturas", "Motivos devolución", "Motivos rotura"];
  const skuData = [["SKU CRÍTICOS RECURRENTES — " + periodo], [], skuHead];
  data.recurSkus.forEach(s => {
    skuData.push([
      s.codigo, s.producto || "", s.categoria || "", s.marca || "",
      s.meses.map(m => `${cap(m.mes)} ${m.anio}`).join(", "),
      s.totalDev, s.totalRot,
      [...s.motivosDev].join(", "),
      [...s.motivosRot].join(", "),
    ]);
  });
  const wsS = XLSX.utils.aoa_to_sheet(skuData);
  wsS["!cols"] = [{wch:12},{wch:38},{wch:22},{wch:14},{wch:28},{wch:14},{wch:14},{wch:28},{wch:28}];
  XLSX.utils.book_append_sheet(wb, wsS, "SKU RECURRENTES");

  // --- Hoja 3: SKU DETALLE POR MES (un row por aparición) ---
  const detData = [["DETALLE DE SKU CRÍTICOS POR MES"], [], ["Mes", "Año", "SKU", "Producto", "Categoría", "Marca", "Devoluciones", "Roturas", "Tasa %", "Motivo dev.", "Nota dev.", "Motivo rot.", "Nota rot."]];
  items.forEach(it => {
    (it.criticos || []).forEach(s => {
      detData.push([
        cap(it.mes), it.anio,
        s.codigo, s.producto || "", s.categoria || "", s.marca || "",
        s.dev, s.rot, Number((s.tasa||0).toFixed(2)),
        s.motivoDev || "", s.notaDev || "", s.motivoRot || "", s.notaRot || ""
      ]);
    });
  });
  const wsD = XLSX.utils.aoa_to_sheet(detData);
  wsD["!cols"] = [{wch:12},{wch:8},{wch:12},{wch:38},{wch:22},{wch:14},{wch:14},{wch:12},{wch:10},{wch:18},{wch:30},{wch:18},{wch:30}];
  XLSX.utils.book_append_sheet(wb, wsD, "DETALLE POR MES");

  // --- Hoja 4: CATEGORÍAS ---
  const catData = [["CATEGORÍAS RECURRENTES — " + periodo], [], ["Categoría", "Σ Devoluciones", "Σ Roturas"]];
  data.cats.forEach(c => catData.push([c.cat, c.totalDev, c.totalRot]));
  const wsC = XLSX.utils.aoa_to_sheet(catData);
  wsC["!cols"] = [{wch:28},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsC, "CATEGORÍAS");

  // --- Hoja 5: MOTIVOS ---
  const motData = [["MOTIVOS RECURRENTES — " + periodo], [], ["Motivo", "Σ Unid. devolución", "Σ Unid. rotura", "Meses con ese motivo"]];
  data.motivos.forEach(m => motData.push([m.motivo, m.dev, m.rot, m.meses.size]));
  const wsM = XLSX.utils.aoa_to_sheet(motData);
  wsM["!cols"] = [{wch:24},{wch:20},{wch:18},{wch:22}];
  XLSX.utils.book_append_sheet(wb, wsM, "MOTIVOS");

  const fileName = `Comparativa_Devoluciones_${items.length}meses_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fileName);
  return fileName;
}

  pres.title = "Comparativa Devoluciones & Roturas";

    navy: "0B1F3A", navyAlt: "13294B", ink: "1E2A44", body: "374151",

  const slideSubtitle = (s, t) => s.addText(t, {x:0.5, y:1.25, w:SW-1, h:0.35, fontSize:12, fontFace:"Calibri", color:C.muted, margin:0});

  const critAgg = (() => {

    const effectiveMotivo = (motivo, nota) => (motivo === "Otros" && (nota||"").trim()) ? nota.trim() : motivo;

    items.forEach(it => {
      const corte = it.corte || 50;
      const umbral = it.umbral || 3;
      (it.criticos || []).forEach(sk => {
        const devCrit = (sk.dev >= corte) && (sk.tasa > umbral);
        const rotCrit = sk.rot >= corte;
        if(!devCrit && !rotCrit) return;
        const k = String(sk.codigo);
        if(!skuMap.has(k)){
          skuMap.set(k, {
            codigo: sk.codigo, producto: sk.producto || "",
            categoria: sk.categoria || "—", marca: sk.marca || "",

          });

        const e = skuMap.get(k);
        e.dev += sk.dev || 0;
        e.rot += sk.rot || 0;
        if((sk.tasa||0) > e.tasaMax) e.tasaMax = sk.tasa || 0;
        e.meses.add(`${cap(it.mes).slice(0,3)}·${String(it.anio).slice(-2)}`);
        if(devCrit){
          const cat = sk.categoria || "—";

            e.motivosDev.add(key);
          }
        }
        if(rotCrit){
          const cat = sk.categoria || "—";

            motivosRotMap.set(key, (motivosRotMap.get(key)||0) + sk.rot);
            e.motivosRot.add(key);
          }
        }
      });
    });

    const toArr = (m, keyName) => [...m.entries()].map(([k,v]) => ({[keyName]: k, unid: v}))
      .sort((a,b) => b.unid - a.unid);

    return {
      list: [...skuMap.values()].sort((a,b) => (b.dev+b.rot) - (a.dev+a.rot)),

       chartColors:["B45309","991B1B"], chartArea:{fill:{color:C.bg}},

  const fileName = `Comparativa_Devoluciones_${items.length}meses_${new Date().toISOString().slice(0,10)}.pptx`;

$("btnProc").addEventListener("click", async () => {

  setStatus("Procesando…", true);

  try{
    const mes = $("mes").value;

      log(`  ${monitor.maestro.size} SKU en Maestro (${monitor.maestroSheet})`, "ok");
    } else {
      log("  Maestro no encontrado — la marca se infiere del nombre del producto.", "warn");

    log("Leyendo Movimiento de Stock…");

/* ─── Corregir motivos de un mes ya guardado ───────────────────────────────
   Hasta ahora solo se podían tocar los motivos del mes cargado en memoria: para
   corregir uno de un mes anterior había que volver a subir los archivos y
   reprocesar todo. Como una persona carga y después se revisa de a dos, esa
   corrección es parte del trabajo normal y no una excepción.

   Se edita sobre el snapshot guardado, que ya trae los SKU críticos con sus
   unidades y sus motivos, así que no hace falta reprocesar nada. */
const FIX = { key:null, snap:null };

// "Otros" con una nota se agrupa bajo el texto de la nota, igual que en la carga
// original: si no, en el PPT sale un genérico "Otros" que no dice nada.
function fixMotivoEfectivo(motivo, nota){
  const n = (nota || "").trim();
  return (motivo === "Otros" && n) ? n : motivo;
}

// El resumen es lo que leen la comparativa y el PPT. Si se corrige un motivo y
// no se rehace, la corrección no aparece donde se mira.
function fixRecalcularResumen(snap){
  const res = { dev:{}, rot:{} };
  (snap.criticos || []).forEach(c => {
    const kd = fixMotivoEfectivo(c.motivoDev, c.notaDev);
    if(kd) res.dev[kd] = (res.dev[kd] || 0) + (c.dev || 0);
    const kr = fixMotivoEfectivo(c.motivoRot, c.notaRot);
    if(kr) res.rot[kr] = (res.rot[kr] || 0) + (c.rot || 0);
  });
  snap.motivosResumen = res;
}

function fixRenderSelector(){
  const sel = $("fixMes");
  if(!sel) return;
  const h = loadHistory();
  const keys = Object.keys(h).sort().reverse();
  const actual = sel.value;
  sel.innerHTML = `<option value="">— Elegí un mes —</option>` + keys.map(k => {
    const s = h[k] || {};
    return `<option value="${k}">${cap(s.mes || "")} ${s.anio || ""}</option>`;
  }).join("");
  if(actual && h[actual]) sel.value = actual;
}

function fixRenderLista(){
  const cont = $("fixList");
  if(!cont) return;
  if(!FIX.snap){
    cont.innerHTML = "";
    $("fixSave").disabled = true;
    return;
  }
  const crit = FIX.snap.criticos || [];
  if(!crit.length){
    cont.innerHTML = `<div class="motivos-empty">Este mes no tiene SKU críticos guardados, así que no hay motivos para corregir.</div>`;
    $("fixSave").disabled = true;
    return;
  }

  const filas = [];
  crit.forEach((c, i) => {
    [
      ["dev", c.dev, "motivoDev", "notaDev", "Devoluciones", true],
      ["rot", c.rot, "motivoRot", "notaRot", "Roturas internas", false]
    ].forEach(([tipo, unid, mk, nk, lbl, isDev]) => {
      if(!unid) return; // sin unidades de ese tipo no hay motivo que cargar
      const opts = MOTIVOS_PRESET.map(o =>
        `<option value="${o.value}"${o.value === (c[mk] || "") ? " selected" : ""}>${o.label}</option>`
      ).join("");
      const prod = String(c.producto || "—").replace(/</g, "&lt;");
      const cat  = String(c.categoria || "Sin categoría").replace(/</g, "&lt;");
      const nota = String(c[nk] || "").replace(/</g, "&lt;");
      filas.push(`
        <div class="motivo-card ${c[mk] ? "done" : ""} ${isDev ? "tipo-dev-border" : "tipo-rot-border"}">
          <div class="mc-id">
            <span class="mc-sku">${c.codigo}</span>
            <span class="mc-units" style="color:${isDev ? "var(--amber)" : "var(--red)"}">${fmt(unid)}</span>
            <span class="mc-units-lbl">${lbl}</span>
          </div>
          <div class="mc-info">
            <div class="mc-prod">${prod}</div>
            <div class="mc-tags">
              <span class="tipo-badge ${isDev ? "tipo-dev" : "tipo-rot"}">${isDev ? "Devolución de cliente" : "Rotura interna"}</span>
              <span class="pill">${cat}</span>
            </div>
          </div>
          <div class="mc-form">
            <span class="mc-label">Motivo principal</span>
            <select class="motivo-select" data-i="${i}" data-campo="${mk}">${opts}</select>
            <span class="mc-label" style="margin-top:6px">Comentario / detalle adicional</span>
            <textarea class="motivo-nota" data-i="${i}" data-campo="${nk}" rows="2">${nota}</textarea>
          </div>
        </div>`);
    });
  });
  cont.innerHTML = filas.join("");

  cont.querySelectorAll(".motivo-select, .motivo-nota").forEach(el => {
    const evento = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evento, () => {
      FIX.snap.criticos[Number(el.dataset.i)][el.dataset.campo] = el.value;
      $("fixSave").disabled = false;
      $("fixSub").textContent = "Hay correcciones sin guardar.";
    });
  });
}

async function fixGuardar(){
  if(!FIX.snap || !FIX.key) return;
  const btn = $("fixSave");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  try{
    fixRecalcularResumen(FIX.snap);

    // 1) Histórico local
    const h = loadHistory();
    h[FIX.key] = FIX.snap;
    persistHistory(h);

    // 2) Motivos del mes en el formato que usa el resto de la app. Se escribe
    //    con setItem normal a propósito: el interceptor de localStorage es el
    //    que dispara la subida de motivos.
    const motivos = {};
    (FIX.snap.criticos || []).forEach(c => {
      const dev = { motivo: c.motivoDev || "", nota: c.notaDev || "" };
      const rot = { motivo: c.motivoRot || "", nota: c.notaRot || "" };
      if(dev.motivo || dev.nota || rot.motivo || rot.nota) motivos[c.codigo] = { dev, rot };
    });
    try{
      localStorage.setItem(`motivos_${APP_VERSION}:${FIX.snap.mes}_${FIX.snap.anio}`, JSON.stringify(motivos));
    }catch(e){}

    // 3) Al servidor. Se esperan las dos: si alguna falla hay que decirlo, no
    //    dejar la corrección viviendo solo en esta computadora.
    await SYNC.pushSnapshot(FIX.snap.mes, FIX.snap.anio, FIX.snap);
    await SYNC.pushMotivos(FIX.snap.mes, FIX.snap.anio, motivos);

    // Si el mes corregido es el que está abierto en Análisis, se refresca el
    // buffer para que las dos pantallas no muestren cosas distintas.
    if(STATE.mes === FIX.snap.mes && String(STATE.anio) === String(FIX.snap.anio)){
      STATE.motivosBuffer = motivos;
      STATE.motivosDirty = false;
      if(typeof renderMotivos === "function") try{ renderMotivos(); }catch(e){}
    }

    const mesCorregido = `${cap(FIX.snap.mes)} ${FIX.snap.anio}`;
    renderHistory();
    if(typeof log === "function") log(`Motivos de ${mesCorregido} corregidos y sincronizados.`);

    // Se cierra el panel al guardar. Corregir es un desvio corto dentro de la
    // revision: dejar la lista abierta tapa la comparativa, que es justo a lo
    // que se vuelve despues de corregir.
    FIX.key = null;
    FIX.snap = null;
    const sel = $("fixMes");
    if(sel) sel.value = "";
    $("fixList").innerHTML = "";
    $("fixSave").disabled = true;
    $("fixSub").textContent = `${mesCorregido}: correcciones guardadas y subidas. Elegí otro mes si necesitás corregir más.`;
  }catch(e){
    btn.disabled = false;
    $("fixSub").textContent = "No se pudieron subir las correcciones.";
    alert("Las correcciones quedaron guardadas en esta computadora, pero NO se subieron al servidor.\n\n" +
          (e && e.message ? e.message : e) + "\n\nLas demás no las van a ver hasta que se suban.");
  }finally{
    btn.textContent = "Guardar correcciones";
  }
}

(function fixInit(){
  const sel = $("fixMes");
  if(!sel) return;
  fixRenderSelector();
  sel.addEventListener("change", () => {
    FIX.key = sel.value || null;
    // Copia propia: si se cambia de mes sin guardar, el histórico no queda tocado.
    const h = loadHistory();
    FIX.snap = FIX.key && h[FIX.key] ? JSON.parse(JSON.stringify(h[FIX.key])) : null;
    $("fixSub").textContent = FIX.snap
      ? "Cambiá el motivo o el comentario y guardá. No hace falta volver a subir archivos."
      : "Elegí el mes que querés revisar.";
    fixRenderLista();
  });
  $("fixSave").addEventListener("click", fixGuardar);
})();
</script>
<script type="text/plain" id="b">
// ============================================================
// AUTH CONTROLLER — Google Sheets backend (sin contraseña)
// ============================================================
(function(){
  const overlay   = document.getElementById("authOverlay");
  const badge     = document.getElementById("syncBadge");
  const selectEl  = document.getElementById("authSelect");
  const newWrap   = document.getElementById("authNewWrap");
  const newName   = document.getElementById("authNewName");
  const btn       = document.getElementById("authBtn");
  const msg       = document.getElementById("authMsg");
  const toggle    = document.getElementById("authToggle");
  const logoutBtn = document.getElementById("logoutBtn");
  const actBtn    = document.getElementById("actBtn");
  const actPanel  = document.getElementById("actPanel");
  const actClose  = document.getElementById("actClose");
  const actBody   = document.getElementById("actBody");

  let mode = "select"; // "select" | "new"

  function showMsg(text, kind){
    msg.className = kind;
    msg.textContent = text;
    msg.style.display = "block";
  }
  function hideMsg(){ msg.style.display = "none"; }

  toggle.addEventListener("click", () => {
    if(mode==="select"){
      mode = "new";
      newWrap.style.display = "block";
      selectEl.style.display = "none";
      toggle.textContent = "← Volver a elegir de la lista";
      btn.textContent = "Crear y entrar";
      newName.focus();
    } else {
      mode = "select";
      newWrap.style.display = "none";
      selectEl.style.display = "block";
      toggle.textContent = "¿Sos nuevo? Agregá tu nombre";
      btn.textContent = "Ingresar";
    }
    hideMsg();
  });

  async function cargarPersonas(){
    if(!GS_READY) return;
    try{
      const res = await gsGet({ action: "getPersonas" });
      if(!res || !res.personas) return;
      selectEl.innerHTML = '<option value="">— Elegí tu nombre —</option>';
      res.personas.sort((a,b) => (a.nombre||"").localeCompare(b.nombre||"")).forEach(p => {
        const opt = document.createElement("option");
        opt.value = p.nombre; opt.textContent = p.nombre;
        selectEl.appendChild(opt);
      });
    }catch(e){ console.warn("cargarPersonas:",e); }
  }

  async function handle(){
    if(!GS_READY){ showMsg("Configurá GSHEET_API_URL en el HTML con la URL de tu Google Apps Script.","err"); return; }
    let nombre = "";
    if(mode==="select"){
      nombre = selectEl.value.trim();
      if(!nombre){ showMsg("Elegí tu nombre de la lista.","err"); return; }
    } else {
      nombre = newName.value.trim();
      if(nombre.length < 2){ showMsg("Ingresá tu nombre completo.","err"); return; }
    }
    btn.disabled = true;
    try{
      if(mode==="new"){
        const res = await gsPost({ action: "addPersona", nombre });
        if(res && res.error) throw new Error(res.error);
      }
      await gsPost({ action: "updateIngreso", nombre });
      onLogin(nombre);
    }catch(e){
      showMsg(e.message || "Error al ingresar","err");
    }finally{
      btn.disabled = false;
    }
  }
  btn.addEventListener("click", handle);
  newName.addEventListener("keydown", e => { if(e.key==="Enter") handle(); });

  function onLogin(nombre){
    SYNC.persona = nombre;
    sessionStorage.setItem("__persona", nombre);
    overlay.classList.add("hidden");
    badge.style.display = "flex";
    SYNC.setBadge("ok", nombre);
    SYNC.log("ingreso", null, null, null);
    hydrateFromCloud();
  }

  logoutBtn.addEventListener("click", () => {
    SYNC.log("salida", null, null, null);
    sessionStorage.removeItem("__persona");
    location.reload();
  });

  // Panel de actividad
  async function loadActividad(){
    if(!GS_READY) return;
    actBody.innerHTML = '<div class="empty">Cargando…</div>';
    try{
      const res = await gsGet({ action: "getActividad", limit: 200 });
      if(!res || !res.actividad || !res.actividad.length){
        actBody.innerHTML = '<div class="empty">Sin actividad registrada todavía.</div>';
        return;
      }
      const ACCIONES = {
        ingreso:"🚪 Ingresó", salida:"👋 Salió",
        carga_archivo:"📥 Cargó archivo", procesado:"⚙️ Procesó mes",
        edita_motivos:"✏️ Editó motivos", descarga_excel:"📊 Descargó Excel",
        descarga_ppt:"📑 Descargó PPT", reset:"🗑️ Reseteó"
      };
      actBody.innerHTML = res.actividad.map(r => {
        const acc = ACCIONES[r.accion] || r.accion;
        const ctx = (r.mes && r.anio) ? ` — ${r.mes} ${r.anio}` : "";
        const det = r.detalle ? ` (${r.detalle})` : "";
        const when = r.fecha ? new Date(r.fecha).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}) : "";
        return `<div class="row"><div class="who">${r.persona}</div><div class="what">${acc}${ctx}${det}</div><div class="when">${when}</div></div>`;
      }).join("");
    }catch(e){
      actBody.innerHTML = '<div class="empty">Error al cargar actividad.</div>';
    }
  }
  actBtn.addEventListener("click", () => { actPanel.classList.add("open"); loadActividad(); });
  actClose.addEventListener("click", () => actPanel.classList.remove("open"));

  async function hydrateFromCloud(){
    SYNC.setBadge("syncing","Trayendo datos de Google Sheets…");
    try{
      // Traer todos los snapshots de una vez (más eficiente que uno por uno)
      const snapshots = await SYNC.pullAllSnapshots();
      if(snapshots && Object.keys(snapshots).length){
        // Mergear con el histórico local (el remoto tiene prioridad)
        // Se normalizan LOS DOS lados, no solo el remoto. El servidor indexa por
        // MES_ANIO y la app por historyKeyFor(), y en los navegadores que ya
        // habian sincronizado antes quedaron guardadas las claves viejas: al
        // mezclar, el mismo mes entraba dos veces y la comparativa contaba doble.
        // Como cada snapshot lleva adentro su mes y su año, reindexar por ahi
        // colapsa las dos formas en una sola y los duplicados desaparecen solos.
        const normalizar = (obj) => {
          const out = {};
          Object.entries(obj || {}).forEach(([k, s]) => {
            out[(s && s.mes && s.anio) ? historyKeyFor(s.mes, s.anio) : k] = s;
          });
          return out;
        };
        const merged = Object.assign({}, normalizar(loadHistory()), normalizar(snapshots));
        const _set = Storage.prototype.setItem;
        _set.call(localStorage, `history_${APP_VERSION}`, JSON.stringify(merged));
      }

      // Traer motivos del mes actual si hay uno seleccionado
      if(STATE.mes && STATE.anio){
        const remoteMot = await SYNC.pullMotivos(STATE.mes, STATE.anio);
        if(remoteMot && Object.keys(remoteMot).length){
          // Convertir al formato del buffer interno
          const buf = {};
          Object.entries(remoteMot).forEach(([sku, m]) => {
            buf[sku] = {
              dev: { motivo: m.motivoDev || "", nota: m.notaDev || "" },
              rot: { motivo: m.motivoRot || "", nota: m.notaRot || "" }
            };
          });
          const key = `motivos_${APP_VERSION}:${STATE.mes}_${STATE.anio}`;
          const _set = Storage.prototype.setItem;
          _set.call(localStorage, key, JSON.stringify(buf));
          // Si ya está en pantalla, refrescar el buffer
          // No pisar lo que se esta editando. Esto corre tambien desde el
          // polling, cada 2 minutos: sin el freno, una correccion volvia sola al
          // valor viejo a los pocos segundos de hacerla. Se veia como "no me
          // deja corregir", y en realidad la estaba sobrescribiendo el sync.
          //
          // motivosDirty se prende en cuanto se toca un motivo y se apaga al
          // guardar, asi que el refresco vuelve a entrar apenas se guarda.
          if(STATE.motivosBuffer !== null && !STATE.motivosDirty){
            STATE.motivosBuffer = buf;
            if(typeof renderMotivos === "function") try{ renderMotivos(); }catch(e){}
          }
        }
      }

      SYNC.setBadge("ok", SYNC.persona);
      if(typeof renderHistory === "function") try{ renderHistory(); }catch(e){}
      if(typeof updateHistBadge === "function") try{ updateHistBadge(); }catch(e){}
    }catch(e){
      console.warn("hydrate:",e);
      SYNC.setBadge("error","Error al sincronizar");
    }
  }

  // Polling cada 2 min (Google Sheets no tiene realtime como Supabase)
  let _pollInterval = null;
  function startPolling(){
    if(_pollInterval) clearInterval(_pollInterval);
    _pollInterval = setInterval(() => {
      if(GS_READY && SYNC.persona) hydrateFromCloud();
    }, 120000); // 2 minutos
  }

  // "Continuar sin sync" era la otra puerta al mismo problema: dejaba entrar con
  // SYNC.persona en null, o sea trabajando solo contra localStorage sin que se
  // notara. Ahora reintenta la sesion, que es lo unico util desde aca.
  document.getElementById("authSkip").addEventListener("click", () => {
    location.reload();
  });

  // Init — la identidad sale de la sesion del portal, no de escribir el nombre.
  //
  // Antes dependia de completar el login propio de esta app, que se guardaba en
  // sessionStorage y se borraba al cerrar la pestaña. Si no se completaba -o si
  // alguien apretaba "continuar sin sync"- SYNC.persona quedaba en null, y CADA
  // funcion de sincronizacion corta en su primera linea con ese chequeo.
  //
  // El efecto era silencioso y en las dos direcciones: la app no traia lo que
  // cargaban los demas Y no subia lo propio, mientras mostraba el cartel en
  // verde. Se veia como "no me actualiza"; en realidad estaba desconectada.
  //
  // El portal ya autentico a esta persona para dejarla entrar al archivo, asi
  // que preguntarle el nombre de nuevo no agregaba seguridad: solo agregaba un
  // paso que se podia saltear.
  (async () => {
    try{
      const r = await fetch('/api/auth/yo', { credentials: 'same-origin' });
      if(!r.ok) throw new Error('sesion no valida');
      const yo = await r.json();
      onLogin(yo.nombre || yo.usuario);
      startPolling();
    }catch(e){
      console.error('sesion:', e);
      SYNC.setBadge('error','Sin sesión — recargá la página');
      showMsg('No se pudo confirmar tu sesión. Recargá la página.','err');
    }
  })();

  // Hooks de logging para eventos clave de la app
  document.addEventListener("change", e => {
    if(e.target && e.target.type === "file" && e.target.files && e.target.files[0]){
      const tipo = e.target.id || "archivo";
      SYNC.log("carga_archivo", `${tipo}: ${e.target.files[0].name}`);
    }
  });
  document.addEventListener("click", e => {
    const t = e.target;
    if(!t) return;
    const txt = (t.textContent||"").toLowerCase();
    const id = (t.id||"").toLowerCase();
    if(id.indexOf("procesar")>=0 || txt.indexOf("procesar")>=0 && t.tagName==="BUTTON"){
      SYNC.log("procesado", null);
    }
    if((id.indexOf("excel")>=0 || txt.indexOf("excel")>=0) && (id.indexOf("descarg")>=0 || txt.indexOf("descarg")>=0)){
      SYNC.log("descarga_excel", null);
    }
    if((id.indexOf("ppt")>=0 || txt.indexOf("powerpoint")>=0 || txt.indexOf("ppt")>=0) && (id.indexOf("descarg")>=0 || txt.indexOf("descarg")>=0)){
      SYNC.log("descarga_ppt", null);
    }
  }, true);
})();
</script>
