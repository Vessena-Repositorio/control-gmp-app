<script type="text/plain" id="a">
/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
// APP_VERSION cambia cada vez que se publica una nueva versión del archivo —
// así las claves de localStorage no se mezclan entre versiones, y los motivos
// del usuario empiezan vacíos hasta que cargue el primer mes con esta versión.
const APP_VERSION = "2026-06-04";

const STATE = {monitor:null, movimientos:null, computed:null, mes:null, anio:null, charts:{}, presentCharts:{}, currentSlide:0, totalSlides:0, motivosBuffer:null, motivosDirty:false};

// ============================================================
// GOOGLE SHEETS SYNC LAYER (reemplaza Supabase)
// ============================================================
// Los datos viven en Postgres, no en Sheets. Este fue el primer dominio en
// cortar: la app escribe acá y la réplica desde Apps Script quedó apagada, así
// que la hoja ya NO es la fuente de verdad y lo que se cargue allá no se ve.
//
// La sesión va en la cookie del login, por eso todas las llamadas usan
// credentials same-origin. El nombre de quien opera lo pone el servidor a
// partir de la sesión: ya no se manda desde acá.
const GSHEET_API_URL = "/api/devoluciones";

const GS_READY = true;

// Wrapper para llamadas GET/POST al Apps Script
async function gsGet(params) {
  if (!GS_READY) return null;
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(GSHEET_API_URL + "?" + qs, { redirect: "follow" });
  return r.json();
}
async function gsPost(body) {
  if (!GS_READY) return null;
  // Content-Type real, no text/plain: aquel era para esquivar el preflight CORS
  // de Apps Script, y contra nuestra API es del mismo origen y no hace falta.
  // Ahora la respuesta SÍ se puede leer, así que un fallo de guardado deja de
  // ser invisible.
  const r = await fetch(GSHEET_API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({ ok: false, error: "respuesta ilegible" }));
  if (!r.ok) throw new Error(d.error || `error ${r.status} al guardar`);
  return d;
}

const SYNC = {
  persona: null,
  setBadge(state, text){
    const dot = document.getElementById("syncDot");
    const txt = document.getElementById("syncText");
    if(!dot || !txt) return;
    dot.className = "dot" + (state==="syncing"?" syncing":state==="error"?" error":"");
    txt.textContent = text || (state==="syncing"?"Sincronizando…":state==="error"?"Sin conexión":(SYNC.persona||"Conectado"));
  },
  // Registra una acción en Google Sheets
  async log(accion, detalle, mes, anio){
    if(!GS_READY || !SYNC.persona) return;
    try{
      await gsPost({
        action: "logActividad",
        persona: SYNC.persona,
        accion, detalle: detalle||"",
        mes: mes||"", anio: anio||""
      });
    }catch(e){ console.warn("log:",e); }
  },
  // Guarda motivos en Google Sheets (SKU_Alertas)
  async pushMotivos(mes, anio, motivosObj){
    if(!GS_READY || !SYNC.persona) return;
    try{
      SYNC.setBadge("syncing");
      const res = await gsPost({
        action: "saveMotivos",
        mes, anio,
        motivos: motivosObj,
        persona: SYNC.persona
      });
      if(res && res.error) throw new Error(res.error);
      SYNC.setBadge("ok");
      SYNC.log("edita_motivos", `${Object.keys(motivosObj).length} SKU(s)`, mes, anio);
    }catch(e){ console.warn("pushMotivos:",e); SYNC.setBadge("error"); }
  },
  // Guarda el análisis completo de un mes
  async pushMesData(mes, anio, payload){
    if(!GS_READY || !SYNC.persona) return;
    try{
      SYNC.setBadge("syncing");
      const res = await gsPost({
        action: "saveMes",
        mes, anio,
        data: payload,
        persona: SYNC.persona
      });
      if(res && res.error) throw new Error(res.error);
      SYNC.setBadge("ok");
    }catch(e){ console.warn("pushMesData:",e); SYNC.setBadge("error"); }
  },
  // Guarda el snapshot JSON para la comparativa
  async pushSnapshot(mes, anio, snapshot){
    if(!GS_READY || !SYNC.persona) return;
    // El error NO se atrapa. Atrapado aca, un snapshot que no entraba en el
    // limite del servidor dejaba un console.warn que nadie mira: el analisis
    // quedaba solo en el navegador de quien lo hizo, el resto veia un mes menos
    // en el historico, y la app no daba ninguna señal. Que reviente y se avise.
    await gsPost({
      action: "saveSnapshot",
      mes, anio,
      snapshot,
      persona: SYNC.persona
    });
  },
  // Lista meses disponibles en Google Sheets
  async listMeses(){
    if(!GS_READY || !SYNC.persona) return [];
    try{
      const res = await gsGet({ action: "listMeses" });
      return (res && res.meses) || [];
    }catch(e){ console.warn("listMeses:",e); return []; }
  },
  // Trae motivos de un mes desde Google Sheets
  async pullMotivos(mes, anio){
    if(!GS_READY || !SYNC.persona) return {};
    try{
      const res = await gsGet({ action: "getMotivos", mes, anio });
      return (res && res.motivos) || {};
    }catch(e){ console.warn("pullMotivos:",e); return {}; }
  },
  // Trae todos los snapshots para reconstruir el histórico
  async pullAllSnapshots(){
    if(!GS_READY || !SYNC.persona) return {};
    // El error NO se atrapa, a proposito. Antes devolvia {} ante un fallo de red;
    // hydrateFromCloud lo confundia con "no hay nada nuevo", se salteaba la
    // mezcla y dejaba el cartel en "ok". Resultado: la app mostraba solo el
    // historico local y afirmaba estar sincronizada. Fallar ruidosamente ES el
    // arreglo: el catch de hydrateFromCloud ya sabe mostrarlo.
    const res = await gsGet({ action: "getAllSnapshots" });
    return (res && res.snapshots) || {};
  }
};

// Interceptar localStorage para sincronizar automáticamente a Google Sheets
(function patchStorage(){
  const _setItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function(key, val){
    _setItem.call(this, key, val);
    if(!GS_READY || !SYNC.persona) return;
    const m = /^motivos_[^:]+:([A-Z]+)_(\d{4})$/.exec(key);
    if(m){
      try{ SYNC.pushMotivos(m[1], parseInt(m[2],10), JSON.parse(val||"{}")); }catch(e){}
    }
  };
})();

function log(msg, level="info"){

  el.classList.add("active");

/* ============================================================
   FILE INPUTS — drag/drop visual feedback
   ============================================================ */
function bindDrop(dropId, inputId, nameId){
  const drop = $(dropId), input = $(inputId), name = $(nameId);
  input.addEventListener("change", () => {
    if(input.files && input.files[0]){
      drop.classList.add("has-file");
      name.textContent = "✓ " + input.files[0].name;
      checkReady();
    }
  });
  ["dragenter","dragover"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor="var(--ink)"; })
  );
  ["dragleave","drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor=""; })
  );
  drop.addEventListener("drop", e => {
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files[0]){
      input.files = e.dataTransfer.files;
      input.dispatchEvent(new Event("change"));
    }
  });
}
bindDrop("dropMon","fileMon","fileMonName");
bindDrop("dropMov","fileMov","fileMovName");

/* ============================================================
   READ XLSX (SheetJS)
   ============================================================ */
async function readWorkbook(file){
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, {type:"array", cellDates:true});
}

function findSheet(wb, ...needles){
  const sheets = wb.SheetNames;
  for(const needle of needles){
    const n = norm(needle);
    const exact = sheets.find(s => norm(s) === n);
    if(exact) return exact;
    const partial = sheets.find(s => norm(s).includes(n));
    if(partial) return partial;
  }
  return null;
}

/* ============================================================
   PARSE MONITOR
   ============================================================ */
function parseMonitor(wb){
  const ventasSheet = findSheet(wb, "vta ultimos 3M", "vta ultimos 3m", "ventas 3m");
  if(!ventasSheet) throw new Error("No se encontró la hoja 'vta ultimos 3M' en el Monitor.");
  const maestroSheet = findSheet(wb, "Maestro", "maestro productos");

  // VTA — leer como AOA
  const wsV = wb.Sheets[ventasSheet];
  const aoa = XLSX.utils.sheet_to_json(wsV, {header:1, defval:null, raw:true});
  if(aoa.length < 2) throw new Error("La hoja 'vta ultimos 3M' está vacía.");
  const head = aoa[0].map(h => norm(h));
  // Detectar columnas
  const idxCod = head.findIndex(h => h && (h.includes("codigo") || h.includes("código") || h==="sku"));
  // idxProd debe ser DISTINTO de idxCod — "Código Producto" también contiene "producto"
  const idxProd = head.findIndex((h, i) => i !== idxCod && h && h.includes("producto"));
  const idxProm = head.findIndex(h => h && (h.includes("promedio") && (h.includes("3") || h.includes("mes"))));
  if(idxCod < 0) throw new Error("La hoja 'vta ultimos 3M' debe tener una columna 'Código Producto'.");
  if(idxProm < 0) throw new Error("La hoja 'vta ultimos 3M' debe tener una columna 'Promedio 3 meses'.");

  // Identificar las 3 columnas de meses: están entre Producto y Promedio (típicamente 3 columnas con tipo fecha o etiqueta mes.aa)
  const mesCols = [];
  for(let i = (idxProd>=0?idxProd+1:1); i < idxProm; i++){
    mesCols.push(i);
  }
  // si no encontramos 3, asumir las 3 antes de Promedio
  if(mesCols.length !== 3){
    const idxs = [];
    for(let i = idxProm-3; i < idxProm; i++) if(i >= 0) idxs.push(i);
    mesCols.length = 0;
    mesCols.push(...idxs);
  }

  const ventas = [];
  for(let r = 1; r < aoa.length; r++){
    const row = aoa[r];
    if(!row) continue;
    const cod = row[idxCod];
    if(cod == null || cod === "") continue;
    const m1 = Number(row[mesCols[0]]) || 0;
    const m2 = Number(row[mesCols[1]]) || 0;
    const m3 = Number(row[mesCols[2]]) || 0;
    const promRaw = row[idxProm];
    ventas.push({
      codigo: cod,
      producto: row[idxProd] || "",
      m1, m2, m3,
      promedio: (typeof promRaw === "number") ? promRaw : (m1+m2+m3)/3,
    });
  }

  // Headers de meses (para output)
  const mesHeaders = mesCols.map(i => aoa[0][i] || "");

  // MAESTRO
  const maestro = new Map();
  if(maestroSheet){
    const wsM = wb.Sheets[maestroSheet];
    const aoaM = XLSX.utils.sheet_to_json(wsM, {header:1, defval:null});
    if(aoaM.length >= 2){
      const headM = aoaM[0].map(h => norm(h));
      const iCod = headM.findIndex(h => h && (h.includes("codigo") || h.includes("código") || h==="sku"));
      const iCat = headM.findIndex(h => h && h.includes("categor"));
      const iMar = headM.findIndex(h => h && h.includes("marca"));
      if(iCod >= 0){
        for(let r = 1; r < aoaM.length; r++){
          const cod = aoaM[r][iCod];
          if(cod == null || cod==="") continue;
          maestro.set(String(cod), {
            categoria: iCat >= 0 ? (aoaM[r][iCat] || "Sin categoría") : "Sin categoría",
            marca:     iMar >= 0 ? (aoaM[r][iMar] || "") : "",
          });
        }
      }
    }
  }

  return {ventas, maestro, mesHeaders, ventasSheet, maestroSheet};
}

/* ============================================================
   PARSE MOVIMIENTOS
   ============================================================ */
function parseMovimientos(wb){
  // Tomar la primera hoja con datos
  let ws = null, sheetName = null;
  for(const n of wb.SheetNames){
    const s = wb.Sheets[n];
    const aoa = XLSX.utils.sheet_to_json(s, {header:1, defval:null});
    if(aoa.length > 1){ ws = s; sheetName = n; break; }
  }
  if(!ws) throw new Error("El archivo de movimientos no contiene datos.");

  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});

  // ============================================================
  // Detección dual de formato:
  //  (A) Export "limpio" con fila de encabezados ("Código Producto", "Documento", "Entrada", ...)
  //  (B) Export crudo de Idempiere: las primeras filas son PARÁMETROS del reporte
  //      (Grupo Empresarial / Organización / Fecha Movimiento / Almacén / Usuario)
  //      y NO existe fila de encabezados — los datos arrancan directamente y las
  //      columnas vienen en posiciones fijas.
  // ============================================================
  let iCod, iProd, iDoc, iEnt, dataStart;

  // Buscar una fila que parezca encabezados (contenga "documento" o "entrada" como texto)
  let headerRowIdx = -1;
  for(let r = 0; r < Math.min(aoa.length, 15); r++){
    const row = (aoa[r] || []).map(h => norm(h));
    const hasDoc = row.some(h => h && h.includes("documento"));
    const hasEnt = row.some(h => h && h.startsWith("entrada"));
    const hasCod = row.some(h => h && (h.includes("codigo producto") || h.includes("código producto")));
    if(hasDoc && hasEnt && hasCod){ headerRowIdx = r; break; }
  }

  if(headerRowIdx >= 0){
    // Caso A — formato con encabezados
    const head = aoa[headerRowIdx].map(h => norm(h));
    iCod  = head.findIndex(h => h && (h.includes("codigo producto") || h.includes("código producto") || h==="codigo" || h==="código"));
    iProd = head.findIndex(h => h && (h.includes("nombre producto") || (h.includes("producto") && !h.includes("codigo"))));
    iDoc  = head.findIndex(h => h && h.includes("documento"));
    iEnt  = head.findIndex(h => h && h.startsWith("entrada"));
    dataStart = headerRowIdx + 1;
  } else {
    // Caso B — formato crudo Idempiere: columnas por posición fija
    // 0:Grupo 1:Estado 2:CodProd 3:Almacén 4:NombreProd 5:Fecha 6:Documento 7:NDoc 8:UM 9:Socio 10:StockIni 11:Entrada 12:Salida 13:Acumulado
    iCod = 2; iProd = 4; iDoc = 6; iEnt = 11;

    // Encontrar la primera fila de datos reales: tiene un Documento conocido en col 6
    const docVals = ["devolucion de cliente","devolución de cliente","transferencia logistica-rotura","transferencia logística-rotura","movimiento de inventario"];
    dataStart = -1;
    for(let r = 0; r < Math.min(aoa.length, 30); r++){
      const cell = norm((aoa[r] || [])[iDoc]);
      if(cell && docVals.some(v => cell.includes(v))){ dataStart = r; break; }
    }
    if(dataStart < 0){
      throw new Error("No se encontraron filas de movimientos válidas. Verificá que el archivo sea la exportación de Idempiere 'Movimiento de Stock por Estado'.");
    }
  }

  if(iCod < 0) throw new Error("El archivo de movimientos debe tener columna 'Código Producto'.");
  if(iDoc < 0) throw new Error("El archivo de movimientos debe tener columna 'Documento'.");
  if(iEnt < 0) throw new Error("El archivo de movimientos debe tener columna 'Entrada'.");

  const rows = [];
  for(let r = dataStart; r < aoa.length; r++){
    const row = aoa[r];
    if(!row || row.every(c => c==null || c==="")) continue;
    const doc = (row[iDoc] || "").toString().trim();
    if(!doc) continue;
    if(norm(doc).includes("movimiento de inventario")) continue; // EXCLUIR
    const ent = Number(row[iEnt]) || 0;
    rows.push({
      codigo: row[iCod],
      producto: row[iProd] || "",
      documento: doc,
      entrada: ent,
      __raw: row,
    });
  }

  return {rows, rawAOA: aoa, sheetName, dataStart, columnMap:{iCod, iProd, iDoc, iEnt}};
}

/* ============================================================
   AGREGAR — calcular indicadores
   ============================================================ */
function aggregate(monitor, mov, opts){
  const umbral = Number(opts.umbral) || 3;              // Umbral SKU crítico (tasa individual)
  const umbralGlobal = Number(opts.umbralGlobal) || 1;  // Umbral tasa global del mes
  const zeroNeg = !!opts.zeroNeg;

  // Si zeroNeg está activo: para cada SKU del Monitor, los meses negativos se ponen
  // en 0 y se recalcula el promedio como (m1+m2+m3)/3. Esto afecta sumaProm, tasas y alertas.
  const applyZeroNeg = (v) => {
    if(!zeroNeg) return v.promedio;
    const m1 = Math.max(0, Number(v.m1) || 0);
    const m2 = Math.max(0, Number(v.m2) || 0);
    const m3 = Math.max(0, Number(v.m3) || 0);
    return (m1 + m2 + m3) / 3;
  };

  // Mapa: codigo (string) -> {dev, rot, prod}
  const skuMap = new Map();
  for(const r of mov.rows){
    const key = String(r.codigo);
    let s = skuMap.get(key);
    if(!s){ s = {codigo:r.codigo, producto:r.producto, dev:0, rot:0}; skuMap.set(key, s); }
    const doc = norm(r.documento);
    if(doc.includes("devolucion de cliente") || doc.includes("devolución de cliente")){
      s.dev += r.entrada;
    } else if(doc.includes("transferencia logistica-rotura") || doc.includes("transferencia logística-rotura") || doc.includes("rotura")){
      s.rot += r.entrada;
    }
    if(!s.producto && r.producto) s.producto = r.producto;
  }

  // Mapa ventas con promedio efectivo (saneado si zeroNeg activo)
  const vMap = new Map();
  for(const v of monitor.ventas){
    vMap.set(String(v.codigo), {...v, promedioEfectivo: applyZeroNeg(v)});
  }

  // Enriquecer SKUs
  const skus = [];
  for(const [k, s] of skuMap){
    const v = vMap.get(k);
    const cat = monitor.maestro.get(k);
    const marca = (cat && cat.marca) ? cat.marca : extractMarca(s.producto);
    const categoria = (cat && cat.categoria) ? cat.categoria : "Sin categoría";
    const promedio = v ? v.promedioEfectivo : 0;
    const tasa = (promedio > 0) ? (s.dev / promedio) * 100 : 0;
    skus.push({
      codigo: s.codigo,
      producto: s.producto || (v ? v.producto : ""),
      categoria, marca,
      dev: s.dev, rot: s.rot,
      total: s.dev + s.rot,
      promedio,
      tasa,
      alerta: tasa > umbral && s.dev > 0,
    });
  }

  // Totales
  const totalDev = skus.reduce((a,s) => a + s.dev, 0);
  const totalRot = skus.reduce((a,s) => a + s.rot, 0);
  const total = totalDev + totalRot;
  const skuConDev = skus.filter(s => s.dev > 0).length;
  const skuConRot = skus.filter(s => s.rot > 0).length;
  // sumaProm — suma del promedio efectivo (saneado si zeroNeg activo)
  const sumaProm = monitor.ventas.reduce((a, v) => {
    const p = applyZeroNeg(v);
    return a + (Number.isFinite(p) ? p : 0);
  }, 0);
  const tasaGlobal = (sumaProm > 0) ? (total / sumaProm) * 100 : 0;
  const promDevSku = (skuConDev > 0) ? totalDev / skuConDev : 0;

  // Alerta — solo devoluciones > umbral
  const alertas = skus.filter(s => s.alerta).sort((a,b) => b.dev - a.dev);

  // Categorías
  const catMap = new Map();
  for(const s of skus){
    let c = catMap.get(s.categoria);
    if(!c){ c = {cat:s.categoria, dev:0, rot:0, total:0, prom:0}; catMap.set(s.categoria, c); }
    c.dev += s.dev; c.rot += s.rot; c.total += (s.dev + s.rot);
  }
  // Sumar promedio venta por categoría (sólo SKU con movimiento, aproximación direccional)
  for(const s of skus){
    const c = catMap.get(s.categoria);
    if(c) c.prom += s.promedio;
  }
  const categorias = Array.from(catMap.values()).sort((a,b) => b.total - a.total);
  categorias.forEach(c => {
    c.partDev = totalDev > 0 ? (c.dev / totalDev) * 100 : 0;
    c.partRot = totalRot > 0 ? (c.rot / totalRot) * 100 : 0;
    c.partTot = total > 0 ? (c.total / total) * 100 : 0;
    c.tasaCat = c.prom > 0 ? (c.total / c.prom) * 100 : 0;
  });

  // Top SKU rotura interna
  const topRot = skus.filter(s => s.rot > 0).sort((a,b) => b.rot - a.rot).slice(0, 10);

  return {
    totalDev, totalRot, total,
    skuConDev, skuConRot, skuTotal: skus.length,
    sumaProm, tasaGlobal, promDevSku,
    umbral,
    umbralGlobal,
    alertas,
    skus,
    categorias,
    topRot,
  };
}

function extractMarca(prod){
  if(!prod) return "";
  // primer token antes del primer espacio o guion
  const t = prod.split(/[\s\-–—]/)[0];
  return cap(t);
}

/* ============================================================
   HISTÓRICO MENSUAL — persistencia de snapshots por mes
   ============================================================ */
const HISTORY_KEY = `history_${APP_VERSION}`;
const MONTH_ORDER = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||"{}"); }catch(e){ return {}; }
}
function persistHistory(h){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){}
}

function historyKeyFor(mes, anio){ return `${anio}-${String(MONTH_ORDER.indexOf(mes)+1).padStart(2,"0")}_${mes}`; }

// Toma una "foto" del análisis actual y la mete en el histórico.
function saveHistorySnapshot(){
  if(!STATE.computed) return;
  const c = STATE.computed;
  const corteEl = document.getElementById("corteMotivos");
  const corte = corteEl ? (Number(corteEl.value)>0 ? Number(corteEl.value) : 50) : 50;
  const buf = STATE.motivosBuffer || {};

  // Críticos
  const critDev = c.skus.filter(s => s.tasa > c.umbral && s.dev >= corte);
  const critRot = c.skus.filter(s => s.tasa > c.umbral && s.rot >= corte);
  const unidsCritDev = critDev.reduce((a,s)=>a+s.dev,0);
  const unidsCritRot = critRot.reduce((a,s)=>a+s.rot,0);

  // Top categorías globales
  const topCatDev = c.categorias.filter(x=>x.dev>0).sort((a,b)=>b.dev-a.dev).slice(0,3).map(x => ({cat:x.cat, unid:x.dev, part:x.partDev}));
  const topCatRot = c.categorias.filter(x=>x.rot>0).sort((a,b)=>b.rot-a.rot).slice(0,3).map(x => ({cat:x.cat, unid:x.rot, part:x.partRot}));

  // Motivos resumidos (devoluciones + roturas).
  // Cuando el motivo es "Otros" y hay una nota escrita, el resumen se agrupa
  // bajo el texto de la nota — así en el PPT no aparece un genérico "Otros".
  const motivosResumen = {dev:{}, rot:{}};
  const effectiveMotivo = (m) => {
    if(!m || !m.motivo) return null;
    const nota = (m.nota || "").trim();
    return (m.motivo === "Otros" && nota) ? nota : m.motivo;
  };
  Object.entries(buf).forEach(([sku, m]) => {
    const skuObj = c.skus.find(s => String(s.codigo) === String(sku));
    if(!skuObj) return;
    const km = effectiveMotivo(m.dev);
    if(km) motivosResumen.dev[km] = (motivosResumen.dev[km]||0) + skuObj.dev;
    const kr = effectiveMotivo(m.rot);
    if(kr) motivosResumen.rot[kr] = (motivosResumen.rot[kr]||0) + skuObj.rot;
  });

  // Detalle de SKU críticos (compacto)
  const criticosSnapshot = [...critDev, ...critRot.filter(r => !critDev.includes(r))].map(s => ({
    codigo:s.codigo, producto:s.producto, categoria:s.categoria, marca:s.marca,
    dev:s.dev, rot:s.rot, tasa:s.tasa, promedio:s.promedio,
    motivoDev: buf[s.codigo]?.dev?.motivo || "",
    notaDev:   buf[s.codigo]?.dev?.nota || "",
    motivoRot: buf[s.codigo]?.rot?.motivo || "",
    notaRot:   buf[s.codigo]?.rot?.nota || "",
  }));

  const snapshot = {
    mes: STATE.mes, anio: STATE.anio,
    fechaAnalisis: new Date().toISOString(),
    umbral: c.umbral,
    umbralGlobal: c.umbralGlobal,
    corte,
    totalDev: c.totalDev, totalRot: c.totalRot,
    skuConDev: c.skuConDev, skuConRot: c.skuConRot,
    sumaProm: c.sumaProm, tasaGlobal: c.tasaGlobal,
    criticosDev: critDev.length, criticosRot: critRot.length,
    unidsCritDev, unidsCritRot,
    topCatDev, topCatRot,
    motivosResumen,
    criticos: criticosSnapshot,
  };

  const h = loadHistory();
  h[historyKeyFor(STATE.mes, STATE.anio)] = snapshot;
  persistHistory(h);
}

// Set de keys seleccionados para la comparativa (en memoria, se reconstruye al volver a entrar)
function getSelectedKeys(){
  if(!STATE.histSelected) STATE.histSelected = new Set();
  return STATE.histSelected;
}

function renderHistory(){
  const h = loadHistory();
  const keys = Object.keys(h).sort();
  const empty = $("historyEmpty");
  const content = $("historyContent");

  $("historyMeta").textContent = keys.length > 0
    ? `${keys.length} ${keys.length===1?'mes registrado':'meses registrados'}`
    : `Sin análisis guardados todavía`;

  if(keys.length === 0){
    empty.style.display = "block";
    content.style.display = "none";
    if(STATE.charts.hist){ STATE.charts.hist.destroy(); delete STATE.charts.hist; }
    if(STATE.charts.histTasa){ STATE.charts.histTasa.destroy(); delete STATE.charts.histTasa; }
    if(typeof updateHistBadge === "function") updateHistBadge();
    return;
  }
  empty.style.display = "none";
  content.style.display = "block";

  // Inicializar selección: si está vacía, seleccionar todos
  const sel = getSelectedKeys();
  if(sel.size === 0){
    keys.forEach(k => sel.add(k));
  }
  // Sacar claves que ya no existen
  for(const k of [...sel]) if(!keys.includes(k)) sel.delete(k);

  renderMonthPicker(h, keys);
  renderComparison(h);
  if(typeof updateHistBadge === "function") updateHistBadge();
  // El selector de correccion se rellena aca y no solo al cargar la pagina: al
  // arrancar todavia no hay historico -llega despues, con la sincronizacion- y
  // el desplegable quedaba vacio para siempre.
  if(typeof fixRenderSelector === "function") try{ fixRenderSelector(); }catch(e){}
}

function renderMonthPicker(h, keys){
  const sel = getSelectedKeys();
  const grid = $("mpGrid");
  $("mpSub").textContent = `${sel.size} de ${keys.length} seleccionados`;

  grid.innerHTML = keys.map(k => {
    const it = normalizeSnapshot(h[k]);
    const isSel = sel.has(k);
    const overUmbral = it.tasaGlobal > it.umbralGlobal;
    const tasaColor = overUmbral ? "var(--red)" : "var(--green)";
    return `
      <div class="mp-chip ${isSel?'selected':''}" data-key="${k}">
        <div class="mp-mes">${cap(it.mes)} ${it.anio}</div>
        <div class="mp-stats">${fmt(it.totalDev)} dev · ${fmt(it.totalRot)} rot</div>
        <div class="mp-stats">Tasa <span class="mp-tasa" style="color:${isSel?'var(--gold)':tasaColor}">${pct(it.tasaGlobal,2)}</span> · ${it.criticosDev+it.criticosRot} críticos</div>
      </div>
    `;
  }).join("");

  // Click handlers
  grid.querySelectorAll(".mp-chip").forEach(el => {
    el.addEventListener("click", () => {
      const k = el.dataset.key;
      if(sel.has(k)) sel.delete(k); else sel.add(k);
      renderHistory();
    });
  });
}

function renderComparison(h){
  const sel = getSelectedKeys();
  const keys = [...sel].sort();
  const items = keys.map(k => normalizeSnapshot(h[k]));

  // KPIs comparativos
  if(items.length === 0){
    $("compKpis").innerHTML = `<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);font-style:italic;font-family:'Fraunces',serif;background:var(--paper-2);border:1px solid var(--line);border-radius:2px">Seleccioná al menos un mes arriba para ver la comparativa.</div>`;
    if(STATE.charts.hist){ STATE.charts.hist.destroy(); delete STATE.charts.hist; }
    if(STATE.charts.histTasa){ STATE.charts.histTasa.destroy(); delete STATE.charts.histTasa; }
    if(STATE.charts.recurCat){ STATE.charts.recurCat.destroy(); delete STATE.charts.recurCat; }
    if(STATE.charts.recurMot){ STATE.charts.recurMot.destroy(); delete STATE.charts.recurMot; }
    $("recurSkuTable").innerHTML = "";
    $("histTable").innerHTML = "";
    $("recurSkuMeta").textContent = "—";
    $("histDetalleMeta").textContent = "—";
    return;
  }

  const totDev = items.reduce((a,it)=>a+it.totalDev,0);
  const totRot = items.reduce((a,it)=>a+it.totalRot,0);
  const sumProm = items.reduce((a,it)=>a+it.sumaProm,0);
  const tasaAcumulada = sumProm > 0 ? ((totDev+totRot)/sumProm)*100 : 0;
  const totCriticos = items.reduce((a,it)=>a+it.criticosDev+it.criticosRot,0);
  const mesesOver = items.filter(it => it.tasaGlobal > it.umbralGlobal).length;

  $("compKpis").innerHTML = `
    <div class="comp-kpi">
      <div class="ck-lbl">Meses comparados</div>
      <div class="ck-val">${items.length}</div>
      <div class="ck-sub">de ${Object.keys(h).length} en el histórico</div>
    </div>
    <div class="comp-kpi">
      <div class="ck-lbl">Devoluciones acumuladas</div>
      <div class="ck-val">${fmt(totDev)}</div>
      <div class="ck-sub">unidades en el período</div>
    </div>
    <div class="comp-kpi">
      <div class="ck-lbl">Roturas acumuladas</div>
      <div class="ck-val">${fmt(totRot)}</div>
      <div class="ck-sub">unidades en el período</div>
    </div>
    <div class="comp-kpi ${tasaAcumulada > 3 ? 'bad':'ok'}">
      <div class="ck-lbl">Tasa promedio del período</div>
      <div class="ck-val">${pct(tasaAcumulada,2)}</div>
      <div class="ck-sub">ponderada por venta promedio</div>
    </div>
    <div class="comp-kpi ${mesesOver > 0 ? 'warn':'ok'}">
      <div class="ck-lbl">Meses sobre umbral</div>
      <div class="ck-val">${mesesOver}<span style="font-size:18px;color:var(--muted);font-style:italic"> / ${items.length}</span></div>
      <div class="ck-sub">tasa global del mes > umbral</div>
    </div>
    <div class="comp-kpi ${totCriticos > 0 ? 'warn':'ok'}">
      <div class="ck-lbl">SKU críticos acumulados</div>
      <div class="ck-val">${totCriticos}</div>
      <div class="ck-sub">suma de dev+rot críticos</div>
    </div>
  `;

  // Chart de evolución
  const labels = items.map(it => `${cap(it.mes).slice(0,3)}.${String(it.anio).slice(-2)}`);
  if(STATE.charts.hist) STATE.charts.hist.destroy();
  STATE.charts.hist = new Chart($("histChart"), {
    type:"bar",
    data:{labels, datasets:[
      {label:"Devoluciones", data:items.map(it => it.totalDev), backgroundColor:"#C2410C", borderRadius:2},
      {label:"Roturas internas", data:items.map(it => it.totalRot), backgroundColor:"#991B1B", borderRadius:2},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"top",labels:{font:{family:"Inter Tight,sans-serif",size:11.5},color:"#2D3B52",boxWidth:14}}, tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.parsed.y)} u.`}}},
      scales:{
        y:{beginAtZero:true, title:{display:true, text:"Unidades", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{color:"#EEF0F2"}, ticks:{font:{family:"Inter Tight,sans-serif",size:11},color:"#6B7A8F",callback:v=>fmt(v)}},
        x:{title:{display:true, text:"Mes", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{display:false}, ticks:{font:{family:"Inter Tight,sans-serif",size:12},color:"#2D3B52"}},
      }
    }
  });

  // Chart línea tasa
  if(STATE.charts.histTasa) STATE.charts.histTasa.destroy();
  const umbralRef = items[items.length-1].umbralGlobal || items[items.length-1].umbral || 1;
  STATE.charts.histTasa = new Chart($("histTasaChart"), {
    type:"line",
    data:{labels, datasets:[
      {label:"Tasa global %", data:items.map(it => Number((Number(it.tasaGlobal)||0).toFixed(2))), borderColor:"#0A1628", backgroundColor:"rgba(10,22,40,.08)", tension:0.25, fill:true, pointBackgroundColor:"#B8902F", pointBorderColor:"#fff", pointBorderWidth:2, pointRadius:5},
      {label:`Umbral ${umbralRef}%`, data:items.map(()=>umbralRef), borderColor:"#991B1B", borderDash:[6,4], pointRadius:0, fill:false},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"top",labels:{font:{family:"Inter Tight,sans-serif",size:11.5},color:"#2D3B52",boxWidth:14}}, tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}%`}}},
      scales:{
        y:{beginAtZero:true, title:{display:true, text:"Tasa global (%)", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{color:"#EEF0F2"}, ticks:{font:{family:"Inter Tight,sans-serif",size:11},color:"#6B7A8F",callback:v=>v+"%"}},
        x:{title:{display:true, text:"Mes", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{display:false}, ticks:{font:{family:"Inter Tight,sans-serif",size:12},color:"#2D3B52"}},
      }
    }
  });

  // === SKU recurrentes ===
  // Para cada SKU crítico en cualquier mes seleccionado, contar en cuántos meses aparece
  const skuMap = new Map();
  items.forEach(it => {
    (it.criticos || []).forEach(sk => {
      const k = String(sk.codigo);
      if(!skuMap.has(k)){
        skuMap.set(k, {
          codigo:sk.codigo, producto:sk.producto, categoria:sk.categoria, marca:sk.marca,
          meses:[], totalDev:0, totalRot:0, motivosDev:new Map(), motivosRot:new Map()
        });
      }
      const entry = skuMap.get(k);
      entry.meses.push({mes:it.mes, anio:it.anio, dev:sk.dev, rot:sk.rot, tasa:sk.tasa,
        motivoDev:sk.motivoDev, notaDev:sk.notaDev, motivoRot:sk.motivoRot, notaRot:sk.notaRot});
      entry.totalDev += sk.dev;
      entry.totalRot += sk.rot;
      // motivosDev/Rot: Map de motivo -> Set de notas (para agrupar notas por motivo)
      if(sk.motivoDev){
        if(!entry.motivosDev.has(sk.motivoDev)) entry.motivosDev.set(sk.motivoDev, new Set());
        if(sk.notaDev && sk.notaDev.trim()) entry.motivosDev.get(sk.motivoDev).add(sk.notaDev.trim());
      }
      if(sk.motivoRot){
        if(!entry.motivosRot.has(sk.motivoRot)) entry.motivosRot.set(sk.motivoRot, new Set());
        if(sk.notaRot && sk.notaRot.trim()) entry.motivosRot.get(sk.motivoRot).add(sk.notaRot.trim());
      }
    });
  });
  // Filtrar: solo los que aparecen en 2+ meses (recurrentes) si hay 2+ meses; si hay solo 1, mostrar todos
  const minMeses = items.length >= 2 ? 2 : 1;
  const recurSkus = [...skuMap.values()]
    .filter(s => s.meses.length >= minMeses)
    .sort((a,b) => b.meses.length - a.meses.length || (b.totalDev+b.totalRot)-(a.totalDev+a.totalRot));

  $("recurSkuMeta").textContent = items.length >= 2
    ? (recurSkus.length > 0 ? `${recurSkus.length} SKU aparecen como críticos en 2 o más meses` : `Ningún SKU se repite como crítico en los meses seleccionados`)
    : `${recurSkus.length} SKU críticos en el mes seleccionado`;

  if(recurSkus.length === 0){
    $("recurSkuTable").innerHTML = `<thead><tr><th></th></tr></thead><tbody><tr><td style="padding:30px;text-align:center;color:var(--muted);font-style:italic;font-family:'Fraunces',serif">${items.length>=2 ? 'Ningún SKU se repite como crítico en los meses seleccionados.' : 'No hay SKU críticos en el mes seleccionado.'}</td></tr></tbody>`;
  } else {
    const head = `<thead><tr>
      <th>SKU</th><th>Producto</th><th>Categoría</th>
      <th style="text-align:right">Meses</th>
      <th style="text-align:right">Σ Dev.</th>
      <th style="text-align:right">Σ Rot.</th>
      <th>Motivos devolución</th>
      <th>Motivos rotura</th>
    </tr></thead>`;
    // Helper para renderizar motivos con sus notas
    const renderMotivosConNotas = (motivosMap, colorBg, colorTxt, colorBorder) => {
      if(motivosMap.size === 0) return '<span style="color:var(--muted);font-style:italic">—</span>';
      return [...motivosMap.entries()].map(([mot, notasSet]) => {
        const pill = `<span class="pill" style="background:${colorBg};color:${colorTxt};border-color:${colorBorder};margin:1px 2px;display:inline-block">${mot}</span>`;
        const notas = [...notasSet];
        if(notas.length === 0) return pill;
        const notasStr = notas.map(n => `«${n}»`).join(' · ');
        return `<div style="margin:2px 0"><div>${pill}</div><div style="font-size:10.5px;color:var(--muted);font-style:italic;margin-left:6px;margin-top:2px;line-height:1.35">${notasStr}</div></div>`;
      }).join("");
    };

    const rows = recurSkus.slice(0,30).map(s => `
      <tr>
        <td class="sku-code">${s.codigo}</td>
        <td class="prod" title="${(s.producto||'').replace(/"/g,'&quot;')}">${s.producto||'—'}</td>
        <td><span class="pill">${s.categoria||'—'}</span></td>
        <td class="num"><b style="color:${s.meses.length>=3?'var(--red)':s.meses.length>=2?'var(--amber)':'var(--ink)'}">${s.meses.length}</b><div style="font-size:10px;color:var(--muted);margin-top:2px">${s.meses.map(m => cap(m.mes).slice(0,3)).join(", ")}</div></td>
        <td class="num" style="color:#C2410C;font-weight:600">${fmt(s.totalDev)}</td>
        <td class="num" style="color:var(--red);font-weight:600">${s.totalRot>0?fmt(s.totalRot):'—'}</td>
        <td style="font-size:11.5px;vertical-align:top">${renderMotivosConNotas(s.motivosDev, '#FED7AA', '#7C2D12', '#FB923C')}</td>
        <td style="font-size:11.5px;vertical-align:top">${renderMotivosConNotas(s.motivosRot, '#FECACA', '#7F1D1D', '#F87171')}</td>
      </tr>
    `).join("");
    $("recurSkuTable").innerHTML = head + `<tbody>${rows}</tbody>`;
  }

  // === Categorías recurrentes ===
  const catMap = new Map();
  items.forEach(it => {
    (it.topCatDev || []).forEach(c => {
      if(!catMap.has(c.cat)) catMap.set(c.cat, {cat:c.cat, mesesDev:new Set(), mesesRot:new Set(), totalDev:0, totalRot:0});
      catMap.get(c.cat).mesesDev.add(`${it.mes} ${it.anio}`);
      catMap.get(c.cat).totalDev += c.unid;
    });
    (it.topCatRot || []).forEach(c => {
      if(!catMap.has(c.cat)) catMap.set(c.cat, {cat:c.cat, mesesDev:new Set(), mesesRot:new Set(), totalDev:0, totalRot:0});
      catMap.get(c.cat).mesesRot.add(`${it.mes} ${it.anio}`);
      catMap.get(c.cat).totalRot += c.unid;
    });
  });
  const catList = [...catMap.values()].map(c => ({
    cat:c.cat, totalDev:c.totalDev, totalRot:c.totalRot,
  })).sort((a,b) => (b.totalDev+b.totalRot)-(a.totalDev+a.totalRot)).slice(0,8);

  $("recurCatSub").textContent = items.length === 1
    ? `${catList.length} ${catList.length===1?'categoría':'categorías'} top en el mes seleccionado`
    : `${catList.length} ${catList.length===1?'categoría':'categorías'} top en los ${items.length} meses seleccionados`;
  if(STATE.charts.recurCat) STATE.charts.recurCat.destroy();
  if(catList.length > 0){
    STATE.charts.recurCat = new Chart($("recurCatChart"), {
      type:"bar",
      data:{labels:catList.map(c=>c.cat), datasets:[
        {label:"Devoluciones", data:catList.map(c=>c.totalDev), backgroundColor:"#C2410C", borderRadius:2, stack:"u"},
        {label:"Roturas", data:catList.map(c=>c.totalRot), backgroundColor:"#991B1B", borderRadius:2, stack:"u"},
      ]},
      options:{
        indexAxis:"y",responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{position:"top",labels:{font:{family:"Inter Tight,sans-serif",size:11.5},color:"#2D3B52",boxWidth:14}},
          tooltip:{callbacks:{
            label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.parsed.x)} u.`
          }}
        },
        scales:{
          x:{stacked:true, beginAtZero:true, title:{display:true, text:"Unidades", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{color:"#EEF0F2"}, ticks:{font:{family:"Inter Tight,sans-serif",size:11},color:"#6B7A8F",callback:v=>fmt(v)}},
          y:{stacked:true, grid:{display:false}, ticks:{autoSkip:false, font:{family:"Inter Tight,sans-serif",size:12},color:"#2D3B52"}},
        }
      }
    });
  }

  // === Motivos recurrentes ===
  const motMap = new Map();
  items.forEach(it => {
    const r = it.motivosResumen || {};
    Object.entries(r.dev || {}).forEach(([m,u]) => {
      if(!motMap.has(m)) motMap.set(m, {motivo:m, dev:0, rot:0, meses:new Set()});
      motMap.get(m).dev += u; motMap.get(m).meses.add(`${it.mes} ${it.anio}`);
    });
    Object.entries(r.rot || {}).forEach(([m,u]) => {
      if(!motMap.has(m)) motMap.set(m, {motivo:m, dev:0, rot:0, meses:new Set()});
      motMap.get(m).rot += u; motMap.get(m).meses.add(`${it.mes} ${it.anio}`);
    });
  });
  const motList = [...motMap.values()].sort((a,b) => (b.dev+b.rot) - (a.dev+a.rot));
  $("recurMotSub").textContent = motList.length > 0
    ? (items.length === 1
        ? `${motList.length} ${motList.length===1?'motivo distinto cargado':'motivos distintos cargados'} en el mes seleccionado`
        : `${motList.length} ${motList.length===1?'motivo distinto cargado':'motivos distintos cargados'} en los ${items.length} meses seleccionados`)
    : (items.length === 1
        ? `No hay motivos cargados todavía en el mes seleccionado`
        : `No hay motivos cargados todavía en los meses seleccionados`);
  if(STATE.charts.recurMot) STATE.charts.recurMot.destroy();
  if(motList.length > 0){
    STATE.charts.recurMot = new Chart($("recurMotChart"), {
      type:"bar",
      data:{labels:motList.map(m=>m.motivo), datasets:[
        {label:"Devoluciones", data:motList.map(m=>m.dev), backgroundColor:"#C2410C", borderRadius:2, stack:"u"},
        {label:"Roturas", data:motList.map(m=>m.rot), backgroundColor:"#991B1B", borderRadius:2, stack:"u"},
      ]},
      options:{
        indexAxis:"y",responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{position:"top",labels:{font:{family:"Inter Tight,sans-serif",size:11.5},color:"#2D3B52",boxWidth:14}},
          tooltip:{callbacks:{
            label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.parsed.x)} u.`,
            afterLabel:ctx=>`Aparece en ${motList[ctx.dataIndex].meses.size} mes(es)`
          }}
        },
        scales:{
          x:{stacked:true, beginAtZero:true, title:{display:true, text:"Unidades", font:{family:"Inter Tight,sans-serif",size:12,weight:"600"}, color:"#2D3B52"}, grid:{color:"#EEF0F2"}, ticks:{font:{family:"Inter Tight,sans-serif",size:11},color:"#6B7A8F",callback:v=>fmt(v)}},
          y:{stacked:true, grid:{display:false}, ticks:{autoSkip:false, font:{family:"Inter Tight,sans-serif",size:12},color:"#2D3B52"}},
        }
      }
    });
  }

  // === Tabla detalle por mes (igual que antes) ===
  // Helper: top 2 motivos para una categoría dada, dentro de los SKU críticos del mes
  const topMotivosForCat = (criticos, categoria, tipo) => {
    const motMap = new Map();
    (criticos || []).forEach(c => {
      if(c.categoria !== categoria) return;
      const motivo = tipo === 'dev' ? c.motivoDev : c.motivoRot;
      const unid = tipo === 'dev' ? (c.dev || 0) : (c.rot || 0);
      if(!motivo || unid <= 0) return;
      motMap.set(motivo, (motMap.get(motivo) || 0) + unid);
    });
    const total = [...motMap.values()].reduce((a,b) => a+b, 0);
    if(total === 0) return [];
    return [...motMap.entries()]
      .map(([mot, u]) => ({mot, u, pct: 100 * u / total}))
      .sort((a,b) => b.u - a.u)
      .slice(0, 2);
  };

  // Helper: celda de categoría líder con unidades, % y motivos top 2
  const celdaCatLider = (top, criticos, tipo) => {
    if(!top) return '—';
    const motivos = topMotivosForCat(criticos, top.cat, tipo);
    const motStr = motivos.length > 0
      ? motivos.map(m => `${m.mot} ${m.pct.toFixed(0)}%`).join(' · ')
      : '<span style="color:var(--muted);font-style:italic">sin motivo cargado</span>';
    return `
      <span class="pill">${top.cat||''}</span>
      <span style="font-size:11px;color:var(--muted);margin-left:4px">${fmt(top.unid||0)} u · ${Number(top.part||0).toFixed(1)}%</span>
      <div style="font-size:10.5px;color:var(--body);margin-top:3px" title="Sobre los SKU críticos de esta categoría con motivo cargado">${motStr}</div>
    `;
  };

  $("histDetalleMeta").textContent = `${items.length} ${items.length===1?'período':'períodos'} · click ✕ para eliminar del histórico`;
  const head2 = `<thead><tr>
    <th>Mes</th>
    <th style="text-align:right">Devoluciones</th>
    <th style="text-align:right">Roturas</th>
    <th style="text-align:right">Tasa global</th>
    <th style="text-align:right">Críticos dev.</th>
    <th style="text-align:right">Críticos rot.</th>
    <th>Categoría líder dev.</th>
    <th>Categoría líder rot.</th>
    <th style="text-align:right">Acción</th>
  </tr></thead>`;
  const rows2 = items.map(it => {
    const overUmbral = it.tasaGlobal > it.umbralGlobal;
    return `<tr>
      <td><b>${cap(it.mes)} ${it.anio}</b><div style="font-size:11px;color:var(--muted);margin-top:2px">${new Date(it.fechaAnalisis).toLocaleDateString("es-AR")}</div></td>
      <td class="num">${fmt(it.totalDev)}</td>
      <td class="num">${fmt(it.totalRot)}</td>
      <td class="num ${overUmbral?'alert':''}">${pct(it.tasaGlobal,2)}</td>
      <td class="num" style="${it.criticosDev>0?'color:#C2410C;font-weight:700':''}">${it.criticosDev}</td>
      <td class="num" style="${it.criticosRot>0?'color:var(--red);font-weight:700':''}">${it.criticosRot}</td>
      <td>${celdaCatLider(it.topCatDev[0], it.criticos, 'dev')}</td>
      <td>${celdaCatLider(it.topCatRot[0], it.criticos, 'rot')}</td>
      <td style="text-align:right"><button class="btn-ghost-mini" data-hist-del="${historyKeyFor(it.mes, it.anio)}" title="Eliminar este registro">✕</button></td>
    </tr>`;
  }).join("");
  $("histTable").innerHTML = head2 + `<tbody>${rows2}</tbody>`;

  // Bind delete buttons
  $("histTable").querySelectorAll("[data-hist-del]").forEach(b => {
    b.addEventListener("click", e => {
      const k = e.target.dataset.histDel;
      if(!confirm(`¿Eliminar el análisis de ${k.split("_")[1]} ${k.split("-")[0]} del histórico?`)) return;
      const h2 = loadHistory();
      delete h2[k];
      persistHistory(h2);
      getSelectedKeys().delete(k);
      renderHistory();
    });
  });
}


function renderReading(c){
  const corteEl = document.getElementById("corteMotivos");
  const corte = corteEl ? (Number(corteEl.value)>0 ? Number(corteEl.value) : 50) : 50;
  const umbral = c.umbral;                    // Umbral SKU crítico
  const umbralGlobal = c.umbralGlobal ?? c.umbral; // Umbral tasa global del mes
  const mesCap = cap(STATE.mes||"");
  const overUmbral = c.tasaGlobal > umbralGlobal;

  // Críticos por tipo
  const critDev = c.skus.filter(s => s.tasa > umbral && s.dev >= corte);
  const critRot = c.skus.filter(s => s.tasa > umbral && s.rot >= corte);

  // Categorías líder
  const topCatDev = c.categorias.filter(x => x.dev > 0).sort((a,b)=>b.dev-a.dev).slice(0,2);
  const topCatRot = c.categorias.filter(x => x.rot > 0).sort((a,b)=>b.rot-a.rot).slice(0,2);

  // Helper: máxima tasa entre los SKU con rot>0 (para diagnosticar por qué no son críticos)
  const skusConRot = c.skus.filter(s => s.rot > 0);
  const maxRotTasa = skusConRot.length > 0 ? Math.max(...skusConRot.map(s => s.tasa)) : 0;
  const skuMaxRot = skusConRot.sort((a,b)=>b.rot-a.rot)[0];

  const paras = [];

  // Párrafo 1 — Panorama global
  paras.push(
    `En <b>${mesCap} ${STATE.anio||""}</b> se registraron <b>${fmt(c.totalDev)} unidades</b> devueltas por clientes y <b>${fmt(c.totalRot)} unidades</b> de rotura interna sobre una venta promedio de <b>${fmt(c.sumaProm)} u./mes</b>. ` +
    `La tasa global del mes es del <span class="${overUmbral?'crit':'calm'}">${pct(c.tasaGlobal,2)}</span>${overUmbral?` — por encima del umbral aceptable del ${umbralGlobal}%.`:` — dentro del umbral aceptable del ${umbralGlobal}%.`}`
  );

  // Párrafo 2 — Devoluciones críticas
  if(critDev.length > 0){
    const unidsCritDev = critDev.reduce((a,s)=>a+s.dev,0);
    paras.push(
      `<b>Devoluciones críticas:</b> <span class="crit">${critDev.length} SKU</span> superan los criterios (tasa &gt; ${umbral}% y ≥ ${corte} unidades), concentrando ${fmt(unidsCritDev)} unidades. ` +
      (topCatDev.length >= 2
        ? `Las categorías más afectadas en términos globales son <b>${topCatDev[0].cat}</b> (${topCatDev[0].partDev.toFixed(1)}%) y <b>${topCatDev[1].cat}</b> (${topCatDev[1].partDev.toFixed(1)}%).`
        : (topCatDev[0] ? `La categoría líder es <b>${topCatDev[0].cat}</b>.` : ''))
    );
  } else {
    // No hay devoluciones críticas — explicar por qué
    if(c.totalDev > 0){
      let razon = '';
      if(topCatDev[0]){
        razon = `Las categorías con más devoluciones del mes son <b>${topCatDev[0].cat}</b>${topCatDev[1]?` y <b>${topCatDev[1].cat}</b>`:''}, pero ningún SKU individual cumple ambos criterios de alerta a la vez (tasa &gt; ${umbral}% <b>y</b> ≥ ${corte} unidades).`;
      } else {
        razon = `Ningún SKU individual cumple ambos criterios de alerta.`;
      }
      paras.push(
        `<b>Devoluciones:</b> <span class="calm">sin SKU críticos</span> este mes. Se reportaron ${fmt(c.totalDev)} unidades en ${c.skuConDev} SKU. ${razon}`
      );
    } else {
      paras.push(`<b>Devoluciones:</b> <span class="calm">sin movimientos</span> de devolución de cliente en el mes.`);
    }
  }

  // Párrafo 3 — Roturas internas (con la lógica que pediste)
  if(critRot.length > 0){
    const unidsCritRot = critRot.reduce((a,s)=>a+s.rot,0);
    paras.push(
      `<b>Roturas internas críticas:</b> <span class="crit">${critRot.length} SKU</span> cumplen los criterios (tasa &gt; ${umbral}% y ≥ ${corte} unidades), concentrando ${fmt(unidsCritRot)} unidades. ` +
      (topCatRot.length >= 2
        ? `Las categorías más afectadas son <b>${topCatRot[0].cat}</b> (${topCatRot[0].partRot.toFixed(1)}%) y <b>${topCatRot[1].cat}</b> (${topCatRot[1].partRot.toFixed(1)}%).`
        : (topCatRot[0] ? `La categoría líder es <b>${topCatRot[0].cat}</b>.` : ''))
    );
  } else {
    if(c.totalRot > 0){
      // Explicar por qué no son críticas
      const partes = [];
      if(topCatRot[0]){
        partes.push(`Las categorías más afectadas fueron <b>${topCatRot[0].cat}</b>${topCatRot[1]?` y <b>${topCatRot[1].cat}</b>`:''}`);
      }
      // Identificar la razón principal: ¿es por unidades, por tasa, o ambas?
      const algunoSupera50 = skusConRot.some(s => s.rot >= corte);
      const algunoSuperaTasa = skusConRot.some(s => s.tasa > umbral);
      let detalle;
      if(!algunoSupera50 && !algunoSuperaTasa){
        detalle = `ningún SKU superó las ${corte} unidades de rotura y la tasa más alta entre SKU con rotura fue ${pct(maxRotTasa,2)} (por debajo del ${umbral}%).`;
      } else if(!algunoSupera50){
        detalle = `ningún SKU individual superó las ${corte} unidades de rotura.`;
      } else if(!algunoSuperaTasa){
        detalle = `los SKU con más roturas (ej. ${skuMaxRot.codigo} con ${fmt(skuMaxRot.rot)} u.) tienen tasa de devolución por debajo del ${umbral}%, por lo que no quedan marcados como críticos.`;
      } else {
        detalle = `ningún SKU cumple ambos criterios simultáneamente (tasa &gt; ${umbral}% <b>y</b> ≥ ${corte} unidades).`;
      }
      paras.push(
        `<b>Roturas internas:</b> <span class="warn">sin SKU críticos</span> este mes. Se reportaron ${fmt(c.totalRot)} unidades en ${c.skuConRot} SKU. ` +
        (partes.length ? `${partes.join(", ")}, pero ${detalle}` : detalle)
      );
    } else {
      paras.push(`<b>Roturas internas:</b> <span class="calm">sin movimientos</span> de rotura interna en el mes.`);
    }
  }

  // Determinar tono de la marca lateral
  const totalCriticos = critDev.length + critRot.length;
  const icon = totalCriticos > 0 ? "!" : "✓";
  const eyebrow = totalCriticos > 0 ? "Lectura crítica" : "Lectura del mes";

  $("reading").innerHTML = `
    <div class="r-mark">
      <div class="r-eyebrow">${eyebrow}</div>
      <div class="r-icon">${icon}</div>
    </div>
    <div class="r-body">
      <h3>Síntesis de <em>${mesCap} ${STATE.anio||""}</em></h3>
      ${paras.map(p => `<p>${p}</p>`).join("")}
    </div>
  `;
}

function renderRankingTable(c){
  const corteEl = document.getElementById("corteMotivos");
  const corte = corteEl ? (Number(corteEl.value)>0 ? Number(corteEl.value) : 50) : 50;
  const umbral = c.umbral;

  // Cargar motivos
  let motivosMap = {};
  motivosMap = getMotivos();

  // Críticos de DEVOLUCIÓN
  const critDev = c.skus
    .filter(s => s.tasa > umbral && s.dev >= corte)
    .sort((a,b) => b.dev - a.dev);
  // Críticos de ROTURA
  const critRot = c.skus
    .filter(s => s.tasa > umbral && s.rot >= corte)
    .sort((a,b) => b.rot - a.rot);

  const fmtMotivoCell = (mObj) => {
    if(!mObj || !mObj.motivo) return '<span style="color:#A8B0BC;font-style:italic">— por completar</span>';
    return mObj.nota
      ? `<b>${mObj.motivo}</b><div style="font-size:11px;color:var(--muted);margin-top:2px;font-weight:400">${mObj.nota.replace(/</g,'&lt;')}</div>`
      : `<b>${mObj.motivo}</b>`;
  };

  const renderTable = (tableId, metaId, items, tipo, accentColor) => {
    const meta = items.length > 0
      ? `${items.length} SKU · tasa > ${umbral}% y ${tipo==="dev"?"devoluciones":"roturas"} ≥ ${corte} u.`
      : `Sin SKU críticos por ${tipo==="dev"?"devolución":"rotura interna"} en este mes`;
    $(metaId).textContent = meta;

    if(items.length === 0){
      $(tableId).innerHTML = `<thead><tr><th></th></tr></thead><tbody><tr><td style="padding:30px;text-align:center;color:var(--muted);font-style:italic;font-family:'Fraunces',serif">Ningún SKU supera los criterios en ${cap(STATE.mes||'')} ${STATE.anio||''}.</td></tr></tbody>`;
      return;
    }

    const unidLabel = tipo === "dev" ? "Devoluciones" : "Roturas";
    const head = `<thead><tr>
      <th>#</th><th>SKU</th><th>Producto</th><th>Categoría</th><th>Marca</th>
      <th style="text-align:right">${unidLabel}</th>
      <th style="text-align:right">Prom 3M</th>
      <th style="text-align:right">Tasa</th>
      <th>Motivo</th>
    </tr></thead>`;

    const rows = items.map((s,i) => {
      const mObj = motivosMap[s.codigo] && motivosMap[s.codigo][tipo];
      const motivoHtml = fmtMotivoCell(mObj);
      const motivoBg = (mObj && mObj.motivo) ? 'background:#F0FAF4;' : '';
      const unidValue = tipo === "dev" ? s.dev : s.rot;
      return `
      <tr>
        <td><span class="rank-rank">${i+1}</span></td>
        <td class="sku-code">${s.codigo}</td>
        <td class="prod" title="${(s.producto||'').replace(/"/g,'&quot;')}">${s.producto || '—'}</td>
        <td><span class="pill">${s.categoria}</span></td>
        <td>${s.marca || '—'}</td>
        <td class="num" style="color:${accentColor};font-weight:700">${fmt(unidValue)}</td>
        <td class="num">${fmt(s.promedio)}</td>
        <td class="num alert">${pct(s.tasa,2)}</td>
        <td style="font-size:12px;line-height:1.4;padding:8px 10px;${motivoBg}">${motivoHtml}</td>
      </tr>`;
    }).join("");
    $(tableId).innerHTML = head + `<tbody>${rows}</tbody>`;
  };

  renderTable("rankTableDev", "rankingDevMeta", critDev, "dev", "#C2410C");

// v3 schema con clave versionada por release del HTML.
// El "buffer" en memoria es la fuente de verdad mientras editás motivos.
// Sólo se guarda a localStorage cuando apretás "Guardar motivos".
// STATE.motivosBuffer = { ...mismaEstructuraQueLocalStorage }
// STATE.motivosDirty = true si hay cambios sin guardar.
function motivosKey(){ return `motivos_${APP_VERSION}:${STATE.mes}_${STATE.anio}`; }
function loadMotivosFromStorage(){
  try{ return JSON.parse(localStorage.getItem(motivosKey())||"{}"); }
  catch(e){ return {}; }
}
function saveMotivosToStorage(m){
  try{ localStorage.setItem(motivosKey(), JSON.stringify(m)); }catch(e){}
}
function getMotivos(){
  // Devuelve el buffer activo. Si no hay buffer todavía, está vacío.
  return STATE.motivosBuffer || {};
}
function setMotivoInBuffer(sku, tipo, field, value){
  if(!STATE.motivosBuffer) STATE.motivosBuffer = {};
  const m = STATE.motivosBuffer;
  if(!m[sku]) m[sku] = {dev:{motivo:"",nota:""}, rot:{motivo:"",nota:""}};
  if(!m[sku][tipo]) m[sku][tipo] = {motivo:"",nota:""};
  m[sku][tipo][field] = value;
  const empty = (!m[sku].dev?.motivo && !m[sku].dev?.nota && !m[sku].rot?.motivo && !m[sku].rot?.nota);
  if(empty) delete m[sku];
  STATE.motivosDirty = true;
  refreshSaveButton();
}
function refreshSaveButton(){
  const btn = document.getElementById("btnSaveMotivos");
  if(!btn) return;
  if(STATE.motivosDirty){
    btn.disabled = false;
    btn.textContent = "Guardar motivos •";
    btn.classList.add("dirty");
  } else {
    btn.disabled = false;
    btn.textContent = "Motivos guardados ✓";
    btn.classList.remove("dirty");
  }
}
function getMotivosCorte(){
  const v = Number($("corteMotivos").value);
  return (v > 0) ? v : 50;
}
// Devuelve un array de "ítems" — un ítem por SKU+tipo (dev/rot) que supere el corte
function itemsParaMotivo(){
  if(!STATE.computed) return [];
  const corte = getMotivosCorte();
  const umbral = STATE.computed.umbral;
  const items = [];
  STATE.computed.skus.forEach(s => {
    // Solo SKU críticos: tasa > umbral
    if(s.tasa <= umbral) return;
    if(s.dev >= corte) items.push({sku:s, tipo:"dev", unidades:s.dev});
    if(s.rot >= corte) items.push({sku:s, tipo:"rot", unidades:s.rot});
  });
  return items.sort((a,b) => b.unidades - a.unidades);
}

function renderMotivos(){
  if(!STATE.computed){ $("motivos").classList.remove("active"); return; }
  const items = itemsParaMotivo();
  const corte = getMotivosCorte();
  const saved = getMotivos();

  $("motivos").classList.add("active");
  const skusUnicos = new Set(items.map(it => it.sku.codigo)).size;
  $("motivosMeta").textContent = `Corte ≥ ${corte} unidades · ${items.length} ítems en ${skusUnicos} SKU para revisar`;

  // Stats
  const completed = items.filter(it => saved[it.sku.codigo]?.[it.tipo]?.motivo).length;
  const pending = items.length - completed;
  const totalUnits = items.reduce((a,it) => a + it.unidades, 0);
  const devCount = items.filter(it => it.tipo==="dev").length;
  const rotCount = items.filter(it => it.tipo==="rot").length;
  $("motivosStats").innerHTML = `
    <div class="mstat">
      <div class="ml">Ítems para revisar</div>
      <div class="mv">${items.length}</div>
      <div class="ms">${devCount} devoluciones · ${rotCount} roturas internas</div>
    </div>
    <div class="mstat ${completed===items.length && items.length>0?'done':'pending'}">
      <div class="ml">Motivos cargados</div>
      <div class="mv">${completed} <span class="frac">/ ${items.length}</span></div>
      <div class="ms">${completed===items.length && items.length>0?'Todos completados ✓':(pending+' pendientes')}</div>
    </div>
    <div class="mstat">
      <div class="ml">Unidades involucradas</div>
      <div class="mv">${fmt(totalUnits)}</div>
      <div class="ms">Suma de devoluciones + roturas de los ítems listados</div>
    </div>
  `;

  if(items.length === 0){
    $("motivosList").innerHTML = `<div class="motivos-empty">Ningún SKU cumple los criterios críticos (tasa > ${STATE.computed.umbral}% con devoluciones o roturas ≥ ${corte} unidades) en ${cap(STATE.mes)} ${STATE.anio}. Ajustá el corte si querés revisar más SKU.</div>`;
    return;
  }

  const cards = items.map(it => {
    const s = it.sku;
    const data = (saved[s.codigo] && saved[s.codigo][it.tipo]) || {motivo:"", nota:""};
    const done = !!data.motivo;
    const opts = MOTIVOS_PRESET.map(o =>
      `<option value="${o.value}" ${o.value===data.motivo?'selected':''}>${o.label}</option>`
    ).join("");
    const cat = (s.categoria||'').replace(/"/g,'&quot;');
    const marca = (s.marca||'').replace(/"/g,'&quot;');
    const prod = (s.producto||'').replace(/"/g,'&quot;');
    const isDev = it.tipo === "dev";
    const tipoLbl = isDev ? "Devoluciones" : "Roturas internas";
    const tipoBadge = isDev
      ? `<span class="tipo-badge tipo-dev">Devolución de cliente</span>`
      : `<span class="tipo-badge tipo-rot">Rotura interna</span>`;
    return `
      <div class="motivo-card ${done?'done':''} ${isDev?'tipo-dev-border':'tipo-rot-border'}" data-sku="${s.codigo}" data-tipo="${it.tipo}">
        <div class="mc-id">
          <span class="mc-sku">${s.codigo}</span>
          <span class="mc-units" style="color:${isDev?'var(--amber)':'var(--red)'}">${fmt(it.unidades)}</span>
          <span class="mc-units-lbl">${tipoLbl}</span>
        </div>
        <div class="mc-info">
          <div class="mc-prod">${prod || '—'}</div>
          <div class="mc-tags">
            ${tipoBadge}
            <span class="pill">${cat || 'Sin categoría'}</span>
            ${marca ? `<span class="pill">${marca}</span>` : ''}
          </div>
          <div class="mc-stats">${isDev?`Prom 3M ${fmt(s.promedio)} u · Tasa ${pct(s.tasa,2)}${s.rot>0?` · Rotura ${fmt(s.rot)} u`:''}`:`Devoluciones del mismo SKU: ${fmt(s.dev)} u · Categoría ${cat}`}</div>
        </div>
        <div class="mc-form">
          <span class="mc-label">Motivo principal</span>
          <select class="motivo-select" data-sku="${s.codigo}" data-tipo="${it.tipo}">${opts}</select>
          <span class="mc-label" style="margin-top:6px">Comentario / detalle adicional</span>
          <textarea class="motivo-nota" data-sku="${s.codigo}" data-tipo="${it.tipo}" rows="2" placeholder="Detalle de la conversación con Logística (opcional)">${(data.nota||'').replace(/</g,'&lt;')}</textarea>
        </div>
      </div>
    `;
  }).join("");
  $("motivosList").innerHTML = cards;

  // Bind events
  $("motivosList").querySelectorAll(".motivo-select").forEach(sel => {
    sel.addEventListener("change", e => {
      setMotivoInBuffer(e.target.dataset.sku, e.target.dataset.tipo, "motivo", e.target.value);
      const card = e.target.closest(".motivo-card");
      card.classList.toggle("done", !!e.target.value);
      updateMotivosStats();
    });
  });
  $("motivosList").querySelectorAll(".motivo-nota").forEach(ta => {
    ta.addEventListener("input", e => {
      setMotivoInBuffer(e.target.dataset.sku, e.target.dataset.tipo, "nota", e.target.value);
    });
  });
  updateMotivosStats();
  refreshSaveButton();
}

function updateMotivosStats(){
  const items = itemsParaMotivo();
  const saved = getMotivos();
  const completed = items.filter(it => saved[it.sku.codigo]?.[it.tipo]?.motivo).length;
  const pending = items.length - completed;
  const statsEl = $("motivosStats");
  const cards = statsEl.querySelectorAll(".mstat");
  if(cards.length >= 2){
    const c = cards[1];
    c.classList.toggle("done", completed===items.length && items.length>0);
    c.classList.toggle("pending", !(completed===items.length && items.length>0));
    c.querySelector(".mv").innerHTML = `${completed} <span class="frac">/ ${items.length}</span>`;
    c.querySelector(".ms").textContent = completed===items.length && items.length>0 ? 'Todos completados ✓' : (pending+' pendientes');
  }
  if(items.length === 0 || (completed === items.length && items.length > 0)){
    setStep(5);
  } else {
    setStep(4);
  }
}

/* ============================================================
   PRESENTATION MODE
   ============================================================ */
// Devuelve datasets para los slides "críticos":
//  - itemsDev / itemsRot: SKU en alerta (tasa > umbral) y con dev/rot ≥ corte
//  - catsDev / catsRot: agrupaciones por categoría
//  - motivosDev / motivosRot: agrupaciones por motivo cargado
function criticosData(c, mes, anio){
  const corteEl = $("corteMotivos");
  const corte = corteEl ? (Number(corteEl.value)>0 ? Number(corteEl.value) : 50) : 50;
  let motivosMap = {};
  motivosMap = (mes===STATE.mes && anio===STATE.anio) ? getMotivos() : (function(){ try{ return JSON.parse(localStorage.getItem(`motivos_${APP_VERSION}:${mes}_${anio}`)||"{}"); }catch(e){return {};} })();

  // SKU críticos por tipo: tasa > umbral Y unidades >= corte (mismo criterio para dev y rot)
  const itemsDev = c.skus.filter(s => s.tasa > c.umbral && s.dev >= corte)
                         .sort((a,b) => b.dev - a.dev);
  const itemsRot = c.skus.filter(s => s.tasa > c.umbral && s.rot >= corte)
                         .sort((a,b) => b.rot - a.rot);

  // Agrupaciones por categoría
  const aggCat = (items, key) => {
    const m = new Map();
    items.forEach(s => { const v = m.get(s.categoria) || 0; m.set(s.categoria, v + s[key]); });
    return [...m.entries()].map(([cat,unid]) => ({cat, unid})).sort((a,b) => b.unid - a.unid);
  };
  const catsDev = aggCat(itemsDev, "dev");
  const catsRot = aggCat(itemsRot, "rot");

  // Agrupaciones por motivo cargado
  const aggMotivo = (items, tipo) => {
    const m = new Map();
    items.forEach(s => {
      const motivo = motivosMap[s.codigo]?.[tipo]?.motivo;
      if(!motivo) return;
      m.set(motivo, (m.get(motivo)||0) + (tipo==="dev"?s.dev:s.rot));
    });
    return [...m.entries()].map(([motivo,unid]) => ({motivo, unid})).sort((a,b) => b.unid - a.unid);
  };
  const motivosDev = aggMotivo(itemsDev, "dev");
  const motivosRot = aggMotivo(itemsRot, "rot");

  return {corte, itemsDev, itemsRot, catsDev, catsRot, motivosDev, motivosRot, motivosMap};
}

        <div class="lbl">Tasa sobre venta</div>
