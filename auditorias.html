    {menoresVencidas.length>0&&<div style={{...sC,background:"#EFF6FF",borderColor:"#2563EB20"}}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px",color:"#2563EB"}}>🟡 NC Menores — Vencidas más de 30 días</h3>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,background:"#fff",borderRadius:8}}>
        <thead><tr><th style={sTh}>Código</th><th style={sTh}>Auditoría</th><th style={sTh}>Descripción</th><th style={sTh}>Estado</th></tr></thead>
        <tbody>{menoresVencidas.map(f=>{const aud=audits.find(a=>a.id===f.auditId);return <tr key={f.id}><td style={{...sTd,fontFamily:"monospace",fontWeight:700,color:"#2563EB",whiteSpace:"nowrap"}}>{f.code}</td><td style={{...sTd,fontSize:11,whiteSpace:"nowrap"}}>{aud?.name||"—"}</td><td style={{...sTd,lineHeight:1.4}}>{f.description}</td><td style={sTd}><SBg s={f.status}/></td></tr>;})}</tbody>
      </table>
    </div>}

    <div style={sC}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>Auditorías por fase</h3>
      <div style={{display:"flex",gap:10,height:110,alignItems:"flex-end"}}>{PHASES.map(p=>{const n=audits.filter(a=>a.phase===p.id).length;const mx=Math.max(...PHASES.map(x=>audits.filter(a=>a.phase===x.id).length),1);return <div key={p.id} style={{flex:1,textAlign:"center"}}><div style={{fontSize:16,fontWeight:800,color:p.color}}>{n}</div><div style={{height:Math.max((n/mx)*80,3),background:p.color+"25",border:`2px solid ${p.color}`,borderRadius:5}}/><div style={{fontSize:10,color:K.txS,marginTop:5,fontWeight:600}}>{p.label}</div></div>;})}</div>
    </div>
  </div>);
}

/* ── CONFIG (simplified) ── */
function ConfigMod({cfg,setCfg,setLogs,currentUser}){
  const logC=d=>alog(setLogs,"CONFIG","Configuración",d,currentUser.name);
  function LE({title,icon,items,onUpdate}){const[v,sV]=useState("");const add=()=>{if(v.trim()&&!items.includes(v.trim())){onUpdate([...items,v.trim()]);logC(`+ "${v.trim()}" en ${title}`);sV("");}};const rm=i=>{logC(`- "${items[i]}" de ${title}`);onUpdate(items.filter((_,j)=>j!==i));};
    return(<div className="cfg-section"><h3><span>{icon}</span>{title}</h3>{items.map((it,i)=><div key={i} className="cfg-item"><span style={{flex:1,fontSize:13}}>{it}</span><button style={{...sB("sm"),color:K.red}} onClick={()=>rm(i)}>✕</button></div>)}<div style={{display:"flex",gap:8,marginTop:8}}><input style={{...sI,flex:1}} value={v} onChange={e=>sV(e.target.value)} placeholder="Agregar..." onKeyDown={e=>e.key==="Enter"&&add()}/><button style={sB("pri")} onClick={add}>+</button></div></div>);}
  function ClassEd(){const[sh,sSh]=useState(false);const bl={id:"",label:"",risk:"",deadline:6,color:"#2563EB",desc:""};const[fm,sFm]=useState(bl);
    const save=()=>{if(!fm.label)return;const id=fm.label.toUpperCase().replace(/\s+/g,"_").slice(0,12);setCfg(p=>({...p,classifications:[...p.classifications,{...fm,id}]}));logC(`+ clasificación "${fm.label}"`);sSh(false);sFm(bl);};
    const rm=i=>{logC(`- clasificación "${cfg.classifications[i].label}"`);setCfg(p=>({...p,classifications:p.classifications.filter((_,j)=>j!==i)}));};
    return(<div className="cfg-section"><h3><span>⚠️</span>Clasificaciones<button style={{...sB("pri"),marginLeft:"auto",fontSize:11}} onClick={()=>sSh(true)}>+</button></h3>{cfg.classifications.map((c,i)=><div key={i} className="cfg-item"><div style={{width:10,height:10,borderRadius:"50%",background:c.color}}/><span style={{flex:1,fontSize:13,fontWeight:600}}>{c.label}</span><span style={{fontSize:11,color:K.txS}}>{c.risk} · {c.deadline>0?c.deadline+"m":"—"}</span><button style={{...sB("sm"),color:K.red}} onClick={()=>rm(i)}>✕</button></div>)}
      {sh&&<Md title="Nueva clasificación" onClose={()=>sSh(false)}><G2><Fd l="Etiqueta"><input style={sI} value={fm.label} onChange={e=>sFm(p=>({...p,label:e.target.value}))}/></Fd><Fd l="Riesgo"><input style={sI} value={fm.risk} onChange={e=>sFm(p=>({...p,risk:e.target.value}))}/></Fd><Fd l="Plazo meses (0=sin)"><input type="number" min="0" style={sI} value={fm.deadline} onChange={e=>sFm(p=>({...p,deadline:parseInt(e.target.value)||0}))}/></Fd><Fd l="Color"><input type="color" value={fm.color} onChange={e=>sFm(p=>({...p,color:e.target.value}))}/></Fd></G2><Fd l="Descripción"><textarea style={{...sI,minHeight:40}} value={fm.desc} onChange={e=>sFm(p=>({...p,desc:e.target.value}))}/></Fd><div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><button style={sB("g")} onClick={()=>sSh(false)}>Cancelar</button><button style={sB("pri")} onClick={save} disabled={!fm.label}>Guardar</button></div></Md>}</div>);}
  return(<div><h1 style={{fontSize:20,fontWeight:800,marginBottom:14}}>Configuración del Sistema</h1>
    <CtxHelp type="warn"><strong>Solo administradores.</strong> Cambios aplican inmediatamente y se registran en Audit Trail.</CtxHelp>
    <ClassEd/>
    <LE title="Sectores" icon="🏭" items={cfg.sectors} onUpdate={v=>setCfg(p=>({...p,sectors:v}))}/>
    <LE title="Tipos de Auditoría" icon="📋" items={cfg.auditTypes} onUpdate={v=>setCfg(p=>({...p,auditTypes:v}))}/>
    <LE title="Normas" icon="📖" items={cfg.standards||[]} onUpdate={v=>setCfg(p=>({...p,standards:v}))}/>
    <LE title="Tipos CAPA" icon="🔧" items={cfg.capaTypes} onUpdate={v=>setCfg(p=>({...p,capaTypes:v}))}/>
    <LE title="Estados" icon="🔄" items={cfg.statuses} onUpdate={v=>setCfg(p=>({...p,statuses:v}))}/>
    {/* Teams editor */}
    {(()=>{
      const addTeam=()=>{setCfg(p=>({...p,teams:[...(p.teams||[]),{name:`E${(p.teams||[]).length+1}`,leader:"",members:"",comments:""}]}));logC("+ equipo auditor");};
      const rmTeam=(i)=>{const t=(cfg.teams||[])[i];setCfg(p=>({...p,teams:(p.teams||[]).filter((_,j)=>j!==i)}));logC(`- equipo "${t?.name}"`);};
      const updTeam=(i,field,val)=>{setCfg(p=>{const ts=[...(p.teams||[])];ts[i]={...ts[i],[field]:val};return{...p,teams:ts};});};
      return(<div className="cfg-section"><h3><span>👥</span>Equipos Auditores<button style={{...sB("pri"),marginLeft:"auto",fontSize:11}} onClick={addTeam}>+ Agregar</button></h3><p className="cfg-desc">Equipos disponibles para asignar a auditorías. Se muestran en el Programa Anual y en el selector de equipo al planificar.</p>
        {(cfg.teams||[]).map((t,i)=><div key={i} style={{border:`1px solid ${K.brdL}`,borderRadius:8,padding:12,marginBottom:8,background:"#fff"}}>
          <div style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 120px auto",gap:8,alignItems:"center"}}>
            <div><div style={{fontSize:10,fontWeight:700,color:K.txS,marginBottom:2}}>CÓDIGO</div><input style={{...sI,fontWeight:700,textAlign:"center"}} value={t.name} onChange={e=>updTeam(i,"name",e.target.value)}/></div>
            <div><div style={{fontSize:10,fontWeight:700,color:K.txS,marginBottom:2}}>LÍDER</div><input style={sI} value={t.leader} onChange={e=>updTeam(i,"leader",e.target.value)} placeholder="Nombre del líder"/></div>
            <div><div style={{fontSize:10,fontWeight:700,color:K.txS,marginBottom:2}}>INTEGRANTES</div><input style={sI} value={t.members} onChange={e=>updTeam(i,"members",e.target.value)} placeholder="Nombres separados por coma"/></div>
            <div><div style={{fontSize:10,fontWeight:700,color:K.txS,marginBottom:2}}>NOTA</div><input style={sI} value={t.comments||""} onChange={e=>updTeam(i,"comments",e.target.value)} placeholder="Opcional"/></div>
            <button style={{...sB("sm"),color:K.red,borderColor:K.red+"30",marginTop:14}} onClick={()=>rmTeam(i)}>✕</button>
          </div>
        </div>)}
      </div>);
    })()}
    <div className="cfg-section" style={{borderColor:K.red+"30",background:K.redL}}><h3 style={{color:K.red}}>🔄 Restaurar</h3><button style={sB("red")} onClick={()=>{if(confirm("¿Restaurar?")){setCfg(DEF_CONFIG);logC("Restaurado");}}}>Restaurar todo</button></div>
  </div>);
}

/* ── USERS ── */
function UserMgmt({users,setUsers,currentUser,setLogs}){const[sh,sSh]=useState(false);const[ed,sEd]=useState(null);const bl={username:"",password:"",role:"user",name:"",active:true};const[fm,sFm]=useState(bl);
  const save=()=>{if(!fm.username||!fm.password||!fm.name)return;if(ed){setUsers(p=>p.map(u=>u.id===ed.id?{...u,...fm}:u));alog(setLogs,"EDITAR USUARIO","Usuarios",fm.username,currentUser.name);}else{if(users.some(x=>x.username.toLowerCase()===fm.username.toLowerCase()))return alert("Ya existe");setUsers(p=>[...p,{...fm,id:gid()}]);alog(setLogs,"CREAR USUARIO","Usuarios",fm.username,currentUser.name);}sSh(false);sEd(null);sFm(bl);};
  return(<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h1 style={{fontSize:20,fontWeight:800}}>Usuarios</h1><button style={sB("pri")} onClick={()=>{sEd(null);sFm(bl);sSh(true);}}>+ Nuevo</button></div>
    <div style={sC}>{users.map(u=>{const r=ROLES[u.role];return <div key={u.id} className="usr-row"><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:32,height:32,borderRadius:"50%",background:r?.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>{r?.icon}</div><div><div style={{fontWeight:600,fontSize:13}}>{u.name}</div><div style={{fontSize:11,color:K.txS}}>@{u.username}</div></div></div><div style={{display:"flex",alignItems:"center",gap:8}}><Bg color={r?.color} bg={r?.bg}>{r?.label}</Bg><span style={{fontSize:11,color:u.active?K.grn:K.red}}>{u.active?"Activo":"Inactivo"}</span><button style={sB("sm")} onClick={()=>{sEd(u);sFm({...u});sSh(true);}}>Editar</button>{u.id!==currentUser.id&&<button style={{...sB("sm"),color:u.active?K.red:K.grn}} onClick={()=>setUsers(p=>p.map(x=>x.id===u.id?{...x,active:!x.active}:x))}>{u.active?"Des":"Act"}</button>}</div></div>;})}</div>
    {sh&&<Md title={ed?"Editar":"Nuevo usuario"} onClose={()=>sSh(false)}><G2><Fd l="Nombre"><input style={sI} value={fm.name} onChange={e=>sFm(p=>({...p,name:e.target.value}))}/></Fd><Fd l="Usuario"><input style={sI} value={fm.username} onChange={e=>sFm(p=>({...p,username:e.target.value}))} disabled={!!ed}/></Fd><Fd l="Contraseña"><input style={sI} value={fm.password} onChange={e=>sFm(p=>({...p,password:e.target.value}))}/></Fd><Fd l="Rol"><select style={sS} value={fm.role} onChange={e=>sFm(p=>({...p,role:e.target.value}))}>{Object.entries(ROLES).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></Fd></G2><div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><button style={sB("g")} onClick={()=>sSh(false)}>Cancelar</button><button style={sB("pri")} onClick={save} disabled={!fm.name||!fm.username}>Guardar</button></div></Md>}</div>);
}

/* ── AUTOINSPECCIONES ── */
const AI_QUARTERS=[{q:"Q1",month:"Feb",label:"Febrero"},{q:"Q2",month:"May",label:"Mayo"},{q:"Q3",month:"Ago",label:"Agosto"},{q:"Q4",month:"Nov",label:"Noviembre"}];
const AI_CRITERIA=[{id:"OL",label:"Orden y Limpieza",icon:"🧹",desc:"Estado general de orden, limpieza de superficies, pisos, equipos"},{id:"T",label:"Temperatura / Condiciones ambientales",icon:"🌡",desc:"Temperatura, humedad, ventilación de áreas"},{id:"M",label:"Mantenimiento",icon:"🔧",desc:"Estado de equipos, instalaciones, infraestructura"},{id:"D",label:"Documentación",icon:"📄",desc:"Registros al día, procedimientos disponibles, identificación"}];
const AI_RATINGS=[{v:"C",label:"Conforme",color:"#16A34A",bg:"#F0FDF4"},{v:"NC",label:"No Conforme",color:"#DC2626",bg:"#FEF2F2"},{v:"NA",label:"N/A",color:"#6B7280",bg:"#F3F4F6"},{v:"OBS",label:"Observación",color:"#D97706",bg:"#FFFBEB"}];

function Autoinspecciones({data,cfg,canEdit}){
  const yr=data.year||2026;
  const[inspections,setInspections]=useLS("v_ai1",[]);
  const[aiFindings,setAiFindings]=useLS("v_aif1",[]);
  const[ed,sEd]=useState(null);
  const[showFind,sShowFind]=useState(false);
  const[findEd,sFindEd]=useState(null);

  const yrInsp=inspections.filter(i=>i.year===yr);
  const yrFinds=aiFindings.filter(f=>f.year===yr);

  const getInsp=(q,sector)=>yrInsp.find(i=>i.quarter===q&&i.sector===sector);

  const openInsp=(q,sector)=>{
    const existing=getInsp(q,sector);
    if(existing){sEd(existing);}
    else if(canEdit){
      const newI={id:gid(),year:yr,quarter:q,sector,date:"",inspector:"",ratings:{},notes:"",status:"Pendiente",createdAt:new Date().toISOString()};
      sEd(newI);
    }
  };

  const saveInsp=(insp)=>{
    const exists=inspections.find(i=>i.id===insp.id);
    if(exists)setInspections(p=>p.map(i=>i.id===insp.id?insp:i));
    else setInspections(p=>[...p,insp]);
    alog(data.setLogs,exists?"EDITAR":"CREAR","Autoinspección",`${insp.quarter} — ${insp.sector} (${yr})`,data.currentUser?.name||"Sistema");
    sEd(null);
  };

  const delInsp=(id)=>{
    if(!confirm("¿Eliminar esta autoinspección?"))return;
    const i=inspections.find(x=>x.id===id);
    setInspections(p=>p.filter(x=>x.id!==id));
    alog(data.setLogs,"ELIMINAR","Autoinspección",`${i?.quarter} — ${i?.sector}`,data.currentUser?.name||"Sistema");
    sEd(null);
  };

  const sectors=cfg.sectors.filter(s=>!s.includes("Proveedor"));

  const findBl={sector:"",quarter:"",description:"",criteria:"",severity:"Observación",action:"",responsible:"",status:"Abierto"};
  const[findFm,sFindFm]=useState(findBl);

  const saveFinding=()=>{
    if(findEd){setAiFindings(p=>p.map(f=>f.id===findEd.id?{...findFm,id:findEd.id}:f));
    }else{setAiFindings(p=>[...p,{...findFm,id:gid(),year:yr,code:`AI-${String(yrFinds.length+1).padStart(3,"0")}`,createdAt:new Date().toISOString()}]);}
    alog(data.setLogs,findEd?"EDITAR":"CREAR","Hallazgo Autoinspección",`${findFm.sector} ${findFm.quarter}`,data.currentUser?.name||"Sistema");
    sShowFind(false);sFindEd(null);sFindFm(findBl);
  };

  const statusColor=(s)=>s==="Realizada"?{c:K.grn,bg:K.grnL}:s==="Pendiente"?{c:"#D97706",bg:"#FFFBEB"}:{c:K.txS,bg:"#F1F5F9"};

  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
      <div><h1 style={{fontSize:20,fontWeight:800}}>Autoinspecciones — {yr}</h1><p style={{color:K.txS,margin:"4px 0 0",fontSize:12.5}}>REG-SOP-AC-035-F — Bitácora de autoinspecciones puntuales (trimestral)</p></div>
      {canEdit&&<div/>}
    </div>

    {(()=>{const allDevs=[];yrInsp.forEach(insp=>{const devMap=insp.deviations||{};Object.keys(devMap).forEach(crId=>{const crLabel=AI_CRITERIA.find(c=>c.id===crId)?.label||crId;devMap[crId].forEach((d,idx)=>{allDevs.push({...d,sector:insp.sector,quarter:insp.quarter,date:insp.date,criteria:crLabel,rating:insp.ratings?.[crId]||"",inspId:insp.id});});});});
    return allDevs.length>0?<div style={{...sC,marginTop:14}}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>📋 Resumen de desvíos del año ({allDevs.length})</h3>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
        <thead><tr><th style={sTh}>Trim.</th><th style={sTh}>Sector</th><th style={sTh}>Criterio</th><th style={sTh}>Tipo</th><th style={sTh}>¿Qué se encontró?</th><th style={sTh}>Acción tomada</th><th style={sTh}>Resp.</th><th style={sTh}>¿Resuelto?</th></tr></thead>
        <tbody>{allDevs.map((d,i)=><tr key={i} style={{background:d.rating==="NC"?"#FEF2F2":"#FFFBEB"}}>
          <td style={sTd}>{d.quarter}</td>
          <td style={sTd}>{d.sector}</td>
          <td style={sTd}>{d.criteria}</td>
          <td style={sTd}>{d.rating==="NC"?<Bg color={K.red} bg={K.redL}>NC</Bg>:<Bg color="#D97706" bg="#FFFBEB">OBS</Bg>}</td>
          <td style={{...sTd,lineHeight:1.4}}>{d.finding||"—"}</td>
          <td style={{...sTd,lineHeight:1.4}}>{d.action||"—"}</td>
          <td style={sTd}>{d.responsible||"—"}</td>
          <td style={sTd}>{d.resolved?<Bg color={d.resolved==="Sí"?K.grn:d.resolved==="En proceso"?"#D97706":K.red} bg={d.resolved==="Sí"?K.grnL:d.resolved==="En proceso"?"#FFFBEB":K.redL}>{d.resolved}</Bg>:"—"}</td>
        </tr>)}</tbody>
      </table>
    </div>:null;})()}

    <div style={{display:"flex",gap:8,marginBottom:14}}>
      {AI_QUARTERS.map(q=>{const done=yrInsp.filter(i=>i.quarter===q.q&&i.status==="Realizada").length;const total=yrInsp.filter(i=>i.quarter===q.q).length;return <div key={q.q} style={{flex:1,padding:"12px 16px",background:done===total&&total>0?K.grnL:total>0?"#FFFBEB":"#F8FAFC",border:`1px solid ${done===total&&total>0?K.grn+"30":total>0?"#D9770630":K.brd}`,borderRadius:8,textAlign:"center"}}>
        <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>{q.q} — {q.label}</div>
        <div style={{fontSize:20,fontWeight:800,color:done===total&&total>0?K.grn:total>0?"#D97706":K.txM,marginTop:2}}>{done}/{total||"—"}</div>
      </div>;})}
    </div>

    <div style={{...sC,overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr><th style={{...sTh,minWidth:160,position:"sticky",left:0,background:K.srf,zIndex:2}}>Sector</th>{AI_QUARTERS.map(q=><th key={q.q} style={{...sTh,textAlign:"center",minWidth:100}}>{q.q} — {q.label}</th>)}</tr></thead>
        <tbody>{sectors.map(s=><tr key={s}>
          <td style={{...sTd,fontWeight:600,fontSize:12,position:"sticky",left:0,background:K.srf,zIndex:1}}>{s}</td>
          {AI_QUARTERS.map(q=>{const insp=getInsp(q.q,s);const sc=insp?statusColor(insp.status):{c:K.txM,bg:"#F8FAFC"};return <td key={q.q} style={{...sTd,padding:4,textAlign:"center"}} onClick={()=>openInsp(q.q,s)}>
            <div style={{padding:"6px 4px",background:insp?sc.bg:"#F8FAFC",borderRadius:6,cursor:canEdit||insp?"pointer":"default",border:`1px solid ${insp?sc.c+"30":"transparent"}`}}>
              {insp?<div><div style={{fontSize:11,fontWeight:700,color:sc.c}}>{insp.status==="Realizada"?"✅":"🔶"} {insp.status}</div>{insp.date&&<div style={{fontSize:10,color:K.txS}}>{fd(insp.date)}</div>}</div>:<span style={{fontSize:16,opacity:.3}}>+</span>}
            </div>
          </td>;})}
        </tr>)}</tbody>
      </table>
    </div>

    {/* Modal editar autoinspección */}
    {ed&&<Md title={`Autoinspección ${ed.quarter} — ${ed.sector}`} onClose={()=>sEd(null)}>
      <G2>
        <Fd l="Fecha"><input type="date" style={sI} value={ed.date||""} onChange={e=>sEd(p=>({...p,date:e.target.value}))}/></Fd>
        <Fd l="Inspector"><input style={sI} value={ed.inspector||""} onChange={e=>sEd(p=>({...p,inspector:e.target.value}))} placeholder="Nombre del inspector"/></Fd>
        <Fd l="Estado"><select style={sS} value={ed.status} onChange={e=>sEd(p=>({...p,status:e.target.value}))}><option>Pendiente</option><option>Realizada</option></select></Fd>
      </G2>
      <div style={{marginTop:10}}>
        <div style={{fontSize:12,fontWeight:700,color:K.txS,marginBottom:8}}>EVALUACIÓN POR CRITERIO</div>
        {AI_CRITERIA.map(cr=>{const rv=ed.ratings?.[cr.id];const needsDetail=rv==="NC"||rv==="OBS";const devs=ed.deviations?.[cr.id]||[];
          const addDev=()=>sEd(p=>({...p,deviations:{...p.deviations,[cr.id]:[...(p.deviations?.[cr.id]||[]),{id:gid(),finding:"",action:"",responsible:"",resolved:""}]}}));
          const updDev=(idx,field,val)=>sEd(p=>{const ds=[...(p.deviations?.[cr.id]||[])];ds[idx]={...ds[idx],[field]:val};return{...p,deviations:{...p.deviations,[cr.id]:ds}};});
          const rmDev=(idx)=>sEd(p=>{const ds=[...(p.deviations?.[cr.id]||[])];ds.splice(idx,1);return{...p,deviations:{...p.deviations,[cr.id]:ds}};});
          return <div key={cr.id} style={{border:`1px solid ${needsDetail?(rv==="NC"?K.red+"30":"#D9770630"):K.brdL}`,borderRadius:8,marginBottom:8,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px"}}>
            <span style={{fontSize:16}}>{cr.icon}</span>
            <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:600}}>{cr.label}</div><div style={{fontSize:11,color:K.txS}}>{cr.desc}</div></div>
            <div style={{display:"flex",gap:4}}>{AI_RATINGS.map(r=><button key={r.v} onClick={()=>{sEd(p=>({...p,ratings:{...p.ratings,[cr.id]:r.v}}));if((r.v==="NC"||r.v==="OBS")&&devs.length===0)addDev();}} style={{padding:"4px 10px",fontSize:11,fontWeight:ed.ratings?.[cr.id]===r.v?700:400,background:ed.ratings?.[cr.id]===r.v?r.bg:"transparent",color:ed.ratings?.[cr.id]===r.v?r.color:K.txM,border:`1px solid ${ed.ratings?.[cr.id]===r.v?r.color+"40":K.brd}`,borderRadius:5,cursor:"pointer",fontFamily:"inherit"}}>{r.label}</button>)}</div>
          </div>
          {needsDetail&&<div style={{padding:"8px 12px",background:rv==="NC"?"#FEF2F210":"#FFFBEB10",borderTop:`1px solid ${K.brdL}`}}>
            {devs.map((d,idx)=><div key={d.id||idx} style={{padding:"10px 12px",background:"#fff",border:`1px solid ${rv==="NC"?K.red+"20":"#D9770620"}`,borderRadius:8,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:700,color:rv==="NC"?K.red:"#D97706"}}>{rv==="NC"?"⚠":"📝"} Desvío {idx+1}</div>
                {devs.length>1&&<button style={{background:"none",border:"none",color:K.red,cursor:"pointer",fontSize:12,fontFamily:"inherit"}} onClick={()=>rmDev(idx)}>✕ Quitar</button>}
              </div>
              <Fd l="¿Qué se encontró?"><textarea style={{...sI,minHeight:35,resize:"vertical",fontSize:12}} value={d.finding||""} onChange={e=>updDev(idx,"finding",e.target.value)}/></Fd>
              <Fd l="Acción tomada / corrección"><textarea style={{...sI,minHeight:35,resize:"vertical",fontSize:12}} value={d.action||""} onChange={e=>updDev(idx,"action",e.target.value)}/></Fd>
              <G2>
                <Fd l="Responsable"><input style={sI} value={d.responsible||""} onChange={e=>updDev(idx,"responsible",e.target.value)}/></Fd>
                <Fd l="¿Resuelto?"><select style={sS} value={d.resolved||""} onChange={e=>updDev(idx,"resolved",e.target.value)}><option value="">—</option><option>Sí</option><option>No — Pendiente</option><option>En proceso</option></select></Fd>
              </G2>
            </div>)}
            <button style={{...sB("g"),fontSize:11,width:"100%"}} onClick={addDev}>+ Agregar otro desvío en {cr.label}</button>
          </div>}
        </div>;})}

      </div>
      <Fd l="Notas / Observaciones"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={ed.notes||""} onChange={e=>sEd(p=>({...p,notes:e.target.value}))}/></Fd>
      <div style={{display:"flex",gap:8,justifyContent:"space-between",marginTop:12}}>
        <div>{ed.id&&inspections.find(i=>i.id===ed.id)&&<button style={{...sB("red"),fontSize:11}} onClick={()=>delInsp(ed.id)}>🗑 Eliminar</button>}</div>
        <div style={{display:"flex",gap:8}}><button style={sB("g")} onClick={()=>sEd(null)}>Cancelar</button><button style={sB("pri")} onClick={()=>saveInsp(ed)}>Guardar</button></div>
      </div>
    </Md>}

  </div>);
}

    {id:"a5",code:"AUD-0005",year:2026,name:"Auditoría DIMENA",type:"A proveedor",progSector:"Dimena (Proveedor)",progMonth:"Ago",phase:"informe",date:"2026-08-21",auditor:"Q.F. Claudia Barlocco",team:"Claudia Barlocco, Gloria Nuñez (Líder: Claudia Barlocco)",standard:"ISO 9001:2015, GMC Res. 31/012 — BPF Domisanitarios, GMC Res. 9/11 — BPF Higiene Personal/Cosméticos y Perfumes",scope:"Auditoría inicial de acercamiento y conocimiento al proveedor de materia prima DIMENA, abarcando la evaluación de instalaciones, procesos de producción, control de calidad, gestión de materias primas, trazabilidad, capacitación, higiene, control de plagas, calibración de equipos, almacenamiento y distribución.",location:"5XQ6+V74, 15000 Gral. Líber Seregni, Canelones",checklists:"Guía MERCOSUR BPF",execNotes:"Auditoría realizada durante operación normal de producción.",execDate:"2026-08-21",checklistApplied:"Guía MERCOSUR BPF",methodology:"Se realizó la auditoría en las instalaciones de DIMENA el día 21 de agosto de 2026, durante la operación normal de producción. La metodología incluyó recorrida de instalaciones productivas, de almacenamiento y laboratorio, entrevistas con personal clave (Ing. Quím. Jorge Hirschfeld, Ing. Quím. Federico Lassere - Área comercial, Ing. Quím. Victoria Castro — Responsable de Control de Calidad, Ing. Quím. Alberto Menéndez — Gerente General), revisión de prácticas de manufactura y verificación de controles en proceso.",distribution:"Ing. Quím. Federico Lassere, Ing. Quím. Jorge Hirschfeld",generalImpression:"DIMENA es una empresa del rubro químico con trayectoria en la fabricación y comercialización de productos químicos para diversos sectores industriales. Trabajan en un solo turno y cuentan aproximadamente con 12 personas. La empresa se encuentra en una etapa de desarrollo y formalización de su sistema de gestión, con avances en la implementación de herramientas informáticas. Se destaca la muy buena predisposición del personal. No obstante, se identificaron áreas con oportunidades de mejora, particularmente en calibración de equipos de medición, control de plagas, documentación de procesos, capacitación del personal y gestión de limpieza de equipos (IBC y reactores).",strengths:"Equipo profesional sólido: equipo compuesto íntegramente por ingenieros químicos en las áreas clave (producción, calidad, dirección).\nDesarrollo de herramientas propias: la empresa se encuentra desarrollando aplicaciones informáticas internas para la gestión de sus procesos operativos.\nPredisposición y apertura: el personal demostró excelente disposición para compartir información y recibir comentarios constructivos.",conclusions:"DIMENA es una empresa con un equipo técnico sólido y buena predisposición hacia la mejora, que se encuentra en proceso de formalización de su SGC. La auditoría reveló 8 no conformidades Mayores y 2 Menores, además de 2 observaciones y 2 oportunidades de mejora. Las NC mayores abarcan: calibración de equipos, control de plagas, capacitaciones, identificación de estado de productos, limpieza de IBC, verificación microbiológica, orden de producción y limpieza de reactores.",result:"APROBADO con condiciones",nextAudit:"",expectations:"Se espera que DIMENA presente un plan de acciones correctivas y preventivas (CAPA) para cada no conformidad dentro de los 30 días hábiles siguientes a la recepción de este informe, dirigido al equipo auditor de Vessena S.A. El plan CAPA deberá incluir: acción propuesta, responsable, fecha de implementación y evidencia de cierre.",closeNotes:"",closeDate:"",createdAt:"2026-01-15T00:00:00.000Z"},
    {id:"a6",code:"AUD-0006",year:2026,name:"Auditoría Petropack",type:"A proveedor",progSector:"Petropack (Proveedor)",progMonth:"Set",phase:"planificada",date:"",auditor:"",team:"",standard:"",scope:"",checklists:"",execNotes:"",execDate:"",conclusions:"",strengths:"",closeNotes:"",createdAt:"2026-01-15T00:00:00.000Z"},
    {id:"a7",code:"AUD-0007",year:2026,name:"Auditoría Imprenta Grifelman",type:"A proveedor",progSector:"Imprenta Grifelman (Proveedor)",progMonth:"Jun",phase:"informe",date:"2026-06-18",auditor:"Q.F. Claudia Barlocco",team:"Claudia Barlocco, Gloria Nuñez (Líder: Claudia Barlocco)",standard:"ISO 9001:2015, GMC Res. 31/012 — BPF Domisanitarios, GMC Res. 9/11 — BPF Higiene Personal/Cosméticos",scope:"Auditoría inicial anual al proveedor de material de empaque impreso Impresora Grifelman, abarcando la evaluación documental y de instalaciones del SGC, procesos de impresión offset, control de calidad, gestión de materias primas, trazabilidad, CAPA, personal, capacitación, higiene, mantenimiento, almacenamiento y distribución.",location:"José Serrato 3589, Montevideo",checklists:"CL-AUD-IMP-001 (109 requisitos en 15 áreas)",execDate:"2026-06-18",execNotes:"Auditoría realizada durante operación normal de producción. Contacto en planta: Miguel Baladón.",checklistApplied:"CL-AUD-IMP-001 (109 requisitos en 15 áreas)",methodology:"Se realizó la auditoría en las instalaciones de Impresora Grifelman (José Serrato 3589, Montevideo) el día 18 de junio de 2026, durante la operación normal de producción. La metodología incluyó revisión de documentación del SGC (manual de calidad MC V14, procedimientos, registros, certificados de calibración), recorrida de instalaciones productivas y de almacenamiento, entrevistas con personal clave (Miguel Baladón – Jefe de Calidad, Jimena Ramírez – Dto Calidad, Diego Mesías – Jefe de Producción), observación directa de prácticas de manufactura y verificación de controles en proceso. Se aplicó el Check List CL-AUD-IMP-001 (109 requisitos en 15 áreas). Distribución del informe: Miguel Baladón y Matías Cobelli (Gerente General).",distribution:"Miguel Baladón, Matías Cobelli (Gerente General)",generalImpression:"Impresora Grifelman es una empresa con trayectoria consolidada en el rubro de impresión offset de material de empaque, certificada ISO 9001:2015 desde el año 2013 (MC V14). Se observa un SGC documentado con procedimientos, registros y controles implementados en la mayoría de los procesos evaluados. La empresa demuestra compromiso con la mejora continua, evidenciado por su programa de excelencia operacional y la sistematización de sus procesos productivos. No obstante, se identificaron áreas con brechas de calidad, particularmente en calibración de equipos críticos de medición y control de vencimientos de materias primas. El sistema de trazabilidad es robusto, la gestión de riesgos mediante excelencia operacional constituye una fortaleza destacable, y los controles en proceso de impresión (densidad de color, códigos de barra en línea, muestras de retención) están adecuadamente implementados.",strengths:"Matriz de polivalencia del personal: la empresa cuenta con una matriz de competencias que permite la asignación flexible del personal según necesidades productivas, asegurando cobertura de puestos críticos.\n\nAnálisis de riesgo por máquina (Excelencia Operacional): se evidenció un mapeo de riesgos por cada proceso y máquina, integrado al SGC. Este enfoque proactivo constituye una práctica superior al estándar habitual del sector.\n\nCertificación ISO 9001:2015 sostenida desde 2013, con manual de calidad en versión 14.\n\nSistema de trazabilidad completo y control de códigos de barra en línea.\n\nSistema de liberación de producto terminado con muestreo AQL en inicio, medio y fin del proceso (PG08.14 V16).",conclusions:"Impresora Grifelman demuestra un Sistema de Gestión de Calidad maduro y certificado, con fortalezas destacables en gestión de riesgos operacionales y trazabilidad. Sin embargo, la auditoría reveló 2 no conformidades Mayores (calibración de equipo de medición crítico vencida y falta de control de vencimiento de materias primas) y 1 no conformidad Menor (limpieza y mantenimiento de instalaciones).\n\nRESULTADO GENERAL: APROBADO con condiciones. Fecha límite CAPA: 18/12/2026 (NC mayores). Próxima auditoría: Junio 2028 (bi-anual), sujeta a cierre satisfactorio de CAPA.",result:"APROBADO con condiciones",nextAudit:"Junio 2028 (bi-anual)",expectations:"Se espera que Impresora Grifelman presente un plan de acciones correctivas y preventivas (CAPA) para cada no conformidad dentro de los 15 días hábiles siguientes a la recepción de este informe, dirigido al equipo auditor de Vessena S.A. El plan CAPA deberá incluir: análisis de causa raíz, acción correctiva propuesta, responsable, fecha de implementación y evidencia de cierre.\n\nPara la NC-03, se deberá presentar el certificado de calibración vigente del espectrodensitómetro y la evaluación del impacto de las mediciones realizadas durante el período fuera de calibración. Se realizará verificación documental del cierre de CAPA.",closeNotes:"",closeDate:"",createdAt:"2026-01-15T00:00:00.000Z"},

  const[audits,setAudits]=useLS("v_audA",DEF_AUDITS);const DEF_FINDINGS=[
    {id:"f1",code:"HAL-0001",year:2026,auditId:"a7",clauseRef:"Cap.2 Instalaciones",classification:"MENOR",description:"NC-01: Limpieza y mantenimiento de instalaciones. Se observaron tachos de basura sin tapa en el área de producción, implementos de limpieza (escobas, mopas) sin ubicación definida y zonas con presencia de humedad y deterioro en paredes/techos. Si bien la empresa indica estar trabajando en la mejora, aún persisten las condiciones inadecuadas.",evidence:"Observación directa durante recorrida de planta.",capaType:"Acción Correctiva",rootCause:"1- Tachos de basura sin tapa: no se había considerado la importancia de tener los recipientes de descarte de material inorgánico con tapas en ciertos puestos de producción. 2- Implementos de limpieza sin ubicación definida: si bien en todos los puestos se verifica la existencia de ciertos elementos, no se consideró la necesidad de definir un lugar específico. 3- Mantenimiento de instalaciones: se encuentra en ejecución plan de mantenimiento edilicio.",status:"En proceso",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f2",code:"HAL-0002",year:2026,auditId:"a7",clauseRef:"Cap.4 Control MP",classification:"GRAVE",description:"NC-02: Control de vencimientos de materias primas. Se detectó materia prima (pintura/tintas) con un período aproximado de dos meses sin control de fechas de vencimiento.",evidence:"Revisión de registros de almacén y verificación física de materiales en depósito.",capaType:"Acción Correctiva",rootCause:"1- Falta de instructivo: no se encuentra descripto en un documento cómo realizar el control del estado de las tintas y su vencimiento. 2- Omisión operativa.",status:"Cerrado",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f3",code:"HAL-0003",year:2026,auditId:"a7",clauseRef:"Cap.3 Equipos",classification:"GRAVE",description:"NC-03: Calibración vencida de espectrodensitómetro. El equipo de medición crítico para el control de color presenta calibración vencida desde el 07/08/2025 (fecha de calibración: 07/08/2023, vigencia expirada hace aproximadamente un año).",evidence:"Certificado de calibración con fecha 07/08/2023, vencimiento 07/08/2025.",capaType:"Acción Correctiva",rootCause:"Si bien el equipo se encuentra con la fecha de calibración vencida, este no es usado asiduamente durante el proceso productivo ya que cada máquina cuenta con su espectrodensitómetro incorporado con autocalibración. Su uso se encuentra supeditado a las situaciones específicas surgidas ante una duda durante algún control visual de color. Acorde a lo expresado no se tomó en cuenta el extender el vencimiento de dicha calibración por el plazo de 1 año.",status:"En proceso",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f4",code:"HAL-0004",year:2026,auditId:"a7",clauseRef:"Cap.4 Proveedores",classification:"OBS",description:"OBS-01: Evaluación de proveedores. El procedimiento (PG08.16 V8) no establece la obligación de notificar al proveedor sobre el motivo del puntaje obtenido en la evaluación. No se realiza clasificación de proveedores en críticos y no críticos.",evidence:"Revisión del procedimiento PG08.16 V8 y registros de evaluación LC 07 01 V1.0.",capaType:"Acción Correctiva",rootCause:"No se había contemplado a la fecha dicha observación.",status:"Cerrado",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f5",code:"HAL-0005",year:2026,auditId:"a7",clauseRef:"Cap.4 Control MP",classification:"OBS",description:"OBS-02: Los certificados de calidad de proveedores se solicitan y archivan pero no se evalúan sistemáticamente frente a las especificaciones internas. Se recomienda solicitar al proveedor que aclare o informe si cambia la especificación que pueda afectar los materiales.",evidence:"Revisión de archivos de certificados de proveedores.",capaType:"Acción Preventiva",rootCause:"La materia prima recibida es aceptada por calidad certificada, de ahí que no se realiza la evaluación en forma sistemática frente a las especificaciones internas. Existe un canal fluido y diario en cuanto a las comunicaciones con los proveedores. En estos momentos se encuentra en proceso un cambio en todos los gramajes de las materias primas provenientes de Chile (CMPC), dicho cambio fue anunciado con antelación acorde a lo definido en los contratos correspondientes.",status:"Cerrado",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f6",code:"HAL-0006",year:2026,auditId:"a7",clauseRef:"Cap.9 Personal",classification:"OBS",description:"OBS-03: Ausencia de capacitación en higiene y GMP. No se evidenció capacitación al personal en temas de higiene (lavado de manos, cabello recogido/corto, uso de cofia).",evidence:"Revisión de registros de capacitación. Observación directa del personal en planta.",capaType:"Acción Correctiva",rootCause:"Si bien se ha realizado la capacitación correspondiente luego de un plan de acción resultante de la auditoría de otro cliente, no quedó registro físico de esta.",status:"Cerrado",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f7",code:"HAL-0007",year:2026,auditId:"a7",clauseRef:"Cap.5 Control proceso",classification:"OBS",description:"OBS-04: La prueba de fricción se realiza sobre una sola muestra. Se recomienda evaluar representatividad estadística según tamaño de lote.",evidence:"Entrevista con personal de calidad y revisión de procedimiento de control en proceso.",capaType:"Acción Preventiva",rootCause:"Se considera acorde a los resultados de los controles realizados durante los últimos años y no presentar ninguna reclamación por parte de los clientes en ese período, el mantener la prueba de fricción sobre una sola muestra. Dicha resolución se basa en la estabilidad y aseguramiento de los diferentes procesos productivos.",status:"Cerrado",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f8",code:"HAL-0008",year:2026,auditId:"a7",clauseRef:"Cap.5 Proceso",classification:"OM",description:"OPM-01: Implementar identificación visible del número de orden de trabajo en cada máquina durante la producción.",evidence:"Observación directa en planta durante recorrida.",capaType:"Acción Preventiva",rootCause:"",status:"Evaluada — No implementar",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f9",code:"HAL-0009",year:2026,auditId:"a7",clauseRef:"Cap.1 SGC",classification:"OM",description:"OPM-02: Vincular el procedimiento de control de cambios con el plan de contingencia y el análisis de riesgos de forma explícita en la documentación del SGC.",evidence:"Revisión de PG 06.05 V07 y documentación de control de cambios 002/2025.",capaType:"Acción Preventiva",rootCause:"",status:"Evaluada — No implementar",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f10",code:"HAL-0010",year:2026,auditId:"a7",clauseRef:"Cap.9 Capacitación",classification:"OM",description:"OPM-03: Establecer un porcentaje mínimo de aprobación por capacitación/entrenamiento en el procedimiento correspondiente (PG 07.05).",evidence:"Revisión de procedimiento de capacitación.",capaType:"Acción Preventiva",rootCause:"",status:"Evaluada — No implementar",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f11",code:"HAL-0011",year:2026,auditId:"a7",clauseRef:"Cap.8 Reclamos",classification:"OM",description:"OPM-04: Documentar en el procedimiento de reclamos el tiempo máximo de respuesta al cliente (actualmente 5 días hábiles de manera informal).",evidence:"Entrevista con responsable de calidad.",capaType:"Acción Preventiva",rootCause:"",status:"Evaluada — No implementar",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f12",code:"HAL-0012",year:2026,auditId:"a7",clauseRef:"Cap.2 Instalaciones",classification:"OM",description:"OPM-05: Instalar insectocutores en áreas de almacén. El programa de control de plagas (F09 11 V1) no hace referencia a insectocutores.",evidence:"Revisión de programa de control de plagas y recorrida de almacén.",capaType:"Acción Preventiva",rootCause:"",status:"Evaluada — No implementar",createdAt:"2026-06-18T00:00:00.000Z"},
    {id:"f13",code:"HAL-0013",year:2026,auditId:"a5",clauseRef:"Cap.10 Capacitación",classification:"GRAVE",description:"NC-01: Capacitaciones. Falta de registro de capacitaciones impartidas al personal. No se cuenta con procedimiento establecido ni plan de capacitación.",evidence:"Revisión de registros de capacitación.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f14",code:"HAL-0014",year:2026,auditId:"a5",clauseRef:"Cap.3 Sanitización",classification:"GRAVE",description:"NC-02: Control de plagas. No hay evidencia de habilitación de los cebos utilizados por parte del MSP. Falta capacitación del personal en seguridad sobre manejo de productos químicos. Faltan controles para hormigas, cucarachas e insectos voladores.",evidence:"Revisión de registros de control de plagas y recorrida de instalaciones.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f15",code:"HAL-0015",year:2026,auditId:"a5",clauseRef:"Cap.14 Materiales",classification:"GRAVE",description:"NC-03: Identificación de estado de productos. No existe forma de identificar visualmente el estado de los productos elaborados (aprobado, cuarentena, rechazado), ni procedimiento escrito que lo avale.",evidence:"Observación directa en planta.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f16",code:"HAL-0016",year:2026,auditId:"a5",clauseRef:"Cap.13 Equipos",classification:"GRAVE",description:"NC-04: Limpieza de IBC. No está definido el orden y flujo de trabajo para la limpieza de IBC. No existe instructivo ni procedimiento escrito.",evidence:"Entrevista con personal y revisión documental.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f17",code:"HAL-0017",year:2026,auditId:"a5",clauseRef:"Cap.13 Equipos",classification:"MENOR",description:"NC-05: Gestión de IBC. Falta identificación de las áreas de almacenamiento de los IBC segregados por tipo de producto.",evidence:"Recorrida de almacén de IBC.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f18",code:"HAL-0018",year:2026,auditId:"a5",clauseRef:"Cap.17 Control Calidad",classification:"GRAVE",description:"NC-06: Verificación microbiológica. Falta verificación microbiológica por hisopado o agua de enjuague de la limpieza de IBC y reactores de fabricación.",evidence:"Revisión de registros de limpieza y control microbiológico.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f19",code:"HAL-0019",year:2026,auditId:"a5",clauseRef:"Cap.16 Producción",classification:"GRAVE",description:"NC-07: Orden de producción. Orden 74713 (02/07/2026, Diclean): falta cancelar campos de MP no participantes, faltan firmas de operarios, no se evidencia rango de tolerancia para pesadas, falta firma del responsable de análisis, faltan datos de certificado de análisis de origen.",evidence:"Revisión de orden de producción 74713.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f20",code:"HAL-0020",year:2026,auditId:"a5",clauseRef:"Cap.13 Equipos",classification:"GRAVE",description:"NC-08: Limpieza de reactores. No hay frecuencia establecida por procedimiento ni procedimiento escrito para la limpieza de reactores.",evidence:"Entrevista con personal de producción.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f21",code:"HAL-0021",year:2026,auditId:"a5",clauseRef:"Cap.12 Instalaciones",classification:"MENOR",description:"NC-09: Almacenamiento, expedición y recepción. No se observan lugares definidos ni identificados para estas áreas; la ubicación es según disponibilidad.",evidence:"Recorrida de instalaciones.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f22",code:"HAL-0022",year:2026,auditId:"a5",clauseRef:"Cap.13 Equipos",classification:"GRAVE",description:"NC-10: Calibración de equipos. Balanza de producción sin calibración ni verificación. No hay listado de equipos definidos. En el laboratorio no se realiza ni hay registro de verificación diaria de pHmetro ni de balanza. Tampoco hay identificación ni calibración de estos equipos.",evidence:"Revisión de registros de calibración y verificación en planta y laboratorio.",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f23",code:"HAL-0023",year:2026,auditId:"a5",clauseRef:"Cap.14 Proveedores",classification:"OBS",description:"OBS-01: Evaluación de proveedores. El proceso de evaluación se encuentra en desarrollo, aún no terminado de definir (criticidad de proveedores, porcentaje de aprobación, ponderación según categoría).",evidence:"Entrevista con responsable de calidad.",capaType:"Acción Preventiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},
    {id:"f24",code:"HAL-0024",year:2026,auditId:"a5",clauseRef:"Cap.1 Aseg. Calidad",classification:"OBS",description:"OBS-02: Gestión de no conformidades. No se encuentra unificado el análisis de causa raíz para que todos los involucrados apliquen el mismo criterio. Tampoco se lleva un listado unificado de no conformidades.",evidence:"Revisión de registros de no conformidades.",capaType:"Acción Preventiva",rootCause:"",status:"Abierto",createdAt:"2026-08-21T00:00:00.000Z"},

  ];
  const[findings,setFindings]=useLS("v_finC",DEF_FINDINGS);  const DEF_ACTIONS=[
    {id:"ac1",code:"ACC-0001",year:2026,findingId:"f4",description:"Modificación procedimiento PG 08.16 (emisión nueva V9): Incorporación de criterios de clasificación en proveedores críticos y no críticos, y notificación de puntaje de evaluación al proveedor.",responsible:"J. Ramirez (Grifelman)",dueDate:"2026-07-31",status:"Cerrado",verification:"Realizado 23/06/2026. Verificación eficacia: Auditoría interna de sistema 06-07/ago/2026 — M. Arada.",effectiveness:"Ok sin observaciones.",followupResp:"M. Arada (Grifelman)",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac2",code:"ACC-0002",year:2026,findingId:"f6",description:"Corrección: Se realiza retroalimentación al personal dejando constancia en registro físico de la capacitación realizada en higiene y GMP. Acción correctiva: Capacitación formal con registro documentado.",responsible:"J. Ramirez (Grifelman)",dueDate:"2026-07-31",status:"Cerrado",verification:"Corrección impl. Jul-2026 (J. Ramirez). Verificación eficacia: Auditoría interna de sistema 06-07/ago/2026 — M. Arada.",effectiveness:"Ok sin observaciones.",followupResp:"M. Arada (Grifelman)",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac3",code:"ACC-0003",year:2026,findingId:"f1",description:"1- Implementación de tapas para recipientes de descarte. 2- Colocación de soportes para escobas y palas en puestos de trabajo. 3- En proceso de ejecución de plan de mantenimiento edilicio.",responsible:"1-2: D. Mesias, 3: M. Baladón / Empresa de construcción (Grifelman)",dueDate:"2027-01-31",status:"En proceso",verification:"Items 1-2: Realizados 24/07/2026. Verificación eficacia 06-07/ago/2026 (M. Arada): OK sin observaciones. Item 3: En proceso — cumplimiento de plan anual.",effectiveness:"Items 1-2: Ok sin observaciones. Item 3: En proceso (verificación Ene-2027 por M. Baladón).",followupResp:"M. Arada / M. Baladón (Grifelman)",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac4",code:"ACC-0004",year:2026,findingId:"f2",description:"1- Confección de instructivo para el stock y control de vencimientos de tintas (IT 08.31 V1, 01/07/2026). 2- Retroalimentación a operarios del sector.",responsible:"J. Ramirez (Grifelman)",dueDate:"2026-07-31",status:"Cerrado",verification:"Evidencia: IT 08.31 V1 (01/07/2026). Implementado 01/07/2026. Verificación eficacia: Auditoría interna de sistema 06-07/ago/2026 — M. Arada.",effectiveness:"Ok sin observaciones.",followupResp:"M. Arada (Grifelman)",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac5",code:"ACC-0005",year:2026,findingId:"f3",description:"Se coordina con el proveedor sito en Argentina la calibración del espectrodensitómetro. NOTA: El equipo aún no ha sido calibrado por temas de coordinación por parte del proveedor. Nueva fecha estimada: Oct 2026.",responsible:"M. Cobelli, M. Baladón (Grifelman)",dueDate:"2026-10-31",status:"En proceso",verification:"Pendiente: Certificado de calibración vigente del espectrodensitómetro.",effectiveness:"Auditoría interna de sistema — verificación prevista Oct-2026 por M. Baladón.",followupResp:"M. Baladón (Grifelman)",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac6",code:"ACC-0006",year:2026,findingId:"f5",description:"No aplica según Grifelman. Justificación: La materia prima recibida es aceptada por calidad certificada, no se realiza la evaluación en forma sistemática frente a las especificaciones internas. Existe un canal fluido y diario con los proveedores. Se encuentra en proceso un cambio en todos los gramajes de las MP provenientes de Chile (CMPC), anunciado con antelación acorde a contratos.",responsible:"No aplica",dueDate:"",status:"Cerrado",verification:"No aplica.",effectiveness:"No aplica.",followupResp:"",createdAt:"2026-06-30T00:00:00.000Z"},
    {id:"ac7",code:"ACC-0007",year:2026,findingId:"f7",description:"No aplica según Grifelman. Justificación: Se considera acorde a los resultados de los controles realizados durante los últimos años y no presentar ninguna reclamación por parte de los clientes en ese período, el mantener la prueba de fricción sobre una sola muestra. Dicha resolución se basa en la estabilidad y aseguramiento de los diferentes procesos productivos.",responsible:"No aplica",dueDate:"",status:"Cerrado",verification:"No aplica.",effectiveness:"No aplica.",followupResp:"",createdAt:"2026-06-30T00:00:00.000Z"},
  ];
  const[actions,setActions]=useLS("v_accD",DEF_ACTIONS);
  /* Las check list aplicadas: una por auditoria, con la respuesta de cada
     requisito. Las plantillas viven en el codigo (DEF_CHECKLISTS); esto es lo
     que se marca en cada auditoria. */
  const[chkRes,setChkRes]=useLS("v_chkR",[]);
  /* El audit trail lo escribe el servidor en cada guardado, con el usuario del
     portal. Acá solo se muestra lo que él tiene. */
  const[logs,setLogs]=useState([]);
  useEffect(()=>{apiAud('/actividad?limite=300')
    .then(d=>setLogs((d.actividad||[]).map(a=>({id:a.ts+a.accion,ts:a.ts,user:a.usuario,action:a.accion,entity:a.entidad,detail:a.detalle}))))
    .catch(()=>{});},[]);
  const[pg,sPg]=useState("prog");const[col,sCol]=useState(false);
  const[year,sYear]=useLS("v_year",2026);
  const[audDet,sAudDet]=useState(null);

  // Year-filtered data
  const yAudits=audits.filter(a=>a.year===year);
  const yFindings=findings.filter(f=>f.year===year||!f.year);
  const yActions=actions.filter(a=>a.year===year||!a.year);
  const yData={...dt,audits:yAudits,findings:yFindings,actions:yActions,allAudits:audits,allFindings:findings,allActions:actions,year};// audit detail modal

  const logout=async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});}catch(e){}location.href='/';};

  const role=ROLES[cu.role]||{};const canEdit=role.canEdit;const canAdmin=role.canAdmin;
  const dt={audits,setAudits,findings,setFindings,actions,setActions,chkRes,setChkRes,logs,setLogs,currentUser:cu};
  // Los usuarios se administran en el portal, no acá.
  const nv=[...NAV];if(canAdmin)nv.push({k:"cfg",l:"Configuración",i:"⚙️"});

  /* ── Open audit from program grid or list ── */
  const openAudit=(existing,sector,month)=>{
    if(existing){sAudDet(existing);}
    else if(canEdit&&sector&&month){
      if(!confirm(`¿Crear auditoría planificada para "${sector}" en ${month}?`))return;
      const code=`AUD-${String(audits.length+1).padStart(4,"0")}`;
      const newA={id:gid(),code,year,name:`Auditoría ${sector}`,type:cfg.auditTypes[0]||"Interna",progSector:sector,progMonth:month,phase:"planificada",date:"",auditor:"",team:"",standard:"",scope:"",location:"",checklists:"",execNotes:"",execDate:"",checklistApplied:"",methodology:"",distribution:"",generalImpression:"",strengths:"",conclusions:"",result:"",nextAudit:"",expectations:"",closeNotes:"",closeDate:"",createdAt:new Date().toISOString()};
      setAudits(p=>[...p,newA]);
      alog(setLogs,"CREAR","Auditoría",`${code} — ${sector} (${month})`,cu.name);
      sAudDet(newA);
    }
  };
  const saveAudit=(fm)=>{
    const prev=audits.find(a=>a.id===fm.id);
    setAudits(p=>p.map(a=>a.id===fm.id?{...a,...fm}:a));
    if(prev&&prev.phase!==fm.phase)alog(setLogs,"CAMBIO FASE","Auditoría",`${fm.code}: ${phaseOf(prev.phase,isExternal(prev)).label} → ${phaseOf(fm.phase,isExternal(fm)).label}`,cu.name);
    else alog(setLogs,"EDITAR","Auditoría",fm.code,cu.name);
    if(fm.postponed&&(!prev||!prev.postponed)){
      const nextYr=fm.postponedToYear||(fm.year||2026)+1;
      const newCode=`AUD-${String(audits.length+1).padStart(4,"0")}`;
      const clone={id:gid(),code:newCode,year:nextYr,name:fm.name,type:fm.type,progSector:fm.progSector,progMonth:fm.progMonth,phase:isExternal(fm)?"ext_notificada":"planificada",date:"",auditor:fm.auditor,team:fm.team,standard:fm.standard,scope:fm.scope,location:fm.location,checklists:fm.checklists,execNotes:"",execDate:"",checklistApplied:"",methodology:"",distribution:fm.distribution,generalImpression:"",strengths:"",conclusions:"",result:"",nextAudit:"",expectations:"",closeNotes:"",closeDate:"",postponed:false,postponedReason:"",postponedDate:"",postponedToYear:0,createdAt:new Date().toISOString()};
      setAudits(p=>[...p,clone]);
      alog(setLogs,"POSTERGAR","Auditoría",`${fm.code} (${fm.year}) → ${newCode} (${nextYr}). Motivo: ${fm.postponedReason}`,cu.name);
    }
    sAudDet(null);
  };

  return(<div style={{background:K.bg,minHeight:"100vh"}}>
    <div style={{width:col?52:220,background:K.txt,color:"#fff",display:"flex",flexDirection:"column",position:"fixed",top:0,left:0,bottom:0,zIndex:10,transition:"width .2s"}}>
      <div style={{padding:col?"16px 8px":"16px 14px",borderBottom:"1px solid rgba(255,255,255,.08)",textAlign:col?"center":"left"}}>{col?<span style={{fontSize:15,fontWeight:800}}>V</span>:<div><div style={{fontSize:10,fontWeight:800,color:K.ves,letterSpacing:".1em",textTransform:"uppercase"}}>Vessena S.A.</div><div style={{fontSize:13.5,fontWeight:700,marginTop:2}}>QMS Audit Tracker</div></div>}</div>
      {!col&&<div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:8}}><div style={{width:28,height:28,borderRadius:"50%",background:role.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{role.icon}</div><div style={{flex:1,overflow:"hidden"}}><div style={{fontSize:12,fontWeight:600,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cu.name}</div><div style={{fontSize:10,color:role.color}}>{role.label}</div></div></div>}
      {!col&&<div style={{padding:"8px 14px",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.4)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Año de gestión</div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button onClick={()=>sYear(y=>y-1)} style={{background:"rgba(255,255,255,.1)",border:"none",color:"#fff",borderRadius:4,width:24,height:24,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>◀</button>
          <span style={{flex:1,textAlign:"center",fontSize:16,fontWeight:800,color:"#fff"}}>{year}</span>
          <button onClick={()=>sYear(y=>y+1)} style={{background:"rgba(255,255,255,.1)",border:"none",color:"#fff",borderRadius:4,width:24,height:24,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>▶</button>
        </div>
      </div>}
      <nav style={{flex:1,padding:"6px 0",overflowY:"auto"}}>{nv.map(n=><div key={n.k} onClick={()=>sPg(n.k)} title={n.l} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 14px",cursor:"pointer",background:pg===n.k?"rgba(255,255,255,.1)":"transparent",borderRadius:5,margin:"1px 6px",fontSize:12.5,fontWeight:pg===n.k?600:400,color:pg===n.k?"#fff":"rgba(255,255,255,.6)",borderTop:n.k==="cfg"?"1px solid rgba(255,255,255,.06)":"none",marginTop:n.k==="cfg"?6:1}}><span style={{fontSize:14,flexShrink:0}}>{n.i}</span>{!col&&<span>{n.l}</span>}</div>)}</nav>
      <div style={{padding:"6px",borderTop:"1px solid rgba(255,255,255,.08)"}}><div onClick={logout} style={{display:"flex",alignItems:"center",justifyContent:col?"center":"flex-start",gap:8,padding:"9px 14px",cursor:"pointer",borderRadius:5,margin:"1px 6px",fontSize:12.5,color:"rgba(255,255,255,.5)"}}><span>🚪</span>{!col&&<span>Salir</span>}</div><div onClick={()=>sCol(!col)} style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"8px",cursor:"pointer",fontSize:12,color:"rgba(255,255,255,.4)"}}>{col?"▸":"◂"}</div></div>
    </div>
    <div style={{marginLeft:col?52:220,padding:"20px 28px",transition:"margin .2s"}}>
      {/* El servidor todavía no tiene nada: lo que se ve es el año que traía
          el archivo viejo. Se trae una sola vez, y recién ahí queda para todas. */}
      {!SRV.datos.auditorias&&canAdmin&&<div style={{background:"#FFFBEB",border:"1px solid #FDE68A",color:"#92400E",borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13}}>
        <b>Este año todavía no está en el servidor.</b> Lo que ves ahora sale del archivo anterior y no lo ve nadie más.
        <button onClick={async()=>{
          const cols={auditorias:audits,hallazgos:findings,acciones:actions,config:cfg,
                      autoinspecciones:[],autoinspecciones_hallazgos:[]};
          try{
            const p=await apiAud('/importar',{method:'POST',body:JSON.stringify({colecciones:cols})});
            const det=Object.entries(p.preview).map(([k,v])=>`${k}: ${v}`).join(', ');
            if(!confirm(`Se va a guardar en el servidor:\n${det}\n\n¿Confirmás?`))return;
            await apiAud('/importar',{method:'POST',body:JSON.stringify({colecciones:cols,confirmar:true})});
            alert('Listo: el año quedó en el servidor.');location.reload();
          }catch(e){alert('No se pudo importar: '+e.message);}
        }} style={{marginLeft:10,padding:"6px 14px",background:"#92400E",color:"#fff",border:"none",borderRadius:7,cursor:"pointer",fontWeight:600}}>Traer el año al servidor</button>
      </div>}
      {pg==="prog"&&<ProgramaIntegrado data={yData} cfg={cfg} canEdit={canEdit} openAudit={openAudit}/>}
      {pg==="aud"&&<AuditList data={{...yData,setAudits,setLogs}} cfg={cfg} canEdit={canEdit} openAudit={(a)=>sAudDet(a)}/>}
      {pg==="hal"&&<Findings data={{...yData,setFindings,setLogs}} cfg={cfg} canEdit={canEdit}/>}
      {pg==="acc"&&<Actions data={{...yData,setActions,setLogs}} cfg={cfg} canEdit={canEdit}/>}
      {pg==="autoinsp"&&<Autoinspecciones data={{...yData,setLogs,currentUser:cu}} cfg={cfg} canEdit={canEdit}/>}
      {pg==="trail"&&<Trail logs={logs}/>}
      {pg==="rep"&&<Reports data={yData} cfg={cfg}/>}
      {pg==="guide"&&<GuidePage goTo={sPg}/>}
      {pg==="cfg"&&canAdmin&&<ConfigMod cfg={cfg} setCfg={setCfg} setLogs={setLogs} currentUser={cu}/>}
    </div>
    {audDet&&<AuditDetail audit={audDet} data={{...dt,setFindings,setActions,setLogs,currentUser:cu}} cfg={cfg} canEdit={canEdit} onClose={()=>sAudDet(null)} onSave={saveAudit} onDelete={(id)=>{
      if(confirm("¿Eliminar esta auditoría? Los hallazgos vinculados no se eliminarán pero perderán la vinculación.")){
        const a=audits.find(x=>x.id===id);
        setAudits(p=>p.filter(x=>x.id!==id));
        alog(setLogs,"ELIMINAR","Auditoría",`${a?.code} — ${a?.name}`,cu.name);
        sAudDet(null);
      }
    }}/>}
  </div>);
}
/* Primero se traen los datos y la sesión del portal; recién ahí se pinta la
   pantalla, porque las listas se leen al construir el estado. */
(async function arrancar(){
  const raiz=document.getElementById("root");
  raiz.innerHTML='<div style="padding:40px;font-family:system-ui;color:#64748B">Cargando auditorías…</div>';
  try{
    const d=await apiAud('/datos');
    for(const[nombre,c]of Object.entries(d.colecciones||{})){SRV.datos[nombre]=c.datos;SRV.vers[nombre]=c.version;}
    SRV.sesion={nombre:d.nombre,permisos:d.permisos||[],importado:d.importado};
    ReactDOM.render(<App/>,raiz);
  }catch(e){
    raiz.innerHTML='<div style="padding:40px;font-family:system-ui;color:#B91C1C">No se pudo entrar: '+
      (e&&e.message?e.message:'error')+'</div>';
  }
})();
</script>
</body>
</html>
