/* Resumen de una check list aplicada: cuántas conformes, no conformes, no
   aplicables y cuántas quedan sin responder. */
function resumenChk(tpl,resp){
  const items=tpl?.items||[];const r=resp?.respuestas||{};
  const cuenta=(v)=>items.filter(i=>(r[i.n]||{}).r===v).length;

}

/* El campo Norma guarda las normas separadas por coma, pero los nombres tienen
   comas adentro -"Higiene Personal, Cosméticos y Perfumes"-: se corta solo
   antes de donde empieza otra norma, o en punto y coma. */
const partirNormas=(s)=>String(s||"")
  .split(/\s*,\s*(?=Decreto|ISO|GMC|MERCOSUR|Res\.|BRCGS|PS\s*9000|EN\s*\d|WHO|OMS|Health\s*Canada|EFfCI|ICH\s*Q)|\s*;\s*/i)

/* Las normas se agrupan por lo que se audita, porque no son las mismas para una
   imprenta que para un proveedor de materia prima: asi la lista de casillas se

   una lista de textos que Claudia edita sola. */
const GRUPOS_NORMA=["Producto (Uruguay / MERCOSUR)","Sistema de gestión","Material de empaque (imprentas)","Materia prima","Otras"];
const grupoDeNorma=(n)=>
  /^\s*decreto|gmc\s*res/i.test(n) ? GRUPOS_NORMA[0]

  : /who|oms|health\s*canada|effci|excipient|materia\s*prima|ich\s*q7|starting\s*material/i.test(n) ? GRUPOS_NORMA[3]

const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
/* ── Los datos viven en el servidor, no en el navegador ─────────────────────
   La app nació guardando todo en localStorage: lo que cargaba una no lo veía
   otra y se perdía al limpiar el navegador. Ahora cada lista es una colección
   del servidor (migración 051). Se mantienen los mismos nombres de clave para
   no tocar el resto de la pantalla.
   Cada colección lleva versión: si dos personas guardan a la vez, el servidor
   rechaza la segunda y la pantalla recarga en vez de pisar el trabajo ajeno. */
const API_AUD='/api/auditorias';
const COLECCION={v_audA:'auditorias',v_finC:'hallazgos',v_accD:'acciones',
  v_ai1:'autoinspecciones',v_aif1:'autoinspecciones_hallazgos',
  v_progsec:'programa_sectores',v_cfg:'config',v_chkR:'checklist_respuestas'};
const SRV={datos:{},vers:{},sesion:null};
async function apiAud(ruta,op){
  const r=await fetch(API_AUD+ruta,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},op||{}));
  if(r.status===401){location.href='/index.html';throw new Error('sesión');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.ok===false){const e=new Error(d.error||('error '+r.status));e.status=r.status;e.actual=d.actual;throw e;}
  return d;
}
async function guardarColeccion(col,datos){
  try{
    const d=await apiAud('/coleccion/'+col,{method:'PUT',body:JSON.stringify({version:SRV.vers[col],datos})});
    SRV.vers[col]=d.version; SRV.datos[col]=datos;
  }catch(e){
    if(e.status===409){
      alert('Otra persona guardó cambios mientras tanto. Se vuelve a cargar la pantalla para no pisarlos; revisá y volvé a hacer el cambio.');
      location.reload(); return;
    }
    alert('No se pudo guardar en el servidor: '+e.message);
  }
}
function useLS(k,i){
  const col=COLECCION[k];
  // v_year y el resto son preferencias de cada uno: siguen en el navegador.
  let inicial=col?(SRV.datos[col]??i):(LS.get(k)??i);
  // La configuración guardada no tiene las claves que se agregan después -las
  // normas, por ejemplo-: se completan con las de fábrica para que aparezcan
  // sin tener que volver a importar nada.
  if(col==='config'&&inicial&&typeof inicial==='object'&&!Array.isArray(inicial))inicial={...i,...inicial};
  const[v,sV]=useState(inicial);
  const s=useCallback(fn=>{sV(p=>{const n=typeof fn==="function"?fn(p):fn;
    if(col)guardarColeccion(col,n); else LS.set(k,n);
    return n;});},[k,col]);
  return[v,s];
}

function ProgramaIntegrado({data,cfg,canEdit,openAudit}){
  const{audits}=data;const yr=data.year||2026;
  const[progSectors,setProgSectors]=useLS("v_progsec",{2026:["Seguimiento Depósito y Distribución","Seguimiento LCC","Gestión Productiva (Fabricación)","Seguimiento Gestión Productiva (Envasado)","Gestión Productiva (Plásticos)","Gestión de Higiene y Sanitización","Seguimiento Depósito de Materias Primas","Imprimex (Proveedor)","Dimena (Proveedor)","Petropack (Proveedor)","Imprenta Grifelman (Proveedor)"]});
  const[showPicker,setShowPicker]=useState(false);
  const yrSectors=progSectors[yr]||[];
  const toggleSector=(s)=>{setProgSectors(p=>{const cur=p[yr]||[];const next=cur.includes(s)?cur.filter(x=>x!==s):[...cur,s];return{...p,[yr]:next};});};
  const addAllSectors=()=>{setProgSectors(p=>({...p,[yr]:[...cfg.sectors]}));};

  const getAudit=(sector,month)=>audits.find(a=>a.progSector===sector&&a.progMonth===month);
  const cellStyle=(a)=>{if(!a)return{background:"#F8FAFC",color:K.txM};const p=phaseOf(a.phase,isExternal(a));return{background:p.color+"18",color:p.color};};
  const cellText=(a)=>{if(!a)return "";const p=phaseOf(a.phase,isExternal(a));return p.icon;};

  return(<div>
    <h1 style={{fontSize:20,fontWeight:800,marginBottom:4}}>Programa Anual de Auditorías — {yr}</h1>
    <p style={{color:K.txS,margin:"0 0 12px",fontSize:12.5}}>REG-SOP-AC-035-A — Click en una celda para planificar o ver el estado de la auditoría</p>
    <CtxHelp>Cada celda representa una auditoría para un sector/mes. <strong>Celda vacía</strong> = sin planificar. Click para crear. Las auditorías avanzan: 📅→📝→🔄→📊→✅</CtxHelp>

    <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
      {PHASES.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:p.color}}><span>{p.icon}</span>{p.label}</div>)}
      <div style={{marginLeft:"auto"}}>{canEdit&&<button style={sB("pri")} onClick={()=>setShowPicker(true)}>🏭 Configurar sectores {yr}</button>}</div>
    </div>

    {yrSectors.length===0?<div style={sC}><Em icon="🏭" t={`No hay sectores configurados para ${yr}. Hacé click en "Configurar sectores ${yr}" para seleccionar qué sectores incluir en el programa.`}/></div>:
    <div style={{...sC,overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr><th style={{...sTh,minWidth:160,position:"sticky",left:0,background:K.srf,zIndex:2}}>Sector / Proceso</th>{MO.map(m=><th key={m} style={{...sTh,textAlign:"center",minWidth:48}}>{m}</th>)}</tr></thead>
        <tbody>{yrSectors.map(s=><tr key={s}>
          <td style={{...sTd,fontWeight:600,fontSize:12,position:"sticky",left:0,background:K.srf,zIndex:1}}>{s}</td>
          {MO.map(m=>{const a=getAudit(s,m);const st=cellStyle(a);return <td key={m} style={{...sTd,padding:4,textAlign:"center"}} onClick={()=>{if(canEdit||a)openAudit(a,s,m);}}>
            <div className="prog-cell" style={{...st,minHeight:32,fontSize:a?14:18,cursor:canEdit||a?"pointer":"default"}} title={a?`${a.code} — ${phaseOf(a.phase,isExternal(a)).label}`:"Click para planificar"}>
              {a?cellText(a)+(a.postponed?"⏸":""):(canEdit?<span style={{opacity:.3}}>+</span>:"")}
            </div>
          </td>;})}
        </tr>)}</tbody>
      </table>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div style={sC}>
        <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 8px"}}>Resumen por fase</h3>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{PHASES.map(p=>{const c=audits.filter(a=>a.phase===p.id&&a.progSector).length;return <div key={p.id} style={{padding:"8px 12px",background:p.bg,border:`1px solid ${p.color}20`,borderRadius:7,flex:"1 1 80px"}}><div style={{fontSize:10,fontWeight:700,color:p.color,textTransform:"uppercase"}}>{p.icon} {p.label}</div><div style={{fontSize:20,fontWeight:800,color:p.color,marginTop:2}}>{c}</div></div>;})}</div>
      </div>
      <div style={sC}>
        <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 8px"}}>Equipos Auditores {yr}</h3>
        {(cfg.teams||[]).map((t,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:`1px solid ${K.brdL}`,fontSize:12}}>
          <span style={{fontWeight:700,color:K.pri,minWidth:24}}>{t.name}</span>
          <span style={{color:K.txS,flex:1}}>{t.members}</span>
          <span style={{fontWeight:600,fontSize:11}}>Líder: {t.leader}</span>
          {t.comments&&<Bg color={K.wrn} bg={K.wrnL}>{t.comments}</Bg>}
        </div>)}
      </div>
    </div>
    <div style={sC}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 6px"}}>Definido por</h3>
      <div style={{fontSize:12.5,color:K.txS}}>Gloria Nuñez — Aseguramiento de Calidad &nbsp;|&nbsp; <strong>Aprobado:</strong> Claudia Barlocco — Dirección Técnica</div>
    </div>

    {showPicker&&<Md title={`Sectores del programa ${yr}`} onClose={()=>setShowPicker(false)} wide>
      <CtxHelp>Seleccioná los sectores/procesos que se incluirán en el programa anual de {yr}. Solo los seleccionados aparecerán como filas en la grilla.</CtxHelp>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <button style={sB("pri")} onClick={addAllSectors}>Seleccionar todos</button>
        <button style={sB("g")} onClick={()=>setProgSectors(p=>({...p,[yr]:[]}))}>Limpiar selección</button>
        <span style={{fontSize:12,color:K.txS,marginLeft:"auto",alignSelf:"center"}}>{yrSectors.length} de {cfg.sectors.length} seleccionados</span>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input style={{...sI,flex:1}} placeholder="Agregar nuevo sector..." onKeyDown={e=>{if(e.key==="Enter"&&e.target.value.trim()){const v=e.target.value.trim();if(!cfg.sectors.includes(v)){cfg.sectors.push(v);}if(!yrSectors.includes(v)){toggleSector(v);}e.target.value="";}}} />
        <button style={sB("pri")} onClick={()=>{const inp=document.querySelector("#newSectorInput");if(inp&&inp.value.trim()){const v=inp.value.trim();if(!cfg.sectors.includes(v)){cfg.sectors.push(v);}if(!yrSectors.includes(v)){toggleSector(v);}inp.value="";}}}>+ Agregar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        {cfg.sectors.map(s=>{const sel=yrSectors.includes(s);return <div key={s} onClick={()=>toggleSector(s)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",border:`1px solid ${sel?K.pri+"40":K.brd}`,borderRadius:8,cursor:"pointer",background:sel?K.priL:"#fff",transition:"all .12s"}}>
          <div style={{width:22,height:22,borderRadius:5,border:`2px solid ${sel?K.pri:K.brd}`,background:sel?K.pri:"#fff",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:700,flexShrink:0}}>{sel&&"✓"}</div>
          <span style={{fontSize:13,fontWeight:sel?600:400,color:sel?K.pri:K.txt}}>{s}</span>
        </div>;})}
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
        <button style={sB("pri")} onClick={()=>setShowPicker(false)}>Listo</button>
      </div>
    </Md>}
  </div>);
}

/* ── EXPORT REPORT ── */
/* Las firmas salen de la tabla `firmas` del servidor, la misma que usan
   Graneles y los demás registros: se busca por el nombre del auditor y se toma
   la que estaba vigente el día de la auditoría. Quien no tenga firma cargada
   sale con el renglón en blanco para firmar a mano. */
/* El informe guarda el nombre como lo escribió quien cargó el plan: "Q.F.
   Claudia Barlocco", "Gloria Nuñez (Líder)". Se limpian el título y la
   aclaración para que coincida con el nombre de la tabla de firmas, y para que
   la misma persona no aparezca dos veces. */
const TITULOS=/^(q\.?\s*f\.?|ing\.?|lic\.?|dra?\.?|sra?\.?|t[eé]c\.?|mg\.?|farm\.?)\s+/i;
function nombreLimpio(n){
  let s=String(n||"").replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
  while(TITULOS.test(s))s=s.replace(TITULOS,"").trim();
  return s;
}
const comparable=n=>nombreLimpio(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
async function firmasDelInforme(fm){
  const nombres=[fm.auditor,...String(fm.team||"").split(/[,;]/)].map(nombreLimpio).filter(Boolean);
  const vistos=new Set();
  const unicos=nombres.filter(n=>{const k=comparable(n);if(vistos.has(k))return false;vistos.add(k);return true;});
  if(!unicos.length)return[];
  try{
    const d=await apiAud('/firmas',{method:'POST',body:JSON.stringify({nombres:unicos,fecha:fm.execDate||fm.date||'',codigo:fm.code})});
    return d.firmas||[];
  }catch(e){return unicos.map(n=>({nombre:n,cargo:'',imagen:'',sinFirma:true}));}
}
async function exportReport(fm,af,cfg,chkResp){
  /* La ventana se abre ANTES de ir a buscar las firmas: si se abriera después,
     el navegador la trata como emergente no pedida y la bloquea. */
  const w=window.open("","_blank");
  if(!w){alert("El navegador bloqueó la ventana. Permití las ventanas emergentes para esta página.");return;}
  w.document.write('<p style="font-family:Arial;padding:20px">Preparando el informe…</p>');
  const clsLabel=(id)=>{const c=cfg.classifications.find(x=>x.id===id);return c?c.label:"—";};
  const ncs=af.filter(f=>["CRITICA","GRAVE","MENOR","OTRA"].includes(f.classification));
  const obs=af.filter(f=>f.classification==="OBS");
  const opm=af.filter(f=>f.classification==="OM");
  const ncsHtml=ncs.length?('<table><tr><th>No conformidad</th><th>Clasificación</th></tr>'+ncs.map(f=>'<tr><td>'+f.code+': '+f.description+'</td><td><b>'+clsLabel(f.classification)+'</b></td></tr>').join('')+'</table>'):'<p>No se detectaron no conformidades.</p>';
  const obsHtml=obs.length?obs.map(f=>'<p><b>'+f.code+':</b> '+f.description+'</p>').join(''):'<p>Sin observaciones.</p>';
  const opmHtml=opm.length?opm.map(f=>'<p><b>'+f.code+':</b> '+f.description+'</p>').join(''):'<p>Sin oportunidades de mejora.</p>';
  const clsTable=cfg.classifications.map(function(c){return '<tr><td><b>'+c.label+'</b></td><td>'+c.desc+(c.deadline?(' — Plazo: '+c.deadline+' meses'):'')+'</td></tr>';}).join('');
  const scope=(fm.scope||"Sin definir").replace(/\n/g,"<br>");
  const meth=(fm.methodology||"Sin definir").replace(/\n/g,"<br>");
  // Una fila por norma, con el organismo que corresponde a cada una: los
  // decretos son del MSP -incorporan el reglamento MERCOSUR- y la ISO no.
  const organismoDe=(n)=>/^\s*decreto/i.test(n)?"MSP Uruguay / MERCOSUR"
    :/^\s*iso/i.test(n)?"ISO"
    :/^\s*brcgs/i.test(n)?"BRCGS"
    :/^\s*ps\s*9000/i.test(n)?"PQG (Reino Unido)"
    :/^\s*(who|oms)\b/i.test(n)?"OMS"
    :/^\s*health\s*canada/i.test(n)?"Health Canada"
    :/^\s*effci/i.test(n)?"EFfCI (Europa)"
    :/^\s*ich\s*q/i.test(n)?"ICH"
    :/mercosur|gmc/i.test(n)?"MERCOSUR":"—";
  const normas=partirNormas(fm.standard);
  /* Si se aplicó una check list, el informe dice cuál y cómo dio por área: es
     la evidencia de que la auditoría recorrió todos los requisitos. */
  const chkTpl=chkResp?chkDe(chkResp.checklistId):null;
  let chkHtml='';
  if(chkTpl){
    const rr=chkResp.respuestas||{};
    const resChk=resumenChk(chkTpl,chkResp);
    const filasArea=areasDe(chkTpl).map(area=>{
      const propios=chkTpl.items.filter(i=>i.a===area);
      const cont=(v)=>propios.filter(i=>(rr[i.n]||{}).r===v).length;
      return '<tr><td>'+area+'</td><td>'+propios.length+'</td><td>'+cont("C")+'</td><td>'+cont("NC")+'</td><td>'+cont("NA")+'</td></tr>';
    }).join('');
    chkHtml=`<h2>• CHECK LIST APLICADA</h2>
<table><tr><th>Check list</th><th>Versión</th><th>Requisitos</th><th>Conformes</th><th>No conformes</th><th>N.A.</th></tr>
<tr><td>${chkTpl.code} — ${chkTpl.nombre}</td><td>${chkTpl.version}</td><td>${resChk.total}</td><td>${resChk.c}</td><td>${resChk.nc}</td><td>${resChk.na}</td></tr></table>
<table><tr><th>Área evaluada</th><th>Requisitos</th><th>C</th><th>NC</th><th>N.A.</th></tr>${filasArea}</table>
${resChk.pend?'<p><i>Quedaron '+resChk.pend+' requisito(s) sin responder al momento de emitir el informe.</i></p>':''}`;
  }
  const normasRows=normas.length
    ? normas.map(n=>'<tr><td>'+organismoDe(n)+'</td><td>'+n+'</td></tr>').join('')
    : '<tr><td>—</td><td>Sin definir</td></tr>';
  const genImp=(fm.generalImpression||"Sin definir").replace(/\n/g,"<br>");
  const strengths=(fm.strengths||"Sin definir").replace(/\n/g,"<br>");
  const concl=(fm.conclusions||"Sin definir").replace(/\n/g,"<br>");
  const expect=(fm.expectations||"Se espera plan CAPA dentro de los 15 días hábiles.").replace(/\n/g,"<br>");
  const fechaFirma=fm.execDate||fm.date||"";
  const firmas=await firmasDelInforme(fm);
  const firmasHtml=(firmas.length?firmas:[{nombre:fm.auditor||"",cargo:"",imagen:"",sinFirma:true}])
    .map(f=>'<tr><td>'+(f.nombre||"")+'</td><td>'+(f.cargo||"")+'</td><td>'+(f.sinFirma?"":fechaFirma)+'</td><td style="height:52px">'+
      (f.imagen?'<img src="'+f.imagen+'" style="max-height:44px;max-width:180px;object-fit:contain">'+
        (f.posterior?'<div style="font-size:7pt;color:#777">Firma registrada después de esta auditoría</div>':'')
       :'<span style="font-size:8pt;color:#999;font-style:italic">Sin firma electrónica registrada</span>')+'</td></tr>').join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Informe de Auditoría — ${fm.code}</title>
<style>@page{size:A4;margin:20mm 18mm}body{font-family:Arial,sans-serif;font-size:11pt;color:#1a1a1a;line-height:1.5}

.header-right{text-align:right;font-size:9pt;color:#555}
.header-right .brand{font-size:14pt;font-weight:700;color:#C41E2A;letter-spacing:2px}
h2{font-size:13pt;font-weight:700;margin:18px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px}
h3{font-size:11pt;font-weight:700;margin:12px 0 6px}
table{width:100%;border-collapse:collapse;margin:8px 0 14px}
th,td{border:1px solid #999;padding:6px 10px;text-align:left;font-size:10pt}
th{background:#e8e8e8;font-weight:700}
.cls-critica{background:#fdd;color:#a00;font-weight:700}.cls-mayor{background:#ffe8cc;color:#955;font-weight:700}
.cls-menor{background:#ddf;color:#339;font-weight:700}.cls-obs{background:#f5f5f5;color:#555}
.footer{margin-top:30px;font-size:9pt;color:#888;text-align:center;border-top:1px solid #ccc;padding-top:8px}
.sign-table td{height:60px;vertical-align:top}
.no-print{background:#1E40AF;color:#fff;border:none;padding:10px 24px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;font-family:inherit;margin:10px}
@media print{.no-print{display:none}}</style></head><body>
<div style="text-align:center;margin-bottom:12px"><button class="no-print" onclick="window.print()">🖨 Imprimir / Guardar PDF</button></div>
<div class="header"><div class="header-left">REG</div><div class="header-right"><div class="brand">☰ VESSENA</div><div>Ref. documento: <b>REG-SOP-AC-035-C</b></div><div>${fm.code}</div></div></div>
<h1 style="font-size:16pt;text-align:center;margin:0 0 20px">Informe de Auditoría</h1>

<h2>• ALCANCE</h2>
<p>${scope}</p>
<table><tr><th>Organismo</th><th>Norma / Referencia</th></tr>${normasRows}</table>
<table><tr><th>Lugar(es)</th><th>Fecha(s)</th></tr><tr><td>${fm.location||fm.progSector||"—"}</td><td>${fm.execDate||fm.date||"—"}</td></tr></table>

<table><tr><th>Auditor Líder / Co-Auditora</th><th>Equipo auditor</th></tr><tr><td>${fm.auditor||"—"}</td><td>${fm.team||"—"}</td></tr></table>

<p>${meth}</p>
${chkHtml}

${clsTable}
</table>

  w.document.open();w.document.write(html);w.document.close();
}

/* ── PEGAR HALLAZGOS ──────────────────────────────────────────────────────────
   Un informe de auditoría trae veinte hallazgos; cargarlos de a uno en el
   formulario es media tarde. Acá se pegan del informe, una por línea, con la
   clasificación adelante separada por | o ;. Se muestra lo que entendió antes
   de crear nada. */
const CLASIF_TEXTO=[
  [/cr[ií]tic/i,"CRITICA"],[/mayor|grave/i,"GRAVE"],[/menor/i,"MENOR"],
  [/oportunidad|^\s*om\b/i,"OM"],[/observaci|^\s*obs\b/i,"OBS"],[/otra/i,"OTRA"]];
function clasificarTexto(t,cfg){
  const s=String(t||"").trim();
  for(const[re,id]of CLASIF_TEXTO)if(re.test(s)&&cfg.classifications.some(c=>c.id===id))return id;
  return null;
}
function leerHallazgosPegados(texto,cfg){
  return String(texto||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.*?)\s*[|;]\s*(.+)$/);
    const cls=m?clasificarTexto(m[1],cfg):null;
    return cls?{clasificacion:cls,descripcion:m[2].trim()}
               :{clasificacion:null,descripcion:l,error:"No se entiende la clasificación al principio de la línea"};
  });
}
function PegarHallazgos({fm,data,cfg,onClose}){
  const[texto,sTexto]=useState("");
  const filas=leerHallazgosPegados(texto,cfg);
  const buenas=filas.filter(f=>f.clasificacion);
  const crear=()=>{
    let n=(data.findings||[]).length;
    const nuevos=buenas.map(f=>{n++;return{id:gid(),code:`HAL-${String(n).padStart(4,"0")}`,year:fm.year||2026,
      auditId:fm.id,clauseRef:"",classification:f.clasificacion,description:f.descripcion,
      evidence:"",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",createdAt:new Date().toISOString()};});
    data.setFindings(p=>[...p,...nuevos]);
    alog(data.setLogs,"CREAR","Hallazgo",`${fm.code}: ${nuevos.length} hallazgos pegados del informe`,data.currentUser?.name);
    alert(`Se crearon ${nuevos.length} hallazgo(s): ${nuevos[0]?.code} a ${nuevos[nuevos.length-1]?.code}.\nRevisalos para completar evidencia y causa raíz.`);
    onClose();
  };
  return(<Md title={`Pegar hallazgos — ${fm.code}`} onClose={onClose} wide>
    <p style={{fontSize:12.5,color:K.txS,margin:"0 0 8px"}}>Una línea por hallazgo, con la clasificación adelante separada por <b>|</b>. Se entienden crítica, mayor o grave, menor, otra, observación y oportunidad de mejora.</p>
    <pre style={{fontSize:11.5,background:K.bg,border:`1px solid ${K.brd}`,borderRadius:6,padding:10,margin:"0 0 10px",whiteSpace:"pre-wrap"}}>Mayor | Aprobación de patrones: la orden cuenta con patrón pero sin firma ni fecha del responsable.
Observación | Revisión por la dirección: se realiza anualmente pero no hay procedimiento que la describa.</pre>
    <textarea style={{...sI,minHeight:180,resize:"vertical",fontFamily:"inherit"}} value={texto} onChange={e=>sTexto(e.target.value)} placeholder="Pegá acá los hallazgos del informe"/>
    {!!filas.length&&<div style={{marginTop:10,maxHeight:220,overflowY:"auto",border:`1px solid ${K.brd}`,borderRadius:6}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <tbody>{filas.map((f,i)=><tr key={i} style={{borderTop:i?`1px solid ${K.brdL}`:"none"}}>
          <td style={{padding:"6px 8px",width:110,verticalAlign:"top"}}>
            {f.clasificacion?<CBg cls={f.clasificacion} cfg={cfg}/>:<span style={{color:K.red,fontSize:11}}>revisar</span>}</td>
          <td style={{padding:"6px 8px",color:f.clasificacion?K.txt:K.red}}>{f.descripcion}</td>
        </tr>)}</tbody>
      </table>
    </div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14}}>
      <span style={{fontSize:12,color:filas.length-buenas.length?K.red:K.txS}}>
        {buenas.length} para crear{filas.length-buenas.length?` · ${filas.length-buenas.length} línea(s) sin clasificación, no se crean`:""}</span>
      <div style={{display:"flex",gap:8}}>
        <button style={sB("g")} onClick={onClose}>Cancelar</button>
        <button style={sB("pri")} disabled={!buenas.length} onClick={crear}>Crear {buenas.length} hallazgo(s)</button>
      </div>
    </div>
  </Md>);
}

/* ── CHECK LIST APLICADA A UNA AUDITORÍA ──────────────────────────────────────
   Se elige la plantilla, se marca cada requisito C / NC / N.A. con la evidencia
   y de un "no conforme" se crea el hallazgo con un botón, ya vinculado.
   La observación se guarda al salir del campo y no en cada tecla: cada guardado
   escribe la colección entera en el servidor. */
function PanelChecklist({fm,u,data,cfg,canEdit}){
  const resp=(data.chkRes||[]).find(r=>r.auditId===fm.id)||null;
  const tpl=resp?chkDe(resp.checklistId):null;
  const[filtro,sFiltro]=useState("todos");
  const[notas,sNotas]=useState({});
  const res=resumenChk(tpl,resp);
  const marcadas=partirNormas(fm.standard);
  const sugeridas=DEF_CHECKLISTS.filter(c=>c.normas.some(n=>marcadas.includes(n)));

  const aplicar=(t)=>{
    if(resp&&!confirm(`Esta auditoría ya tiene aplicada la ${resp.code}. ¿Cambiar a ${t.code}? Se pierden las respuestas marcadas.`))return;
    data.setChkRes(p=>[...p.filter(r=>r.auditId!==fm.id),
      {id:gid(),auditId:fm.id,checklistId:t.id,code:t.code,version:t.version,
       aplicadaEn:new Date().toISOString(),aplicadaPor:data.currentUser?.name||"",respuestas:{}}]);
    u("checklistApplied",`${t.code} v${t.version} (${t.items.length} requisitos en ${areasDe(t).length} áreas)`);
  };
  const cambiar=(n,campos)=>data.setChkRes(p=>p.map(r=>r.auditId===fm.id
    ?{...r,respuestas:{...r.respuestas,[n]:{...(r.respuestas[n]||{}),...campos}}}:r));
  const quitar=()=>{
    if(!confirm(`¿Quitar la ${resp.code} de esta auditoría? Se pierden las respuestas.`))return;
    data.setChkRes(p=>p.filter(r=>r.auditId!==fm.id));
  };
  const crearHallazgo=(it)=>{
    const r=resp.respuestas[it.n]||{};
    const code=`HAL-${String((data.findings||[]).length+1).padStart(4,"0")}`;
    const cls=cfg.classifications.find(c=>c.id==="MENOR")||cfg.classifications[0];
    data.setFindings(p=>[...p,{id:gid(),code,year:fm.year||2026,auditId:fm.id,
      clauseRef:it.r||it.a,classification:cls.id,
      description:`${resp.code} Nº ${it.n}: ${it.q}${r.nota?" — "+r.nota:""}`,
      evidence:r.nota||"",capaType:"Acción Correctiva",rootCause:"",status:"Abierto",
      createdAt:new Date().toISOString()}]);
    cambiar(it.n,{hallazgoId:code});
    alog(data.setLogs,"CREAR","Hallazgo",`${code} desde ${resp.code} Nº ${it.n}`,data.currentUser?.name);
  };

  if(!tpl)return(<div style={sC}>
    <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 4px",color:"#0891B2"}}>☑ Check list</h3>
    <p style={{fontSize:12.5,color:K.txS,margin:"0 0 12px"}}>Elegí la check list a aplicar en esta auditoría. Las primeras son las que corresponden a las normas marcadas en el plan.</p>
    {!marcadas.length&&<p style={{fontSize:12,color:K.wrn,margin:"0 0 10px"}}>No hay normas marcadas en el plan: se muestran todas.</p>}
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {[...sugeridas,...DEF_CHECKLISTS.filter(c=>!sugeridas.includes(c))].map(t=>
        <div key={t.id} style={{border:`1px solid ${sugeridas.includes(t)?K.pri:K.brd}`,borderRadius:8,padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>{t.code} v{t.version} — {t.nombre}</div>
            <div style={{fontSize:11.5,color:K.txS,marginTop:2}}>{t.items.length} requisitos en {areasDe(t).length} áreas</div>
            <div style={{fontSize:11,color:K.txM,marginTop:2}}>{t.normas.join(" · ")}</div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <button style={sB("sm")} onClick={()=>imprimirChecklist(fm,t,null)}>🖨 En blanco</button>
            {canEdit&&<button style={sB("pri")} onClick={()=>aplicar(t)}>Aplicar</button>}
          </div>
        </div>)}
    </div>
  </div>);

  const items=tpl.items.filter(i=>{
    const r=(resp.respuestas[i.n]||{}).r;
    if(filtro==="pend")return !r;
    if(filtro==="nc")return r==="NC";
    return true;
  });
  const BOT=[{v:"C",l:"C",t:"Conforme",col:K.grn,bg:K.grnL},{v:"NC",l:"NC",t:"No conforme",col:K.red,bg:K.redL},{v:"NA",l:"N.A.",t:"No aplica",col:K.txS,bg:K.bg}];
  return(<div>
    <div style={sC}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
        <div>
          <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 2px",color:"#0891B2"}}>☑ {tpl.code} v{tpl.version}</h3>
          <div style={{fontSize:12,color:K.txS}}>{tpl.nombre}</div>
          <div style={{fontSize:11,color:K.txM,marginTop:2}}>Aplicada {resp.aplicadaEn?.slice(0,10)}{resp.aplicadaPor?` por ${resp.aplicadaPor}`:""}</div>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button style={sB("sm")} onClick={()=>imprimirChecklist(fm,tpl,resp)}>🖨 Imprimir</button>
          {canEdit&&<button style={{...sB("sm"),color:K.red}} onClick={quitar}>Quitar</button>}
        </div>
      </div>
      <div style={{display:"flex",gap:14,marginTop:12,flexWrap:"wrap",fontSize:12.5}}>
        <span><b>{res.total}</b> requisitos</span>
        <span style={{color:K.grn}}>Conformes <b>{res.c}</b></span>
        <span style={{color:K.red}}>No conformes <b>{res.nc}</b></span>
        <span style={{color:K.txS}}>N.A. <b>{res.na}</b></span>
        <span style={{color:res.pend?K.wrn:K.txM}}>Sin responder <b>{res.pend}</b></span>
      </div>
      <div style={{height:6,background:K.brdL,borderRadius:4,marginTop:8,overflow:"hidden",display:"flex"}}>
        <div style={{width:`${res.c/res.total*100}%`,background:K.grn}}/>
        <div style={{width:`${res.nc/res.total*100}%`,background:K.red}}/>
        <div style={{width:`${res.na/res.total*100}%`,background:K.txM}}/>
      </div>
      <div style={{display:"flex",gap:6,marginTop:12}}>
        {[{k:"todos",l:`Todos (${res.total})`},{k:"pend",l:`Sin responder (${res.pend})`},{k:"nc",l:`No conformes (${res.nc})`}].map(f=>
          <button key={f.k} style={{...sB("sm"),...(filtro===f.k?{background:K.priL,color:K.pri,borderColor:K.pri}:{})}} onClick={()=>sFiltro(f.k)}>{f.l}</button>)}
      </div>
    </div>
    {areasDe(tpl).map(area=>{
      const propios=items.filter(i=>i.a===area);
      if(!propios.length)return null;
      return <div key={area} style={sC}>
        <h4 style={{fontSize:12.5,fontWeight:700,margin:"0 0 10px",color:K.txt}}>{area}</h4>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {propios.map(it=>{
            const r=resp.respuestas[it.n]||{};
            return <div key={it.n} style={{borderTop:`1px solid ${K.brdL}`,paddingTop:10}}>
              <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                <span style={{fontSize:11,fontWeight:700,color:K.txM,minWidth:22}}>{it.n}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12.5,lineHeight:1.4}}>{it.q}</div>
                  {it.r&&<div style={{fontSize:10.5,color:K.txM,marginTop:2}}>{it.r}</div>}
                </div>
                <div style={{display:"flex",gap:4,flexShrink:0}}>
                  {BOT.map(b=><button key={b.v} title={b.t} disabled={!canEdit}
                    onClick={()=>cambiar(it.n,{r:r.r===b.v?"":b.v})}
                    style={{...sB("sm"),minWidth:38,justifyContent:"center",
                      ...(r.r===b.v?{background:b.bg,color:b.col,borderColor:b.col,fontWeight:700}:{})}}>{b.l}</button>)}
                </div>
              </div>
              <div style={{display:"flex",gap:6,marginTop:6,marginLeft:32,alignItems:"center"}}>
                <input style={{...sI,fontSize:12,padding:"6px 9px"}} disabled={!canEdit}
                  placeholder={r.r==="NC"?"Evidencia de la no conformidad":"Observación / evidencia"}
                  value={notas[it.n]!==undefined?notas[it.n]:(r.nota||"")}
                  onChange={e=>sNotas(p=>({...p,[it.n]:e.target.value}))}
                  onBlur={()=>{if(notas[it.n]!==undefined&&notas[it.n]!==(r.nota||""))cambiar(it.n,{nota:notas[it.n]});}}/>
                {r.r==="NC"&&(r.hallazgoId
                  ?<span style={{fontSize:11.5,fontWeight:700,color:K.red,whiteSpace:"nowrap"}}>{r.hallazgoId}</span>
                  :canEdit&&<button style={{...sB("sm"),color:K.red,whiteSpace:"nowrap"}} onClick={()=>crearHallazgo(it)}>+ Hallazgo</button>)}
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>);
}

/* Impresión de la check list: con las respuestas marcadas, o en blanco para
   llevar en papel. Con respuestas salen además las firmas electrónicas del
   equipo auditor, igual que el informe. */
async function imprimirChecklist(fm,tpl,resp){
  const w=window.open("","_blank");
  if(!w){alert("El navegador bloqueó la ventana. Permití las ventanas emergentes para esta página.");return;}
  w.document.write('<p style="font-family:Arial;padding:20px">Preparando la check list…</p>');
  const firmas=resp?await firmasDelInforme(fm):[];
  const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const r=resp?.respuestas||{};
  const etiqueta={C:"Conforme",NC:"No conforme",NA:"N.A."};
  const filas=areasDe(tpl).map(area=>
    '<tr class="area"><td colspan="4">'+esc(area)+'</td></tr>'+
    tpl.items.filter(i=>i.a===area).map(i=>{
      const v=(r[i.n]||{});
      return '<tr><td class="num">'+i.n+'</td><td>'+esc(i.q)+(i.r?'<div class="ref">'+esc(i.r)+'</div>':'')+'</td>'+
        '<td class="res '+(v.r==="NC"?"nc":v.r==="C"?"ok":"")+'">'+(resp?(etiqueta[v.r]||"—"):'<span class="cajas">C &nbsp; NC &nbsp; N.A.</span>')+'</td>'+
        '<td>'+esc(v.nota||"")+(v.hallazgoId?'<div class="ref">'+esc(v.hallazgoId)+'</div>':"")+'</td></tr>';
    }).join('')).join('');
  const res=resumenChk(tpl,resp);
  const resumen=resp?`<table><tr><th>Requisitos</th><th>Conformes</th><th>No conformes</th><th>N.A.</th><th>Sin responder</th></tr>
    <tr><td>${res.total}</td><td>${res.c}</td><td>${res.nc}</td><td>${res.na}</td><td>${res.pend}</td></tr></table>`:"";

    firmas.map(f=>'<td>'+(f.imagen?'<img src="'+f.imagen+'" style="max-height:52px">':'')+'</td>').join('')+'</tr></table>'):"";
  w.document.open();
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(tpl.code)} — ${esc(fm.code)}</title>
<style>@page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;font-size:9.5pt;color:#222;margin:0}

td.num{width:26px;text-align:center;color:#555}td.res{width:78px;text-align:center}

function AuditDetail({audit,data,cfg,canEdit,onClose,onSave,onDelete}){
  const{findings,actions}=data;
  const[fm,sFm]=useState(audit||{});
  const ext=isExternal(fm);
  const phases=ext?EXT_PHASES:PHASES;
  const af=findings.filter(f=>f.auditId===audit?.id);
  const aa=actions.filter(a=>af.some(f=>f.id===a.findingId));
  const ph=phaseOf(fm.phase,ext);
  const ci=phases.findIndex(p=>p.id===fm.phase);
  const u=(k,v)=>sFm(p=>({...p,[k]:v}));
  const tabForPhase=(phId)=>{const extMap={ext_notificada:"xi",ext_recibida:"xr",ext_informe:"xp",ext_capa:"xc",ext_cerrada:"xx"};const intMap={planificada:"plan",plan_definido:"plan",en_ejecucion:"exec",informe:"report",cerrada:"close"};return extMap[phId]||intMap[phId]||null;};
  const initTab=tabForPhase(fm.phase)||(ext?"xi":"plan");
  const[tab,sTab]=useState(initTab);
  const[pegar,sPegar]=useState(false);
  const activeTab=tab||initTab;
  const nextP=()=>{if(ci<phases.length-1){const np=phases[ci+1].id;sFm(p=>({...p,phase:np}));sTab(tabForPhase(np));}};
  const prevP=()=>{if(ci>0){const np=phases[ci-1].id;sFm(p=>({...p,phase:np}));sTab(tabForPhase(np));}};
  const chgType=(t)=>{const nExt=t==="Externa";if(ext!==nExt){const newPhase=nExt?EXT_PHASES[0].id:PHASES[0].id;sFm(p=>({...p,type:t,phase:newPhase}));sTab(tabForPhase(newPhase));}else sFm(p=>({...p,type:t}));};
  const intTabs=[{k:"plan",l:"📅 Plan"},{k:"exec",l:"🔄 Ejecución"},{k:"chk",l:"☑ Check list"},{k:"report",l:"📊 Informe"},{k:"close",l:"✅ Cierre"}];
  const extTabs=[{k:"xi",l:"📩 Datos"},{k:"xr",l:"🏭 Recepción"},{k:"xp",l:"📨 Informe cliente"},{k:"xc",l:"📤 CAPA Vessena"},{k:"xx",l:"✅ Cierre"}];
  const curTabs=ext?extTabs:intTabs;

  return(<Md title={audit?.code?`${audit.code} — ${fm.name||"Auditoría"}`:"Nueva Auditoría"} onClose={onClose} wide>
    <FlowBar current={fm.phase||phases[0].id} phases={phases}/>
    <div style={{display:"flex",gap:8,marginBottom:12,justifyContent:"center"}}>
      {canEdit&&ci>0&&<button style={sB("g")} onClick={prevP}>← Anterior</button>}
      <span className="aud-phase" style={{color:ph.color,background:ph.bg,padding:"6px 16px",fontSize:13}}>{ph.icon} {ph.label}</span>
      {canEdit&&ci<phases.length-1&&<button style={sB("pri")} onClick={nextP}>Siguiente →</button>}

    {/* ═══ EXTERNA: CAPA Vessena ═══ */}

function Actions({data,cfg,canEdit}){const{actions,setActions,findings,setLogs,currentUser}=data;const[sh,sSh]=useState(false);const[ed,sEd]=useState(null);
  const bl={findingId:"",description:"",responsible:"",responsibleEmail:"",dueDate:"",status:cfg.statuses[0]||"Abierto",verification:"",effectiveness:"",followupResp:"",followupEmail:""};const[fm,sFm]=useState(bl);
  const save=()=>{if(ed){const pv=actions.find(a=>a.id===ed.id);setActions(p=>p.map(a=>a.id===ed.id?{...a,...fm}:a));if(pv.status!==fm.status)alog(setLogs,"CAMBIO ESTADO","Acción",`${ed.code}: ${pv.status} → ${fm.status}`,currentUser.name);else alog(setLogs,"EDITAR","Acción",ed.code,currentUser.name);}else{const allA=data.allActions||actions;const code=`ACC-${String(allA.length+1).padStart(4,"0")}`;const fin=findings.find(f=>f.id===fm.findingId);setActions(p=>[...p,{...fm,id:gid(),code,year:fin?.year||2026,createdAt:new Date().toISOString()}]);alog(setLogs,"CREAR","Acción",code,currentUser.name);}sSh(false);sEd(null);};
  const autoD=fId=>{const fn=findings.find(x=>x.id===fId);if(fn){const c=cfg.classifications.find(x=>x.id===fn.classification);if(c&&c.deadline>0)sFm(p=>({...p,dueDate:addMo(fn.createdAt||tdy(),c.deadline)}));}};
  const open=a=>{sFm(a||bl);sEd(a);sSh(true);};const lk=findings.find(x=>x.id===fm.findingId);const cls=lk?cfg.classifications.find(x=>x.id===lk.classification):null;
  const daysLeft=(d)=>{if(!d)return 999;return Math.ceil((new Date(d)-new Date())/86400000);};
  const urgLabel=(dl)=>{if(dl<0)return{txt:"⚠ VENCIDO",bg:K.redL,color:K.red};if(dl<=7)return{txt:"🔴 "+dl+"d",bg:"#FEF2F2",color:K.red};if(dl<=15)return{txt:"🟡 "+dl+"d",bg:K.wrnL,color:"#92400E"};return null;};
  const sendReminder=(a)=>{const fin=findings.find(f=>f.id===a.findingId);const to=a.responsibleEmail||"";const cc=a.followupEmail||"";const subj="Recordatorio: Plan de Acción "+a.code+" — Vessena S.A.";const body="Estimado/a "+a.responsible+",\n\nLe recordamos que el plan de acción "+a.code+" vinculado al hallazgo "+(fin?fin.code:"")+" tiene fecha límite el "+fd(a.dueDate)+".\n\nDescripción: "+a.description+"\n\nPor favor, actualice el estado de la acción y envíe la evidencia correspondiente.\n\nSaludos cordiales,\nEquipo de Aseguramiento de Calidad\nVessena S.A.";
    window.open("mailto:"+to+"?cc="+cc+"&subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body));};

  // Deadline alerts
  const upcoming=actions.filter(a=>a.status!=="Cerrado"&&daysLeft(a.dueDate)<=15).sort((a,b)=>daysLeft(a.dueDate)-daysLeft(b.dueDate));

  const[fiAud,sFiAud]=useState("Todos");
  const[fiSt,sFiSt]=useState("Todos");
  const auditNames=[...new Set(actions.map(a=>{const f=findings.find(x=>x.id===a.findingId);const aud=data.audits?.find(x=>x.id===f?.auditId);return aud?aud.name:"Sin auditoría";}).filter(Boolean))];
  let filtered=actions;
  if(fiAud!=="Todos")filtered=filtered.filter(a=>{const f=findings.find(x=>x.id===a.findingId);const aud=data.audits?.find(x=>x.id===f?.auditId);return aud?.name===fiAud;});
  if(fiSt!=="Todos")filtered=filtered.filter(a=>fiSt==="Vencido"?(daysLeft(a.dueDate)<0&&a.status!=="Cerrado"):a.status===fiSt);

  return(<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div><h1 style={{fontSize:20,fontWeight:800}}>Planes de Acción</h1><p style={{color:K.txS,margin:"4px 0 0",fontSize:12.5}}>{actions.length} acciones</p></div>{canEdit&&<button style={sB("pri")} onClick={()=>open(null)}>+ Nueva</button>}</div>{!canEdit&&<VBanner/>}

    <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
      <span style={{fontSize:11,fontWeight:700,color:K.txS,alignSelf:"center",marginRight:4}}>AUDITORÍA:</span>
      <button onClick={()=>sFiAud("Todos")} style={{...sB("g"),background:fiAud==="Todos"?K.priL:"transparent",color:fiAud==="Todos"?K.pri:K.txS,fontSize:11,padding:"4px 10px"}}>Todas ({actions.length})</button>
      {auditNames.map(n=>{const c=actions.filter(a=>{const f=findings.find(x=>x.id===a.findingId);const aud=data.audits?.find(x=>x.id===f?.auditId);return aud?.name===n;}).length;return <button key={n} onClick={()=>sFiAud(n)} style={{...sB("g"),background:fiAud===n?K.priL:"transparent",color:fiAud===n?K.pri:K.txS,fontSize:11,padding:"4px 10px"}}>{n.slice(0,25)} ({c})</button>;})}
    </div>
    <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      <span style={{fontSize:11,fontWeight:700,color:K.txS,alignSelf:"center",marginRight:4}}>ESTADO:</span>
      {["Todos",...cfg.statuses,"Vencido"].map(s=><button key={s} onClick={()=>sFiSt(s)} style={{...sB("g"),background:fiSt===s?(s==="Vencido"?K.redL:K.priL):"transparent",color:fiSt===s?(s==="Vencido"?K.red:K.pri):K.txS,fontSize:11,padding:"4px 10px"}}>{s==="Vencido"?"⚠ Vencido":s}</button>)}</div>

    {fiAud==="Todos"&&fiSt==="Todos"&&upcoming.length>0&&<div style={{...sC,background:"#FEF2F2",borderColor:K.red+"30",marginBottom:14}}>
      <h3 style={{fontSize:13,fontWeight:700,color:K.red,margin:"0 0 8px"}}>🔔 Alertas de vencimiento</h3>
      {upcoming.map(a=>{const dl=daysLeft(a.dueDate);const urg=urgLabel(dl);const fin=findings.find(f=>f.id===a.findingId);return <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#fff",borderRadius:8,marginBottom:6,border:`1px solid ${urg.color}20`}}>
        <Bg color={urg.color} bg={urg.bg}>{urg.txt}</Bg>
        <span style={{fontFamily:"monospace",fontWeight:700,color:K.pri,fontSize:12}}>{a.code}</span>
        <span style={{flex:1,fontSize:12.5,color:K.txt}}>{a.description.slice(0,60)}</span>
        <span style={{fontSize:11.5,color:K.txS}}>{a.responsible}</span>
        <span style={{fontSize:11.5,fontWeight:600}}>{fd(a.dueDate)}</span>
        {a.responsibleEmail&&<button style={{...sB("sm"),color:"#0891B2",fontSize:10}} onClick={()=>sendReminder(a)} title="Enviar recordatorio por email">✉ Recordar</button>}
      </div>;})}
    </div>}

    <div style={sC}>{filtered.length===0?<Em icon="📌" t="Sin acciones con este filtro"/>:<table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:12.5}}><thead><tr><th style={sTh}>Código</th><th style={sTh}>Hallazgo</th><th style={sTh}>Descripción</th><th style={sTh}>Responsable</th><th style={sTh}>Vence</th><th style={sTh}>Estado</th>{canEdit&&<th style={sTh}></th>}</tr></thead><tbody>{filtered.map(a=>{const dl=daysLeft(a.dueDate);const ov=dl<0&&a.status!=="Cerrado";const warn=dl>=0&&dl<=15&&a.status!=="Cerrado";const urg=a.status!=="Cerrado"?urgLabel(dl):null;return <tr key={a.id} style={{background:ov?K.redL:warn?"#FFFBEB":"transparent"}}><td style={{...sTd,fontWeight:700,color:K.pri,fontFamily:"monospace"}}>{a.code}</td><td style={{...sTd,fontFamily:"monospace",fontSize:11.5}}>{findings.find(f=>f.id===a.findingId)?.code||"—"}</td><td style={{...sTd,fontSize:11,lineHeight:1.4}}>{a.description}</td><td style={sTd}><div>{a.responsible}</div>{a.responsibleEmail&&<div style={{fontSize:10,color:K.txS}}>{a.responsibleEmail}</div>}</td><td style={{...sTd,whiteSpace:"nowrap"}}>{fd(a.dueDate)} {urg&&<Bg color={urg.color} bg={urg.bg}>{urg.txt}</Bg>}</td><td style={sTd}><SBg s={a.status}/></td>{canEdit&&<td style={sTd}><div style={{display:"flex",gap:4}}><button style={sB("sm")} onClick={()=>open(a)}>Editar</button>{a.responsibleEmail&&a.status!=="Cerrado"&&<button style={{...sB("sm"),color:"#0891B2",padding:"2px 6px"}} onClick={()=>sendReminder(a)} title="Enviar recordatorio">✉</button>}</div></td>}</tr>;})}</tbody></table>}</div>
    {sh&&<Md title={ed?"Editar "+ed.code:"Nueva Acción"} onClose={()=>sSh(false)}>
      <G2>
        <Fd l="Hallazgo"><select style={sS} value={fm.findingId} onChange={e=>{sFm(p=>({...p,findingId:e.target.value}));autoD(e.target.value);}}><option value="">—</option>{findings.map(x=><option key={x.id} value={x.id}>{x.code} — {x.description.slice(0,35)}</option>)}</select></Fd>
        <Fd l="Estado"><select style={sS} value={fm.status} onChange={e=>sFm(p=>({...p,status:e.target.value}))}>{cfg.statuses.map(s=><option key={s}>{s}</option>)}</select></Fd>
        <Fd l="Fecha límite"><input type="date" style={sI} value={fm.dueDate} onChange={e=>sFm(p=>({...p,dueDate:e.target.value}))}/></Fd>
      </G2>
      {cls&&cls.deadline>0&&<CtxHelp type="success">Plazo: <strong>{cls.deadline} meses</strong> ({cls.risk})</CtxHelp>}
      <Fd l="Descripción"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.description} onChange={e=>sFm(p=>({...p,description:e.target.value}))}/></Fd>
      <div style={{...sC,background:"#F0F9FF",borderColor:"#0891B220"}}>
        <h3 style={{fontSize:12,fontWeight:700,color:"#0891B2",margin:"0 0 8px"}}>👤 Responsable de la acción</h3>
        <G2>
          <Fd l="Nombre"><input style={sI} value={fm.responsible} onChange={e=>sFm(p=>({...p,responsible:e.target.value}))} placeholder="Nombre completo"/></Fd>
          <Fd l="Email"><input type="email" style={sI} value={fm.responsibleEmail||""} onChange={e=>sFm(p=>({...p,responsibleEmail:e.target.value}))} placeholder="email@empresa.com"/></Fd>
        </G2>
      </div>
      <div style={{...sC,background:"#F5F3FF",borderColor:"#7C3AED20"}}>
        <h3 style={{fontSize:12,fontWeight:700,color:"#7C3AED",margin:"0 0 8px"}}>🔍 Responsable de seguimiento / verificación</h3>
        <G2>
          <Fd l="Nombre"><input style={sI} value={fm.followupResp||""} onChange={e=>sFm(p=>({...p,followupResp:e.target.value}))} placeholder="Nombre completo"/></Fd>
          <Fd l="Email"><input type="email" style={sI} value={fm.followupEmail||""} onChange={e=>sFm(p=>({...p,followupEmail:e.target.value}))} placeholder="email@empresa.com"/></Fd>
        </G2>
      </div>
      <Fd l="Verificación implementación"><textarea style={{...sI,minHeight:40,resize:"vertical"}} value={fm.verification} onChange={e=>sFm(p=>({...p,verification:e.target.value}))}/></Fd>
      <Fd l="Verificación eficacia"><textarea style={{...sI,minHeight:40,resize:"vertical"}} value={fm.effectiveness} onChange={e=>sFm(p=>({...p,effectiveness:e.target.value}))}/></Fd>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><button style={sB("g")} onClick={()=>sSh(false)}>Cancelar</button><button style={sB("pri")} onClick={save} disabled={!fm.description}>Guardar</button></div>
    </Md>}</div>);
}

/* ── AUDIT TRAIL ── */
function Trail({logs}){const[q,sQ]=useState("");const ls=q?logs.filter(l=>Object.values(l).some(v=>String(v).toLowerCase().includes(q.toLowerCase()))):logs;
  return(<div><h1 style={{fontSize:20,fontWeight:800,margin:"0 0 12px"}}>Audit Trail</h1><input style={{...sI,maxWidth:320,marginBottom:12}} placeholder="Buscar..." value={q} onChange={e=>sQ(e.target.value)}/><div style={sC}>{ls.length===0?<Em icon="📜" t="Sin registros"/>:<table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><th style={sTh}>Fecha</th><th style={sTh}>Usuario</th><th style={sTh}>Acción</th><th style={sTh}>Entidad</th><th style={sTh}>Detalle</th></tr></thead><tbody>{ls.slice(0,200).map(l=><tr key={l.id}><td style={{...sTd,whiteSpace:"nowrap",fontFamily:"monospace",fontSize:11.5}}>{fdt(l.ts)}</td><td style={{...sTd,fontWeight:600}}>{l.user}</td><td style={sTd}><Bg color={l.action.includes("CREAR")?K.grn:l.action.includes("CAMBIO")?K.wrn:l.action.includes("CONFIG")||l.action.includes("USUARIO")?K.vio:l.action.includes("FASE")?PHASES[2].color:K.pri} bg={l.action.includes("CREAR")?K.grnL:l.action.includes("CAMBIO")?K.wrnL:l.action.includes("CONFIG")||l.action.includes("USUARIO")?K.vioL:l.action.includes("FASE")?PHASES[2].bg:K.priL}>{l.action}</Bg></td><td style={sTd}>{l.entity}</td><td style={{...sTd,fontSize:12,color:K.txS}}>{l.detail}</td></tr>)}</tbody></table>}</div></div>);
}

/* ── REPORTES ── */
function Reports({data,cfg}){const{audits,findings,actions}=data;
  const yr=data.year||2026;
  const resolved=["Cerrado","No aplica","Evaluada — No implementar"];
  const planificadas=audits.length;
  const ejecutadas=audits.filter(a=>{const i=phaseIdx(a.phase,isExternal(a));return i>=2;}).length;
  const conInforme=audits.filter(a=>{const i=phaseIdx(a.phase,isExternal(a));return i>=3;}).length;
  const cerradas=audits.filter(a=>a.phase==="cerrada"||a.phase==="ext_cerrada").length;
  const postergadas=audits.filter(a=>a.postponed).length;

  const actTotal=actions.length;
  const actCerradas=actions.filter(a=>resolved.includes(a.status)).length;
  const actVencidas=actions.filter(a=>!resolved.includes(a.status)&&a.dueDate&&a.dueDate<tdy()).length;
  const cumplimiento=actTotal?Math.round((actCerradas/actTotal)*100):0;

  const gravesVencidas=findings.filter(f=>{
    if(f.classification!=="CRITICA"&&f.classification!=="GRAVE")return false;
    if(resolved.includes(f.status))return false;
    const aa=actions.filter(a=>a.findingId===f.id&&!resolved.includes(a.status)&&a.dueDate);
    return aa.some(a=>{const dias=Math.ceil((new Date()-new Date(a.dueDate))/86400000);return dias>=30;});
  });
  const menoresVencidas=findings.filter(f=>{
    if(f.classification!=="MENOR")return false;
    if(resolved.includes(f.status))return false;
    const aa=actions.filter(a=>a.findingId===f.id&&!resolved.includes(a.status)&&a.dueDate);
    return aa.some(a=>{const dias=Math.ceil((new Date()-new Date(a.dueDate))/86400000);return dias>=30;});
  });

  const auditIds=[...new Set(actions.map(a=>{const f=findings.find(x=>x.id===a.findingId);return f?.auditId;}).filter(Boolean))];
  const perAudit=auditIds.map(aid=>{const aud=audits.find(a=>a.id===aid);const aa=actions.filter(a=>{const f=findings.find(x=>x.id===a.findingId);return f?.auditId===aid;});const cerr=aa.filter(a=>resolved.includes(a.status)).length;const venc=aa.filter(a=>!resolved.includes(a.status)&&a.dueDate&&a.dueDate<tdy()).length;return{name:aud?.name||"—",code:aud?.code||"—",total:aa.length,cerradas:cerr,vencidas:venc,pct:aa.length?Math.round(cerr/aa.length*100):0};});

  const dlPdf=()=>{
    var res=["Cerrado","No aplica","Evaluada \u2014 No implementar"];
    var pctColor=cumplimiento>=80?"#16A34A":cumplimiento>=50?"#D97706":"#DC2626";
    var barHtml=perAudit.map(function(a){var bc=a.pct>=80?"#16A34A":a.pct>=50?"#D97706":"#DC2626";return "<div style=\"margin:10px 0\"><strong>"+a.code+" \u2014 "+a.name+"</strong> <span style=\"color:"+bc+";font-weight:700\">"+a.cerradas+"/"+a.total+" ("+a.pct+"%)"+(a.vencidas?" \u2014 \u26a0 "+a.vencidas+" vencida(s)":"")+"</span><div style=\"height:12px;background:#E2E8F0;border-radius:6px;margin:3px 0 10px\"><div style=\"height:12px;border-radius:6px;width:"+Math.max(a.pct,1)+"%;background:"+bc+"\"></div></div></div>";}).join("");
    var ncHtml="";
    if(gravesVencidas.length>0){ncHtml+="<h2 style=\"color:#DC2626\">NC Cr\u00edticas / Mayores \u2014 Vencidas m\u00e1s de 30 d\u00edas</h2><table><tr><th>C\u00f3digo</th><th>Auditor\u00eda</th><th>Descripci\u00f3n</th><th>Estado</th></tr>";gravesVencidas.forEach(function(f){var aud=audits.find(function(a){return a.id===f.auditId});ncHtml+="<tr style=\"background:#FEF2F2\"><td><b>"+f.code+"</b></td><td>"+(aud?aud.name:"\u2014")+"</td><td>"+f.description+"</td><td>"+f.status+"</td></tr>";});ncHtml+="</table>";}
    if(menoresVencidas.length>0){ncHtml+="<h2 style=\"color:#D97706\">NC Menores \u2014 Vencidas m\u00e1s de 30 d\u00edas</h2><table><tr><th>C\u00f3digo</th><th>Auditor\u00eda</th><th>Descripci\u00f3n</th><th>Estado</th></tr>";menoresVencidas.forEach(function(f){var aud=audits.find(function(a){return a.id===f.auditId});ncHtml+="<tr><td><b>"+f.code+"</b></td><td>"+(aud?aud.name:"\u2014")+"</td><td>"+f.description+"</td><td>"+f.status+"</td></tr>";});ncHtml+="</table>";}
    var html="<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Reporte Comit\u00e9 Gerencial</title><style>@page{size:A4 landscape;margin:15mm}body{font-family:Arial,sans-serif;font-size:11pt;color:#1a1a1a}h1{font-size:18pt;color:#1E40AF;border-bottom:3px solid #1E40AF;padding-bottom:6px}h2{font-size:14pt;color:#1E40AF;margin-top:24px}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #ccc;padding:6px 10px;font-size:10pt}th{background:#EEF2FF;font-weight:700;color:#1E40AF}.kpi{display:inline-block;text-align:center;padding:14px 24px;border-radius:8px;margin:6px}.kv{font-size:28pt;font-weight:800}.kl{font-size:9pt;color:#64748B;text-transform:uppercase}.np{margin:10px;text-align:center}@media print{.np{display:none}}</style></head><body>";
    html+="<div class=\"np\"><button onclick=\"window.print()\" style=\"background:#1E40AF;color:#fff;border:none;padding:10px 24px;font-size:14px;font-weight:600;border-radius:6px;cursor:pointer\">Imprimir / Guardar PDF</button></div>";
    html+="<h1>VESSENA S.A. \u2014 Reporte para Comit\u00e9 Gerencial ("+yr+")</h1>";
    html+="<p style=\"color:#64748B\">Generado: "+fdt(new Date().toISOString())+"</p>";
    html+="<h2>Programa de Auditor\u00edas</h2>";
    html+="<div><span class=\"kpi\" style=\"background:#EEF2FF\"><span class=\"kl\">Planificadas</span><br><span class=\"kv\" style=\"color:#1E40AF\">"+planificadas+"</span></span>";
    html+="<span class=\"kpi\" style=\"background:#FFFBEB\"><span class=\"kl\">Ejecutadas</span><br><span class=\"kv\" style=\"color:#D97706\">"+ejecutadas+"</span></span>";
    html+="<span class=\"kpi\" style=\"background:#EFF6FF\"><span class=\"kl\">Con informe</span><br><span class=\"kv\" style=\"color:#2563EB\">"+conInforme+"</span></span>";
    html+="<span class=\"kpi\" style=\"background:#F0FDF4\"><span class=\"kl\">Cerradas</span><br><span class=\"kv\" style=\"color:#16A34A\">"+cerradas+"</span></span></div>";
    html+="<h2>Cumplimiento Planes de Acci\u00f3n</h2>";
    html+="<div><span class=\"kpi\" style=\"background:"+(cumplimiento>=80?"#F0FDF4":cumplimiento>=50?"#FFFBEB":"#FEF2F2")+"\"><span class=\"kl\">Cumplimiento</span><br><span class=\"kv\" style=\"color:"+pctColor+"\">"+cumplimiento+"%</span></span>";
    html+="<span class=\"kpi\" style=\"background:#F0FDF4\"><span class=\"kl\">Cerradas</span><br><span class=\"kv\" style=\"color:#16A34A\">"+actCerradas+"/"+actTotal+"</span></span>";
    html+="<span class=\"kpi\" style=\"background:"+(actVencidas>0?"#FEF2F2":"#F0FDF4")+"\"><span class=\"kl\">Vencidas</span><br><span class=\"kv\" style=\"color:"+(actVencidas>0?"#DC2626":"#16A34A")+"\">"+actVencidas+"</span></span></div>";
    html+=barHtml+ncHtml;
    html+="<div style=\"margin-top:30px;font-size:9pt;color:#999;text-align:center;border-top:1px solid #eee;padding-top:8px\">Vessena S.A. \u2014 Sistema de Gesti\u00f3n de Auditor\u00edas</div></body></html>";
    var w=window.open("","_blank");w.document.write(html);w.document.close();
  };

  return(<div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h1 style={{fontSize:20,fontWeight:800}}>Reportes — Comité Gerencial</h1>
      <button style={sB("pri")} onClick={dlPdf}>📄 Descargar PDF</button>
    </div>

    <div style={sC}><h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>📅 Programa de Auditorías</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
        <div style={{padding:"12px 16px",background:K.priL,borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Planificadas</div><div style={{fontSize:28,fontWeight:800,color:K.pri}}>{planificadas}</div></div>
        <div style={{padding:"12px 16px",background:"#FFFBEB",borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Ejecutadas</div><div style={{fontSize:28,fontWeight:800,color:"#D97706"}}>{ejecutadas}</div></div>
        <div style={{padding:"12px 16px",background:"#EFF6FF",borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Con informe</div><div style={{fontSize:28,fontWeight:800,color:"#2563EB"}}>{conInforme}</div></div>
        <div style={{padding:"12px 16px",background:K.grnL,borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Cerradas</div><div style={{fontSize:28,fontWeight:800,color:K.grn}}>{cerradas}</div></div>
      </div>
    </div>

    <div style={sC}><h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>📌 Cumplimiento Planes de Acción</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
        <div style={{padding:"12px 16px",background:cumplimiento>=80?K.grnL:cumplimiento>=50?"#FFFBEB":K.redL,borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Cumplimiento</div><div style={{fontSize:28,fontWeight:800,color:cumplimiento>=80?K.grn:cumplimiento>=50?"#D97706":K.red}}>{cumplimiento}%</div></div>
        <div style={{padding:"12px 16px",background:K.grnL,borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>Cerradas</div><div style={{fontSize:28,fontWeight:800,color:K.grn}}>{actCerradas}<span style={{fontSize:14,color:K.txS}}>/{actTotal}</span></div></div>
        <div style={{padding:"12px 16px",background:"#FFFBEB",borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>En proceso</div><div style={{fontSize:28,fontWeight:800,color:"#D97706"}}>{actions.filter(a=>a.status==="En proceso").length}</div></div>
        <div style={{padding:"12px 16px",background:actVencidas>0?K.redL:K.grnL,borderRadius:8}}><div style={{fontSize:10,fontWeight:700,color:K.txS,textTransform:"uppercase"}}>⚠ Vencidas</div><div style={{fontSize:28,fontWeight:800,color:actVencidas>0?K.red:K.grn}}>{actVencidas}</div></div>
      </div>
      {perAudit.map(a=><div key={a.code} style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:13,fontWeight:600}}>{a.code} — {a.name}</span>
          <span style={{fontSize:13,fontWeight:700,color:a.pct>=80?K.grn:a.pct>=50?"#D97706":K.red}}>{a.cerradas}/{a.total} ({a.pct}%){a.vencidas>0?" — ⚠ "+a.vencidas+" vencida(s)":""}</span>
        </div>
        <div style={{height:8,background:"#F1F5F9",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:a.pct+"%",background:a.pct>=80?K.grn:a.pct>=50?"#D97706":K.red,borderRadius:4,transition:"width .3s"}}/>
        </div>
      </div>)}
    </div>

    {gravesVencidas.length>0&&<div style={{...sC,background:K.redL,borderColor:K.red+"30"}}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px",color:K.red}}>🔴 NC Críticas / Mayores — Vencidas más de 30 días</h3>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,background:"#fff",borderRadius:8}}>
        <thead><tr><th style={sTh}>Código</th><th style={sTh}>Auditoría</th><th style={sTh}>Descripción</th><th style={sTh}>Clasif.</th><th style={sTh}>Estado</th></tr></thead>
        <tbody>{gravesVencidas.map(f=>{const aud=audits.find(a=>a.id===f.auditId);const cl=cfg.classifications.find(x=>x.id===f.classification);return <tr key={f.id}><td style={{...sTd,fontFamily:"monospace",fontWeight:700,color:K.red,whiteSpace:"nowrap"}}>{f.code}</td><td style={{...sTd,fontSize:11,whiteSpace:"nowrap"}}>{aud?.name||"—"}</td><td style={{...sTd,lineHeight:1.4}}>{f.description}</td><td style={sTd}><Bg color={cl?.color||K.red} bg={cl?.color+"15"||K.redL}>{cl?.label||"—"}</Bg></td><td style={sTd}><SBg s={f.status}/></td></tr>;})}</tbody>
