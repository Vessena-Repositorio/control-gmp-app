.ish-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ish-cell{border:1px solid #E1E4EA;border-radius:8px;padding:12px;background:#FAFBFC}.ish-cell h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;display:flex;align-items:center;gap:6px}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;

/* ═══════════════════════════════════════════════
   CONSTANTS & UTILITIES
   ═══════════════════════════════════════════════ */
const NC_PHASES=[
  {id:"abierta",label:"Apertura",color:"#DC2626",bg:"#FEF2F2",icon:"🔴",desc:"NC detectada y registrada"},
  {id:"analisis",label:"Análisis 5M",color:"#D97706",bg:"#FFFBEB",icon:"🔍",desc:"Investigación causa raíz en curso"},
  {id:"clasificada",label:"Clasificación",color:"#6366F1",bg:"#EEF2FF",icon:"⚖️",desc:"Criticidad determinada"},
  {id:"capa",label:"Conclusiones",color:"#0891B2",bg:"#ECFEFF",icon:"📋",desc:"Conclusiones y tipo de acción"},
  {id:"implementacion",label:"CAPA",color:"#2563EB",bg:"#EFF6FF",icon:"🔧",desc:"Acciones correctivas/preventivas"},
  {id:"verificacion",label:"Verificación",color:"#7C3AED",bg:"#F5F3FF",icon:"✔️",desc:"Evaluación de eficacia"},
  {id:"cerrada",label:"Cierre",color:"#16A34A",bg:"#F0FDF4",icon:"✅",desc:"Eficacia confirmada — NC cerrada"},
];
const DEV_PHASES=[
  {id:"abierto",label:"Datos",color:"#DC2626",bg:"#FEF2F2",icon:"📝",desc:"Desvío registrado"},
  {id:"evaluacion",label:"Impacto",color:"#D97706",bg:"#FFFBEB",icon:"📊",desc:"Análisis de impacto"},
  {id:"decision",label:"Riesgo / Decisión",color:"#6366F1",bg:"#EEF2FF",icon:"⚖️",desc:"Clasificación y decisión"},
  {id:"implementacion",label:"Implementación",color:"#0891B2",bg:"#ECFEFF",icon:"🔧",desc:"Acciones del desvío en curso"},
  {id:"cerrado",label:"Cierre",color:"#16A34A",bg:"#F0FDF4",icon:"✅",desc:"Desvío cerrado y verificado"},
];
const CLASSIFICATIONS=[
  {id:"CRITICA",label:"Crítica",color:"#DC2626",desc:"Riesgo inmediato/latente para la salud. Acción correctiva e investigación inmediata.",deadline:0,deadlineLabel:"Inmediato"},
  {id:"MAYOR",label:"Mayor",color:"#B45309",desc:"Puede comprometer actividad comercial. Impacto a clientes poco probable.",deadline:3,deadlineLabel:"3 meses"},
  {id:"MENOR",label:"Menor",color:"#1E40AF",desc:"Sin impacto en atributos de calidad. No pone en riesgo actividad comercial.",deadline:6,deadlineLabel:"6 meses"},
];
const SEVERITIES=["Baja","Moderada","Alta"];
const PROBABILITIES=["Baja","Moderada","Alta"];
/* Matriz de criticidad, indexada como "Severidad-Probabilidad".
   ─────────────────────────────────────────────────────────────────────────────
   ATENCIÓN: esta tabla es la ÚNICA fuente. Las matrices que se ven en la etapa
   de Clasificación y en la Guía se dibujan a partir de ella (ver <RiskMatrix/>),
   no están escritas aparte. Antes sí lo estaban y discrepaban en dos celdas:
   el sistema clasificaba distinto de lo que le mostraba a quien clasificaba.

   Dos celdas siguen pendientes de confirmar contra el SOP-AC-036 §5.4 —las
   marcadas abajo—: se dejaron como estaban en el código hasta poder cotejarlas
   con el procedimiento. */
const RISK_MATRIX={
  "Alta-Alta":"CRITICA","Alta-Moderada":"MAYOR","Alta-Baja":"MENOR",      // Alta-Baja: ¿MENOR o MAYOR?
  "Moderada-Alta":"MAYOR","Moderada-Moderada":"MAYOR","Moderada-Baja":"MENOR", // Moderada-Alta: ¿MAYOR o CRITICA?
  "Baja-Alta":"CRITICA","Baja-Moderada":"MENOR","Baja-Baja":"MENOR",
};
const DETECTION_SOURCES=["Auditorías","Control Interno","Reclamo clientes","Validaciones y calificaciones","Desvíos de procesos","Revisión por la dirección","Evaluación de tendencias","Evaluación de proveedores","Otros"];
const ISHIKAWA_CATS=[
  {id:"metodo",label:"Método",icon:"📄",questions:["¿Existe procedimiento?","¿El procedimiento detalla claramente la tarea?","¿El procedimiento contempla todas las etapas?","¿Los procedimientos vinculados se mantuvieron?","¿Existen formularios de apoyo?"]},
  {id:"mano_obra",label:"Mano de Obra",icon:"👤",questions:["¿El personal está capacitado?","¿Puede cumplir la tarea sin dificultad?","¿La cantidad de personas es adecuada?","¿Procedió como habitualmente?","¿Se mantuvo el personal durante la tarea?"]},
  {id:"materiales",label:"Materiales",icon:"📦",questions:["¿Los materiales fueron los adecuados?","¿Estaban aprobados por CC?","¿Cumplían especificación?","¿El proveedor es el habitual?","¿El material es adecuado para la tarea?"]},
  {id:"maquinas",label:"Máquinas",icon:"⚙️",questions:["¿Los equipos fueron los adecuados?","¿Se encuentran calibrados?","¿Se les realiza mantenimiento preventivo?","¿Fue manipulado por personal entrenado?"]},
  {id:"medio_ambiente",label:"Medio Ambiente",icon:"🏭",questions:["¿La tarea se realizó en el lugar indicado?","¿El área se encuentra calificada?","¿La limpieza fue correcta?","¿Las condiciones ambientales fueron adecuadas?","¿El lugar es adecuado para la tarea?"]},
];
const IMPACT_AREAS=["Producto(s)","Suspensión equipo/sistema","Nivel de riesgo","Aspectos regulatorios","Dirección Técnica","Aseguramiento de Calidad","Control de Calidad","Producción","I+D","Ingeniería y Mantenimiento","TI","Compras","Depósito y distribución","Marketing y Ventas","Documentos","Personal","Estado calificación/validación","21CFR11","Otros aspectos GMP","Necesidades de capacitación"];
const SECTORS=["Seguimiento Depósito y Distribución","Seguimiento LCC","Gestión Productiva (Fabricación)","Seguimiento Gestión Productiva (Envasado)","Gestión Productiva (Plásticos)","Gestión de Higiene y Sanitización","Seguimiento Depósito de Materias Primas","Depósito PT","Hipoclorito","Control de Calidad","Aseguramiento de Calidad","Dirección Técnica","Compras","Servicios/Agua/Tanques"];
const CAPA_TYPES=["Acción Correctiva","Acción Preventiva","Corrección"];
const STATUSES=["Abierto","En proceso","Cerrado","Vencido"];
const NAV=[
  {k:"nc",l:"No Conformidades",i:"⚠️"},
  {k:"dev",l:"Desvíos",i:"↩️"},
  {k:"capa",l:"CAPA / Acciones",i:"📋"},
  {k:"trail",l:"Audit Trail",i:"📜"},
  {k:"rep",l:"Reportes",i:"📈"},
  {k:"guide",l:"Guía de Uso",i:"❓"},
];

const K={bg:"#F5F6F8",srf:"#FFF",brd:"#E1E4EA",brdL:"#EEF0F3",txt:"#1B1E25",txS:"#5A6170",txM:"#8B92A0",pri:"#1E40AF",priL:"#EFF6FF",red:"#DC2626",redL:"#FEF2F2",grn:"#16A34A",grnL:"#F0FDF4",wrn:"#D97706",wrnL:"#FFFBEB",vio:"#6D28D9",vioL:"#F5F3FF",ves:"#C41E2A"};
const sB=(v="pri")=>{const b={padding:"7px 15px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12.5,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5,transition:"all .15s",fontFamily:"inherit"};if(v==="pri")return{...b,background:K.pri,color:"#fff"};if(v==="red")return{...b,background:K.red,color:"#fff"};if(v==="grn")return{...b,background:K.grn,color:"#fff"};if(v==="g")return{...b,background:"transparent",color:K.txS,border:`1px solid ${K.brd}`};if(v==="sm")return{...b,padding:"4px 10px",fontSize:11.5,background:"transparent",color:K.txS,border:`1px solid ${K.brd}`};return b;};
const sI={width:"100%",padding:"8px 11px",border:`1px solid ${K.brd}`,borderRadius:6,fontSize:13,fontFamily:"inherit",color:K.txt,background:K.srf,boxSizing:"border-box",outline:"none"};
const sS={...sI,cursor:"pointer"};const sL={fontSize:11,fontWeight:700,color:K.txS,marginBottom:3,display:"block",textTransform:"uppercase",letterSpacing:".04em"};
const sC={background:K.srf,border:`1px solid ${K.brd}`,borderRadius:9,padding:18,marginBottom:14};
const sTh={textAlign:"left",padding:"9px 10px",borderBottom:`2px solid ${K.brd}`,color:K.txS,fontWeight:700,fontSize:10.5,textTransform:"uppercase",letterSpacing:".05em"};
const sTd={padding:"10px",borderBottom:`1px solid ${K.brdL}`,verticalAlign:"top",fontSize:13};

const fd=d=>d?new Date(d+(String(d).length===10?"T00:00:00":"")).toLocaleDateString("es-UY",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fdt=d=>d?new Date(d).toLocaleString("es-UY",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const tdy=()=>new Date().toISOString().split("T")[0];
const addMo=(d,m)=>{const dt=new Date(d);dt.setMonth(dt.getMonth()+m);return dt.toISOString().split("T")[0];};
const daysLeft=(d)=>{if(!d)return 999;return Math.ceil((new Date(d+"T00:00:00")-new Date())/86400000);};

/* Una fecha 'YYYY-MM-DD' como hora local. `new Date("2026-01-20")` se interpreta
   como medianoche UTC, que en Montevideo son las 21:00 del 19: al agrupar por mes
   o por año, todo lo del día 1 caía en el mes anterior. */
const fecha0=d=>d?new Date(String(d).slice(0,10)+"T00:00:00"):null;

/* Concordancia de número. Los avisos de cierre nombran cuántas acciones faltan,
   y "quedan 1 acciones" en un mensaje de bloqueo se lee como un error del
   sistema, no como una regla. La N del plural se reemplaza por el número. */
const plural=(n,uno,varios)=>n===1?uno:varios.replace("N",n);

/* Escapa texto que se inserta en el HTML de los informes imprimibles. Sin esto,
   una descripción con "<" o "&" —habitual al citar una especificación, por
   ejemplo "<10000 ufc/100ml"— rompe el documento generado. */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ═══ API ═══════════════════════════════════════════════════════════════════
   Los datos viven en Postgres, no en el navegador: entramos desde varias
   máquinas y todos tenemos que ver lo mismo. El audit trail también, que
   guardado junto a los datos que audita no probaba nada.

   Toda respuesta que no sea ok levanta una excepción con el mensaje del
   servidor, para que quien llama no tenga que revisar `ok` en cada lugar y un
   fallo no pase por guardado. */
const API="/api/nc-desvios";
async function api(ruta,opciones={}){
  const r=await fetch(API+ruta,{
    credentials:"same-origin",
    headers:opciones.body?{"Content-Type":"application/json"}:undefined,
    ...opciones,
  });
  if(r.status===401){
    // La sesión venció mientras la pestaña estaba abierta.
    location.href="/?volver="+encodeURIComponent(location.pathname);
    throw new Error("sesión vencida");
  }
  let d=null;
  try{d=await r.json();}catch{}
  if(!r.ok||!d||d.ok===false)throw new Error((d&&d.error)||`error ${r.status}`);
  return d;
}

/* ═══ ROLES ═════════════════════════════════════════════════════════════════
   El padrón del portal usa administrador / revisor / operador / vista. La app
   solo necesita saber dos cosas: si puede editar y si puede administrar. Se
   traduce acá y no al revés, porque el vocabulario del padrón es el que vale
   para todo el sistema.

   `canAdmin` gobierna borrar. El servidor exige el mismo permiso, así que
   esconder el botón es comodidad, no la protección: borrar un registro GMP no
   está al alcance de quien carga datos en el turno. */
const ROLES={
  administrador:{label:"Administrador",color:"#DC2626",bg:"#FEF2F2",icon:"🔑",canEdit:true,canAdmin:true},
  revisor:{label:"Revisor",color:"#6D28D9",bg:"#F5F3FF",icon:"🔍",canEdit:true,canAdmin:false},
  operador:{label:"Operador",color:"#1E40AF",bg:"#EFF6FF",icon:"👤",canEdit:true,canAdmin:false},
  vista:{label:"Visualización",color:"#059669",bg:"#F0FDF4",icon:"👁",canEdit:false,canAdmin:false},
};

/* ═══ SHARED COMPONENTS ═══ */
function Bg({children,color,bg}){return <span style={{display:"inline-block",padding:"2px 9px",borderRadius:16,fontSize:11,fontWeight:600,color,background:bg,whiteSpace:"nowrap"}}>{children}</span>;}
function ClsBg({cls}){const c=CLASSIFICATIONS.find(x=>x.id===cls);return c?<Bg color={c.color} bg={c.color+"15"}>{c.label}</Bg>:<Bg color={K.txM} bg="#F1F5F9">Sin clasificar</Bg>;}
function SBg({s}){const m={Abierto:[K.red,K.redL],"En proceso":[K.wrn,K.wrnL],Cerrado:[K.grn,K.grnL],Vencido:["#991B1B","#FEE2E2"]};const[c,b]=m[s]||[K.txM,"#F1F5F9"];return <Bg color={c} bg={b}>{s}</Bg>;}

/* "Vencido" es un hecho de la fecha, no un estado que alguien tenga que tildar.
   La lista lo mostraba solo si alguien se acordaba de cambiarlo a mano, así que
   una acción pasada de fecha seguía figurando como "Abierto". Se deriva. */
const estadoVisible=c=>(c.status!=="Cerrado"&&daysLeft(c.dueDate)<0?"Vencido":c.status);
function PhaseBg({phase,phases}){const p=(phases||NC_PHASES).find(x=>x.id===phase)||(phases||NC_PHASES)[0];return <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:6,fontSize:11,fontWeight:600,color:p.color,background:p.bg}}>{p.icon} {p.label}</span>;}
function Fd({l,children}){return <div style={{marginBottom:12}}><label style={sL}>{l}</label>{children}</div>;}
function Em({icon,t}){return <div style={{textAlign:"center",padding:"36px 20px",color:K.txM}}><div style={{fontSize:28,marginBottom:6}}>{icon}</div><div style={{fontSize:13}}>{t}</div></div>;}
function Md({title,onClose,children,wide}){return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:100,display:"flex",justifyContent:"center",alignItems:"flex-start",paddingTop:30,overflowY:"auto"}} onClick={onClose}><div style={{background:"#fff",borderRadius:12,width:"100%",maxWidth:wide?960:640,padding:24,boxShadow:"0 20px 60px rgba(0,0,0,.15)",margin:"0 16px 40px"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontSize:16,fontWeight:800,margin:0}}>{title}</h2><button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:K.txM}}>✕</button></div>{children}</div></div>);}
function G2({children}){return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{children}</div>;}
function CtxHelp({children,type="info"}){return <div className={`ctx-help ${type==="warn"?"warn":type==="success"?"success":""}`}><span className="ctx-icon">{type==="warn"?"⚠️":type==="success"?"✅":"💡"}</span><div>{children}</div></div>;}
function VBanner(){return <CtxHelp type="warn"><strong>Modo visualización.</strong> Solo lectura.</CtxHelp>;}

/* Dibuja la matriz de criticidad leyendo RISK_MATRIX. Al derivarla del mismo
   objeto que hace el cálculo, lo que se muestra y lo que se aplica no pueden
   separarse. `marcar` resalta la celda que corresponde a la selección actual. */
function RiskMatrix({sev,prob}){
  const clase={CRITICA:"r-crit",MAYOR:"r-may",MENOR:"r-men"};
  const etiqueta=id=>CLASSIFICATIONS.find(c=>c.id===id)?.label||"—";
  return(<table className="risk-matrix" style={{width:"100%"}}>
    <thead><tr><th style={{fontSize:9.5,fontWeight:700}}>Sev. \ Prob.</th>{PROBABILITIES.map(p=><th key={p}>{p}</th>)}</tr></thead>
    <tbody>
      {[...SEVERITIES].reverse().map(s=><tr key={s}>
        <th>{s}</th>
        {PROBABILITIES.map(p=>{
          const id=RISK_MATRIX[`${s}-${p}`];
          const activa=sev===s&&prob===p;
          return <td key={p} className={clase[id]||""}
            style={activa?{outline:`2px solid ${K.txt}`,outlineOffset:-2,fontWeight:800}:undefined}>
            {etiqueta(id)}
          </td>;
        })}
      </tr>)}
    </tbody>
  </table>);
}

/* ═══ EXPORT FUNCTIONS ═══ */
/* Escapa las cadenas de un registro dejando el resto intacto. Los informes se
   arman con plantillas de texto, así que el escapado se hace acá, en la entrada,
   y no en cada una de las cuarenta interpolaciones: una que se olvide es una
   descripción que rompe el documento sin aviso. */
const escReg=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[k,typeof v==="string"?esc(v):v]));

function exportNC(ncCrudo,capasCrudas){
  const nc=escReg(ncCrudo);
  const capas=(capasCrudas||[]).map(escReg);
  const cls=CLASSIFICATIONS.find(c=>c.id===nc.classification);
  const phase=NC_PHASES.find(p=>p.id===nc.phase);
  const ncCapas=capas.filter(c=>c.ncId===nc.id);
  const ish=nc.ishikawa||{};
  const ishHTML=ISHIKAWA_CATS.map(cat=>{
    const qs=cat.questions.map((q,i)=>`<tr><td style="padding:4px 8px;border:1px solid #ddd;font-size:11px">${q}</td><td style="padding:4px 8px;border:1px solid #ddd;text-align:center;font-size:11px;font-weight:600">${(ish[cat.id]||{})[i]||"—"}</td></tr>`).join("");
    return `<div style="margin-bottom:10px"><div style="font-weight:700;font-size:11px;margin-bottom:3px">${cat.icon} ${cat.label}</div><table style="width:100%;border-collapse:collapse">${qs}</table></div>`;
  }).join("");
  const capaRows=ncCapas.map(c=>`<tr><td style="padding:6px 8px;border:1px solid #ddd;font-size:11px">${c.type==="Acción Correctiva"?"Correctiva":c.type==="Acción Preventiva"?"Preventiva":"Corrección"}</td><td style="padding:6px 8px;border:1px solid #ddd;font-size:11px">${c.description}</td><td style="padding:6px 8px;border:1px solid #ddd;font-size:11px;white-space:nowrap">${fd(c.dueDate)}</td><td style="padding:6px 8px;border:1px solid #ddd;font-size:11px">${c.responsible}</td><td style="padding:6px 8px;border:1px solid #ddd;font-size:11px;text-align:center">${c.status==="Cerrado"?"Sí":"No"}</td></tr>`).join("");
  const w=window.open("","_blank","width=900,height=700");
  // El navegador puede bloquear la ventana emergente; sin esto el clic no hace
  // nada y no queda claro por que.
  if(!w){alert("El navegador bloqueó la ventana del informe. Habilitá las ventanas emergentes para este sitio y volvé a intentar.");return;}

/* ═══ UNIFIED STEP BAR ═══ */
function StepBar({phases,currentPhase,viewStep,onClickStep,canEdit}){
  const phIdx=phases.findIndex(p=>p.id===currentPhase);
  return(<div className="step-bar" style={{borderBottom:`1px solid ${K.brdL}`,marginBottom:18}}>
    {phases.map((p,i)=>{
      const isDone=i<phIdx;const isActive=i===viewStep;const isFuture=i>phIdx;
      return <div key={p.id}
        className={`step-item ${isDone?"done":""} ${isActive?"active":""} ${isFuture?"future":""}`}
        style={{"--sc":p.color,"--sbg":p.bg,color:isActive?p.color:isDone?p.color:K.txM}}
        onClick={()=>onClickStep(i)}
        title={p.desc}>
        <span className="step-icon">{isDone&&i!==viewStep?"✓":p.icon}</span>
        <span className="step-label">{p.label}</span>
      </div>;
    })}
  </div>);
}

/* ══════════════════════════════════════════════════════
   NC DETAIL — UNIFIED WIZARD
   ══════════════════════════════════════════════════════ */
function NCDetail({nc,data,canEdit,canAdmin,onClose,onSave,onDelete}){
  const{capas}=data;
  const[fm,sFm]=useState({...nc});
  const[ocupado,sOcupado]=useState(false);
  const phIdx=NC_PHASES.findIndex(p=>p.id===fm.phase);
  const[step,sStep]=useState(phIdx>=0?phIdx:0);
  const u=(k,v)=>sFm(p=>({...p,[k]:v}));
  const ncCapas=capas.filter(c=>c.ncId===nc.id);
  const curPhase=NC_PHASES[step];

  // Ishikawa
  const[ish,sIsh]=useState(nc.ishikawa||{});
  const uIsh=(cat,qi,val)=>{sIsh(p=>{const n={...p,[cat]:{...(p[cat]||{})}};n[cat][qi]=val;return n;});};
  useEffect(()=>{u("ishikawa",ish);},[ish]);

  // Risk matrix auto-calc — only on explicit user changes, not on mount
  const mounted=useRef(false);
  useEffect(()=>{if(!mounted.current){mounted.current=true;return;}
    if(fm.severity&&fm.probability){const key=`${fm.severity}-${fm.probability}`;const cls=RISK_MATRIX[key];if(cls)u("classification",cls);}
  },[fm.severity,fm.probability]);

  const canAdvance=step<NC_PHASES.length-1;
  const canGoBack=step>0;

  const goBack=()=>{if(canGoBack)sStep(step-1);};

  /* SOP-AC-036 §5.6: una NC no se cierra mientras tenga CAPA abiertas. El texto
     de ayuda ya lo decía, pero nada lo impedía: se podía cerrar con acciones
     pendientes y el expediente quedaba mintiendo. */
  const capasAbiertas=ncCapas.filter(c=>c.status!=="Cerrado");
  const puedeCerrar=capasAbiertas.length===0;

  const guardar=async(fmAGuardar=fm)=>{
    if(fmAGuardar.phase==="cerrada"&&!puedeCerrar){
      data.avisar(`No se puede cerrar: ${plural(capasAbiertas.length,"queda 1 acción CAPA sin cerrar","quedan N acciones CAPA sin cerrar")} (${capasAbiertas.map(c=>c.code).join(", ")}).`,"error");
      return;
    }
    sOcupado(true);
    try{const g=await onSave(fmAGuardar);if(g)sFm(p=>({...p,...g}));}
    catch(e){/* el aviso lo muestra quien guarda */}
    finally{sOcupado(false);}
  };

  /* Avanzar mueve la fase solo hacia adelante. Antes fijaba la fase del paso
     siguiente al que se estuviera mirando: entrar a una NC cerrada, ir a
     revisar el análisis y guardar la devolvía a "Análisis 5M". */
  const avanzar=async()=>{
    if(!canEdit||!canAdvance)return;
    const faseActual=NC_PHASES.findIndex(p=>p.id===fm.phase);
    const destino=step+1;
    const nueva=destino>faseActual?NC_PHASES[destino].id:fm.phase;
    await guardar({...fm,phase:nueva});
    sStep(destino);
  };

  return(<Md title={`${nc.code} — No Conformidad`} onClose={onClose} wide>
    {/* ── Phase step description ── */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
      <span style={{fontSize:22}}>{curPhase.icon}</span>
      <div><div style={{fontSize:15,fontWeight:800,color:curPhase.color}}>{curPhase.label}</div><div style={{fontSize:11.5,color:K.txS}}>{curPhase.desc}</div></div>
      <div style={{marginLeft:"auto"}}><ClsBg cls={fm.classification}/></div>
    </div>

    <StepBar phases={NC_PHASES} currentPhase={fm.phase} viewStep={step} onClickStep={sStep} canEdit={canEdit}/>

    {/* ═══ STEP 0: APERTURA ═══ */}
    {step===0&&<div>
      <CtxHelp>SOP-AC-036 §5.2: Complete los datos de apertura. El supervisor del sector donde se detectó la NC completa este registro.</CtxHelp>
      <div style={sC}>
        <G2>
          <Fd l="Fecha del incidente"><input type="date" style={sI} value={fm.incidentDate||""} onChange={e=>u("incidentDate",e.target.value)} disabled={!canEdit}/></Fd>
          <Fd l="Fecha de apertura"><input type="date" style={sI} value={fm.openDate||""} onChange={e=>u("openDate",e.target.value)} disabled={!canEdit}/></Fd>
          <Fd l="Abierto por"><input style={sI} value={fm.openedBy||""} onChange={e=>u("openedBy",e.target.value)} disabled={!canEdit}/></Fd>
          <Fd l="Sector"><select style={sS} value={fm.sector||""} onChange={e=>u("sector",e.target.value)} disabled={!canEdit}><option value="">— Seleccionar —</option>{SECTORS.map(s=><option key={s}>{s}</option>)}</select></Fd>
        </G2>
        <Fd l="Detalle (cuándo se detecta y qué se detecta)"><textarea style={{...sI,minHeight:80,resize:"vertical"}} value={fm.description||""} onChange={e=>u("description",e.target.value)} disabled={!canEdit}/></Fd>
        <Fd l="Fuente de detección"><select style={sS} value={fm.source||""} onChange={e=>u("source",e.target.value)} disabled={!canEdit}><option value="">— Seleccionar —</option>{DETECTION_SOURCES.map(s=><option key={s}>{s}</option>)}</select></Fd>
        <G2>
          <Fd l="Producto / Instrumento / Documento asociado"><input style={sI} value={fm.associatedItem||""} onChange={e=>u("associatedItem",e.target.value)} disabled={!canEdit}/></Fd>
          <Fd l="Lote (si corresponde)"><input style={sI} value={fm.lot||""} onChange={e=>u("lot",e.target.value)} disabled={!canEdit}/></Fd>
        </G2>
      </div>
    </div>}

    {/* ═══ STEP 1: ANÁLISIS 5M ═══ */}
    {step===1&&<div>
      <CtxHelp>SOP-AC-036 §5.3: Análisis de causa raíz con diagrama de Ishikawa (5M). Responda SI/NO/N-A a cada pregunta.</CtxHelp>
      <div className="ish-grid">
        {ISHIKAWA_CATS.map(cat=><div key={cat.id} className="ish-cell">
          <h4 style={{color:K.pri}}>{cat.icon} {cat.label}</h4>
          {cat.questions.map((q,qi)=><div key={qi} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:`1px solid ${K.brdL}`,fontSize:11.5}}>
            <span style={{flex:1,color:K.txS}}>{q}</span>
            {["SI","NO","N/A"].map(opt=><button key={opt} style={{padding:"2px 6px",borderRadius:4,border:`1px solid ${(ish[cat.id]||{})[qi]===opt?K.pri:K.brd}`,background:(ish[cat.id]||{})[qi]===opt?K.priL:"#fff",color:(ish[cat.id]||{})[qi]===opt?K.pri:K.txM,fontSize:10,fontWeight:600,cursor:canEdit?"pointer":"default",fontFamily:"inherit"}} onClick={()=>canEdit&&uIsh(cat.id,qi,opt)} disabled={!canEdit}>{opt}</button>)}
          </div>)}
        </div>)}
      </div>
      <div style={{...sC,marginTop:14}}>
        <Fd l="Descripción de hallazgos (respuestas NO)"><textarea style={{...sI,minHeight:70,resize:"vertical"}} value={fm.analysisNotes||""} onChange={e=>u("analysisNotes",e.target.value)} disabled={!canEdit}/></Fd>
        <G2>
          <Fd l="Fecha del análisis"><input type="date" style={sI} value={fm.analysisDate||""} onChange={e=>u("analysisDate",e.target.value)} disabled={!canEdit}/></Fd>
          <Fd l="Analizado por"><input style={sI} value={fm.analyzedBy||""} onChange={e=>u("analyzedBy",e.target.value)} disabled={!canEdit}/></Fd>
        </G2>
        <Fd l="Causa raíz determinada"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={fm.rootCause||""} onChange={e=>u("rootCause",e.target.value)} disabled={!canEdit} placeholder="Ishikawa, 5 Porqués u otra herramienta..."/></Fd>
      </div>
    </div>}

    {/* ═══ STEP 2: CLASIFICACIÓN ═══ */}
    {step===2&&<div>
      <CtxHelp>SOP-AC-036 §5.4: Determine la clasificación usando la matriz Severidad × Probabilidad.</CtxHelp>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>
        <div style={sC}>
          <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>Severidad</h3>
          {SEVERITIES.map(s=><label key={s} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 10px",border:`1px solid ${fm.severity===s?K.pri+"40":K.brd}`,borderRadius:7,marginBottom:6,cursor:canEdit?"pointer":"default",background:fm.severity===s?K.priL:"#fff"}}>
            <input type="radio" name="sev" checked={fm.severity===s} onChange={()=>canEdit&&u("severity",s)} disabled={!canEdit} style={{marginTop:2}}/>
            <div><div style={{fontSize:12.5,fontWeight:600}}>{s}</div><div style={{fontSize:10.5,color:K.txS}}>{s==="Baja"?"No compromete salud ni actividad comercial":s==="Moderada"?"Sistema correcto pero no efectivo":"Pérdida de licencia, riesgo de salud"}</div></div>
          </label>)}
        </div>
        <div style={sC}>
          <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>Probabilidad</h3>
          {PROBABILITIES.map(p=><label key={p} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 10px",border:`1px solid ${fm.probability===p?K.pri+"40":K.brd}`,borderRadius:7,marginBottom:6,cursor:canEdit?"pointer":"default",background:fm.probability===p?K.priL:"#fff"}}>
            <input type="radio" name="prob" checked={fm.probability===p} onChange={()=>canEdit&&u("probability",p)} disabled={!canEdit} style={{marginTop:2}}/>
            <div><div style={{fontSize:12.5,fontWeight:600}}>{p}</div><div style={{fontSize:10.5,color:K.txS}}>{p==="Baja"?"Improbable, evento aislado":p==="Moderada"?"Puede no detectarse sin acción":"Probable recurrencia"}</div></div>
          </label>)}
        </div>
        <div style={sC}>
          <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>Matriz de riesgo</h3>
          <RiskMatrix sev={fm.severity} prob={fm.probability}/>
          <div style={{textAlign:"center",marginTop:10}}>
            <div style={{fontSize:10,color:K.txS,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Resultado</div>
            <div style={{fontSize:18}}><ClsBg cls={fm.classification}/></div>
            {fm.classification&&<div style={{fontSize:11,color:K.txS,marginTop:6}}>Plazo CAPA: <strong>{CLASSIFICATIONS.find(c=>c.id===fm.classification)?.deadlineLabel}</strong></div>}
          </div>
        </div>
      </div>
    </div>}

    {/* ═══ STEP 3: CONCLUSIONES ═══ */}
    {step===3&&<div style={sC}>
      <Fd l="¿Impacta sobre otros productos/procesos?">
        <div style={{display:"flex",gap:8}}>{["Sí","No"].map(opt=><button key={opt} style={{...sB(fm.impactsOthers===opt?"pri":"g"),fontSize:12}} onClick={()=>canEdit&&u("impactsOthers",opt)} disabled={!canEdit}>{opt}</button>)}</div>
      </Fd>
      {fm.impactsOthers==="Sí"&&<Fd l="Detalle del impacto"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.impactDetail||""} onChange={e=>u("impactDetail",e.target.value)} disabled={!canEdit}/></Fd>}
      <Fd l="Tipo de acción a iniciar"><select style={sS} value={fm.capaType||""} onChange={e=>u("capaType",e.target.value)} disabled={!canEdit}><option value="">— Seleccionar —</option>{CAPA_TYPES.map(t=><option key={t}>{t}</option>)}</select></Fd>
      <Fd l="Conclusiones generales"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={fm.conclusions||""} onChange={e=>u("conclusions",e.target.value)} disabled={!canEdit}/></Fd>
    </div>}

    {/* ═══ STEP 4: CAPA ═══ */}
    {step===4&&<div style={sC}>
      <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px",color:"#2563EB"}}>🔧 Acciones CAPA vinculadas ({ncCapas.length})</h3>
      <CtxHelp>SOP-AC-036 §5.5: Las acciones se gestionan desde la sección CAPA/Acciones del menú lateral. Aquí se muestran las vinculadas a esta NC.</CtxHelp>
      {ncCapas.length===0?<Em icon="📋" t="Sin acciones CAPA vinculadas. Creá acciones desde 'CAPA / Acciones' vinculándolas a esta NC."/>:
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><th style={sTh}>Código</th><th style={sTh}>Tipo</th><th style={sTh}>Descripción</th><th style={sTh}>Responsable</th><th style={sTh}>Vence</th><th style={sTh}>Estado</th></tr></thead>
      <tbody>{ncCapas.map(c=><tr key={c.id}><td style={{...sTd,fontFamily:"monospace",fontWeight:700,color:K.pri}}>{c.code}</td><td style={sTd}><Bg color={c.type==="Acción Correctiva"?K.red:c.type==="Acción Preventiva"?K.vio:"#0891B2"} bg={c.type==="Acción Correctiva"?K.redL:c.type==="Acción Preventiva"?K.vioL:"#ECFEFF"}>{c.type==="Acción Correctiva"?"AC":c.type==="Acción Preventiva"?"AP":"Corr."}</Bg></td><td style={sTd}>{c.description}</td><td style={sTd}>{c.responsible}</td><td style={{...sTd,whiteSpace:"nowrap"}}>{fd(c.dueDate)}</td><td style={sTd}><SBg s={estadoVisible(c)}/></td></tr>)}</tbody></table>}
    </div>}

    {/* ═══ STEP 5: VERIFICACIÓN ═══ */}
    {step===5&&<div style={sC}>
      <CtxHelp type="warn">SOP-AC-036 §5.6: Las NC no serán cerradas hasta que no estén cerradas las CAPA establecidas.</CtxHelp>
      <Fd l="¿Las acciones eliminaron la(s) causa(s) raíz?"><select style={sS} value={fm.rootCauseEliminated||""} onChange={e=>u("rootCauseEliminated",e.target.value)} disabled={!canEdit}><option value="">—</option><option>Sí</option><option>No</option><option>Parcialmente</option></select></Fd>
      <Fd l="¿Las acciones cubrieron todos los procesos y productos?"><select style={sS} value={fm.coverageComplete||""} onChange={e=>u("coverageComplete",e.target.value)} disabled={!canEdit}><option value="">—</option><option>Sí</option><option>No</option></select></Fd>
      <Fd l="¿Las acciones afectaron de forma negativa al proceso?"><select style={sS} value={fm.negativeImpact||""} onChange={e=>u("negativeImpact",e.target.value)} disabled={!canEdit}><option value="">—</option><option>No</option><option>Sí (detallar)</option></select></Fd>
      <Fd l="¿Las acciones se pudieron llevar adelante en tiempo y forma?"><select style={sS} value={fm.onTime||""} onChange={e=>u("onTime",e.target.value)} disabled={!canEdit}><option value="">—</option><option>Sí</option><option>No (detallar)</option></select></Fd>
      <Fd l="Verificación de eficacia"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={fm.effectivenessNotes||""} onChange={e=>u("effectivenessNotes",e.target.value)} disabled={!canEdit}/></Fd>
    </div>}

    {/* ═══ STEP 6: CIERRE ═══ */}
    {step===6&&<div style={sC}>
      {puedeCerrar
        ?<CtxHelp type="success">Completar los datos de cierre y guardar para finalizar la NC.</CtxHelp>
        :<CtxHelp type="warn"><strong>No se puede cerrar todavía.</strong> SOP-AC-036 §5.6: {plural(capasAbiertas.length,"queda 1 acción CAPA sin cerrar","quedan N acciones CAPA sin cerrar")} ({capasAbiertas.map(c=>c.code).join(", ")}). Cerralas desde el módulo CAPA / Acciones.</CtxHelp>}
      <G2>
        <Fd l="Fecha de cierre"><input type="date" style={sI} value={fm.closeDate||""} onChange={e=>u("closeDate",e.target.value)} disabled={!canEdit}/></Fd>
        <Fd l="Cerrado por"><input style={sI} value={fm.closedBy||""} onChange={e=>u("closedBy",e.target.value)} disabled={!canEdit}/></Fd>
      </G2>
      <Fd l="Notas de cierre"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={fm.closeNotes||""} onChange={e=>u("closeNotes",e.target.value)} disabled={!canEdit}/></Fd>
    </div>}

    {/* ═══ NAVIGATION FOOTER ═══ */}
    <div className="nav-footer">
      <div style={{display:"flex",gap:8}}>
        {canAdmin&&<button style={sB("red")} onClick={()=>onDelete(nc.id)}>🗑 Eliminar</button>}
        <button style={{...sB("g"),color:"#7C3AED"}} onClick={()=>exportNC(fm,ncCapas)}>📄 Exportar PDF</button>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {canGoBack&&<button style={sB("g")} onClick={goBack}>◀ {NC_PHASES[step-1].label}</button>}
        <button style={sB("g")} onClick={onClose}>Cerrar</button>
        {canEdit&&<button style={sB("pri")} onClick={guardar} disabled={ocupado}>{ocupado?"Guardando…":"💾 Guardar"}</button>}
        {canEdit&&canAdvance&&<button style={{...sB("grn"),background:NC_PHASES[step+1].color}} onClick={avanzar} disabled={ocupado}>Guardar y avanzar ▸ {NC_PHASES[step+1].label}</button>}
      </div>
    </div>
  </Md>);
}

/* ══════════════════════════════════════════════════════
   DEV DETAIL — UNIFIED WIZARD
   ══════════════════════════════════════════════════════ */
/* ═══ ACCIONES DE UN DESVÍO ═════════════════════════════════════════════════
   Se escriben con el formato qué / quién / cuándo, y se guardan como acciones
   CAPA vinculadas al desvío. No son una lista aparte: al ser filas de la misma
   tabla entran en las alertas de vencimiento y en el seguimiento del módulo
   CAPA. Una acción con fecha que nadie controla no es una acción, es una nota. */
function AccionesDesvio({dev,data,canEdit}){
  const{capas,guardarCapa,borrarCapa,avisar,canAdmin}=data;
  const mias=capas.filter(c=>c.devId===dev.id);
  const vacia={que:"",quien:"",email:"",cuando:"",tipo:"Corrección"};
  const[nueva,sNueva]=useState(vacia);
  const[ocupado,sOcupado]=useState(false);

  const agregar=async()=>{
    if(!nueva.que.trim()){avisar("Escribí qué hay que hacer","error");return;}
    sOcupado(true);
    try{
      await guardarCapa({
        devId:dev.id,ncId:"",type:nueva.tipo,description:nueva.que.trim(),
        responsible:nueva.quien.trim(),responsibleEmail:nueva.email.trim(),
        dueDate:nueva.cuando,status:"Abierto",
      });
      sNueva(vacia);
      avisar("Acción agregada");
    }catch(e){avisar("No se pudo agregar: "+e.message,"error");}
    finally{sOcupado(false);}
  };

  const cambiar=async(c,campo,valor)=>{
    try{await guardarCapa({...c,[campo]:valor});}
    catch(e){avisar("No se pudo actualizar: "+e.message,"error");}
  };

  const quitar=async(c)=>{
    if(!confirm(`¿Eliminar la acción ${c.code}?`))return;
    try{await borrarCapa(c.id);avisar("Acción eliminada");}
    catch(e){avisar("No se pudo eliminar: "+e.message,"error");}
  };

  return(<div style={sC}>
    <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 4px",color:"#0891B2"}}>🔧 Acciones del desvío ({mias.length})</h3>
    <CtxHelp>Cada acción se escribe como <strong>qué</strong> se hace, <strong>quién</strong> lo hace y <strong>cuándo</strong> vence. Quedan vinculadas a este desvío y aparecen en las alertas de vencimiento junto con el resto de las CAPA.</CtxHelp>

    {mias.length===0&&<Em icon="🔧" t="Todavía no hay acciones registradas para este desvío"/>}

    {mias.length>0&&<table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,marginBottom:12}}>
      <thead><tr>
        <th style={sTh}>Código</th><th style={sTh}>Qué</th><th style={{...sTh,width:150}}>Quién</th>
        <th style={{...sTh,width:130}}>Cuándo</th><th style={{...sTh,width:120}}>Estado</th>{canAdmin&&<th style={sTh}></th>}
      </tr></thead>
      <tbody>{mias.map(c=><tr key={c.id}>
        <td style={{...sTd,fontFamily:"monospace",fontWeight:700,color:K.pri,fontSize:11.5}}>{c.code}</td>
        <td style={sTd}>{c.description}</td>
        <td style={sTd}>{c.responsible||<span style={{color:K.txM}}>— sin asignar —</span>}</td>
        <td style={{...sTd,whiteSpace:"nowrap"}}>{c.dueDate?fd(c.dueDate):<span style={{color:K.txM}}>— sin fecha —</span>}</td>
        <td style={sTd}>
          {canEdit
            ?<select style={{...sS,fontSize:11.5,padding:"3px 6px"}} value={c.status} onChange={e=>cambiar(c,"status",e.target.value)}>
               {STATUSES.filter(s=>s!=="Vencido").map(s=><option key={s}>{s}</option>)}
             </select>
            :<SBg s={estadoVisible(c)}/>}
        </td>
        {canAdmin&&<td style={sTd}><button style={{...sB("sm"),color:K.red,padding:"2px 7px"}} onClick={()=>quitar(c)}>✕</button></td>}
      </tr>)}</tbody>
    </table>}

    {canEdit&&<div style={{border:`1px dashed ${K.brd}`,borderRadius:8,padding:12,background:"#FAFBFC"}}>
      <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase",letterSpacing:".04em",marginBottom:8}}>Agregar acción</div>
      <Fd l="Qué se hace"><textarea style={{...sI,minHeight:52,resize:"vertical"}} value={nueva.que} onChange={e=>sNueva(p=>({...p,que:e.target.value}))} placeholder="Descripción de la acción a realizar..."/></Fd>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 130px 150px",gap:10}}>
        <Fd l="Quién"><input style={sI} value={nueva.quien} onChange={e=>sNueva(p=>({...p,quien:e.target.value}))} placeholder="Responsable"/></Fd>
        <Fd l="Email (para recordatorios)"><input type="email" style={sI} value={nueva.email} onChange={e=>sNueva(p=>({...p,email:e.target.value}))}/></Fd>
        <Fd l="Cuándo"><input type="date" style={sI} value={nueva.cuando} onChange={e=>sNueva(p=>({...p,cuando:e.target.value}))}/></Fd>
        <Fd l="Tipo"><select style={sS} value={nueva.tipo} onChange={e=>sNueva(p=>({...p,tipo:e.target.value}))}>{CAPA_TYPES.map(t=><option key={t}>{t}</option>)}</select></Fd>
      </div>
      <button style={sB("pri")} onClick={agregar} disabled={ocupado||!nueva.que.trim()}>{ocupado?"Agregando…":"＋ Agregar acción"}</button>
    </div>}
  </div>);
}

function DevDetail({dev,data,canEdit,canAdmin,onClose,onSave,onDelete}){
  const[fm,sFm]=useState({...dev});
  const phIdx=DEV_PHASES.findIndex(p=>p.id===fm.phase);
  const[step,sStep]=useState(phIdx>=0?phIdx:0);
  const u=(k,v)=>sFm(p=>({...p,[k]:v}));
  const curPhase=DEV_PHASES[step];
  const[impacts,sImpacts]=useState(dev.impacts||{});
  const uImp=(area,field,val)=>{sImpacts(p=>({...p,[area]:{...(p[area]||{}),[field]:val}}));};
  useEffect(()=>{u("impacts",impacts);},[impacts]);

  const[ocupado,sOcupado]=useState(false);
  const canAdvance=step<DEV_PHASES.length-1;
  const canGoBack=step>0;

  /* Un desvío no se cierra con acciones pendientes, por la misma razón que una
     NC: el expediente diría que está terminado y no lo está. */
  const misCapas=data.capas.filter(c=>c.devId===dev.id);
  const abiertas=misCapas.filter(c=>c.status!=="Cerrado");

  const guardar=async(fmAGuardar=fm)=>{
    if(fmAGuardar.phase==="cerrado"&&abiertas.length>0){
      data.avisar(`No se puede cerrar: ${plural(abiertas.length,"queda 1 acción sin cerrar","quedan N acciones sin cerrar")} (${abiertas.map(c=>c.code).join(", ")}).`,"error");
      return;
    }
    sOcupado(true);
    try{const g=await onSave(fmAGuardar);if(g)sFm(p=>({...p,...g}));}
    catch(e){/* el aviso lo muestra quien guarda */}
    finally{sOcupado(false);}
  };

    </div>}

    {/* ═══ STEP 1: IMPACTO ═══ */}
    {step===1&&<div style={sC}>
      <CtxHelp>REG-SOP-AC-036-B: Evalúe el impacto del desvío sobre cada área.</CtxHelp>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}><thead><tr><th style={sTh}>Área</th><th style={{...sTh,width:60}}>Sí</th><th style={{...sTh,width:60}}>No</th><th style={sTh}>Detalle</th></tr></thead>
      <tbody>{IMPACT_AREAS.map(area=><tr key={area}>
        <td style={{...sTd,fontWeight:600,fontSize:12}}>{area}</td>
        <td style={{...sTd,textAlign:"center"}}><input type="radio" name={`imp_${area}`} checked={(impacts[area]||{}).applies===true} onChange={()=>canEdit&&uImp(area,"applies",true)} disabled={!canEdit}/></td>

        <td style={sTd}><input style={{...sI,fontSize:11.5,padding:"4px 8px"}} value={(impacts[area]||{}).detail||""} onChange={e=>canEdit&&uImp(area,"detail",e.target.value)} disabled={!canEdit}/></td>
      </tr>)}</tbody></table>
      <Fd l="Observaciones generales"><textarea style={{...sI,minHeight:50,resize:"vertical",marginTop:10}} value={fm.impactNotes||""} onChange={e=>u("impactNotes",e.target.value)} disabled={!canEdit}/></Fd>

    {/* ═══ STEP 2: RIESGO / DECISIÓN ═══ */}

      <div style={sC}>

          <div style={{display:"flex",gap:8}}>{["Sí","No","Pendiente"].map(opt=><button key={opt} style={{...sB(fm.riskControlled===opt?"pri":"g"),fontSize:12}} onClick={()=>canEdit&&u("riskControlled",opt)} disabled={!canEdit}>{opt}</button>)}</div>
        </Fd>
        <Fd l="Notas del análisis de riesgo"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.riskNotes||""} onChange={e=>u("riskNotes",e.target.value)} disabled={!canEdit}/></Fd>
      </div>
      <div style={sC}>
        <h3 style={{fontSize:13,fontWeight:700,margin:"0 0 10px"}}>Clasificación y decisión</h3>
        <G2>
          <Fd l="Criticidad"><div style={{display:"flex",gap:8}}>
            {[{v:true,l:"Crítico",c:K.red},{v:false,l:"No Crítico",c:K.pri}].map(opt=><button key={opt.l} style={{...sB("g"),borderColor:fm.critical===opt.v?opt.c:K.brd,color:fm.critical===opt.v?"#fff":opt.c,background:fm.critical===opt.v?opt.c:"transparent"}} onClick={()=>canEdit&&u("critical",opt.v)} disabled={!canEdit}>{opt.l}</button>)}
          </div></Fd>
          <Fd l="Planificación"><div style={{display:"flex",gap:8}}>
            {["Planificado","No Planificado"].map(opt=><button key={opt} style={{...sB(fm.planned===opt?"pri":"g"),fontSize:12}} onClick={()=>canEdit&&u("planned",opt)} disabled={!canEdit}>{opt}</button>)}
          </div></Fd>
        </G2>
        <G2>
          <Fd l="Prioridad"><select style={sS} value={fm.priority||""} onChange={e=>u("priority",e.target.value)} disabled={!canEdit}><option value="">—</option><option>Alta</option><option>Media</option><option>Baja</option></select></Fd>
          <Fd l="Decisión"><div style={{display:"flex",gap:8}}>
            {["Aprobar","Rechazar"].map(opt=><button key={opt} style={{...sB("g"),borderColor:fm.decision===opt?(opt==="Aprobar"?K.grn:K.red):K.brd,color:fm.decision===opt?"#fff":(opt==="Aprobar"?K.grn:K.red),background:fm.decision===opt?(opt==="Aprobar"?K.grn:K.red):"transparent"}} onClick={()=>canEdit&&u("decision",opt)} disabled={!canEdit}>{opt}</button>)}
          </div></Fd>
        </G2>
        <Fd l="Verificadores (nombre, sección, cargo)"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.verifiers||""} onChange={e=>u("verifiers",e.target.value)} disabled={!canEdit}/></Fd>
      </div>
    </div>}

    {/* ═══ STEP 3: IMPLEMENTACIÓN ═══ */}
    {step===3&&<div>
      <AccionesDesvio dev={fm} data={data} canEdit={canEdit}/>
      <div style={sC}>
        <Fd l="Notificaciones regulatorias"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.notifications||""} onChange={e=>u("notifications",e.target.value)} disabled={!canEdit} placeholder="Autoridad sanitaria, clientes, distribuidores..."/></Fd>
        <Fd l="Observaciones generales de la implementación"><textarea style={{...sI,minHeight:60,resize:"vertical"}} value={fm.implementationActions||""} onChange={e=>u("implementationActions",e.target.value)} disabled={!canEdit} placeholder="Contexto que no entra en una acción puntual..."/></Fd>
      </div>
    </div>}

    {/* ═══ STEP 4: CIERRE ═══ */}
    {step===4&&<div style={sC}>
      {abiertas.length===0
        ?<CtxHelp type="success">Completar datos de cierre para finalizar el desvío.</CtxHelp>
        :<CtxHelp type="warn"><strong>No se puede cerrar todavía.</strong> {plural(abiertas.length,"Queda 1 acción sin cerrar","Quedan N acciones sin cerrar")} ({abiertas.map(c=>c.code).join(", ")}). Podés cerrarlas desde la etapa de Implementación.</CtxHelp>}
      <Fd l="Se aporta toda la documentación que avala la aprobación/rechazo">
        <div style={{display:"flex",gap:8}}>{["Sí","No","N/A"].map(opt=><button key={opt} style={{...sB(fm.docComplete===opt?"pri":"g"),fontSize:12}} onClick={()=>canEdit&&u("docComplete",opt)} disabled={!canEdit}>{opt}</button>)}</div>
      </Fd>
      <G2>
        <Fd l="Aprobado por"><input style={sI} value={fm.approvedBy||""} onChange={e=>u("approvedBy",e.target.value)} disabled={!canEdit} placeholder="DT / Responsable AC"/></Fd>
        <Fd l="Fecha cierre"><input type="date" style={sI} value={fm.closeDate||""} onChange={e=>u("closeDate",e.target.value)} disabled={!canEdit}/></Fd>
      </G2>
      <Fd l="Notas de cierre"><textarea style={{...sI,minHeight:50,resize:"vertical"}} value={fm.closeNotes||""} onChange={e=>u("closeNotes",e.target.value)} disabled={!canEdit}/></Fd>
    </div>}

    {/* ═══ NAVIGATION FOOTER ═══ */}
    <div className="nav-footer">
      <div style={{display:"flex",gap:8}}>
        {canAdmin&&<button style={sB("red")} onClick={()=>onDelete(dev.id)}>🗑 Eliminar</button>}
        <button style={{...sB("g"),color:"#7C3AED"}} onClick={()=>exportDev(fm)}>📄 Exportar PDF</button>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {canGoBack&&<button style={sB("g")} onClick={goBack}>◀ {DEV_PHASES[step-1].label}</button>}
        <button style={sB("g")} onClick={onClose}>Cerrar</button>
        {canEdit&&<button style={sB("pri")} onClick={()=>guardar()} disabled={ocupado}>{ocupado?"Guardando…":"💾 Guardar"}</button>}
        {canEdit&&canAdvance&&<button style={{...sB("grn"),background:DEV_PHASES[step+1].color}} onClick={avanzar} disabled={ocupado}>Guardar y avanzar ▸ {DEV_PHASES[step+1].label}</button>}
      </div>
    </div>
  </Md>);
}

/* ═══ EVIDENCIA ADJUNTA ═════════════════════════════════════════════════════
   Foto o PDF que respalda una acción. El archivo se guarda en el servidor, no
   en el navegador: es evidencia, tiene que verla cualquiera que abra la acción.

   Las imágenes se reducen acá antes de subirlas. Una foto de celular son 4 MB y
   4000 px de ancho; para leer la etiqueta de una caja alcanzan 1600 px y quedan
   en unos cientos de KB. Subir el original no agrega información y multiplica
   por diez el tamaño de la base y del backup. */
const MAX_LADO=1600;
const CALIDAD_JPEG=0.82;
const kb=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB";

function leerBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);
    r.onerror=()=>rej(new Error("no se pudo leer el archivo"));
    r.readAsDataURL(blob);
  });
}

async function prepararAdjunto(file){
  /* HEIC (el formato de las fotos de iPhone) no lo decodifica el canvas, así que
     no se puede reducir: se sube tal cual y el servidor lo acepta igual. */
  const reducible=file.type.startsWith("image/")&&file.type!=="image/heic";
  if(!reducible)return{nombre:file.name,tipo:file.type||"application/octet-stream",contenido:await leerBase64(file)};

  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const i=new Image();
      i.onload=()=>res(i);
      i.onerror=()=>rej(new Error("no se pudo abrir la imagen"));
      i.src=url;
    });
    const escala=Math.min(1,MAX_LADO/Math.max(img.width,img.height));
    // Ya es chica: se sube el original y no se recomprime, que solo perdería
    // calidad sin ganar tamaño.
    if(escala>=1)return{nombre:file.name,tipo:file.type,contenido:await leerBase64(file)};

    const c=document.createElement("canvas");
    c.width=Math.round(img.width*escala);c.height=Math.round(img.height*escala);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",CALIDAD_JPEG));
    if(!blob)throw new Error("no se pudo procesar la imagen");
    return{
      nombre:file.name.replace(/\.[^.]+$/,"")+".jpg",
      tipo:"image/jpeg",
      contenido:await leerBase64(blob),
    };
  }finally{
    URL.revokeObjectURL(url);
  }
}

function Evidencia({capa,canEdit,canAdmin,avisar,onCambio}){
  const[lista,sLista]=useState(capa.adjuntos||[]);
  const[subiendo,sSubiendo]=useState(false);
  const input=useRef(null);

  useEffect(()=>{sLista(capa.adjuntos||[]);},[capa.id]);

  const subir=async(files)=>{
    sSubiendo(true);
    const nuevos=[];
    for(const f of files){
      try{
        const payload=await prepararAdjunto(f);
        const{adjunto}=await api(`/capa/${encodeURIComponent(capa.id)}/adjuntos`,
          {method:"POST",body:JSON.stringify(payload)});
        nuevos.push(adjunto);
      }catch(e){
        avisar(`No se pudo adjuntar ${f.name}: ${e.message}`,"error");
      }
    }
    if(nuevos.length){
      const l=[...nuevos,...lista];
      sLista(l);onCambio&&onCambio(l);
      avisar(nuevos.length===1?"Evidencia adjuntada":`${nuevos.length} archivos adjuntados`);
    }
    sSubiendo(false);
    if(input.current)input.current.value="";
  };

  const borrar=async(a)=>{
    if(!confirm(`¿Eliminar "${a.nombre}"? La evidencia no se recupera.`))return;
    try{
      await api("/adjuntos/"+a.id,{method:"DELETE"});
      const l=lista.filter(x=>x.id!==a.id);
      sLista(l);onCambio&&onCambio(l);
      avisar("Adjunto eliminado");
    }catch(e){avisar("No se pudo eliminar: "+e.message,"error");}
  };

  if(!capa.id)return(
    <div style={{...sC,background:"#FAFBFC"}}>
      <h3 style={{fontSize:12,fontWeight:700,color:K.txS,margin:"0 0 6px"}}>📎 Evidencia</h3>
      <div style={{fontSize:12,color:K.txM}}>Guardá la acción para poder adjuntar archivos.</div>
    </div>);

  return(
    <div style={{...sC,background:"#FFFBEB",borderColor:"#D9770620"}}>
      <h3 style={{fontSize:12,fontWeight:700,color:"#92400E",margin:"0 0 8px"}}>
        📎 Evidencia {lista.length>0&&<span style={{color:K.txS,fontWeight:600}}>({lista.length})</span>}
      </h3>

      {lista.length===0&&<div style={{fontSize:12,color:K.txM,marginBottom:8}}>Sin archivos adjuntos.</div>}

      {lista.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#fff",border:`1px solid ${K.brdL}`,borderRadius:7,marginBottom:5}}>
        <span style={{fontSize:15,flexShrink:0}}>{a.tipo==="application/pdf"?"📄":"🖼"}</span>
        <a href={`${API}/adjuntos/${a.id}`} target="_blank" rel="noopener"
           style={{flex:1,fontSize:12.5,color:K.pri,fontWeight:600,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
           title={a.nombre}>{a.nombre}</a>
        <span style={{fontSize:11,color:K.txM,whiteSpace:"nowrap"}}>{kb(a.tamano)}</span>
        <span style={{fontSize:11,color:K.txM,whiteSpace:"nowrap"}} title={`Subido por ${a.subidoPor||"—"}`}>{fd(a.subidoEn)}</span>
        {canAdmin&&<button style={{...sB("sm"),color:K.red,padding:"2px 7px"}} onClick={()=>borrar(a)} title="Eliminar adjunto">✕</button>}
      </div>)}

      {canEdit&&<div style={{marginTop:8}}>
        <input ref={input} type="file" multiple accept="image/*,application/pdf" style={{display:"none"}}
               onChange={e=>e.target.files.length&&subir([...e.target.files])}/>
        <button style={{...sB("g"),color:"#92400E",borderColor:"#D9770640"}}
                onClick={()=>input.current&&input.current.click()} disabled={subiendo}>
          {subiendo?"Subiendo…":"＋ Adjuntar foto o PDF"}
        </button>
        <div style={{fontSize:10.5,color:K.txM,marginTop:5}}>
          Las fotos se reducen automáticamente antes de subirse. Máximo 10 MB por archivo.
        </div>
      </div>}
    </div>);
}

function CAPAList({data,canEdit}){
  const{capas,ncs,devs,guardarCapa,borrarCapa,avisar,canAdmin}=data;
  const[sh,sSh]=useState(false);const[ed,sEd]=useState(null);const[q,sQ]=useState("");
  const[guardando,sGuardando]=useState(false);
  const bl={ncId:"",devId:"",type:"Acción Correctiva",description:"",responsible:"",responsibleEmail:"",dueDate:"",status:"Abierto",verification:"",effectiveness:"",followupResp:"",followupEmail:""};
  const[fm,sFm]=useState(bl);
  const save=async()=>{
    // El email del responsable es obligatorio: es la dirección a la que va el
    // aviso de vencimiento. Se chequea acá además del servidor para decirlo
    // antes del viaje de ida y vuelta, no para reemplazarlo.
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(fm.responsibleEmail||"").trim())){
      return avisar("Falta el email del responsable: es a donde se le avisa del vencimiento","error");
    }
    sGuardando(true);
    try{
      const c=await guardarCapa(ed?{...ed,...fm}:fm);
      // Al crear, la ficha queda abierta sobre la acción recién creada: es donde
      // se adjunta la evidencia, y cerrar acá obligaría a buscarla de nuevo.
      sEd(c);sFm(c);
      avisar(ed?"Acción guardada":`Acción ${c.code} creada`);
    }catch(e){avisar("No se pudo guardar: "+e.message,"error");}
    finally{sGuardando(false);}
  };
  /* Plazo automático según la clasificación de la NC (SOP-AC-036).
     Para las Críticas el plazo es "inmediato": antes eso se traducía en no poner
     fecha, y una acción sin fecha nunca vencía ni entraba en las alertas. Justo
     la que más urge era la única que el sistema no reclamaba. Ahora la fecha es
     el día de apertura de la NC, que es lo que "inmediato" significa. */
  const autoD=ncId=>{
    const nc=ncs.find(x=>x.id===ncId);
    if(!nc||!nc.classification)return;
    const c=CLASSIFICATIONS.find(x=>x.id===nc.classification);
    if(!c)return;
    const base=nc.openDate||tdy();
    sFm(p=>({...p,dueDate:c.deadline>0?addMo(base,c.deadline):base}));
  };
  const open=c=>{sFm(c||bl);sEd(c);sSh(true);};
  const del=async id=>{
    const c=capas.find(x=>x.id===id);
    if(!confirm(`¿Eliminar ${c?.code||"esta acción"}? También se borra su evidencia adjunta.`))return;
    try{await borrarCapa(id);avisar("Acción eliminada");sSh(false);sEd(null);}
    catch(e){avisar("No se pudo eliminar: "+e.message,"error");}
  };
  const lkNC=fm.ncId?ncs.find(x=>x.id===fm.ncId):null;
  const cls=lkNC?CLASSIFICATIONS.find(x=>x.id===lkNC.classification):null;
  let ls=capas;
  if(q){const ql=q.toLowerCase();ls=ls.filter(c=>[c.code,c.description,c.responsible,c.responsibleEmail,c.type,c.status,c.verification,c.effectiveness].some(v=>v&&String(v).toLowerCase().includes(ql)));}
  const urgLabel=(dl)=>{if(dl<0)return{txt:"⚠ VENCIDO",bg:K.redL,color:K.red};if(dl<=7)return{txt:"🔴 "+dl+"d",bg:"#FEF2F2",color:K.red};if(dl<=15)return{txt:"🟡 "+dl+"d",bg:K.wrnL,color:"#92400E"};return null;};
  const sendReminder=(a)=>{const nc=ncs.find(n=>n.id===a.ncId);const to=a.responsibleEmail||"";const cc=a.followupEmail||"";const subj="Recordatorio: CAPA "+a.code+" — Vessena S.A.";const body="Estimado/a "+a.responsible+",\n\nLe recordamos que la acción "+a.code+" vinculada a la NC "+(nc?nc.code:"")+" tiene fecha límite el "+fd(a.dueDate)+".\n\nDescripción: "+a.description+"\n\nSaludos cordiales,\nAseguramiento de Calidad\nVessena S.A.";window.open("mailto:"+to+"?cc="+cc+"&subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body));};
  const upcoming=capas.filter(c=>c.status!=="Cerrado"&&daysLeft(c.dueDate)<=15).sort((a,b)=>daysLeft(a.dueDate)-daysLeft(b.dueDate));

  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <div><h1 style={{fontSize:20,fontWeight:800}}>CAPA / Acciones</h1><p style={{color:K.txS,margin:"4px 0 0",fontSize:12.5}}>{capas.length} acciones registradas</p></div>
      {canEdit&&<button style={sB("pri")} onClick={()=>open(null)}>+ Nueva CAPA</button>}
    </div>
    {!canEdit&&<VBanner/>}
    {upcoming.length>0&&<div style={{...sC,background:"#FEF2F2",borderColor:K.red+"30"}}>
      <h3 style={{fontSize:13,fontWeight:700,color:K.red,margin:"0 0 8px"}}>🔔 Alertas de vencimiento</h3>
      {upcoming.map(a=>{const dl=daysLeft(a.dueDate);const urg=urgLabel(dl);const nc=ncs.find(n=>n.id===a.ncId);return <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#fff",borderRadius:8,marginBottom:6,border:`1px solid ${urg.color}20`}}>
        <Bg color={urg.color} bg={urg.bg}>{urg.txt}</Bg>
        <span style={{fontFamily:"monospace",fontWeight:700,color:K.pri,fontSize:12}}>{a.code}</span>
        <span style={{flex:1,fontSize:12.5}}>{a.description}</span>
        <span style={{fontSize:11.5,color:K.txS}}>{a.responsible}</span>
        <span style={{fontSize:11.5,fontWeight:600}}>{fd(a.dueDate)}</span>
        {a.responsibleEmail&&<button style={{...sB("sm"),color:"#0891B2",fontSize:10}} onClick={()=>sendReminder(a)} title="Recordar">✉</button>}
      </div>;})}
    </div>}
    <input style={{...sI,maxWidth:300,marginBottom:12}} placeholder="Buscar..." value={q} onChange={e=>sQ(e.target.value)}/>
    <div style={sC}>
      {ls.length===0?<Em icon="📋" t="Sin acciones CAPA"/>:

}

/* ═══ AUDIT TRAIL ═══ */
/* Los registros vienen del servidor (tabla ncd_actividad). Antes se guardaban
   en el mismo localStorage que los datos que auditan, donde quien estaba siendo
   auditado podía reescribirlos desde la consola del navegador.

   El listado es del sistema entero y no del año seleccionado: una traza sirve
   para reconstruir qué pasó, y recortarla por el filtro de la pantalla
   escondería justo el movimiento que se está buscando. */
function Trail({logs}){
  const[q,sQ]=useState("");
  const ls=q?logs.filter(l=>Object.values(l).some(v=>String(v).toLowerCase().includes(q.toLowerCase()))):logs;
  const color=a=>a.includes("CREAR")||a.includes("CARGA")?[K.grn,K.grnL]
    :a.includes("CAMBIO")?[K.wrn,K.wrnL]
    :a.includes("ELIMINAR")?[K.red,K.redL]
    :a.includes("ADJUNTAR")?["#0891B2","#ECFEFF"]:[K.pri,K.priL];
  return(<div>
    <h1 style={{fontSize:20,fontWeight:800,margin:"0 0 4px"}}>Audit Trail</h1>
    <p style={{color:K.txS,margin:"0 0 12px",fontSize:12.5}}>Últimos {logs.length} movimientos registrados en el servidor.</p>
    <input style={{...sI,maxWidth:320,marginBottom:12}} placeholder="Buscar..." value={q} onChange={e=>sQ(e.target.value)}/>
    <div style={sC}>{ls.length===0?<Em icon="📜" t="Sin registros"/>:
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
        <thead><tr><th style={sTh}>Fecha</th><th style={sTh}>Usuario</th><th style={sTh}>Acción</th><th style={sTh}>Entidad</th><th style={sTh}>Detalle</th></tr></thead>
        <tbody>{ls.map(l=>{const[c,b]=color(l.accion||"");return <tr key={l.id}>
          <td style={{...sTd,whiteSpace:"nowrap",fontFamily:"monospace",fontSize:11.5}}>{fdt(l.ts)}</td>
          <td style={{...sTd,fontWeight:600}}>{l.usuario}</td>
          <td style={sTd}><Bg color={c} bg={b}>{l.accion}</Bg></td>
          <td style={sTd}>{l.entidad}</td>
          <td style={{...sTd,fontSize:12,color:K.txS}}>{l.detalle}</td>
        </tr>;})}</tbody>
      </table>}
    </div>
  </div>);
}

/* ═══ REPORTES ═══ */
const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
/* Carga inicial. Los 7 expedientes de 2026 y sus 28 acciones venían escritos
   dentro de este archivo, que era la única copia que existía. Este panel los
   pasa a la base una sola vez; el servidor rechaza el pedido si ya hay algo
   cargado, así que un click de más no puede duplicar un expediente.

   Una vez hecho, DEFAULT_NCS y DEFAULT_CAPAS se pueden sacar del archivo. */
function CargaInicial({onListo,avisar}){
  const[ocupado,sOcupado]=useState(false);
  const importar=async()=>{
    if(!confirm(`Se van a cargar ${DEFAULT_NCS.length} no conformidades y ${DEFAULT_CAPAS.length} acciones. Solo se puede hacer una vez. ¿Continuar?`))return;
    sOcupado(true);
    try{
      const r=await api("/importar",{method:"POST",body:JSON.stringify({ncs:DEFAULT_NCS,capas:DEFAULT_CAPAS})});
      avisar(`Cargados ${r.ncs} expedientes y ${r.capas} acciones`);
      onListo&&onListo();
    }catch(e){avisar("No se pudo importar: "+e.message,"error");}
    finally{sOcupado(false);}
  };
  return(<div style={{...sC,background:K.priL,borderColor:K.pri+"30"}}>
    <h3 style={{fontSize:14,fontWeight:800,color:K.pri,margin:"0 0 6px"}}>📥 Carga inicial de datos</h3>
    <p style={{fontSize:12.5,color:K.txS,lineHeight:1.6,margin:"0 0 12px"}}>
      La base está vacía. Este archivo trae {DEFAULT_NCS.length} no conformidades de 2026 y {DEFAULT_CAPAS.length} acciones
      cargadas de antemano; desde acá pasan al servidor, donde las va a ver todo el equipo.
      Es una operación única: después de hacerla, este panel desaparece.
    </p>
    <button style={sB("pri")} onClick={importar} disabled={ocupado}>{ocupado?"Cargando…":"Cargar los datos iniciales"}</button>
  </div>);
}

    {/* ── KPI cards ── */}

    </div>

    {/* ── Charts row 1 ── */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:14}}>

/* ═══ INFORME COMITÉ GERENCIAL ═══ */
function CommitteeReport({mode,ncs,devs,capas,yr,onClose}){
  const isNC=mode==="nc";
  const items=isNC?ncs:devs;
  const title=isNC?"NO CONFORMIDADES":"DESVÍOS DE PRODUCCIÓN";
  const subtitle=isNC?"Seguimiento de no conformidades abiertas y cerradas":"Seguimiento de desvíos de producción abiertos y cerrados";
  const now=new Date();const mo=MONTHS_ES[now.getMonth()];
  const today=now;

  // Items already filtered by year from parent
  const yrItems=items;
  const closedKey=isNC?"cerrada":"cerrado";
  const closed=yrItems.filter(x=>x.phase===closedKey).length;
  const open=yrItems.length-closed;
  const pct=yrItems.length?Math.round((closed/yrItems.length)*100):0;

  // By classification (NC) or criticality (DEV)
  const byCls=isNC?CLASSIFICATIONS.map(c=>({label:c.label,color:c.color,count:yrItems.filter(n=>n.classification===c.id).length})):[{label:"Crítico",color:K.red,count:yrItems.filter(d=>d.critical).length},{label:"No Crítico",color:K.pri,count:yrItems.filter(d=>!d.critical).length}];

  // By source (NC) or sector (DEV)
  const bySource=isNC?(()=>{const m={};yrItems.forEach(n=>{const s=n.source||"Sin dato";m[s]=(m[s]||0)+1;});return Object.entries(m).map(([k,v])=>({label:k,count:v}));})():(()=>{const m={};yrItems.forEach(d=>{const s=d.sector||"Sin dato";m[s]=(m[s]||0)+1;});return Object.entries(m).map(([k,v])=>({label:k,count:v}));})();

  // CAPA stats
  const relCapas=isNC?capas.filter(c=>ncs.some(n=>n.id===c.ncId)):capas.filter(c=>devs.some(d=>d.id===c.devId));
  const capaOpen=relCapas.filter(c=>c.status!=="Cerrado").length;
  const capaOverdue=relCapas.filter(c=>c.status!=="Cerrado"&&daysLeft(c.dueDate)<0).length;

  // Months without new cases
  const moCounts=Array(12).fill(0);
  yrItems.forEach(x=>{const d=fecha0(isNC?x.openDate:x.date);if(d&&d.getFullYear()===yr)moCounts[d.getMonth()]++;});
  const noCase=[];for(let i=0;i<=now.getMonth();i++){if(moCounts[i]===0)noCase.push(MONTHS_ES[i]);}
  const noCaseStr=noCase.length>0?` · sin nuevos casos en ${noCase.join(", ")}`:"";

  // Colors for pie
  const PIE_COLORS=["#DC2626","#2563EB","#D97706","#16A34A","#7C3AED","#0891B2","#DB2777","#65A30D"];

  // Day count helper
  const daysSince=(dateStr)=>{if(!dateStr)return"—";return Math.floor((today-new Date(dateStr+"T00:00:00"))/86400000);};

  /* Días que el expediente estuvo abierto: hasta el cierre si cerró, y hasta hoy
     si sigue abierto. Antes contaba siempre hasta hoy, incluso para las cerradas,
     así que una NC resuelta en una semana en enero sumaba trescientos días al
     promedio que se le muestra a gerencia. Y cuando faltaba la fecha devolvía "—",
     que al sumarse daba NaN y dejaba el indicador en blanco. */
  const diasAbierto=(x)=>{
    const ini=isNC?x.openDate:x.date;
    if(!ini)return null;
    const fin=x.closeDate||null;
    const desde=new Date(ini+"T00:00:00");
    const hasta=fin?new Date(fin+"T00:00:00"):today;
    return Math.max(0,Math.floor((hasta-desde)/86400000));
  };
  const conDias=yrItems.map(diasAbierto).filter(d=>d!==null);
  const promedioDias=conDias.length?Math.round(conDias.reduce((s,d)=>s+d,0)/conDias.length):0;

  // First and last month with data
  const firstMo=yrItems.reduce((m,x)=>{const d=fecha0(isNC?x.openDate:x.date);return d&&d<m?d:m;},new Date());
  const dateRange=`${MONTHS_ES[firstMo.getMonth()]} – ${mo} ${yr}`;

  const doPrint=()=>{
    const el=document.getElementById("comrpt");if(!el)return;
    const w=window.open("","_blank","width=960,height=700");
    if(!w){alert("El navegador bloqueó la ventana del informe. Habilitá las ventanas emergentes para este sitio y volvé a intentar.");return;}
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title} — Vessena S.A.</title><style>
      *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#1B1E25;font-size:13px;padding:0}
      @media print{@page{size:landscape;margin:12mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
    </style></head><body>${el.innerHTML}</body></html>`);
    w.document.close();setTimeout(()=>{w.print();},400);
  };

  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",justifyContent:"center",alignItems:"flex-start",paddingTop:20,overflowY:"auto"}} onClick={onClose}>
    <div style={{background:"#fff",borderRadius:12,width:"100%",maxWidth:1000,margin:"0 16px 40px",boxShadow:"0 24px 80px rgba(0,0,0,.2)"}} onClick={e=>e.stopPropagation()}>
      {/* Toolbar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",borderBottom:`1px solid ${K.brd}`}}>
        <div style={{fontSize:14,fontWeight:700}}>📊 Vista previa — Informe Comité Gerencial</div>
        <div style={{display:"flex",gap:8}}>
          <button style={sB("pri")} onClick={doPrint}>🖨 Imprimir / PDF</button>
          <button style={sB("g")} onClick={onClose}>✕ Cerrar</button>
        </div>
      </div>

      {/* Report content */}
      <div id="comrpt" style={{padding:0}}>

        {/* ── SLIDE 1: COVER ── */}
        <div style={{background:"linear-gradient(135deg,#1B1E25,#2D3748)",color:"#fff",padding:"60px 50px",textAlign:"center",pageBreakAfter:"always"}}>
          <div style={{fontSize:10,fontWeight:800,letterSpacing:".15em",color:"#C41E2A",marginBottom:8}}>VESSENA S.A.</div>
          <div style={{fontSize:36,fontWeight:800,letterSpacing:".02em",marginBottom:12}}>{title}</div>
          <div style={{fontSize:15,color:"rgba(255,255,255,.6)",marginBottom:30}}>{subtitle}</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,.45)"}}>Aseguramiento de Calidad &nbsp;|&nbsp; Planta Vessena S.A. &nbsp;|&nbsp; Reporte {dateRange}</div>
        </div>

        {/* ── SLIDE 2: ANÁLISIS ── */}
        <div style={{padding:"36px 50px",pageBreakAfter:"always"}}>
          <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>ANÁLISIS COMPARATIVO</div>
          <div style={{fontSize:13,color:K.txS,marginBottom:20}}>{title} {yr} &nbsp;·&nbsp; Estado al cierre de {mo}</div>

          {/* KPI cards */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16,marginBottom:28}}>
            <div style={{background:"#F8FAFC",border:`1px solid ${K.brd}`,borderRadius:10,padding:"18px",textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase",marginBottom:4}}>Total {yr}</div>
              <div style={{fontSize:42,fontWeight:800,color:K.pri}}>{yrItems.length}</div>
              <div style={{fontSize:12,color:K.txS,marginTop:4}}>{closed} cerradas &nbsp;|&nbsp; {open} abiertas</div>
            </div>
            <div style={{background:pct>=80?"#F0FDF4":pct>=50?"#FFFBEB":"#FEF2F2",border:`1px solid ${pct>=80?K.grn+"30":pct>=50?K.wrn+"30":K.red+"30"}`,borderRadius:10,padding:"18px",textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase",marginBottom:4}}>Tasa de cierre</div>
              <div style={{fontSize:42,fontWeight:800,color:pct>=80?K.grn:pct>=50?K.wrn:K.red}}>{pct}%</div>
              <div style={{height:8,background:"#E5E7EB",borderRadius:4,marginTop:6,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:pct>=80?K.grn:pct>=50?K.wrn:K.red,borderRadius:4}}/></div>
            </div>
            <div style={{background:"#F8FAFC",border:`1px solid ${K.brd}`,borderRadius:10,padding:"18px",textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase",marginBottom:4}}>CAPA vinculadas</div>
              <div style={{fontSize:42,fontWeight:800,color:K.vio}}>{relCapas.length}</div>
              <div style={{fontSize:12,color:K.txS,marginTop:4}}>{capaOpen} abiertas{capaOverdue>0?<span style={{color:K.red,fontWeight:700}}> · {capaOverdue} vencidas</span>:""}</div>
            </div>
            <div style={{background:"#F8FAFC",border:`1px solid ${K.brd}`,borderRadius:10,padding:"18px",textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:K.txS,textTransform:"uppercase",marginBottom:4}}>Promedio días abierta</div>
              <div style={{fontSize:42,fontWeight:800,color:K.wrn}}>{promedioDias}</div>
              <div style={{fontSize:12,color:K.txS,marginTop:4}}>hasta el cierre, o hasta hoy si sigue abierta</div>
            </div>
          </div>

          {/* Charts row */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
            {/* Bar chart - by classification */}
            <div style={{border:`1px solid ${K.brd}`,borderRadius:10,padding:"18px"}}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:12,textTransform:"uppercase",color:K.txS}}>Por {isNC?"clasificación":"criticidad"}</div>
              <div style={{display:"flex",gap:12,height:120,alignItems:"flex-end"}}>
                {byCls.map(c=>{const mx=Math.max(...byCls.map(x=>x.count),1);return <div key={c.label} style={{flex:1,textAlign:"center"}}>
                  <div style={{fontSize:18,fontWeight:800,color:c.color}}>{c.count}</div>
                  <div style={{height:Math.max((c.count/mx)*80,4),background:c.color,borderRadius:5,opacity:.8,marginTop:4}}/>
                  <div style={{fontSize:10,fontWeight:600,color:K.txS,marginTop:6}}>{c.label}</div>
                </div>;})}
              </div>
            </div>
            {/* Pie chart - by source/sector */}
            <div style={{border:`1px solid ${K.brd}`,borderRadius:10,padding:"18px"}}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:12,textTransform:"uppercase",color:K.txS}}>Por {isNC?"fuente de detección":"sector"}</div>
              <div style={{display:"flex",alignItems:"center",gap:20}}>
                {/* CSS pie */}
                <div style={{width:100,height:100,borderRadius:"50%",background:(()=>{
                  if(bySource.length===0)return "#E5E7EB";
                  const total=bySource.reduce((s,x)=>s+x.count,0);
                  let acc=0;const stops=[];
                  bySource.forEach((s,i)=>{const pct=(s.count/total)*100;stops.push(`${PIE_COLORS[i%PIE_COLORS.length]} ${acc}% ${acc+pct}%`);acc+=pct;});
                  return `conic-gradient(${stops.join(",")})`;
                })(),flexShrink:0}}/>
                <div style={{flex:1}}>
                  {bySource.map((s,i)=><div key={s.label} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                    <div style={{width:10,height:10,borderRadius:3,background:PIE_COLORS[i%PIE_COLORS.length],flexShrink:0}}/>
                    <span style={{fontSize:11.5,flex:1}}>{s.label}</span>
                    <span style={{fontSize:12,fontWeight:700}}>{s.count}</span>
                  </div>)}
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ── SLIDE 3: DETALLE ── */}
        <div style={{padding:"36px 50px"}}>
          <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>DETALLE DE PENDIENTES</div>
          <div style={{fontSize:13,color:K.txS,marginBottom:20}}>{yrItems.length} {isNC?"No Conformidades":"Desvíos"} {yr} — al cierre de {mo}{noCaseStr}</div>

          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#1B1E25",color:"#fff"}}>
              <th style={{padding:"10px 8px",textAlign:"left",fontWeight:700,fontSize:10.5,textTransform:"uppercase",letterSpacing:".04em"}}>N°</th>
              <th style={{padding:"10px 8px",textAlign:"left",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Fecha</th>
              <th style={{padding:"10px 8px",textAlign:"center",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Días</th>
              <th style={{padding:"10px 8px",textAlign:"left",fontWeight:700,fontSize:10.5,textTransform:"uppercase",width:"40%"}}>Descripción</th>
              <th style={{padding:"10px 8px",textAlign:"left",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>{isNC?"Detección":"Sector"}</th>
              <th style={{padding:"10px 8px",textAlign:"left",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>{isNC?"Clasif.":"Tipo"}</th>
              <th style={{padding:"10px 8px",textAlign:"center",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Estado</th>
              <th style={{padding:"10px 8px",textAlign:"center",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>CAPA</th>
            </tr></thead>
            <tbody>
              {/* Sobre una copia: `sort` ordena en el lugar, y este arreglo es el
                  estado de la aplicación. Ordenarlo acá reordenaría además las
                  listas de NC y de desvíos, sin que nadie lo hubiera pedido. */}
              {[...yrItems].sort((a,b)=>fecha0(isNC?a.openDate:a.date)-fecha0(isNC?b.openDate:b.date)).map((x,i)=>{
                const isClosed=isNC?x.phase==="cerrada":x.phase==="cerrado";
                const dt=isNC?x.openDate:x.date;
                const days=daysSince(dt);
                const num=x.code.match(/\d+/)?.[0]||String(i+1);
                const det=isNC?x.source:(x.sector||"—");
                const cls=isNC?(CLASSIFICATIONS.find(c=>c.id===x.classification)?.label||"—"):(x.critical?"Crítico":"No Crítico");
                const clsColor=isNC?(CLASSIFICATIONS.find(c=>c.id===x.classification)?.color||K.txM):(x.critical?K.red:K.pri);
                const linked=isNC?capas.filter(c=>c.ncId===x.id):capas.filter(c=>c.devId===x.id);
                const lclosed=linked.filter(c=>c.status==="Cerrado").length;
                const stripe=i%2===0?"#fff":"#F8FAFC";
                return <tr key={x.id} style={{background:stripe}}>
                  <td style={{padding:"10px 8px",fontWeight:700,color:K.pri,fontFamily:"monospace"}}>{num}</td>
                  <td style={{padding:"10px 8px",whiteSpace:"nowrap"}}>{fd(dt)}</td>
                  <td style={{padding:"10px 8px",textAlign:"center",fontWeight:700,color:days>90?K.red:days>30?K.wrn:K.txS}}>{days}</td>
                  <td style={{padding:"10px 8px",fontSize:11.5,lineHeight:1.4}}>{x.description}</td>
                  <td style={{padding:"10px 8px",fontSize:11.5}}>{det}</td>
                  <td style={{padding:"10px 8px"}}><span style={{padding:"2px 8px",borderRadius:12,fontSize:10.5,fontWeight:600,color:clsColor,background:clsColor+"15"}}>{cls}</span></td>
                  <td style={{padding:"10px 8px",textAlign:"center"}}><span style={{padding:"3px 10px",borderRadius:12,fontSize:10.5,fontWeight:700,color:isClosed?K.grn:K.red,background:isClosed?K.grnL:K.redL}}>{isClosed?"CERRADO":"ABIERTO"}</span></td>
                  <td style={{padding:"10px 8px",textAlign:"center",fontSize:11}}>{linked.length>0?<span style={{fontWeight:600}}>{lclosed}/{linked.length}</span>:"—"}</td>
                </tr>;
              })}
            </tbody>
          </table>
          <div style={{marginTop:16,fontSize:11,color:K.txS,borderTop:`1px solid ${K.brd}`,paddingTop:10}}>
            {title} {yr} — detalle al cierre de {mo} &nbsp;|&nbsp; Aseguramiento de Calidad · Vessena S.A.
          </div>
        </div>
      </div>
    </div>
  </div>);
}

/* ═══ ACCESOS ═══════════════════════════════════════════════════════════════
   Antes acá había un alta de usuarios propia de esta app. Se quitó porque era
   una trampa: editaba un padrón local que no controlaba el acceso, así que dar
   de alta a alguien no lo habilitaba y darlo de baja no lo sacaba. Queda un
   panel que dice dónde se administran de verdad. */
function Accesos({cu,rolRecurso}){
  const r=ROLES[rolRecurso]||{};
  return(<div>
    <h1 style={{fontSize:20,fontWeight:800,marginBottom:4}}>Accesos</h1>
    <p style={{color:K.txS,margin:"0 0 16px",fontSize:12.5}}>Quién entra y con qué rol lo decide el portal de calidad, no esta aplicación.</p>

    <div className="cfg-section">
      <h3>👤 Tu sesión</h3>
      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:8}}>
        <div style={{width:40,height:40,borderRadius:"50%",background:r.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{r.icon}</div>
        <div>
          <div style={{fontSize:14,fontWeight:700}}>{cu.nombre}</div>
          <div style={{fontSize:11.5,color:K.txS}}>{cu.usuario} · <span style={{color:r.color,fontWeight:600}}>{r.label||rolRecurso}</span></div>
        </div>
      </div>
    </div>

    <div className="cfg-section">
      <h3>🔑 Qué habilita cada rol en esta app</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:6}}>
        {Object.entries(ROLES).map(([k,v])=>
          <div key={k} style={{padding:"10px 14px",background:v.bg,borderRadius:8,border:`1px solid ${v.color}20`}}>
            <div style={{fontWeight:700,color:v.color,fontSize:13}}>{v.icon} {v.label}</div>
            <div style={{fontSize:12,color:K.txS,marginTop:4}}>
              {v.canAdmin?"Carga, edita y además puede eliminar registros y hacer la carga inicial."
                :v.canEdit?"Carga y edita no conformidades, desvíos y acciones. No puede eliminar."
                :"Solo lectura. Consulta e imprime, sin modificar nada."}
            </div>
          </div>
        )}
      </div>
    </div>

    <div className="cfg-section" style={{background:K.priL,borderColor:K.pri+"20"}}>
      <h3 style={{color:K.pri}}>➕ Dar acceso a alguien más</h3>
      <p style={{fontSize:12.5,color:K.txS,lineHeight:1.6,margin:"6px 0 0"}}>
        Los permisos viven en el padrón del portal, junto con los del resto de las aplicaciones.
        Para que una persona entre acá hace falta asignarle un rol en el recurso
        <code style={{fontFamily:"monospace",fontWeight:700,color:K.pri}}> no-conformidades-desvios</code>.
        Pedíselo a quien administre el portal.
      </p>
    </div>
  </div>);
}
