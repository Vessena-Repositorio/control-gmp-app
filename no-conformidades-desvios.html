rootCause:"A mitad de la jornada productiva se produjo un apagón energético generalizado en el barrio donde se ubica la planta, lo que provocó la interrupción abrupta de la línea de envasado y el reinicio de la impresora de etiquetas de cajas. La impresora no cuenta con memoria no volátil ni sistema de respaldo de energía ininterrumpible (UPS), por lo que al restablecerse el suministro eléctrico los datos del archivo de impresión cargado al inicio del turno se perdieron en su totalidad, sin posibilidad de recuperación automática. Al retomar la producción, el operario reenvió manualmente el archivo de etiqueta, seleccionando por error el correspondiente al SKU 61011882 (Fabuloso Pasión de Frutas 2L) en lugar del SKU 61011876 (1L).\n\nAnálisis de la falla de detección: el procedimiento vigente contempla la verificación obligatoria de datos de impresión (SKU, descripción, lote) como punto de control independiente tras cualquier reinicio de proceso. Dicho control fue correctamente ejecutado y documentado al inicio de la jornada, quedando evidencia del sticker en la hoja de control en proceso. Sin embargo, al reanudarse la producción luego del corte de energía, la verificación post-reinicio no fue ejecutada ni documentada, constituyendo un incumplimiento del procedimiento establecido.\n\nDel análisis se identifican tres factores contribuyentes concurrentes: (1) Vulnerabilidad técnica del equipo: la impresora de etiquetas carece de memoria no volátil y de respaldo de energía (UPS), lo que convierte cada corte eléctrico en un punto crítico de falla que requiere reconfiguración manual completa, exponiéndose al error humano en la selección del archivo. (2) Incumplimiento de procedimiento: el control post-reinicio establecido en el procedimiento no fue ejecutado. Se evidencia una brecha entre el procedimiento documentado y la práctica operativa, lo que indica necesidad de refuerzo de capacitación y supervisión en controles tras paradas no programadas. (3) Ausencia de barrera de verificación independiente: si bien el procedimiento asigna la verificación, no existe un segundo control cruzado (por ejemplo, validación por parte del Jefe de envasado o de Control de Calidad) que actúe como barrera redundante ante el incumplimiento del primer control, particularmente en situaciones de reinicio donde el riesgo de error es elevado.\n\nConclusión: la causa raíz es la combinación de una vulnerabilidad técnica del equipo (sin memoria ni respaldo) con la no ejecución del control post-reinicio previsto en el procedimiento. La falla no se origina en ausencia de procedimiento sino en incumplimiento del mismo, agravada por la falta de una barrera de verificación redundante y la limitación técnica del equipo.",

{id:"nc024",code:"NC-024-2026",phase:"implementacion",incidentDate:"2026-08-10",openDate:"2026-08-10",openedBy:"Gloria Nuñez",sector:"Seguimiento Gestión Productiva (Envasado)",description:"El 10/08/2026, durante una verificación en depósito de producto terminado, se detecta que el sticker de funda del SKU 5602 – PACK CRISTAL DETER LIMÓN 1,25 LTS presenta un código DUN-14 que no corresponde al producto: el DUN-14 impreso corresponde al SKU 2132 – PACK RELAX 900 ML. El alcance del evento comprende 45 pallets (234 unidades por pallet, fundas de 6 unidades cada una), totalizando 10.530 fundas del lote 6218UY20A1, todas en planta al momento de la detección. El producto envasado dentro de las fundas es correcto; la no conformidad se limita al código DUN-14 del sticker de funda, afectando la trazabilidad logística e identificación a nivel de unidad de despacho.",source:"Control Interno",associatedItem:"5602 – PACK CRISTAL DETER LIMÓN 1,25 LTS",lot:"6218UY20A1",

analysisNotes:"Método #1, #2, #3, #5: No existe procedimiento ni formulario que establezca la verificación del DUN-14 del sticker de funda como punto de control en proceso.\nMano de Obra #1, #2: Al no existir procedimiento ni punto de control definido, el personal no ha sido capacitado en esta verificación.\nMateriales #1, #2, #3: La etiqueta de funda fue impresa con un DUN-14 que no corresponde al SKU del producto. El sticker no fue verificado por CC ya que este dato no forma parte de los controles vigentes.",analysisDate:"2026-08-10",analyzedBy:"Gloria Nuñez",

  const[aviso,sAviso]=useState(null);

  /* Un mensaje breve arriba a la derecha. Antes guardar cerraba la ficha y ese
     cierre era todo el acuse de recibo; ahora la ficha queda abierta, así que
     hace falta decir explícitamente que se guardó. */
  const avisar=useCallback((texto,tipo="ok")=>{
    sAviso({texto,tipo,id:Date.now()});
    setTimeout(()=>sAviso(a=>(a&&a.texto===texto?null:a)),tipo==="error"?6000:2500);
  },[]);

  const cargarSesion=useCallback(async()=>{
    sEstado("cargando");
    try{
      const r=await fetch("/api/auth/yo",{credentials:"same-origin"});
      if(!r.ok){
        // Sin sesión se vuelve al portal, que es donde está el acceso.
        location.href="/?volver="+encodeURIComponent(location.pathname);
        return;
      }
      const d=await r.json();
      const rec=d.recursos&&d.recursos["no-conformidades-desvios"];
      sCu({usuario:d.usuario,nombre:d.nombre||d.usuario,email:d.email});
      sRol(rec?rec.rol:"vista");
      sEstado("listo");
    }catch(e){
      sErrConexion(e.message);
      sEstado("sin-conexion");
    }
  },[]);

  useEffect(()=>{cargarSesion();},[cargarSesion]);

  /* ─── Datos del año ───────────────────────────────────────────────────────
     Se recargan enteros al cambiar de año. Son unos cientos de registros: pedir
     de nuevo es más simple y más seguro que mantener cachés por año que pueden
     quedar viejas si otra persona cargó algo mientras tanto. */
  const cargarDatos=useCallback(async(anio)=>{
    sCargandoDatos(true);
    try{
      const d=await api(`/datos?anio=${anio}`);
      setNCs(d.ncs);setDevs(d.devs);setCapas(d.capas);setLogs(d.actividad);
      sAnios(d.anios||[]);
    }catch(e){
      avisar("No se pudieron cargar los datos: "+e.message,"error");
    }finally{
      sCargandoDatos(false);
    }
  },[avisar]);

  useEffect(()=>{if(estado==="listo")cargarDatos(yr);},[estado,yr,cargarDatos]);

  const logout=async()=>{
    // Se cierra en el servidor: borrar solo el estado local dejaría la sesión
    // viva y usable desde otra pestaña.
    try{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"});}catch(e){}
    location.href="/";
  };

  if(estado==="cargando")return <Cargando texto="Verificando la sesión…"/>;
  if(estado==="sin-conexion")return <SinConexion detalle={errConexion} onReintentar={cargarSesion}/>;

  const role=ROLES[rolRecurso]||ROLES.vista;
  const canEdit=role.canEdit;const canAdmin=role.canAdmin;

  /* ─── Escrituras ──────────────────────────────────────────────────────────
     Todas siguen la misma forma: mandar al servidor, y recién con la respuesta
     actualizar la pantalla. No se toca el estado antes de que el servidor
     confirme: mostrar el cambio y que la escritura falle en silencio es
     exactamente lo que hacía la versión que guardaba en el navegador. */

  const guardarNC=async(fm,{cerrar=false}={})=>{
    try{
      const{nc}=await api("/nc",{method:"POST",body:JSON.stringify(fm)});
      setNCs(p=>p.some(x=>x.id===nc.id)?p.map(x=>x.id===nc.id?nc:x):[nc,...p]);
      // El audit trail lo escribe el servidor; se relee para verlo al día.
      api("/datos?anio="+yr).then(d=>setLogs(d.actividad)).catch(()=>{});
      avisar("Guardado");
      if(cerrar)sNcDet(null);else sNcDet(nc);
      return nc;
    }catch(e){
      avisar("No se pudo guardar: "+e.message,"error");
      throw e;
    }
  };

  const openNC=async(existente)=>{
    if(existente){sNcDet(existente);return;}
    if(!canEdit)return;
    // El código lo asigna el servidor al insertar, no el navegador: si lo
    // calculara acá, dos personas creando a la vez llegarían al mismo número.
    try{
      const{nc}=await api("/nc",{method:"POST",body:JSON.stringify({
        phase:"abierta",incidentDate:"",openDate:tdy(),openedBy:cu.nombre,sector:"",
        description:"",source:"",associatedItem:"",lot:"",ishikawa:{},analysisNotes:"",
        analysisDate:"",analyzedBy:"",rootCause:"",severity:"",probability:"",
        classification:"",impactsOthers:"",impactDetail:"",capaType:"",conclusions:"",
        rootCauseEliminated:"",coverageComplete:"",negativeImpact:"",onTime:"",
        effectivenessNotes:"",closeDate:"",closedBy:"",closeNotes:"",
      })});
      setNCs(p=>[nc,...p]);sNcDet(nc);
    }catch(e){avisar("No se pudo crear la NC: "+e.message,"error");}
  };

  const deleteNC=async(id)=>{
    const n=ncs.find(x=>x.id===id);
    if(!confirm(`¿Eliminar ${n?.code||"esta NC"}? Sus acciones CAPA quedarán sin vincular.`))return;
    try{
      await api("/nc/"+encodeURIComponent(id),{method:"DELETE"});
      setNCs(p=>p.filter(x=>x.id!==id));sNcDet(null);
      cargarDatos(yr);
      avisar("No conformidad eliminada");
    }catch(e){avisar("No se pudo eliminar: "+e.message,"error");}
  };

  const guardarDev=async(fm,{cerrar=false}={})=>{
    try{
      const{dev}=await api("/desvios",{method:"POST",body:JSON.stringify(fm)});
      setDevs(p=>p.some(x=>x.id===dev.id)?p.map(x=>x.id===dev.id?dev:x):[dev,...p]);
      api("/datos?anio="+yr).then(d=>setLogs(d.actividad)).catch(()=>{});
      avisar("Guardado");
      if(cerrar)sDevDet(null);else sDevDet(dev);
      return dev;
    }catch(e){
      avisar("No se pudo guardar: "+e.message,"error");
      throw e;
    }
  };

  const openDev=async(existente)=>{
    if(existente){sDevDet(existente);return;}
    if(!canEdit)return;
    try{
      const{dev}=await api("/desvios",{method:"POST",body:JSON.stringify({
        phase:"abierto",openedBy:cu.nombre,sector:"",date:tdy(),associatedItem:"",lot:"",
        description:"",justification:"",impacts:{},impactNotes:"",riskControlled:"",
        riskNotes:"",critical:false,planned:"No Planificado",priority:"",decision:"",
        verifiers:"",notifications:"",docComplete:"",approvedBy:"",closeDate:"",closeNotes:"",
      })});
      setDevs(p=>[dev,...p]);sDevDet(dev);
    }catch(e){avisar("No se pudo crear el desvío: "+e.message,"error");}
  };

  const deleteDev=async(id)=>{
    const d=devs.find(x=>x.id===id);
    if(!confirm(`¿Eliminar ${d?.code||"este desvío"}? Sus acciones quedarán sin vincular.`))return;
    try{
      await api("/desvios/"+encodeURIComponent(id),{method:"DELETE"});
      setDevs(p=>p.filter(x=>x.id!==id));sDevDet(null);
      cargarDatos(yr);
      avisar("Desvío eliminado");
    }catch(e){avisar("No se pudo eliminar: "+e.message,"error");}
  };

  /* Acciones CAPA. Las usan tanto el módulo de CAPA como la etapa de
     Implementación de un desvío: una acción escrita ahí es una fila de la misma
     tabla, con las mismas alertas de vencimiento. */
  const guardarCapa=async(fm)=>{
    const{capa}=await api("/capa",{method:"POST",body:JSON.stringify(fm)});
    setCapas(p=>p.some(x=>x.id===capa.id)?p.map(x=>x.id===capa.id?capa:x):[...p,capa]);
    api("/datos?anio="+yr).then(d=>setLogs(d.actividad)).catch(()=>{});
    return capa;
  };
  const borrarCapa=async(id)=>{
    await api("/capa/"+encodeURIComponent(id),{method:"DELETE"});
    setCapas(p=>p.filter(x=>x.id!==id));
    api("/datos?anio="+yr).then(d=>setLogs(d.actividad)).catch(()=>{});
  };

  const allYears=[...new Set([...anios,yr])].sort((a,b)=>a-b);

  const data={
    ncs,devs,capas,logs,yr,currentUser:cu,
    guardarCapa,borrarCapa,avisar,canAdmin,
    recargar:()=>cargarDatos(yr),
  };
  const nv=[...NAV];if(canAdmin)nv.push({k:"users",l:"Accesos",i:"👥"});

  return(<div style={{background:K.bg,minHeight:"100vh"}}>
    <div style={{width:col?52:220,background:K.txt,color:"#fff",display:"flex",flexDirection:"column",position:"fixed",top:0,left:0,bottom:0,zIndex:10,transition:"width .2s"}}>
      <div style={{padding:col?"16px 8px":"16px 14px",borderBottom:"1px solid rgba(255,255,255,.08)",textAlign:col?"center":"left"}}>{col?<span style={{fontSize:15,fontWeight:800}}>V</span>:<div><div style={{fontSize:10,fontWeight:800,color:K.ves,letterSpacing:".1em",textTransform:"uppercase"}}>Vessena S.A.</div><div style={{fontSize:13.5,fontWeight:700,marginTop:2}}>NC / CAPA & Desvíos</div></div>}</div>
      {!col&&<div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,.06)",display:"flex",alignItems:"center",gap:8}}><div style={{width:28,height:28,borderRadius:"50%",background:role.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>{role.icon}</div><div style={{flex:1,overflow:"hidden"}}><div style={{fontSize:12,fontWeight:600,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cu.nombre}</div><div style={{fontSize:10,color:role.color}}>{role.label}</div></div></div>}
      {!col&&<div style={{padding:"8px 14px",borderBottom:"1px solid rgba(255,255,255,.06)"}}><div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,.4)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>SOP-AC-036</div><div style={{fontSize:11,color:"rgba(255,255,255,.6)"}}>No Conformidades / CAPA</div></div>}
      {/* Year selector */}
      <div style={{padding:col?"6px 4px":"8px 14px",borderBottom:"1px solid rgba(255,255,255,.06)",display:"flex",alignItems:"center",justifyContent:"center",gap:col?2:8}}>
        {/* Los extremos se acotan a los años que tienen algo cargado (más el
            actual y el siguiente): sin esto se podía navegar indefinidamente
            hacia atrás por años vacíos creyendo que se habían perdido datos. */}
        {(()=>{const min=Math.min(...allYears),max=Math.max(...allYears,new Date().getFullYear()+1);return<>
          <button onClick={()=>sYr(y=>Math.max(min,y-1))} disabled={yr<=min} title={yr<=min?"No hay registros anteriores":""} style={{background:"none",border:"none",color:yr<=min?"rgba(255,255,255,.15)":"rgba(255,255,255,.5)",fontSize:14,cursor:yr<=min?"default":"pointer",padding:"2px 4px",fontFamily:"inherit"}}>◀</button>
          <span style={{fontSize:col?13:16,fontWeight:800,color:"#fff",minWidth:col?30:50,textAlign:"center"}}>{yr}</span>
          <button onClick={()=>sYr(y=>Math.min(max,y+1))} disabled={yr>=max} style={{background:"none",border:"none",color:yr>=max?"rgba(255,255,255,.15)":"rgba(255,255,255,.5)",fontSize:14,cursor:yr>=max?"default":"pointer",padding:"2px 4px",fontFamily:"inherit"}}>▶</button>
        </>;})()}
      </div>
      <nav style={{flex:1,padding:"6px 0",overflowY:"auto"}}>{nv.map(n=><div key={n.k} onClick={()=>sPg(n.k)} title={n.l} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 14px",cursor:"pointer",background:pg===n.k?"rgba(255,255,255,.1)":"transparent",borderRadius:5,margin:"1px 6px",fontSize:12.5,fontWeight:pg===n.k?600:400,color:pg===n.k?"#fff":"rgba(255,255,255,.6)",borderTop:n.k==="users"?"1px solid rgba(255,255,255,.06)":"none",marginTop:n.k==="users"?6:1}}><span style={{fontSize:14,flexShrink:0}}>{n.i}</span>{!col&&<span>{n.l}</span>}</div>)}</nav>
      <div style={{padding:"6px",borderTop:"1px solid rgba(255,255,255,.08)"}}><div onClick={logout} style={{display:"flex",alignItems:"center",justifyContent:col?"center":"flex-start",gap:8,padding:"9px 14px",cursor:"pointer",borderRadius:5,margin:"1px 6px",fontSize:12.5,color:"rgba(255,255,255,.5)"}}><span>🚪</span>{!col&&<span>Salir</span>}</div><div onClick={()=>sCol(!col)} style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"8px",cursor:"pointer",fontSize:12,color:"rgba(255,255,255,.4)"}}>{col?"▸":"◂"}</div></div>
    </div>
    <div style={{marginLeft:col?52:220,padding:"20px 28px",transition:"margin .2s"}}>
      {cargandoDatos&&<div style={{fontSize:12,color:K.txM,marginBottom:8}}>Cargando datos de {yr}…</div>}
      {pg==="nc"&&<NCList data={data} canEdit={canEdit} openNC={openNC}/>}
      {pg==="dev"&&<DevList data={data} canEdit={canEdit} openDev={openDev}/>}
      {pg==="capa"&&<CAPAList data={data} canEdit={canEdit}/>}
      {pg==="trail"&&<Trail logs={logs}/>}
      {pg==="rep"&&<Reports data={data} canAdmin={canAdmin} onImportar={cargarDatos}/>}
      {pg==="guide"&&<GuidePage goTo={sPg}/>}
      {pg==="users"&&canAdmin&&<Accesos cu={cu} rolRecurso={rolRecurso}/>}
    </div>

    {/* Acuse de recibo de las escrituras. Guardar ya no cierra la ficha, así que
        sin esto no habría señal de que el servidor confirmó. */}
    {aviso&&<div style={{position:"fixed",top:16,right:20,zIndex:300,background:aviso.tipo==="error"?K.red:K.grn,color:"#fff",padding:"10px 16px",borderRadius:8,fontSize:12.5,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.18)",maxWidth:420}}>{aviso.texto}</div>}

    {ncDet&&<NCDetail nc={ncDet} data={data} canEdit={canEdit} canAdmin={canAdmin} onClose={()=>sNcDet(null)} onSave={guardarNC} onDelete={deleteNC}/>}
    {devDet&&<DevDetail dev={devDet} data={data} canEdit={canEdit} canAdmin={canAdmin} onClose={()=>sDevDet(null)} onSave={guardarDev} onDelete={deleteDev}/>}
  </div>);
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
