        body {

            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { color: #2d3748; font-size: 28px; font-weight: 700; }
        .logo { color: #667eea; font-weight: 800; font-size: 24px; }
        .main-content { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; }
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; background: #f7fafc; flex-wrap: wrap; }
        .tab {
            padding: 18px 30px; cursor: pointer; border: none; background: none;
            font-size: 15px; font-weight: 600; color: #718096; transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        .tab:hover { background: #edf2f7; color: #4a5568; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; background: white; }
        .content { padding: 30px; }
        .form-section { margin-bottom: 30px; }
        .section-title {
            font-size: 20px; font-weight: 700; color: #2d3748;
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; color: #4a5568; margin-bottom: 8px; font-size: 14px; }
        select, input, textarea {
            padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;
            font-size: 15px; transition: all 0.3s; font-family: inherit;
        }
        select:focus, input:focus, textarea:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600;
            font-size: 15px; cursor: pointer; transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a67d8; transform: translateY(-2px); }
        .btn-secondary { background: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-success { background: #38a169; color: white; }
        .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: white; }
        .btn-danger:hover { background: #c53030; }
        .button-group { display: flex; gap: 15px; margin-top: 30px; padding-top: 20px; border-top: 2px solid #e2e8f0; flex-wrap: wrap; }
        .alert { padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
        .alert-success { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
        .alert-warning { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
        .alert-info { background: #bee3f8; color: #2c5282; border-left: 4px solid #3182ce; }
        .tipo-control-selector {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-top: 15px;
        }
        .tipo-control-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 8px;
            padding: 20px; cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .tipo-control-card:hover { border-color: #667eea; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2); }
        .tipo-control-card.selected { border-color: #667eea; background: #eef2ff; }
        .tipo-control-icon { font-size: 32px; margin-bottom: 10px; }
        .tipo-control-title { font-weight: 700; color: #2d3748; margin-bottom: 5px; font-size: 16px; }
        .tipo-control-desc { font-size: 12px; color: #718096; }
        .measurement-table { width: 100%; overflow-x: auto; margin-top: 15px; }
        .measurement-table table { width: 100%; min-width: 800px; border-collapse: collapse; }
        .measurement-table th {
            background: #667eea; color: white; padding: 10px;
            text-align: left; font-weight: 600; font-size: 12px;
        }
        .measurement-table td { padding: 8px; border: 1px solid #e2e8f0; }
        .measurement-table tr:nth-child(even) { background: #f7fafc; }
        .measurement-table input { width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; }
        .spec-info { font-size: 11px; color: #718096; margin-top: 2px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #718096; }
        .empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.3; }
        .orden-card, .control-card {
            background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 20px; margin-bottom: 20px;
        }
        /* Cards colapsables (details) — ocultar el marker nativo del navegador */
        details.control-card, details.orden-card { padding: 0 !important; }
        details.control-card > summary, details.orden-card > summary { list-style: none; }
        details.control-card > summary::-webkit-details-marker,
        details.orden-card > summary::-webkit-details-marker { display: none; }
        details.control-card[open] > summary > div > span:first-child,
        details.orden-card[open] > summary > div > span:first-child { transform: rotate(90deg); display: inline-block; transition: transform .15s; }
        details.control-card > summary > div > span:first-child,
        details.orden-card > summary > div > span:first-child { transition: transform .15s; display: inline-block; }
        details.control-card > summary:hover, details.orden-card > summary:hover { background: #f7fafc; }
        .orden-header, .control-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0;

        .orden-title, .control-title { font-weight: 700; color: #2d3748; font-size: 18px; }

        .status-active { background: #bee3f8; color: #2c5282; }
        .status-ok { background: #c6f6d5; color: #22543d; }

        .orden-detail { font-size: 14px; color: #4a5568; }

        .control-item {

        .control-item.validacion { border-left-color: #9f7aea; background: #faf5ff; }
        .control-item.quincenal { border-left-color: #ed8936; background: #fffaf0; }
        .control-item.semanal { border-left-color: #38b2ac; background: #e6fffa; }
        .control-item.proceso { border-left-color: #38a169; }
        .control-info { flex: 1; }
        .control-hora { font-weight: 700; color: #2d3748; margin-right: 15px; }
        .control-tipo { font-size: 13px; color: #718096; }

            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);

        .stat-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7); display: flex; align-items: center;
            justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: white; border-radius: 12px; max-width: 900px; width: 100%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

        .modal-header {
            padding: 20px 25px; border-bottom: 2px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: white; z-index: 10;
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #2d3748; }
        .modal-close {
            background: #edf2f7; border: none; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-body { padding: 25px; }
        .detalle-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .detalle-item { padding: 12px; background: #f7fafc; border-radius: 6px; border-left: 3px solid #667eea; }
        .detalle-label { font-size: 12px; color: #718096; margin-bottom: 4px; }
        .detalle-value { font-size: 16px; font-weight: 600; color: #2d3748; }
        .search-box { position: relative; }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #718096; font-size: 16px; pointer-events: none;
        }
        .search-box input { padding-left: 40px; }
        .filtros-section { background: #f7fafc; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .filtros-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
        }
        .alerta-oos {
            background: #fff5f5; border: 2px solid #fc8181; border-radius: 8px;
            padding: 15px; margin-bottom: 15px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .alerta-oos-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .alerta-oos-icon { font-size: 24px; }
        .alerta-oos-titulo { font-weight: 700; color: #742a2a; }
        .alerta-oos-detalle { font-size: 14px; color: #4a5568; margin-left: 34px; }
        .export-multiple { background: #805ad5; color: white; }
        .export-multiple:hover { background: #6b46c1; }
        .btn-export { background: #38a169; color: white; }
        .btn-export:hover { background: #2f855a; }
        .btn-print { background: #3182ce; color: white; }
        .btn-print:hover { background: #2c5282; }
        .dias-activa {
            display: inline-block; padding: 4px 8px; background: #fef5e7;
            color: #744210; border-radius: 4px; font-size: 12px; font-weight: 600; margin-left: 10px;

        .dias-activa.warning { background: #fed7d7; color: #742a2a; }
        .separator {
            height: 2px; background: linear-gradient(to right, transparent, #e2e8f0, transparent);
            margin: 30px 0;
        }
        @media (max-width: 768px) {
            .tipo-control-selector { grid-template-columns: 1fr; }
        }

        // Slots horarios de muestreo cada 2 h
        const HORARIOS_SLOTS = ['06:00', '08:00', '10:00', '12:00', '14:00', '16:30'];
        function slotActual() {
            const now = new Date();
            const min = now.getHours() * 60 + now.getMinutes();
            let mejor = HORARIOS_SLOTS[0], mejorDelta = Infinity;
            for (const s of HORARIOS_SLOTS) {
                const [h, m] = s.split(':').map(Number);
                const d = Math.abs(min - (h * 60 + m));
                if (d < mejorDelta) { mejorDelta = d; mejor = s; }
            }
            return mejor;
        }

        // Helper para llamadas a la API de Google Sheets
        async function apiCall(action, data = null, params = {}) {
            const url = new URL(GOOGLE_SCRIPT_URL);
            url.searchParams.set('action', action);
            Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

            const options = data
                ? { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain' } }
                : { method: 'GET' };
            
            // Google redirige, hay que seguir la redirección
            const response = await fetch(url.toString(), { ...options, redirect: 'follow' });
            return response.json();
        }

        const USUARIOS = {

        async function sha256Hex(texto) {
            const enc = new TextEncoder().encode(texto);
            const hash = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

            // === CONFIGURACIÓN DE REGLAS DE PROCESO ===
            // Turnos fijos: mañana 06-14, tarde 14-22, noche 22-06 (ver getTurnoActual)
            // Auto-cierre: al finalizar el turno + margen
            const MARGEN_CIERRE_HORAS = 1;  // margen para dejar cerrar el último control del turno
            const HORA_FIN_MANANA = 14;     // fin turno mañana → cierra a 14 + margen
            const HORA_FIN_TARDE  = 22;     // fin turno tarde  → cierra a 22 + margen

            // CASO ESPECIAL FABULOSO: un solo turno extendido 06:00 - 17:30
            // Envases Fabuloso (FAB-1L, FAB-2L) → cierre a 17:30 + margen = 18:30
            const HORA_FIN_FABULOSO = 17;
            const MIN_FIN_FABULOSO  = 30;
            const esFabulosoEnvase = (env) => env === 'FAB-1L' || env === 'FAB-2L';

            // === REGLA DE ARRANQUE CADA 15 DÍAS ===
            // Ver lista dinámica ENVASES_ARRANQUE_15_DIAS_ACTIVOS (según modo)
            const ENVASES_ARRANQUE_15_DIAS = ENVASES_15_DIAS_ACTIVOS;
            const DIAS_ARRANQUE = 15;

            // Máquinas disponibles (dropdown al crear/editar orden) — según modo
            const MAQUINAS = MAQUINAS_ACTIVAS;

            /* Devuelve { requiere, razon, diasDesdeUltimoArranque, ultimoArranqueFecha }
               Busca el ÚLTIMO ARRANQUE del MISMO ENVASE en todas las órdenes históricas
               (las órdenes se auto-cierran cada turno pero los controles quedan guardados
               para siempre). Como cada máquina es dedicada a un envase, esto refleja
               correctamente cuándo fue el último arranque de esa línea de producción.

               requiere=true en dos casos:
               1) No hay ningún control de arranque previo para este envase
               2) El envase está en la lista de 15 días Y pasaron >= 15 días
                  desde el último arranque */
            const chequearArranque = (envase, ordenesArr) => {
                let ultimoArranqueMs = 0;
                let ultimoArranqueFecha = null;
                for (const o of ordenesArr) {
                    if (o.envase !== envase) continue;
                    if (!o.controles) continue;
                    for (const c of o.controles) {
                        if (c.tipo === 'arranque' && c.timestamp) {
                            const t = new Date(c.timestamp).getTime();
                            if (!isNaN(t) && t > ultimoArranqueMs) {
                                ultimoArranqueMs = t;
                                ultimoArranqueFecha = normalizeFecha(c.fecha || c.timestamp);
                            }
                        }
                    }
                }

                // CASO 1: nunca hubo arranque de este envase
                if (ultimoArranqueMs === 0) {
                    return {
                        requiere: true,
                        razon: 'sin_arranque_previo',
                        diasDesdeUltimoArranque: null,
                        ultimoArranqueFecha: null
                    };
                }

                // CASO 2: envase 15-días con arranque >= 15 días
                const dias = Math.floor((Date.now() - ultimoArranqueMs) / 86400000);
                if (ENVASES_ARRANQUE_15_DIAS.includes(envase) && dias >= DIAS_ARRANQUE) {
                    return {
                        requiere: true,
                        razon: '15_dias',
                        diasDesdeUltimoArranque: dias,
                        ultimoArranqueFecha
                    };
                }

                return {
                    requiere: false,
                    diasDesdeUltimoArranque: dias,
                    ultimoArranqueFecha
                };
            };

            // Helper: calcula el momento en que una orden debería cerrarse según su turno
            const calcularHoraCierre = (orden) => {
                const creadoMs = (typeof orden.id === 'number' && orden.id > 1e12) ? orden.id : null;
                if (!creadoMs) return null;
                const creado = new Date(creadoMs);

                // CASO ESPECIAL: Fabuloso (turno único 06:00-17:30 + 1h margen = 18:30)
                if (esFabulosoEnvase(orden.envase)) {
                    const cierre = new Date(creado);
                    // 17:30 + 1h margen = 18:30
                    cierre.setHours(HORA_FIN_FABULOSO + MARGEN_CIERRE_HORAS, MIN_FIN_FABULOSO, 0, 0);
                    return cierre;
                }

                // Turnos estándar: determinar el turno (prioridad al campo guardado, fallback por hora)
                let turno = orden.turno;
                if (turno !== 'mañana' && turno !== 'tarde' && turno !== 'noche') {
                    const h = creado.getHours();
                    if (h >= 6 && h < 14) turno = 'mañana';
                    else if (h >= 14 && h < 22) turno = 'tarde';
                    else turno = 'noche';
                }

                const cierre = new Date(creado);
                if (turno === 'mañana') {
                    // Cierra hoy a 14:00 + margen
                    cierre.setHours(HORA_FIN_MANANA + MARGEN_CIERRE_HORAS, 0, 0, 0);
                } else if (turno === 'tarde') {
                    // Cierra hoy a 22:00 + margen
                    cierre.setHours(HORA_FIN_TARDE + MARGEN_CIERRE_HORAS, 0, 0, 0);
                } else {
                    // Noche: cierra a 06:00 + margen del día siguiente.
                    // Si la orden se abrió entre 22:00 y 23:59, el fin de turno es "mañana"
                    if (creado.getHours() >= 22) {
                        cierre.setDate(cierre.getDate() + 1);
                    }
                    cierre.setHours(HORA_FIN_NOCHE + MARGEN_CIERRE_HORAS, 0, 0, 0);
                }
                return cierre;
            };

            // Helper: normaliza cualquier formato de fecha a "YYYY-MM-DD"
            const normalizeFecha = (f) => {
                if (f == null || f === '') return '';
                const s = String(f).trim();
                const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (m) return `${m[1]}-${m[2]}-${m[3]}`;
                const d = new Date(s);
                if (!isNaN(d.getTime())) {
                    return d.getUTCFullYear() + '-' +
                           String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
                           String(d.getUTCDate()).padStart(2, '0');
                }
                return s;
            };

            // Helper: tiempo transcurrido en formato legible
            const tiempoTranscurrido = (msDesde) => {
                if (!msDesde || msDesde <= 0) return '';
                const min = Math.floor(msDesde / 60000);
                if (min < 60) return `hace ${min} min`;
                const h = Math.floor(min / 60);
                if (h < 24) return `hace ${h} h`;
                const d = Math.floor(h / 24);
                return `hace ${d} día${d !== 1 ? 's' : ''}`;
            };

            // Cargar datos desde Google Sheets al iniciar
            const cargarDatos = async () => {
                if (!configurado) { setCargando(false); return; }
                try {
                    setCargando(true);
                    const result = await apiCall(endpoint('getAll'));
                    if (result.error) throw new Error(result.error);

                    // === AUTO-CIERRE de órdenes activas al finalizar el turno + margen ===
                    const ahora = Date.now();
                    const ordenesRecibidas = result.ordenes || [];
                    const ordenesParaCerrar = [];
                    const ordenesFinales = ordenesRecibidas.map(o => {
                        if (o.estado !== 'activa') return o;
                        const horaCierre = calcularHoraCierre(o);
                        if (horaCierre && ahora > horaCierre.getTime()) {
                            const motivo = esFabulosoEnvase(o.envase)
                                ? `auto-cierre Fabuloso 17:30 (+${MARGEN_CIERRE_HORAS}h)`
                                : `auto-cierre fin turno ${o.turno || ''} (+${MARGEN_CIERRE_HORAS}h)`.trim();
                            const cerrada = {
                                ...o,
                                estado: 'finalizada',
                                motivoCierre: motivo,
                                fechaCierre: new Date().toISOString()
                            };
                            ordenesParaCerrar.push(cerrada);
                            return cerrada;

                        return o;
                    });

                    setOrdenesSoplado(ordenesFinales);
                    setControlesLCC(result.lcc || []);
                    localStorage.setItem('ordenes_soplado', JSON.stringify(ordenesFinales));
                    localStorage.setItem('controles_lcc', JSON.stringify(result.lcc || []));

                    // Sincronizar cierres al Sheet en segundo plano (no bloquea la UI)
                    if (ordenesParaCerrar.length > 0) {
                        console.log(`[Auto-cierre] Cerrando ${ordenesParaCerrar.length} orden(es) por fin de turno + ${MARGEN_CIERRE_HORAS}h de margen`);
                        ordenesParaCerrar.forEach(orden => {
                            apiCall(endpoint('updateOrden'), orden).catch(err =>
                                console.error('Error auto-cerrando orden', orden.numeroOrden, err)
                            );
                        });
                    }
                } catch (err) {
                    console.error('Error cargando datos:', err);
                    setMensaje({ tipo: 'warning', texto: '⚠️ Error al conectar con Google Sheets. Verificá la URL del script.' });
                    // Fallback a localStorage
                    const storedOrdenes = localStorage.getItem('ordenes_soplado');
                    const storedLCC = localStorage.getItem('controles_lcc');
                    if (storedOrdenes) setOrdenesSoplado(JSON.parse(storedOrdenes));
                    if (storedLCC) setControlesLCC(JSON.parse(storedLCC));
                } finally {
                    setCargando(false);
                }
            };

            useEffect(() => { cargarDatos(); }, [modoProducto]);

            // Auto-sincronización cada 5 minutos
            useEffect(() => {
                if (!configurado) return;
                const intervalo = setInterval(() => {
                    cargarDatos();
                }, 5 * 60 * 1000);
                return () => clearInterval(intervalo);
            }, [configurado]);

            // Guardar órdenes en Google Sheets (y localStorage como backup)
            const guardarOrdenes = (nuevasOrdenes) => {
                localStorage.setItem('ordenes_soplado', JSON.stringify(nuevasOrdenes));
                setOrdenesSoplado(nuevasOrdenes);
            };

            // Guardar controles LCC en Google Sheets (y localStorage como backup)
            const guardarControlesLCC = (nuevosControles) => {
                localStorage.setItem('controles_lcc', JSON.stringify(nuevosControles));
                setControlesLCC(nuevosControles);
            };

            const crearNuevaOrden = async () => {
                if (guardando) return; // guardia anti-doble-click
                if (!nuevaOrdenData.numeroOrden || !nuevaOrdenData.envase || !nuevaOrdenData.maquina || !nuevaOrdenData.operador) {
                    setMensaje({ tipo: 'warning', texto: 'Complete todos los campos obligatorios (número de orden, envase, máquina y operador de máquina)' });
                    return;
                }

                // Anti-duplicado: si hace menos de 30 seg se creó una orden con el mismo
                // número, envase y operador → bloquear (típico doble click)
                const ultimaMismoNumero = ordenesSoplado.find(o =>
                    o.numeroOrden === nuevaOrdenData.numeroOrden
                    && o.envase === nuevaOrdenData.envase
                    && o.operador === nuevaOrdenData.operador
                );
                if (ultimaMismoNumero && typeof ultimaMismoNumero.id === 'number') {
                    const hace = Date.now() - ultimaMismoNumero.id;
                    if (hace < 30000) {
                        setMensaje({
                            tipo: 'warning',
                            texto: `⚠ Ya existe una orden ${nuevaOrdenData.numeroOrden} de ${nuevaOrdenData.envase} creada hace ${Math.round(hace/1000)} segundos. Si es diferente, cambiá el número de orden.`
                        });
                        return;
                    }
                    setMensaje({
                        tipo: 'warning',
                        texto: `⚠ Ya existe una orden con el número ${nuevaOrdenData.numeroOrden}. Verificá que sea correcto antes de continuar.`
                    });
                }

                setGuardando(true);
                const id = Date.now();
                const campaign_id = campanaSeleccionada ? campanaSeleccionada.campaign_id : id;
                const nuevaOrden = {
                    id, ...nuevaOrdenData,
                    analista: usuarioLogueado.nombre,
                    createdBy: usuarioLogueado.username,
                    estado: 'activa', controles: [],
                    createdAt: new Date().toISOString(),
                    campaign_id
                };
                guardarOrdenes([nuevaOrden, ...ordenesSoplado]);
                
                // Enviar a Google Sheets
                if (configurado) {
                    try {
                        await apiCall(endpoint('saveOrden'), nuevaOrden);
                    } catch (err) {
                        console.error('Error guardando en Sheets:', err);
                        setMensaje({ tipo: 'warning', texto: '⚠️ Guardado local OK, pero falló la sincronización con Google Sheets' });
                    }
                }
                setGuardando(false);
                const msgCampana = campanaSeleccionada 
                    ? ` (continuación de campaña ${campanaSeleccionada.envase})`
                    : ' (nueva campaña iniciada)';
                setMensaje({ tipo: 'success', texto: `✓ Orden ${nuevaOrdenData.numeroOrden} creada${msgCampana}` });
                setMostrarNuevaOrden(false);
                setCampanaSeleccionada(null);
                setNuevaOrdenData({
                    numeroOrden: '', envase: '', fecha: new Date().toISOString().split('T')[0],
                    operador: '', turno: getTurnoActual(), maquina: ''
                });
            };

            // Obtiene campañas activas (al menos 1 orden con estado='activa')
            // Garantiza 1 campaña activa por envase como máximo (la más reciente)
            const obtenerCampanasActivas = () => {
                const grupos = {};
                ordenesSoplado.forEach(o => {
                    const cid = o.campaign_id || o.id;
                    if (!grupos[cid]) {
                        grupos[cid] = {
                            campaign_id: cid,
                            envase: o.envase,
                            ordenes: [],
                            primeraFecha: o.fecha,
                            tieneActiva: false
                        };
                    }
                    grupos[cid].ordenes.push(o);
                    if (o.estado === 'activa') grupos[cid].tieneActiva = true;
                    if (new Date(o.fecha) < new Date(grupos[cid].primeraFecha)) {
                        grupos[cid].primeraFecha = o.fecha;
                    }
                });
                const activas = Object.values(grupos).filter(g => g.tieneActiva);
                
                // Si hay duplicados por envase, quedarse con la más reciente
                const porEnvase = {};
                activas.forEach(c => {
                    const fecha = new Date(c.primeraFecha).getTime();
                    if (!porEnvase[c.envase] || fecha > new Date(porEnvase[c.envase].primeraFecha).getTime()) {
                        porEnvase[c.envase] = c;
                    }
                });
                return Object.values(porEnvase);
            };

            const finalizarCampana = async (campaign_id) => {
                if (!confirm('¿Finalizar la campaña? Todas las órdenes activas pasarán a estado "finalizada".')) return;
                
                // Actualizar localmente
                const ordenesActualizadas = ordenesSoplado.map(o => {
                    const cid = o.campaign_id || o.id;
                    if (String(cid) === String(campaign_id) && o.estado === 'activa') {
                        return { ...o, estado: 'finalizada' };
                    }
                    return o;
                });
                guardarOrdenes(ordenesActualizadas);
                
                // Sincronizar con Google Sheets
                if (configurado) {
                    try {
                        await apiCall(endpoint('finalizarCampana'), null, { campaign_id });
                    } catch (err) {
                        console.error('Error finalizando campaña:', err);
                    }
                }
                setMensaje({ tipo: 'success', texto: '✓ Campaña finalizada' });
            };

            const registrarControlSoplado = async () => {
                if (guardando) return; // guardia anti-doble-click
                if (!ordenSeleccionada) {
                    setMensaje({ tipo: 'warning', texto: 'Seleccione una orden' });
                    return;
                }

                // Verificación anti-duplicado: si el último control de esta orden
                // es del mismo tipo y se guardó hace menos de 15 segundos, bloquear
                const ordenActual = ordenesSoplado.find(o => o.id === ordenSeleccionada.id);
                if (ordenActual && ordenActual.controles && ordenActual.controles.length > 0) {
                    const ult = ordenActual.controles[ordenActual.controles.length - 1];
                    if (ult.tipo === tipoControlSoplado && ult.timestamp) {
                        const hace = Date.now() - new Date(ult.timestamp).getTime();
                        if (hace < 15000) {
                            setMensaje({
                                tipo: 'warning',
                                texto: `⚠ Ya guardaste un control de ${tipoControlSoplado} hace ${Math.round(hace/1000)} segundos. Si es realmente un control nuevo, esperá unos segundos y volvé a intentar.`
                            });
                            return;
                        }
                    }
                }
                
                // Validar peso si el envase lo requiere
                const specEnvase = SPECS_ACTIVAS[ordenSeleccionada.envase];
                if (specEnvase?.parametros?.peso) {
                    const cavidades = specEnvase.cavidades || 1;
                    const prefijo = tipoControlSoplado === 'arranque' ? 'arr_peso_cav' : 'proc_peso_cav';
                    const pesosCargados = [];
                    for (let i = 1; i <= cavidades; i++) {
                        const v = mediciones[`${prefijo}${i}`];
                        if (v !== undefined && v !== '' && v !== null) pesosCargados.push(i);
                    }
                    if (pesosCargados.length === 0) {
                        setMensaje({ 
                            tipo: 'warning', 
                            texto: `⚖️ El peso es obligatorio para ${specEnvase.nombre}. Cargá al menos una cavidad.` 
                        });
                        return;
                    }
                }
                const nuevoControl = {
                    id: Date.now(), tipo: tipoControlSoplado,
                    fecha: new Date().toISOString().split('T')[0],
                    hora: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }),
                    mediciones: { ...mediciones }, observaciones, timestamp: new Date().toISOString(),
                    createdBy: usuarioLogueado.username,
                    analista: usuarioLogueado.nombre,
                    operador: ordenSeleccionada.operador  // heredado de la orden
                };
                const ordenesActualizadas = ordenesSoplado.map(orden => {
                    if (orden.id === ordenSeleccionada.id) {
                        return { ...orden, controles: [...orden.controles, nuevoControl] };
                    }
                    return orden;
                });
                setGuardando(true);
                guardarOrdenes(ordenesActualizadas);
                
                // Sincronizar con Google Sheets
                if (configurado) {
                    try {
                        await apiCall(endpoint('saveControlSoplado'), {
                            id: nuevoControl.id,
                            ordenId: ordenSeleccionada.id,
                            numeroOrden: ordenSeleccionada.numeroOrden,
                            envase: ordenSeleccionada.envase,
                            tipoControl: nuevoControl.tipo,
                            fecha: nuevoControl.fecha,
                            hora: nuevoControl.hora,
                            operador: ordenSeleccionada.operador,
                            turno: ordenSeleccionada.turno || '',
                            observaciones: nuevoControl.observaciones,
                            mediciones: nuevoControl.mediciones,
                            timestamp: nuevoControl.timestamp
                        });
                    } catch (err) {
                        console.error('Error sincronizando:', err);
                    }
                }
                setGuardando(false);
                setMensaje({ tipo: 'success', texto: `✓ Control de ${tipoControlSoplado} registrado` });
                resetFormularios();
            };

            const registrarControlLCC = async (estado = 'completo') => {
                if (guardando) return; // guardia anti-doble-click
                if (!nuevoControlLCC.envase || !tipoControlLCC) {
                    setMensaje({ tipo: 'warning', texto: 'Complete todos los campos obligatorios (envase y tipo de control)' });
                    return;
                }

                // Verificación anti-duplicado (solo cuando es nuevo, no en edición)
                if (!editandoLCCId && controlesLCC && controlesLCC.length > 0) {
                    const ult = controlesLCC[0];
                    if (ult.tipo === tipoControlLCC
                        && ult.envase === nuevoControlLCC.envase
                        && ult.analista === usuarioLogueado.nombre
                        && ult.timestamp) {
                        const hace = Date.now() - new Date(ult.timestamp).getTime();
                        if (hace < 15000) {
                            setMensaje({
                                tipo: 'warning',
                                texto: `⚠ Ya guardaste un control LCC ${tipoControlLCC} de ${nuevoControlLCC.envase} hace ${Math.round(hace/1000)} segundos.`
                            });
                            return;
                        }
                    }
                }
                // Preparo mediciones + metadata de estado
                const medConEstado = { ...mediciones, _estado: estado };
                if (estado === 'completo') {
                    // Al pasar a completo se resetea el estado de aprobación
                    medConEstado._aprobado = 'pendiente';
                    delete medConEstado._aprobadoPor;
                    delete medConEstado._fechaAprobacion;
                }

                const nuevoControl = {
                    id: editandoLCCId || Date.now(),
                    tipo: tipoControlLCC,
                    ...nuevoControlLCC,
                    analista: usuarioLogueado.nombre,
                    createdBy: usuarioLogueado.username,
                    hora: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }),
                    mediciones: medConEstado,
                    observaciones,
                    timestamp: new Date().toISOString()
                };
                setGuardando(true);

                // Guardado local: si es edición reemplazo, si es nuevo agrego al inicio
                if (editandoLCCId) {
                    guardarControlesLCC(controlesLCC.map(c => c.id === editandoLCCId ? nuevoControl : c));
                } else {
                    guardarControlesLCC([nuevoControl, ...controlesLCC]);
                }

                // Enviar a Google Sheets
                if (configurado) {
                    try {
                        await apiCall(editandoLCCId ? 'updateLCC' : 'saveLCC', nuevoControl);
                    } catch (err) {
                        console.error('Error guardando LCC en Sheets:', err);
                    }
                }
                setGuardando(false);
                const msgEstado = estado === 'borrador' ? 'guardado como borrador' : 'guardado y enviado para aprobación';
                setMensaje({ tipo: 'success', texto: `✓ Control ${tipoControlLCC} ${msgEstado}` });
                setEditandoLCCId(null);
                resetFormularios();
                setMostrarNuevoLCC(false);
            };

            // Cargar un control LCC existente en el formulario para editarlo
            const editarControlLCC = (control) => {
                setEditandoLCCId(control.id);
                setTipoControlLCC(control.tipo);
                setNuevoControlLCC({
                    envase: control.envase,
                    fecha: control.fecha
                });
                // Rellenar mediciones (sin los metadatos internos)
                const medLimpias = { ...(control.mediciones || {}) };
                setMediciones(medLimpias);
                setObservaciones(control.observaciones || '');
                setMostrarNuevoLCC(true);
                setActiveTab('lcc');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const resetFormularios = () => {
                setMediciones({});
                setObservaciones('');
                setHora('');
                setTipoControlSoplado('');
                setTipoControlLCC('');
                setOrdenSeleccionada(null);
                setMostrarSeleccionOrden(false);
                setCampanaFiltroProceso(null);
                setEnvaseFiltroProceso(null);
                setNuevoControlLCC({
                    envase: '', fecha: new Date().toISOString().split('T')[0]
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const esFabuloso = (envase) => envase === 'FAB-1L' || envase === 'FAB-2L';

            const finalizarOrden = async (ordenId) => {
                const ordenesActualizadas = ordenesSoplado.map(orden => {
                    if (orden.id === ordenId) return { ...orden, estado: 'finalizada' };
                    return orden;
                });
                guardarOrdenes(ordenesActualizadas);
                
                if (configurado) {
                    try {
                        const ordenFinalizada = ordenesActualizadas.find(o => o.id === ordenId);
                        await apiCall(endpoint('updateOrden'), ordenFinalizada);
                    } catch (err) { console.error('Error finalizando:', err); }
                }
                setMensaje({ tipo: 'success', texto: 'Orden finalizada' });
            };

            const eliminarOrden = async (ordenId) => {
                if (confirm('¿Eliminar esta orden?')) {
                    guardarOrdenes(ordenesSoplado.filter(orden => orden.id !== ordenId));
                    
                    if (configurado) {
                        try { await apiCall(endpoint('deleteOrden'), null, { id: ordenId }); }
                        catch (err) { console.error('Error eliminando:', err); }
                    }
                    setMensaje({ tipo: 'success', texto: 'Orden eliminada' });
                }
            };

            const eliminarControlLCC = async (controlId) => {
                if (confirm('¿Eliminar este control LCC?')) {
                    guardarControlesLCC(controlesLCC.filter(c => c.id !== controlId));
                    
                    if (configurado) {
                        try { await apiCall('deleteLCC', null, { id: controlId }); }
                        catch (err) { console.error('Error eliminando LCC:', err); }
                    }
                    setMensaje({ tipo: 'success', texto: 'Control eliminado' });
                }
            };

            // Exporta todos los controles LCC a Excel (tabla plana)
            const exportarLCCaExcel = () => {
                if (typeof XLSX === 'undefined') {
                    setMensaje({ tipo: 'warning', texto: '⏳ Cargando librería Excel, probá de nuevo en un instante.' });
                    return;
                }
                if (controlesLCC.length === 0) {
                    setMensaje({ tipo: 'warning', texto: 'No hay controles LCC para exportar.' });
                    return;
                }
                // 1) Descubro todas las claves de mediciones (union) — orden estable
                const clavesMediciones = new Set();
                controlesLCC.forEach(c => {
                    Object.keys(c.mediciones || {}).forEach(k => {
                        if (!k.startsWith('_')) clavesMediciones.add(k);
                    });
                });
                const columnasMediciones = Array.from(clavesMediciones).sort();

                // 2) Genero fila por control con columnas fijas + expandidas
                const rows = controlesLCC.map(c => {
                    const spec = ESPECIFICACIONES[c.envase] || TAPAS[c.envase];
                    const base = {
                        'ID': c.id,
                        'Fecha': c.fecha || '',
                        'Hora': c.hora || '',
                        'Tipo': c.tipo || '',
                        'Envase (código)': c.envase || '',
                        'Envase (nombre)': spec?.nombre || '',
                        'Analista': c.analista || (c.mediciones?._analista) || '',
                        'Estado': (c.mediciones?._estado) || 'completo',
                        'Aprobado': (c.mediciones?._aprobado) || 'pendiente',
                        'Aprobado por': (c.mediciones?._aprobadoPor) || '',
                        'Fecha aprobación': (c.mediciones?._fechaAprobacion) || '',
                        'Observaciones': c.observaciones || ''
                    };
                    // Agrego columnas dinámicas de mediciones
                    columnasMediciones.forEach(k => {
                        const val = c.mediciones?.[k];
                        base[k] = Array.isArray(val) ? val.join(' | ') : (val ?? '');
                    });
                    return base;
                });

                // 3) Convierto y descargo
                const ws = XLSX.utils.json_to_sheet(rows);
                // Auto-ancho aproximado
                const colWidths = Object.keys(rows[0]).map(k => ({
                    wch: Math.max(k.length + 2, 12)
                }));
                ws['!cols'] = colWidths;
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Controles LCC');

                const fecha = new Date().toISOString().slice(0, 10);
                XLSX.writeFile(wb, `controles_LCC_${fecha}.xlsx`);
                setMensaje({ tipo: 'success', texto: `📊 Exportados ${rows.length} controles a Excel.` });
            };

            const exportarOrdenExcel = (orden) => {
                const spec = SPECS_ACTIVAS[orden.envase];
                let csv = `Orden,${orden.numeroOrden}\nEnvase,${spec.nombre}\nOperador,${orden.operador}\nFecha,${orden.fecha}\n\n`;
                csv += 'CONTROLES\n';
                orden.controles.forEach((c, i) => {
                    csv += `${i+1},${c.tipo},${c.fecha},${c.hora}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${orden.numeroOrden}_${orden.fecha}.csv`;
                link.click();
            };

            const calcularDiasActiva = (fechaInicio) => {
                const inicio = new Date(fechaInicio);
                const hoy = new Date();
                return Math.floor((hoy - inicio) / (1000 * 60 * 60 * 24));
            };

            // Normaliza cualquier fecha a formato YYYY-MM-DD legible
            const formatearFecha = (d) => {
                if (!d) return '—';
                try {
                    if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
                    const date = new Date(d);
                    if (isNaN(date.getTime())) return '—';
                    const yyyy = date.getFullYear();
                    const mm = String(date.getMonth() + 1).padStart(2, '0');
                    const dd = String(date.getDate()).padStart(2, '0');
                    return `${yyyy}-${mm}-${dd}`;
                } catch { return '—'; }
            };

            // Si no hay usuario logueado, mostrar pantalla de login
            if (!usuarioLogueado) {
                return (
                    <div style={{
                        minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
                        background: 'linear-gradient(135deg, #023E56 0%, #028090 100%)', padding: '20px'
                    }}>
                        <div style={{
                            background: 'white', borderRadius: '12px', padding: '40px 32px',
                            width: '100%', maxWidth: '400px',
                            boxShadow: '0 20px 60px rgba(0,0,0,0.3)'
                        }}>
                            <div style={{textAlign: 'center', marginBottom: '30px'}}>
                                <div style={{fontSize: '13px', fontWeight: 700, color: '#02C39A', letterSpacing: '3px', marginBottom: '8px'}}>
                                    VESSENA S.A.
                                </div>
                                <div style={{fontSize: '24px', fontWeight: 700, color: '#1E2761', fontFamily: 'Cambria, Georgia, serif'}}>
                                    Control de Envases
                                </div>
                                <div style={{fontSize: '13px', color: '#718096', marginTop: '6px'}}>
                                    Iniciá sesión para continuar
                                </div>
                            </div>

                            <form onSubmit={handleLogin}>
                                <div className="form-group">
                                    <label>Usuario</label>
                                    <input type="text" autoFocus autoComplete="username"
                                        value={loginUsername}
                                        onChange={(e) => setLoginUsername(e.target.value)}
                                        placeholder="ej: gloria"
                                        disabled={loginProcesando} />
                                </div>
                                <div className="form-group">
                                    <label>Clave</label>
                                    <input type="password" autoComplete="current-password"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        disabled={loginProcesando} />
                                </div>

                                {loginError && (
                                    <div style={{
                                        padding: '10px 14px', borderRadius: '8px', marginBottom: '15px',
                                        background: '#FED7D7', color: '#742A2A', fontSize: '13px', fontWeight: 600
                                    }}>
                                        ⚠ {loginError}
                                    </div>
                                )}

                                <button type="submit" className="btn btn-primary"
                                    style={{width: '100%', padding: '12px', fontSize: '15px'}}
                                    disabled={loginProcesando || !loginUsername || !loginPassword}>
                                    {loginProcesando ? '⏳ Verificando...' : 'Ingresar'}
                                </button>
                            </form>

                            <div style={{marginTop: '25px', paddingTop: '20px', borderTop: '1px solid #E2E8F0', fontSize: '11px', color: '#A0AEC0', textAlign: 'center'}}>
                                ¿Problemas de acceso? Contactá a la Q.F. Claudia Barlocco.
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <div>
                            <div className="logo">VESSENA</div>
                            <h1>Control de Calidad {esModoTapas ? '- Tapas' : '- Envases'}</h1>
                        </div>
                        <div style={{textAlign: 'right', color: '#718096', display: 'flex', alignItems: 'center', gap: '15px'}}>
                            <div style={{fontSize: '14px'}}>SOP-PR-138</div>
                            {configurado && (
                                <button className="btn btn-secondary" onClick={cargarDatos}
                                    style={{fontSize: '13px', padding: '6px 14px'}}
                                    disabled={cargando}>
                                    {cargando ? '⏳ Cargando...' : '🔄 Sincronizar'}
                                </button>
                            )}
                            <div style={{fontSize: '12px'}}>
                                {configurado 
                                    ? <span style={{color: '#38a169'}}>● Google Sheets conectado</span>
                                    : <span style={{color: '#e53e3e'}}>● Solo local</span>
                                }
                            </div>
                            <div style={{
                                display: 'flex', alignItems: 'center', gap: '10px',
                                padding: '6px 14px', borderRadius: '20px', background: '#EDF2F7',
                                borderLeft: '3px solid #028090'
                            }}>
                                <span style={{fontSize: '13px', color: '#2D3748', fontWeight: 600}}>
                                    👤 {usuarioLogueado.nombre}
                                </span>
                                <button onClick={handleLogout}
                                    style={{
                                        background: 'transparent', border: 'none', cursor: 'pointer',
                                        fontSize: '12px', color: '#E53E3E', fontWeight: 600, padding: 0
                                    }}
                                    title="Cerrar sesión">
                                    Salir ✕
                                </button>
                            </div>
                        </div>
                    </div>

                    {!configurado && (
                        <div className="alert alert-warning" style={{marginBottom: '20px', borderRadius: '12px'}}>
                            <strong>⚠️ Google Sheets no configurado.</strong> Los datos se guardan solo en este navegador (localStorage). 
                            Para compartir datos entre usuarios, seguí las instrucciones del archivo <code>google-apps-script.js</code> 
                            y pegá la URL en la constante <code>GOOGLE_SCRIPT_URL</code> al inicio del código.
                        </div>
                    )}

                    {guardando && (
                        <div className="alert alert-info" style={{marginBottom: '20px', borderRadius: '12px'}}>
                            ⏳ Guardando en Google Sheets...
                        </div>
                    )}

                    {cargando ? (

                                                    <div className="measurement-table">
                                                        <h3 style={{marginBottom: '15px', color: '#2d3748'}}>
                                                            Mediciones Dimensionales - {numMuestras} muestras por cavidad
                                                        </h3>
                                                        <table>
                                                            <thead>
                                                                <tr>
                                                                    <th style={{width: '150px'}}>Parámetro</th>
                                                                    <th style={{width: '80px'}}>Cavidad</th>
                                                                    <th style={{width: '100px'}}>Especificación</th>
                                                                    {[...Array(numMuestras)].map((_, i) => (
                                                                        <th key={i} style={{width: '70px'}}>M{i+1}</th>
                                                                    ))}
                                                                    <th style={{width: '70px'}}>Promedio</th>
                                                                    <th style={{width: '70px'}}>Mín</th>
                                                                    <th style={{width: '70px'}}>Máx</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {/* Iterar sobre cada parámetro dimensional */}
                                                                {['brimful', 'altura_h', 'ancho_pie_hw', 'profundidad_pie_hd', 'ancho_hombro_sw', 'profundidad_hombro_sd'].map(param => {
                                                                    if (!spec.parametros[param]) return null;

                                                                    const numCavidades = spec.cavidades || 2;
                                                                    return Array.from({length: numCavidades}, (_, i) => i + 1).map(cav => {
                                                                        const key = `${tipoControlLCC}_${param}_cav${cav}`;
                                                                        const valores = mediciones[key] || Array(numMuestras).fill('');
                                                                        
                                                                        // Cálculos automáticos
                                                                        const nums = valores.filter(v => v && !isNaN(parseFloat(v))).map(v => parseFloat(v));
                                                                        const promedio = nums.length > 0 ? (nums.reduce((a,b) => a+b, 0) / nums.length).toFixed(2) : '-';
                                                                        const minVal = nums.length > 0 ? Math.min(...nums).toFixed(2) : '-';
                                                                        const maxVal = nums.length > 0 ? Math.max(...nums).toFixed(2) : '-';
                                                                        
                                                                        // Validación OOS
                                                                        const esOOS = nums.some(v => v < spec.parametros[param].min || v > spec.parametros[param].max);
                                                                        
                                                                        return (
                                                                            <tr key={`${param}_cav${cav}`}>
                                                                                {cav === 1 && (
                                                                                    <td rowSpan={numCavidades} style={{fontWeight: 'bold', background: '#f7fafc'}}>
                                                                                        {spec.parametros[param].nombre}
                                                                                    </td>

                                                                                <td style={{fontSize: '11px', color: '#718096'}}>
                                                                                    {spec.parametros[param].min} - {spec.parametros[param].max} {spec.parametros[param].unidad}
                                                                                </td>
                                                                                {[...Array(numMuestras)].map((_, i) => (
                                                                                    <td key={i}>
                                                                                        <input 
                                                                                            type="number"
                                                                                            step="0.1"
                                                                                            value={valores[i] || ''}
                                                                                            onChange={(e) => {
                                                                                                const newValores = [...valores];
                                                                                                newValores[i] = e.target.value;
                                                                                                setMediciones({
                                                                                                    ...mediciones,
                                                                                                    [key]: newValores
                                                                                                });
                                                                                            }}
                                                                                            style={{
                                                                                                borderColor: valores[i] && !isNaN(parseFloat(valores[i])) && 
                                                                                                    (parseFloat(valores[i]) < spec.parametros[param].min || 
                                                                                                     parseFloat(valores[i]) > spec.parametros[param].max) 
                                                                                                    ? '#e53e3e' : '#cbd5e0'
                                                                                            }}
                                                                                        />
                                                                                    </td>
                                                                                ))}
                                                                                <td style={{fontWeight: 'bold', background: esOOS ? '#fff5f5' : '#f0fff4'}}>
                                                                                    {promedio}
                                                                                </td>
                                                                                <td>{minVal}</td>
                                                                                <td>{maxVal}</td>
                                                                            </tr>
                                                                        );
                                                                    });
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                                {!spec && (
                                                    <div className="alert alert-warning">
                                                        Seleccione un envase para mostrar los parámetros de medición
                                                    </div>

                                                {/* PERFIL DE ESPESOR — semanal (3 botellas) o quincenal (6 botellas) */}
                                                {(tipoControlLCC === 'semanal' || tipoControlLCC === 'quincenal') && spec && ENVASES_PERFIL_ESPESOR.includes(nuevoControlLCC.envase) && (() => {
                                                    const nBotellas = PERFIL_ESPESOR_BOTELLAS_POR_TIPO[tipoControlLCC] || 3;
                                                    return (
                                                    <div style={{marginTop: '30px', background: '#f7fafc', padding: '20px', borderRadius: '8px', border: '1px solid #e2e8f0'}}>
                                                        <h3 style={{marginBottom: '5px', color: '#2d3748'}}>📏 Perfil de Espesor</h3>
                                                        <div style={{fontSize: '13px', color: '#4a5568', marginBottom: '15px'}}>
                                                            {tipoControlLCC === 'semanal' ? 'REG-SOP-PR-138-H' : 'REG-SOP-PR-138-C'} · {PERFIL_ESPESOR_PUNTOS.length} puntos por cavidad · {nBotellas} botellas por punto · {spec.cavidades || 2} cavidades
                                                        </div>

                                                        {Array.from({length: spec.cavidades || 2}, (_, i) => i + 1).map(cav => (
                                                            <details key={cav} open={cav === 1} style={{marginBottom: '15px', border: '1px solid #cbd5e0', borderRadius: '6px', background: 'white'}}>
                                                                <summary style={{padding: '10px 14px', cursor: 'pointer', fontWeight: 'bold', color: '#2d3748', background: '#edf2f7', borderRadius: '6px 6px 0 0'}}>

                                                                </summary>
                                                                <div style={{padding: '10px', overflowX: 'auto'}}>
                                                                    {[0, 10].map(sliceStart => (

                                                                            <thead>
                                                                                <tr style={{background: '#e2e8f0'}}>
                                                                                    <th style={{padding: '6px', textAlign: 'left', border: '1px solid #cbd5e0', minWidth: '70px'}}>Botella</th>
                                                                                    {PERFIL_ESPESOR_PUNTOS.slice(sliceStart, sliceStart + 10).map(pt => (
                                                                                        <th key={pt.key} style={{padding: '6px', border: '1px solid #cbd5e0', minWidth: '60px', textAlign: 'center'}}>
                                                                                            {pt.label}
                                                                                        </th>
                                                                                    ))}
                                                                                </tr>
                                                                                <tr style={{background: '#f7fafc'}}>
                                                                                    <th style={{padding: '4px', textAlign: 'left', border: '1px solid #cbd5e0', fontSize: '10px', color: '#718096'}}>Spec (mm)</th>
                                                                                    {PERFIL_ESPESOR_PUNTOS.slice(sliceStart, sliceStart + 10).map(pt => (
                                                                                        <th key={pt.key + '-spec'} style={{padding: '4px', border: '1px solid #cbd5e0', fontSize: '10px', color: '#718096', textAlign: 'center', fontWeight: 'normal'}}>
                                                                                            ≥ {getEspesorSpec(nuevoControlLCC.envase, pt.key)}
                                                                                        </th>
                                                                                    ))}
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                {Array.from({length: nBotellas}, (_, b) => b + 1).map(bot => (

                                                                                        <td style={{padding: '4px', border: '1px solid #cbd5e0', fontWeight: 'bold', textAlign: 'center'}}>{bot}</td>

                                                                                            const key = `esp_cav${cav}_${pt.key}_b${bot}`;
                                                                                            const val = mediciones[key] || '';
                                                                                            const numVal = parseFloat(val);
                                                                                            const specMin = getEspesorSpec(nuevoControlLCC.envase, pt.key);
                                                                                            const fueraSpec = val !== '' && !isNaN(numVal) && numVal < specMin;
                                                                                            return (
                                                                                                <td key={pt.key} style={{padding: '2px', border: '1px solid #cbd5e0'}}>
                                                                                                    <input type="number" step="0.01"
                                                                                                        value={val}
                                                                                                        onChange={(e) => setMediciones({
                                                                                                            ...mediciones,
                                                                                                            [key]: e.target.value
                                                                                                        })}
                                                                                                        style={{
                                                                                                            width: '100%', minWidth: '50px', padding: '4px', fontSize: '11px',
                                                                                                            border: '1px solid ' + (fueraSpec ? '#e53e3e' : '#cbd5e0'),
                                                                                                            background: fueraSpec ? '#fff5f5' : 'white'

                                                                                                </td>
                                                                                            );
                                                                                        })}
                                                                                    </tr>
                                                                                ))}
                                                                            </tbody>
                                                                        </table>
                                                                    ))}
                                                                </div>
                                                            </details>
                                                        ))}

                                                        </div>
                                                    </div>
                                                    );
                                                })()}

                                                {/* DROP IMPACT — solo quincenal */}

                                                        <h3 style={{marginBottom: '5px', color: '#2d3748'}}>💥 Drop Impact</h3>
                                                        <div style={{fontSize: '13px', color: '#4a5568', marginBottom: '15px'}}>

                                                        </div>

                                                            <summary style={{padding: '10px 14px', cursor: 'pointer', fontWeight: 'bold', color: '#2d3748', background: '#edf2f7', borderRadius: '6px 6px 0 0'}}>
                                                                Tabla de {DROP_IMPACT_BOTELLAS} botellas

                                                                <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '12px'}}>

                                                                                </th>

                                                                            {DROP_IMPACT_ZONAS.map(z => (

                                                                                    <th style={{padding: '4px', border: '1px solid #cbd5e0', fontSize: '11px', textAlign: 'center'}}>Obs</th>
                                                                                </React.Fragment>
                                                                            ))}
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        {Array.from({length: DROP_IMPACT_BOTELLAS}, (_, i) => i + 1).map(bot => (
                                                                            <tr key={bot}>
                                                                                <td style={{padding: '4px', border: '1px solid #cbd5e0', fontWeight: 'bold', textAlign: 'center'}}>{bot}</td>
                                                                                {DROP_IMPACT_ZONAS.map(z => {
                                                                                    const kOk = `drop_${z.key}_b${bot}`;
                                                                                    const kObs = `drop_${z.key}_b${bot}_obs`;
                                                                                    return (
                                                                                        <React.Fragment key={z.key}>
                                                                                            <td style={{padding: '2px', border: '1px solid #cbd5e0', textAlign: 'center'}}>
                                                                                                <select value={mediciones[kOk] || ''}
                                                                                                    onChange={(e) => setMediciones({...mediciones, [kOk]: e.target.value})}
                                                                                                    style={{
                                                                                                        width: '100%', padding: '3px', fontSize: '11px',
                                                                                                        background: mediciones[kOk] === 'No' ? '#fff5f5' : (mediciones[kOk] === 'Ok' ? '#f0fff4' : 'white')
                                                                                                    }}>
                                                                                                    <option value="">—</option>
                                                                                                    <option value="Ok">Ok</option>
                                                                                                    <option value="No">No</option>
                                                                                                </select>
                                                                                            </td>
                                                                                            <td style={{padding: '2px', border: '1px solid #cbd5e0'}}>
                                                                                                <input type="text"
                                                                                                    value={mediciones[kObs] || ''}
                                                                                                    onChange={(e) => setMediciones({...mediciones, [kObs]: e.target.value})}
                                                                                                    placeholder="Obs..."
                                                                                                    style={{width: '100%', minWidth: '80px', padding: '3px', fontSize: '11px', border: '1px solid #cbd5e0'}} />
                                                                                            </td>
                                                                                        </React.Fragment>
                                                                                    );
                                                                                })}
                                                                            </tr>
                                                                        ))}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </details>
                                                    </div>
                                                )}

                                                {/* HERMETICIDAD — solo quincenal */}
                                                {tipoControlLCC === 'quincenal' && spec && ENVASES_DROP_HERMET.includes(nuevoControlLCC.envase) && (

                                                        <h3 style={{marginBottom: '5px', color: '#2d3748'}}>🔐 Hermeticidad</h3>
                                                        <div style={{fontSize: '13px', color: '#4a5568', marginBottom: '15px'}}>
                                                            REG-SOP-PR-138-C · {HERMETICIDAD_MUESTRAS_POR_COND} muestras por condición · Lectura de torque <strong>a las 24 h</strong> de exposición · Spec torque: {HERMETICIDAD_TORQUE_MIN} – {HERMETICIDAD_TORQUE_MAX} Nm
                                                        </div>

                                                        {HERMETICIDAD_CONDICIONES.map(cond => (
                                                            <details key={cond.key} open style={{marginBottom: '12px', border: '1px solid #cbd5e0', borderRadius: '6px', background: 'white'}}>
                                                                <summary style={{padding: '10px 14px', cursor: 'pointer', fontWeight: 'bold', color: '#2d3748', background: '#edf2f7', borderRadius: '6px 6px 0 0'}}>
                                                                    {cond.label}
                                                                </summary>
                                                                <div style={{padding: '10px'}}>
                                                                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '12px'}}>
                                                                        <thead>
                                                                            <tr style={{background: '#e2e8f0'}}>
                                                                                <th style={{padding: '6px', border: '1px solid #cbd5e0', width: '80px'}}>Botella</th>
                                                                                <th style={{padding: '6px', border: '1px solid #cbd5e0'}}>Torque a 24 h (Nm)</th>
                                                                                <th style={{padding: '6px', border: '1px solid #cbd5e0', width: '130px'}}>¿Pierde?</th>
                                                                                <th style={{padding: '6px', border: '1px solid #cbd5e0'}}>Observaciones</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {Array.from({length: HERMETICIDAD_MUESTRAS_POR_COND}, (_, i) => i + 1).map(bot => {
