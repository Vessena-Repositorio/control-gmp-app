                                                                                const kPierde = `herm_${cond.key}_b${bot}_pierde`;
                                                                                const kObs = `herm_${cond.key}_b${bot}_obs`;
                                                                                const val = mediciones[kTorque] || '';
                                                                                const numVal = parseFloat(val);
                                                                                const fueraSpec = val !== '' && !isNaN(numVal) &&
                                                                                    (numVal < HERMETICIDAD_TORQUE_MIN || numVal > HERMETICIDAD_TORQUE_MAX);
                                                                                const pierdeVal = mediciones[kPierde];
                                                                                return (
                                                                                    <tr key={bot}>
                                                                                        <td style={{padding: '4px', border: '1px solid #cbd5e0', fontWeight: 'bold', textAlign: 'center'}}>{bot}</td>
                                                                                        <td style={{padding: '2px', border: '1px solid #cbd5e0'}}>
                                                                                            <input type="number" step="0.01"
                                                                                                value={val}
                                                                                                onChange={(e) => setMediciones({...mediciones, [kTorque]: e.target.value})}
                                                                                                placeholder="Nm"
                                                                                                style={{
                                                                                                    width: '100%', padding: '4px', fontSize: '12px',
                                                                                                    border: '1px solid ' + (fueraSpec ? '#e53e3e' : '#cbd5e0'),
                                                                                                    background: fueraSpec ? '#fff5f5' : 'white'
                                                                                                }} />
                                                                                        </td>
                                                                                        <td style={{padding: '2px', border: '1px solid #cbd5e0', textAlign: 'center'}}>
                                                                                            <select value={pierdeVal || ''}
                                                                                                onChange={(e) => setMediciones({...mediciones, [kPierde]: e.target.value})}
                                                                                                style={{
                                                                                                    width: '100%', padding: '3px', fontSize: '12px',
                                                                                                    background: pierdeVal === 'Pierde' ? '#fff5f5' : (pierdeVal === 'No pierde' ? '#f0fff4' : 'white')
                                                                                                }}>
                                                                                                <option value="">—</option>
                                                                                                <option value="No pierde">No pierde</option>
                                                                                                <option value="Pierde">Pierde</option>
                                                                                            </select>
                                                                                        </td>
                                                                                        <td style={{padding: '2px', border: '1px solid #cbd5e0'}}>
                                                                                            <input type="text"
                                                                                                value={mediciones[kObs] || ''}
                                                                                                onChange={(e) => setMediciones({...mediciones, [kObs]: e.target.value})}
                                                                                                placeholder="Obs..."
                                                                                                style={{width: '100%', padding: '4px', fontSize: '12px', border: '1px solid #cbd5e0'}} />
                                                                                        </td>
                                                                                    </tr>
                                                                                );
                                                                            })}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </details>
                                                        ))}
                                                    </div>
                                                )}

                                                <div className="form-group" style={{marginTop: '25px'}}>
                                                    <label>Observaciones</label>
                                                    <textarea value={observaciones}
                                                        onChange={(e) => setObservaciones(e.target.value)}
                                                        rows="3" 
                                                        placeholder="Detallar cualquier inconformidad o acción correctiva..." />
                                                </div>

                                                <div className="button-group" style={{flexWrap: 'wrap', gap: '10px'}}>
                                                    <button className="btn btn-primary"
                                                        onClick={() => registrarControlLCC('completo')}
                                                        disabled={guardando}
                                                        style={{background: '#22543d'}}>
                                                        {guardando ? '⏳ Guardando...' : (editandoLCCId ? '✓ Guardar cambios y notificar aprobación' : '✓ Guardar y solicitar aprobación')}
                                                    </button>
                                                    <button className="btn btn-secondary"
                                                        onClick={() => registrarControlLCC('borrador')}
                                                        disabled={guardando}
                                                        style={{background: '#d69e2e', color: 'white'}}
                                                        title="Guarda el control para completarlo después. No manda email a Antonella.">
                                                        📝 Guardar como borrador
                                                    </button>
                                                    <button className="btn btn-secondary" onClick={() => { setEditandoLCCId(null); resetFormularios(); }} disabled={guardando}>
                                                        Cancelar
                                                    </button>
                                                </div>
                                                {editandoLCCId && (
                                                    <div style={{marginTop: '10px', padding: '10px', background: '#fefcbf', borderRadius: '6px', fontSize: '13px', color: '#744210'}}>
                                                        ✏️ Estás editando un control existente (ID: {editandoLCCId})
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </>
                            )}

                            {/* TAB: HISTÓRICO */}
                            {activeTab === 'historico' && (
                                <>
                                    <div className="stats-grid">
                                        <div className="stat-card"
                                            onClick={() => document.getElementById('historico-ordenes')?.scrollIntoView({behavior: 'smooth', block: 'start'})}
                                            style={{cursor: 'pointer', transition: 'transform .15s, box-shadow .15s'}}
                                            onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 8px 20px rgba(102,126,234,0.4)'; }}
                                            onMouseLeave={(e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; }}
                                            title="Ir al listado de órdenes de abajo">
                                            <div className="stat-label">{esModoTapas ? 'Órdenes Tapas' : 'Órdenes Soplado'} ↓</div>
                                            <div className="stat-value">{ordenesSoplado.length}</div>
                                        </div>
                                        <div className="stat-card"
                                            onClick={() => { setFiltroEstado('activa'); document.getElementById('historico-ordenes')?.scrollIntoView({behavior: 'smooth', block: 'start'}); }}
                                            style={{cursor: 'pointer', transition: 'transform .15s, box-shadow .15s'}}
                                            onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 8px 20px rgba(102,126,234,0.4)'; }}
                                            onMouseLeave={(e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; }}
                                            title="Filtrar por órdenes activas y bajar al listado">
                                            <div className="stat-label">Órdenes Activas ↓</div>
                                            <div className="stat-value">{ordenesSoplado.filter(o => o.estado === 'activa').length}</div>
                                        </div>
                                        {!esModoTapas && (
                                            <div className="stat-card"
                                                onClick={() => document.getElementById('historico-lcc')?.scrollIntoView({behavior: 'smooth', block: 'start'})}
                                                style={{cursor: 'pointer', transition: 'transform .15s, box-shadow .15s'}}
                                                onMouseEnter={(e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 8px 20px rgba(102,126,234,0.4)'; }}
                                                onMouseLeave={(e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; }}
                                                title="Ir al listado de Controles LCC de abajo">
                                                <div className="stat-label">Controles LCC ↓</div>
                                                <div className="stat-value">{controlesLCC.length}</div>
                                            </div>
                                        )}
                                        <div className="stat-card" title="Suma de controles de soplado + LCC">
                                            <div className="stat-label">Total Controles</div>
                                            <div className="stat-value">
                                                {ordenesSoplado.reduce((sum, o) => sum + o.controles.length, 0) + controlesLCC.length}
                                            </div>
                                        </div>
                                    </div>

                                    {/* FILTROS */}
                                    <div style={{background: '#f7fafc', padding: '15px 20px', borderRadius: '12px',
                                        marginBottom: '20px', display: 'flex', gap: '15px', flexWrap: 'wrap', alignItems: 'flex-end'}}>

                                                                                        .replace(/^(validacion_|quincenal_|semanal_)/, '')
                                                                                    .replace(/_/g, ' ')
                                                                                    .replace(/cav(\d)/, 'Cav $1')
                                                                                    .replace(/\b\w/g, l => l.toUpperCase());
                                                                                
                                                                                // Buscar spec del parámetro
                                                                                const paramBase = key.replace(/^(validacion_|quincenal_|semanal_)/, '').replace(/_cav\d$/, '');
                                                                                const specParam = spec?.parametros?.[paramBase];
                                                                                
                                                                                let displayValue, esOOS = false;
                                                                                if (Array.isArray(value)) {
                                                                                    const nums = value.filter(v => v && !isNaN(parseFloat(v))).map(v => parseFloat(v));
                                                                                    displayValue = value.filter(v => v !== '').join(', ');
                                                                                    if (specParam && nums.length > 0) {
                                                                                        esOOS = nums.some(v => v < specParam.min || v > specParam.max);
                                                                                    }
                                                                                } else {
                                                                                    displayValue = value;
                                                                                    const numVal = parseFloat(value);
                                                                                    if (specParam && !isNaN(numVal)) {
                                                                                        esOOS = numVal < specParam.min || numVal > specParam.max;
                                                                                    }
                                                                                }
                                                                                
                                                                                return (
                                                                                    <tr key={key} style={{background: esOOS ? '#fff5f5' : 'transparent'}}>
                                                                                        <td style={{fontWeight: '600', fontSize: '13px'}}>{nombreParam}</td>
                                                                                        <td>{displayValue}</td>
                                                                                        {spec && (
                                                                                            <td style={{fontSize: '12px', color: '#718096'}}>
                                                                                                {specParam ? `${specParam.min} - ${specParam.max} ${specParam.unidad}` : ''}
                                                                                            </td>
                                                                                        )}
                                                                                        <td>
                                                                                            {esOOS 
                                                                                                ? <span style={{color: '#e53e3e', fontWeight: '700'}}>⚠️ OOS</span>
                                                                                                : specParam 
                                                                                                    ? <span style={{color: '#38a169'}}>✓</span>
                                                                                                    : ''
                                                                                            }
                                                                                        </td>
                                                                                    </tr>
                                                                                );
                                                                            })}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div style={{marginTop: '15px', display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                                            <button className="btn btn-primary"
                                                                onClick={() => editarControlLCC(control)}
                                                                style={{fontSize: '13px', padding: '8px 16px', background: esBorrador ? '#d69e2e' : '#028090'}}
                                                                title="Editar / continuar este control">
                                                                {esBorrador ? '📝 Seguir cargando' : '✏️ Editar'}
                                                            </button>
                                                            <button className="btn btn-danger"
                                                                onClick={() => eliminarControlLCC(control.id)}
                                                                style={{fontSize: '13px', padding: '8px 16px'}}>
                                                                🗑️ Eliminar
                                                            </button>
                                                        </div>
                                                        </div>
                                                    </details>
                                                );
                                            });
                                        })()}
                                    </div>
                                </>
                            )}

                            {/* MODAL DE DETALLES */}
                            {controlDetalle && (
                                <div className="modal-overlay" onClick={() => setControlDetalle(null)}>
                                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                        <div className="modal-header">
                                            <div className="modal-title">Detalle del Control</div>
                                            <button className="modal-close" onClick={() => setControlDetalle(null)}>✕</button>
                                        </div>
                                        <div className="modal-body">
                                            <div className="detalle-grid">
                                                {controlDetalle.tipo === 'soplado' && (
                                                    <div className="detalle-item">
                                                        <div className="detalle-label">Orden</div>
                                                        <div className="detalle-value">{controlDetalle.orden.numeroOrden}</div>
                                                    </div>
                                                )}
                                                <div className="detalle-item">
                                                    <div className="detalle-label">Tipo</div>
                                                    <div className="detalle-value">{controlDetalle.control.tipo}</div>
                                                </div>
                                                <div className="detalle-item">
                                                    <div className="detalle-label">Fecha</div>
                                                    <div className="detalle-value">{formatearFecha(controlDetalle.control.fecha)}</div>
                                                </div>
                                                <div className="detalle-item">
                                                    <div className="detalle-label">Hora</div>
                                                    <div className="detalle-value">{controlDetalle.control.hora}</div>
                                                </div>
                                            </div>

                                            {/* MEDICIONES DEL CONTROL */}
                                            {controlDetalle.control.mediciones && Object.keys(controlDetalle.control.mediciones).length > 0 && (
                                                <div style={{marginTop: '20px'}}>
                                                    <h4 style={{marginBottom: '12px', color: '#2d3748', borderBottom: '2px solid #e2e8f0', paddingBottom: '8px'}}>
                                                        📏 Mediciones Registradas
                                                    </h4>
                                                    <div className="measurement-table">
                                                        <table>
                                                            <thead>
                                                                <tr>
                                                                    <th>Parámetro</th>
                                                                    <th>Valor</th>
                                                                    {controlDetalle.tipo === 'soplado' && controlDetalle.orden && (() => {
                                                                        const spec = SPECS_ACTIVAS[controlDetalle.orden.envase];
                                                                        return spec ? <th>Especificación</th> : null;
                                                                    })()}
                                                                    <th>Estado</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {Object.entries(controlDetalle.control.mediciones).map(([key, value]) => {
                                                                    if (value === '' || value === null || value === undefined) return null;
                                                                    
                                                                    // Formatear nombre del parámetro
                                                                    const nombreParam = key
                                                                        .replace(/^(arr_|proc_|obs_)/, '')
                                                                        .replace(/_/g, ' ')
                                                                        .replace(/cav(\d)/, 'Cav $1')
                                                                        .replace(/\b\w/g, l => l.toUpperCase());
                                                                    
                                                                    // Determinar si está en spec
                                                                    let enSpec = false;
                                                                    let specMin = null, specMax = null, specUnidad = '';
                                                                    if (controlDetalle.tipo === 'soplado' && controlDetalle.orden) {
                                                                        const spec = SPECS_ACTIVAS[controlDetalle.orden.envase];
                                                                        if (spec) {
                                                                            const paramBase = key.replace(/^(arr_|proc_)/, '').replace(/_cav\d$/, '');
                                                                            if (spec.parametros[paramBase]) {
                                                                                enSpec = true;
                                                                                specMin = spec.parametros[paramBase].min;
                                                                                specMax = spec.parametros[paramBase].max;
                                                                                specUnidad = spec.parametros[paramBase].unidad;
                                                                            }
                                                                        }
                                                                    }
                                                                    
                                                                    const numVal = parseFloat(value);
                                                                    const esOOS = enSpec && !isNaN(numVal) && (numVal < specMin || numVal > specMax);
                                                                    const displayValue = typeof value === 'boolean' 
                                                                        ? (value ? '✗ Sí' : '✓ No') 
                                                                        : (value === 'ok' ? '✓ OK' : value === 'no' ? '✗ NO' : value);
                                                                    
                                                                    return (
                                                                        <tr key={key} style={{background: esOOS ? '#fff5f5' : 'transparent'}}>
                                                                            <td style={{fontWeight: '600', fontSize: '13px'}}>{nombreParam}</td>
                                                                            <td style={{fontWeight: '500'}}>{displayValue}</td>
                                                                            {enSpec ? (
                                                                                <td style={{fontSize: '12px', color: '#718096'}}>
                                                                                    {specMin} - {specMax} {specUnidad}
                                                                                </td>
                                                                            ) : controlDetalle.tipo === 'soplado' && controlDetalle.orden && SPECS_ACTIVAS[controlDetalle.orden.envase] ? (
                                                                                <td></td>
                                                                            ) : null}
                                                                            <td>
                                                                                {esOOS 
                                                                                    ? <span style={{color: '#e53e3e', fontWeight: '700'}}>⚠️ OOS</span>
                                                                                    : enSpec 
                                                                                        ? <span style={{color: '#38a169'}}>✓</span>
                                                                                        : ''
                                                                                }
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}
                                            {controlDetalle.control.observaciones && (
                                                <div style={{marginTop: '20px', padding: '15px', background: '#fff5f5',
                                                    borderRadius: '8px', borderLeft: '4px solid #e53e3e'}}>
                                                    <strong>Observaciones:</strong>
                                                    <p style={{marginTop: '8px'}}>{controlDetalle.control.observaciones}</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
