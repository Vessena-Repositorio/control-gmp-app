<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Sistema de Calidad · Vessena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Mismos tokens que el resto de la suite, para que el portal no se sienta
   una app aparte. */
:root{
  --bg:#0b1120;--s1:#131d33;--s2:#182340;--s3:#1e2d4d;--border:#253354;
  --text:#e4eaf6;--text2:#8494b7;--text3:#5c6f94;
  --mint:#2dd4a8;--mint-g:rgba(45,212,168,.12);--mint-d:#1fad88;
  --amber:#f5a623;--amber-g:rgba(245,166,35,.12);
  --blue:#5b9cf6;--blue-g:rgba(91,156,246,.12);
  --r:14px;--rs:9px;--f:'Outfit',sans-serif;--m:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}

.hdr{position:sticky;top:0;z-index:100;background:rgba(11,17,32,.9);backdrop-filter:blur(24px);
     border-bottom:1px solid var(--border);padding:14px 18px}
.hdr-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-ico{width:38px;height:38px;background:linear-gradient(140deg,var(--mint),var(--mint-d));
         border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:800;line-height:1.2}
.hdr p{font-size:11px;color:var(--text2)}
.fuente{margin-left:auto;font-family:var(--m);font-size:10px;color:var(--text3);
        border:1px solid var(--border);border-radius:50px;padding:5px 12px;white-space:nowrap}
.fuente b{color:var(--mint);font-weight:600}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 80px}

.buscador{position:relative;margin-bottom:26px}
.buscador input{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:50px;
  padding:13px 18px 13px 42px;color:var(--text);font-family:var(--f);font-size:14px;outline:none}
.buscador input:focus{border-color:var(--mint)}
.buscador input::placeholder{color:var(--text3)}
.buscador svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2}

.seccion{margin-bottom:32px}
.seccion.oculta{display:none}
.st{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--text3);
    font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.st::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--mint)}
.st span{color:var(--text3);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}

.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:15px;
      text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:7px;
      transition:border-color .15s,background .15s,transform .15s}
.card:hover{border-color:var(--mint);background:var(--s2);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.card.oculta{display:none}

.card-top{display:flex;align-items:flex-start;gap:9px}
.card-ico{width:32px;height:32px;border-radius:var(--rs);background:var(--s3);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.card h3{font-size:13.5px;font-weight:700;line-height:1.3}
.card-desc{font-size:11.5px;color:var(--text2);line-height:1.45;flex:1}

.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tag{font-family:var(--m);font-size:9px;font-weight:500;padding:3px 7px;border-radius:5px;
     border:1px solid var(--border);color:var(--text3);white-space:nowrap}
.tag.pg{background:var(--mint-g);border-color:transparent;color:var(--mint)}
.tag.sheets{background:var(--amber-g);border-color:transparent;color:var(--amber)}
.tag.local{background:var(--blue-g);border-color:transparent;color:var(--blue)}

.vacio{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;display:none}
.vacio.on{display:block}

.pie{max-width:1080px;margin:0 auto;padding:0 18px 40px;
     font-size:11px;color:var(--text3);line-height:1.6;border-top:1px solid var(--border);padding-top:18px}
.pie code{font-family:var(--m);color:var(--text2)}

@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .fuente{margin-left:0;width:100%;text-align:center}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-ico">⚗️</div>
    <div>
      <h1>Sistema de Calidad</h1>
      <p>Vessena S.A. — Control GMP</p>
    </div>
    <div class="fuente" id="fuente">datos: <b>—</b></div>
  </div>
</header>

<div class="wrap">
  <div class="buscador">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Buscar aplicación…" autocomplete="off" aria-label="Buscar aplicación">
  </div>

  <div id="secciones"></div>

  <div class="vacio" id="vacio">Sin resultados.</div>
</div>

<footer class="pie" id="pie"></footer>

<script>
// Las URLs son relativas para que el portal funcione igual servido por Coolify
// o por GitHub Pages.
//
// `origen` indica de donde saca los datos cada app:
//   pg     -> ya migrada: lee de Postgres cuando hay backend
//   sheets -> sigue leyendo/escribiendo en Google (Apps Script o Sheets)
//   local  -> no consulta nada, los datos estan dentro del archivo
const SECCIONES = [
  {
    titulo: 'Captura en planta',
    nota: 'lo que se completa durante el turno',
    apps: [
      { url:'control-en-proceso.html', ico:'⚗️', nombre:'Control en Proceso GMP',
        desc:'Registro de pesos, pH, checks y desvíos por control de línea.', origen:'sheets' },
      { url:'control-calidad-envases.html', ico:'🧪', nombre:'Control Calidad Envases y Tapas',
        desc:'Captura de soplado y LCC: medidas por cavidad, estética y campañas.', origen:'sheets' },
      { url:'control-calidad-workflow.html', ico:'📦', nombre:'Control Calidad Materias Primas',
        desc:'Flujo de recepción, muestreo y liberación de materias primas.', origen:'sheets' },
      { url:'fabuloso.html', ico:'🧴', nombre:'Fabuloso — Atributos en Línea',
        desc:'Control de atributos de la línea Fabuloso durante el envasado.', origen:'sheets' }
    ]
  },
  {
    titulo: 'Supervisión',
    nota: 'seguimiento de cumplimiento por turno',
    apps: [
      { url:'supervision-envases.html', ico:'👁️', nombre:'Supervisión Envases',
        desc:'Cumplimiento de horarios de control y detección de faltantes.', origen:'pg' },
      { url:'panel-supervision-envases.html', ico:'📋', nombre:'Panel Supervisión Envases',
        desc:'Panel de supervisión de envases por orden y analista.', origen:'pg' },
      { url:'panel-supervision-tapas.html', ico:'🔩', nombre:'Panel Supervisión Tapas',
        desc:'Panel de supervisión específico de tapas en producción.', origen:'pg' }
    ]
  },
  {
    titulo: 'Indicadores',
    nota: 'KPIs y análisis',
    apps: [
      { url:'dashboard.html', ico:'📊', nombre:'Dashboard Calidad Envases',
        desc:'Órdenes, controles y fuera de especificación por envase.', origen:'pg' },
      { url:'informe-gerencial.html', ico:'📈', nombre:'KPIs Pesos Líneas',
        desc:'Informe gerencial con análisis estadístico de pesos por línea.', origen:'pg' },
      { url:'dashboard_sao001.html', ico:'💧', nombre:'KPI Sistema de Agua',
        desc:'Validación y monitoreo del sistema de agua (SAO-001 / PPQ-H2O-001).', origen:'pg' },
      { url:'fabuloso_kpi_dashboard.html', ico:'🎯', nombre:'KPI Fabuloso',
        desc:'Rendimiento, merma y análisis por lote de la línea Fabuloso.', origen:'pg' },
      { url:'dashboard_syso.html', ico:'🦺', nombre:'SYSO — Frases Preventivas',
        desc:'Clasificación de frases preventivas de seguridad y salud ocupacional.', origen:'local' }
    ]
  },
  {
    titulo: 'Gestión GMP',
    nota: 'registros del sistema de calidad',
    apps: [
      { url:'no_conformidades.html', ico:'⚠️', nombre:'No Conformidades y CAPA',
        desc:'Registro, análisis y seguimiento de no conformidades y acciones.', origen:'sheets' },
      { url:'control_cambios.html', ico:'🔄', nombre:'Control de Cambios',
        desc:'Gestión, evaluación y aprobación de cambios en procesos y productos.', origen:'sheets' },
      { url:'devoluciones_app_gsheets.html', ico:'↩️', nombre:'Devoluciones y Roturas',
        desc:'Tablero ejecutivo de devoluciones y roturas internas.', origen:'sheets' },
      { url:'capacitaciones_vessena.html', ico:'🎓', nombre:'Capacitaciones',
        desc:'Gestión, registro y seguimiento de capacitaciones del personal.', origen:'sheets' },
      { url:'estabilidad.html', ico:'🧫', nombre:'Programa de Estabilidad',
        desc:'Seguimiento del programa de estabilidad de producto terminado.', origen:'sheets' }
    ]
  },
  {
    titulo: 'Documentos',
    nota: 'material de referencia',
    apps: [
      { url:'guia-entrenamiento-gmp.html', ico:'📖', nombre:'Guía de Entrenamiento GMP',
        desc:'Material de capacitación en buenas prácticas de manufactura.', origen:'local' }
    ]
  },
  {
    titulo: 'Portales anteriores',
    nota: 'versiones previas de esta misma pantalla',
    apps: [
      { url:'dashboard-calidad-vessena.html', ico:'🗂️', nombre:'Portal Calidad (v3)',
        desc:'Portal anterior con login y catálogo por secciones.', origen:'sheets' },
      { url:'dashboard-calidad-moderno.html', ico:'🗂️', nombre:'Portal Calidad (v2)',
        desc:'Segunda versión del portal de calidad.', origen:'local' },
      { url:'dashboard-calidad.html', ico:'🗂️', nombre:'Portal Calidad (v1)',
        desc:'Primera versión del portal de calidad.', origen:'local' }
    ]
  }
];

// Sin backend (GitHub Pages o file://) todas las apps leen de Google, asi que
// la etiqueta "Postgres" seria mentira. Se decide igual que en cada dashboard.
const SIN_BACKEND = location.hostname.endsWith('github.io') || location.protocol === 'file:';

const ETIQUETAS = {
  pg:     { clase:'pg',     texto:'Postgres' },
  sheets: { clase:'sheets', texto:'Google Sheets' },
  local:  { clase:'local',  texto:'datos locales' }
};

function etiquetaDe(origen) {
  // Una app migrada sigue leyendo de Apps Script cuando no hay backend.
  if (origen === 'pg' && SIN_BACKEND) return ETIQUETAS.sheets;
  return ETIQUETAS[origen] || ETIQUETAS.local;
}

function crearTarjeta(app) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = app.url;
  const et = etiquetaDe(app.origen);
  a.innerHTML =
    '<div class="card-top">' +
      '<div class="card-ico">' + app.ico + '</div>' +
      '<h3></h3>' +
    '</div>' +
    '<div class="card-desc"></div>' +
    '<div class="tags"><span class="tag ' + et.clase + '">' + et.texto + '</span>' +
      '<span class="tag"></span></div>';
  // textContent y no innerHTML: los nombres y descripciones son datos, y asi no
  // hay forma de que un caracter raro se interprete como marcado.
  a.querySelector('h3').textContent = app.nombre;
  a.querySelector('.card-desc').textContent = app.desc;
  a.querySelector('.tags .tag:last-child').textContent = app.url;
  // El origen entra al indice para poder filtrar por "postgres" o "sheets",
  // que es lo primero que uno quiere ver durante la migracion.
  a.dataset.buscar = (app.nombre + ' ' + app.desc + ' ' + app.url + ' ' + et.texto).toLowerCase();
  return a;
}

const cont = document.getElementById('secciones');
for (const sec of SECCIONES) {
  const div = document.createElement('section');
  div.className = 'seccion';
  const h = document.createElement('div');
  h.className = 'st';
  h.textContent = sec.titulo;
  const nota = document.createElement('span');
  nota.textContent = '· ' + sec.nota;
  h.appendChild(nota);
  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.apps.forEach(app => grid.appendChild(crearTarjeta(app)));
  div.appendChild(h);
  div.appendChild(grid);
  cont.appendChild(div);
}

// Buscador
const q = document.getElementById('q');
const vacio = document.getElementById('vacio');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  let visibles = 0;
  document.querySelectorAll('.seccion').forEach(sec => {
    let enSeccion = 0;
    sec.querySelectorAll('.card').forEach(c => {
      const ok = !t || c.dataset.buscar.includes(t);
      c.classList.toggle('oculta', !ok);
      if (ok) enSeccion++;
    });
    sec.classList.toggle('oculta', enSeccion === 0);
    visibles += enSeccion;
  });
  vacio.classList.toggle('on', visibles === 0);
});

// Estado del backend: se consulta una sola vez y no bloquea nada. Si falla, el
// portal funciona igual; solo cambia la etiqueta del encabezado.
const fuente = document.getElementById('fuente');
if (SIN_BACKEND) {
  fuente.innerHTML = 'datos: <b>Google Sheets</b>';
} else {
  fuente.innerHTML = 'datos: <b>verificando…</b>';
  fetch('/api/salud')
    .then(r => r.json())
    .then(d => {
      fuente.innerHTML = d.base === 'conectada'
        ? 'datos: <b>Postgres</b>'
        : 'datos: <b style="color:var(--amber)">API sin base</b>';
    })
    .catch(() => { fuente.innerHTML = 'datos: <b style="color:var(--amber)">API sin respuesta</b>'; });
}

document.getElementById('pie').textContent =
  SIN_BACKEND
    ? 'Servido desde GitHub Pages, sin backend: todas las apps leen de Google Sheets.'
    : 'Servido desde Coolify. Las apps marcadas como Postgres leen de la réplica; el resto sigue en Google Sheets.';
</script>

</body>
</html>
