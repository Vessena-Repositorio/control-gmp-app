// ── Duración entre dos horas HH:MM (retorna string legible o "") ──
function calcDuration(tIn, tEnd) {
  if (!tIn || !tEnd) return "";
  const [h1, m1] = tIn.split(":").map(Number);
  const [h2, m2] = tEnd.split(":").map(Number);
  const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (isNaN(diff) || diff < 0) return "";
  if (diff === 0) return "< 1 min";
  const hh = Math.floor(diff / 60);
  const mm = diff % 60;
  return hh > 0 ? `${hh}h ${mm}min` : `${mm} min`;
}

// ── Evaluación de un valor contra un parámetro ──
// La misma regla la aplica el servidor al guardar y al aprobar (server/routes/graneles.js):
// si se cambia una, hay que cambiar la otra.
//
// Acepta coma decimal, que es como se escribe acá. Con parseFloat, "7,5" se leía
// como 7 y un valor fuera de rango podía figurar dentro.
function numero(v) {
  const t = String(v ?? "").trim().replace(",", ".");
  if (t === "") return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}
function evalValue(param, val) {
  if (val === "" || val == null) return null;
  if (!param) return null;
  if (param.type === "text") return val.trim() !== "" ? true : null;
  const n = numero(val);
  if (n === null) return null;
  const min = numero(param.min);
  const max = numero(param.max);
  return (min === null || n >= min) && (max === null || n <= max);
}
// Resultado final del parámetro considerando retest
// - pass true → true
// - pass false, retestPass true → true (rescatado)
// - pass false, retestPass false → false (confirmado fuera)
// - pass false, retest vacío → null (pendiente retest)
// - todo vacío → null
function finalPass(r) {
  if (r.pass === true) return true;
  // Texto no tiene retest: "No conforme" es definitivo. Antes caía en "pendiente
  // retest", no contaba en los KPI de no conformes y pedía un retest imposible.
  if (r.pass === false && r.type === "text") return false;
  if (r.pass === false) {
    if (r.retestPass === true) return true;
    if (r.retestPass === false) return false;
    return null; // pendiente retest
  }
  return null;
}

  try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d || d.ok === false) throw new Error((d && d.error) || `error ${r.status}`);
  return d;
}

// ── Parser del payload del QR ──
// Formatos aceptados:
//   • JSON: {"lote":"X","granel":"Y","salida":"HH:MM"}
//   • URL/query: https://.../?lote=X&granel=Y&salida=HH:MM
//   • KV separado por | o salto de línea: LOTE:X|GRANEL:Y|SALIDA:HH:MM
function parseQrPayload(text) {
  const out = { batchCode: "", productCode: "", timeFactory: "" };
  if (!text || typeof text !== "string") return out;
  const t = text.trim();
  try {
    if (t.startsWith("{")) {
      const obj = JSON.parse(t);
      out.batchCode = String(obj.lote || obj.batch || obj.batchCode || "").trim();
      out.productCode = String(obj.granel || obj.product || obj.code || obj.productCode || "").trim();
      out.timeFactory = String(obj.salida || obj.timeFactory || obj.hora || "").trim();
      return out;
    }
    if (t.includes("=") && (t.includes("&") || t.includes("?"))) {
      const qs = t.includes("?") ? t.split("?").pop() : t;
      const params = new URLSearchParams(qs);
      out.batchCode = (params.get("lote") || params.get("batch") || "").trim();
      out.productCode = (params.get("granel") || params.get("product") || params.get("code") || "").trim();
      out.timeFactory = (params.get("salida") || params.get("timeFactory") || params.get("hora") || "").trim();
      if (out.batchCode || out.productCode) return out;
    }
    const parts = t.split(/[|\n]/).map(s => s.trim()).filter(Boolean);
    for (const p of parts) {
      const idx = p.indexOf(":");
      if (idx < 0) continue;
      const key = p.substring(0, idx).trim().toLowerCase();
      const val = p.substring(idx + 1).trim();
      if (!val) continue;
      if (key.includes("lote") || key === "batch") out.batchCode = val;
      else if (key.includes("granel") || key === "code" || key === "product") out.productCode = val;
      else if (key.includes("salida") || key.includes("factory") || key.includes("hora")) out.timeFactory = val;
    }
  } catch (e) { console.warn("QR parse error:", e); }
  return out;
}

// ── Componente scanner QR (usa html5-qrcode desde CDN) ──
function QrScanner({ onScan, onCancel }) {
  const [error, setError] = useState("");
  const [manualText, setManualText] = useState("");

  useEffect(() => {
    if (typeof Html5QrcodeScanner === "undefined") {
      setError("La librería de escaneo no cargó. Usá el pegado manual abajo.");
      return;
    }
    let scanner;
    try {
      scanner = new Html5QrcodeScanner("qr-reader", {
        fps: 10,
        qrbox: { width: 240, height: 240 },
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true,
      }, false);
      scanner.render(
        (decodedText) => {
          try { scanner.clear(); } catch(e) {}
          onScan(decodedText);
        },
        () => {} // ignore per-frame errors
      );
    } catch (e) {
      setError("No se pudo iniciar la cámara. Verificá permisos o pegá el contenido abajo.");
    }
    return () => { try { scanner && scanner.clear(); } catch(e) {} };
  }, []);

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000,
      padding: 12,
    }}>
      <div style={{ background: V.white, borderRadius: 10, maxWidth: 480, width: "100%", maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ padding: "12px 16px", borderBottom: `1px solid ${V.grayMid}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700 }}>Escanear QR de muestra</h3>
          <button type="button" onClick={onCancel} style={{ border: "none", background: "transparent", cursor: "pointer", padding: 4 }}>
            <X size={18} color={V.gray} />
          </button>
        </div>
        <div style={{ padding: 16 }}>
          {!error && (
            <div id="qr-reader" style={{ width: "100%" }}></div>
          )}
          {error && (
            <div style={{ padding: 10, background: "#FEF3C7", border: "1px solid #FCD34D", borderRadius: 6, fontSize: 12, color: "#78350F", marginBottom: 12 }}>
              {error}
            </div>
          )}
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${V.grayMid}` }}>
            <div style={{ fontSize: 12, color: V.gray, marginBottom: 6, fontWeight: 600 }}>O pegar contenido del QR manualmente:</div>
            <textarea value={manualText} onChange={e => setManualText(e.target.value)} rows={3}
              placeholder='Ejemplo: {"lote":"L2609-001","granel":"G305404","salida":"14:30"}'
              style={{ width: "100%", padding: 8, borderRadius: 6, border: `1px solid ${V.grayMid}`, fontFamily: "inherit", fontSize: 12, resize: "vertical", boxSizing: "border-box" }} />
            <Btn onClick={() => manualText.trim() && onScan(manualText)} disabled={!manualText.trim()} style={{ marginTop: 8 }}>
              Procesar contenido pegado
            </Btn>
          </div>
          <div style={{ marginTop: 14, fontSize: 11, color: V.gray, lineHeight: 1.4 }}>
            <strong>Formato esperado del QR (fabricación):</strong><br/>
            JSON: <code style={{background: V.grayLight, padding: "1px 4px"}}>{'{"lote":"L2609-001","granel":"G305404","salida":"14:30"}'}</code><br/>
            o KV: <code style={{background: V.grayLight, padding: "1px 4px"}}>LOTE:L2609-001|GRANEL:G305404|SALIDA:14:30</code>
          </div>
        </div>
      </div>
    </div>
  );
}



// ── Helpers de fechas para KPIs ──
const currentMonth = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const shiftMonth = (m, delta) => {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const formatMonth = (m) => {
  const [y, mo] = m.split("-").map(Number);
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return `${meses[mo - 1]} ${y}`;
};
const last6Months = (m) => Array.from({length: 6}, (_, i) => shiftMonth(m, -5 + i));

// Duración en minutos entre timeIn y timeEnd (mismo día); "" si no calculable
function durationMinutes(tIn, tEnd) {
  if (!tIn || !tEnd) return null;
  const [h1, m1] = tIn.split(":").map(Number);
  const [h2, m2] = tEnd.split(":").map(Number);
  const d = (h2 * 60 + m2) - (h1 * 60 + m1);
  return isNaN(d) || d < 0 ? null : d;
}
function minutesToStr(m) {
  if (m == null) return "—";
  const hh = Math.floor(m / 60);
  const mm = Math.round(m % 60);
  return hh > 0 ? `${hh}h ${mm}min` : `${mm} min`;
}

// ══ KPI DASHBOARD ════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function KpiDashboard({ entries, specs }) {
  const [selMonth, setSelMonth] = useState(currentMonth());
  const prevMonth = shiftMonth(selMonth, -1);

  // ── Cortes por mes ──
  const inMonth = (m) => (e) => (e.date || "").startsWith(m);
  const monthE = entries.filter(inMonth(selMonth));
  const prevE = entries.filter(inMonth(prevMonth));

  const stats = (arr) => {
    const total = arr.length;
    const approved = arr.filter(e => e.status === STATUS.APPROVED).length;
    const rejected = arr.filter(e => e.status === STATUS.REJECTED).length;
    const pending = arr.filter(e => e.status === STATUS.PENDING).length;
    const decided = approved + rejected;
    const rate = decided > 0 ? (approved / decided) * 100 : null;
    // Duración promedio
    const durs = arr.map(e => durationMinutes(e.timeIn, e.timeEnd)).filter(v => v != null);
    const avgDur = durs.length ? durs.reduce((a,b)=>a+b, 0) / durs.length : null;
    // Pre-análisis (ingreso a control - salida fábrica)
    const pres = arr.map(e => durationMinutes(e.timeFactory, e.timeIn)).filter(v => v != null);
    const avgPre = pres.length ? pres.reduce((a,b)=>a+b, 0) / pres.length : null;
    return { total, approved, rejected, pending, rate, avgDur, avgPre };
  };
  const cur = stats(monthE);
  const prv = stats(prevE);

  // ── Top parámetros con "No conforme" en el mes ──
  const paramFails = {};
  monthE.forEach(e => {
    e.results.forEach(r => {
      if (finalPass(r) === false) {
        paramFails[r.paramName] = (paramFails[r.paramName] || 0) + 1;
      }
    });
  });
  const topParams = Object.entries(paramFails).sort((a,b) => b[1]-a[1]).slice(0, 5);

  // ── Rechazos por producto ──
  const productFails = {};
  monthE.forEach(e => {
    if (e.status === STATUS.REJECTED) {
      productFails[e.productCode] = (productFails[e.productCode] || 0) + 1;
    }
  });
  const topProducts = Object.entries(productFails).sort((a,b) => b[1]-a[1]).slice(0, 10);
  const productName = (code) => {
    const s = specs.find(x => x.code === code);
    return s ? s.name : code;
  };

  // ── Pendientes (todos, no del mes) ──
  const allPending = entries.filter(e => e.status === STATUS.PENDING);
  const now = new Date();
  const withAge = allPending.map(e => {
    const created = new Date(e.createdAt || (e.date + "T00:00:00"));
    const hours = (now - created) / (1000 * 60 * 60);
    return { ...e, ageHours: hours };
  }).sort((a,b) => b.ageHours - a.ageHours);

  // ── Tendencia últimos 6 meses ──
  const trend = last6Months(selMonth).map(m => {
    const s = stats(entries.filter(inMonth(m)));
    return { month: m, rate: s.rate, total: s.total };
  });

  // ── Delta con mes anterior ──
  const delta = (curr, prev, digits=1) => {
    if (curr == null || prev == null) return null;
    return +(curr - prev).toFixed(digits);
  };

  // ── Exportar informe mensual ──
  const exportMonthlyReport = () => {
    const wb = XLSX.utils.book_new();
    // Hoja 1: Resumen
    const resumen = [

            <StatCard label="Tasa de aprobación" value={cur.rate} prevValue={prv.rate} unit="%" small={cur.rate == null ? "Sin lotes decididos" : `${cur.approved}/${cur.approved + cur.rejected} lotes`} />

// ── Gráfico de tendencia simple (SVG) ──
function TrendChart({ data }) {
  const w = 320, h = 140, pad = 24;
  const points = data.map((d, i) => ({
    x: pad + (i * (w - pad * 2)) / Math.max(data.length - 1, 1),
    y: d.rate == null ? null : h - pad - ((d.rate / 100) * (h - pad * 2)),
    d
  }));
  const valid = points.filter(p => p.y != null);
  const poly = valid.map(p => `${p.x},${p.y}`).join(" ");

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto" }}>
      {/* Grid horizontal */}
      {[0, 25, 50, 75, 100].map(v => {
        const y = h - pad - ((v / 100) * (h - pad * 2));
        return (
          <g key={v}>
            <line x1={pad} y1={y} x2={w - pad} y2={y} stroke="#E5E7EB" strokeWidth="0.5" />
            <text x={pad - 4} y={y + 3} fontSize="8" fill="#9CA3AF" textAnchor="end">{v}%</text>
          </g>
        );
      })}
      {valid.length > 1 && (
        <polyline points={poly} fill="none" stroke="#B91C1C" strokeWidth="2" />
      )}
      {points.map((p, i) => (
        <g key={i}>
          {p.y != null && <circle cx={p.x} cy={p.y} r="3" fill="#B91C1C" />}
          <text x={p.x} y={h - 6} fontSize="8" fill="#6B7280" textAnchor="middle">{formatMonth(p.d.month).split(" ")[0]}</text>
          {p.y != null && <text x={p.x} y={p.y - 6} fontSize="8" fill="#B91C1C" textAnchor="middle" fontWeight="600">{p.d.rate.toFixed(0)}%</text>}
        </g>
      ))}
    </svg>
  );
}




// ══════════════════════════════════════════════════════════════════
// ══ ANÁLISIS ESTADÍSTICO — CONTROL DE PROCESO ═════════════════════
// ══════════════════════════════════════════════════════════════════

// ── Valor efectivo de un resultado: prioriza retest, sino usa value ──
function effectiveValue(r) {
  const v = (r.retestValue != null && r.retestValue !== "") ? r.retestValue : r.value;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

// ── Estadística descriptiva ──
function computeStats(values) {
  const n = values.length;
  if (n === 0) return null;
  const sorted = [...values].sort((a, b) => a - b);
  const sum = values.reduce((a, b) => a + b, 0);
  const mean = sum / n;
  const variance = n > 1 ? values.reduce((acc, v) => acc + (v - mean) ** 2, 0) / (n - 1) : 0;
  const sd = Math.sqrt(variance);
  const median = n % 2 === 0 ? (sorted[n/2 - 1] + sorted[n/2]) / 2 : sorted[Math.floor(n/2)];
  const cv = mean !== 0 ? (sd / Math.abs(mean)) * 100 : null;
  return { n, mean, median, sd, min: sorted[0], max: sorted[n-1], cv };
}

// ── Índices de capacidad Cp/Cpk ──
function capability(mean, sd, lse, lie) {
  if (sd === 0 || sd == null) return { cp: null, cpk: null };
  const hasUp = lse != null && !isNaN(lse);
  const hasLo = lie != null && !isNaN(lie);
  const cp = (hasUp && hasLo) ? (lse - lie) / (6 * sd) : null;
  const cpu = hasUp ? (lse - mean) / (3 * sd) : Infinity;
  const cpl = hasLo ? (mean - lie) / (3 * sd) : Infinity;
  const cpk = Math.min(cpu, cpl);
  return { cp, cpk: isFinite(cpk) ? cpk : null };
}

// ── Reglas de Nelson para gráficos de control ──
function nelsonAlerts(values, mean, sd) {
  const alerts = [];
  if (sd === 0) return alerts;
  const ucl = mean + 3*sd, lcl = mean - 3*sd;
  const u2 = mean + 2*sd, l2 = mean - 2*sd;
  values.forEach((v, i) => {
    if (v > ucl) alerts.push({ idx: i, rule: 1, msg: "Punto > +3σ (fuera de UCL)" });
    else if (v < lcl) alerts.push({ idx: i, rule: 1, msg: "Punto < -3σ (fuera de LCL)" });
  });
  // Regla 2: 9 consecutivos mismo lado
  for (let i = 8; i < values.length; i++) {
    const w = values.slice(i-8, i+1);
    if (w.every(v => v > mean)) alerts.push({ idx: i, rule: 2, msg: "9 puntos consecutivos > media" });
    else if (w.every(v => v < mean)) alerts.push({ idx: i, rule: 2, msg: "9 puntos consecutivos < media" });
  }
  // Regla 3: tendencia 6 pts
  for (let i = 5; i < values.length; i++) {
    const w = values.slice(i-5, i+1);
    let asc = true, desc = true;
    for (let j = 1; j < w.length; j++) {
      if (w[j] <= w[j-1]) asc = false;
      if (w[j] >= w[j-1]) desc = false;
    }
    if (asc) alerts.push({ idx: i, rule: 3, msg: "Tendencia creciente (6 puntos)" });
    if (desc) alerts.push({ idx: i, rule: 3, msg: "Tendencia decreciente (6 puntos)" });
  }
  // Regla 5: 2 de 3 fuera ±2σ mismo lado
  for (let i = 2; i < values.length; i++) {
    const w = values.slice(i-2, i+1);
    const above = w.filter(v => v > u2).length;
    const below = w.filter(v => v < l2).length;
    if (above >= 2) alerts.push({ idx: i, rule: 5, msg: "2 de 3 puntos > +2σ" });
    if (below >= 2) alerts.push({ idx: i, rule: 5, msg: "2 de 3 puntos < -2σ" });
  }
  return alerts;
}

// ══ Componente principal ══
function StatAnalysis({ entries, specs }) {
  const [productCode, setProductCode] = useState("");
  const [paramName, setParamName] = useState("");
  const today_ = new Date();
  const d90ago = new Date(today_.getTime() - 90 * 24 * 60 * 60 * 1000);
  const iso = (d) => d.toISOString().split("T")[0];
  const [dateFrom, setDateFrom] = useState(iso(d90ago));
  const [dateTo, setDateTo] = useState(iso(today_));

  // Productos ordenados con datos
  const productsWithData = [...new Set(entries.map(e => e.productCode))].sort();
  const selectedSpec = specs.find(s => s.code === productCode);
  const availableParams = selectedSpec ? selectedSpec.parameters.filter(p => p.type === "numeric") : [];

  // Al cambiar producto, resetear parámetro
  useEffect(() => { setParamName(""); }, [productCode]);

  // Data filtrada
  const filteredEntries = entries
    .filter(e => e.productCode === productCode)
    .filter(e => e.date >= dateFrom && e.date <= dateTo)
    .sort((a, b) => (a.date + (a.timeIn || "")).localeCompare(b.date + (b.timeIn || "")));

  const param = availableParams.find(p => p.name === paramName);
  const dataPoints = filteredEntries.map(e => {
    const r = e.results.find(x => x.paramName === paramName);
    return r ? { value: effectiveValue(r), entry: e, hadRetest: r.retestValue != null && r.retestValue !== "", firstValue: parseFloat(r.value) || null } : null;
  }).filter(p => p && p.value != null);

  const values = dataPoints.map(p => p.value);
  const stats = values.length > 0 ? computeStats(values) : null;
  const lse = param?.max !== "" && param?.max != null ? parseFloat(param.max) : null;
  const lie = param?.min !== "" && param?.min != null ? parseFloat(param.min) : null;
  const cap = stats ? capability(stats.mean, stats.sd, lse, lie) : null;
  const nelson = stats && stats.n >= 5 ? nelsonAlerts(values, stats.mean, stats.sd) : [];
  const alertsByIdx = {};
  nelson.forEach(a => {
    if (!alertsByIdx[a.idx]) alertsByIdx[a.idx] = [];
    alertsByIdx[a.idx].push(a);
  });

  // Análisis de retest
  const retestData = dataPoints.filter(p => p.hadRetest);
  const retestRescued = retestData.filter(p => {
    const r = p.entry.results.find(x => x.paramName === paramName);
    return r && r.pass === false && r.retestPass === true;
  }).length;
  const retestDiffs = retestData.map(p => Math.abs(p.value - p.firstValue)).filter(v => !isNaN(v));
  const avgDiff = retestDiffs.length > 0 ? retestDiffs.reduce((a,b) => a+b, 0) / retestDiffs.length : null;

  // Cp/Cpk display
  const capBadge = (val) => {
    if (val == null) return { color: V.gray, bg: V.grayLight, label: "N/A" };
    if (val >= 1.33) return { color: "#166534", bg: "#DCFCE7", label: "Capaz" };
    if (val >= 1.0) return { color: "#92400E", bg: "#FEF3C7", label: "Marginal" };
    return { color: "#991B1B", bg: "#FEE2E2", label: "No capaz" };
  };

  const exportAnalysis = () => {
    if (!param) return;
    const wb = XLSX.utils.book_new();
    const info = [
      ["Análisis Estadístico — " + productCode],
      ["Producto:", selectedSpec?.name || ""],
      ["Parámetro:", paramName + (param.unit ? " (" + param.unit + ")" : "")],
      ["Rango de fechas:", fmt(dateFrom) + " a " + fmt(dateTo)],
      ["Especificación LIE:", lie ?? "—"],
      ["Especificación LSE:", lse ?? "—"],
      [],
      ["ESTADÍSTICA DESCRIPTIVA"],
      ["n", stats?.n],
      ["Media", stats?.mean.toFixed(4)],
      ["Mediana", stats?.median.toFixed(4)],
      ["Desvío estándar (σ)", stats?.sd.toFixed(4)],
      ["Mínimo", stats?.min],
      ["Máximo", stats?.max],
      ["CV%", stats?.cv?.toFixed(2)],
      [],
      ["CAPACIDAD DE PROCESO (n≥20)"],
      ["Cp", cap?.cp?.toFixed(3) ?? "N/A"],
      ["Cpk", cap?.cpk?.toFixed(3) ?? "N/A"],
      [],
      ["ALERTAS REGLAS NELSON"],
      ...nelson.map(a => [`Punto #${a.idx+1}`, `Regla ${a.rule}`, a.msg]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), "Resumen");
    const dataSheet = dataPoints.map((p, i) => ({
      "#": i+1, Fecha: fmt(p.entry.date), Lote: p.entry.batchCode,
      "Valor usado": p.value, "1° medición": p.firstValue, "Fue retest": p.hadRetest ? "Sí" : "No",
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataSheet), "Datos");
    XLSX.writeFile(wb, `analisis_${productCode}_${paramName.replace(/[^a-zA-Z0-9]/g,"_")}_${today()}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <h3 style={{ margin: 0, fontSize: 18, fontWeight: 700 }}>Análisis Estadístico de Proceso</h3>
        <p style={{ margin: "2px 0 0", fontSize: 12, color: V.gray }}>Control de proceso Shewhart · Capacidad Cp/Cpk · Reglas de Nelson</p>
      </div>

      {/* Selectores */}
      <Card>
        <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1.5fr 1fr 1fr auto", gap: 10, alignItems: "flex-end" }}>
          <Field label="Producto (código de granel)">
            <Select value={productCode} onChange={e => setProductCode(e.target.value)}>
              <option value="">— Seleccionar producto —</option>
              {productsWithData.map(c => {
                const s = specs.find(x => x.code === c);
                return <option key={c} value={c}>{c}{s ? ` — ${s.name}` : ""}</option>;
              })}
            </Select>
          </Field>
          <Field label="Parámetro numérico">
            <Select value={paramName} onChange={e => setParamName(e.target.value)} disabled={!productCode}>
              <option value="">— Seleccionar parámetro —</option>
              {availableParams.map(p => <option key={p.id || p.name} value={p.name}>{p.name}{p.unit ? ` (${p.unit})` : ""}</option>)}
            </Select>
          </Field>
          <Field label="Desde">
            <Input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
          </Field>
          <Field label="Hasta">
            <Input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} />
          </Field>
          <Btn variant="secondary" onClick={exportAnalysis} disabled={!stats || stats.n < 5}>
            <Download size={13} /> Exportar
          </Btn>
        </div>
      </Card>

      {/* Sin selección */}
      {(!productCode || !paramName) && (
        <Card style={{ textAlign: "center", padding: 40 }}>
          <BarChart3 size={36} color={V.grayMid} style={{ margin: "0 auto 10px" }} />
          <p style={{ color: V.gray, fontSize: 14 }}>Seleccioná un producto y un parámetro numérico para ver el análisis.</p>
          {productsWithData.length === 0 && <p style={{ color: V.gray, fontSize: 12, marginTop: 4 }}>Aún no hay muestras cargadas.</p>}
        </Card>

      {/* Datos insuficientes */}
      {productCode && paramName && (!stats || stats.n < 5) && (
        <Card style={{ background: "#FEF3C7", border: "1px solid #FCD34D" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: "#78350F" }}>
            <AlertCircle size={16} />
            <span style={{ fontSize: 13, fontWeight: 600 }}>Muestra insuficiente: n = {stats?.n || 0}. Se necesitan al menos 5 mediciones para descriptiva.</span>
          </div>
        </Card>

      {/* Estadística descriptiva */}
      {stats && stats.n >= 5 && (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 12 }}>
            <Card>
              <div style={{ fontSize: 12, fontWeight: 700, color: V.gray, textTransform: "uppercase", marginBottom: 10 }}>Descriptiva</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, fontSize: 13 }}>
                {[
                  ["n", stats.n],
                  ["Media", stats.mean.toFixed(3)],

                  ["σ", stats.sd.toFixed(4)],
                  ["Mínimo", stats.min],
                  ["Máximo", stats.max],
                  ["CV%", stats.cv != null ? stats.cv.toFixed(2) + "%" : "—"],
                  ["Rango", (stats.max - stats.min).toFixed(3)],

                  <div key={k}>
                    <div style={{ fontSize: 11, color: V.gray, fontWeight: 600 }}>{k}</div>

                  </div>
                ))}
              </div>
              <div style={{ marginTop: 10, fontSize: 11, color: V.gray, paddingTop: 8, borderTop: `1px solid ${V.grayMid}` }}>
                Especificación: LIE = {lie ?? "—"} · LSE = {lse ?? "—"}{param.unit ? ` (${param.unit})` : ""}
              </div>
            </Card>

            {[["Cp", cap?.cp], ["Cpk", cap?.cpk]].map(([label, val]) => {
              const b = capBadge(val);
              return (
                <Card key={label} style={{ background: b.bg, borderColor: "transparent" }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: V.gray, textTransform: "uppercase" }}>{label}</div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: b.color, marginTop: 4 }}>
                    {val != null ? val.toFixed(2) : "—"}
                  </div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: b.color, marginTop: 2 }}>{b.label}</div>
                  {stats.n < 20 && <div style={{ fontSize: 10, color: V.gray, marginTop: 4 }}>Requiere n≥20 (actual: {stats.n})</div>}
                </Card>
              );
            })}
          </div>

          {/* Gráfico de control Shewhart */}
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 6 }}>
              <div style={{ fontSize: 13, fontWeight: 700 }}>Gráfico de control (Shewhart)</div>
              <div style={{ fontSize: 11, color: V.gray, display: "flex", gap: 12, flexWrap: "wrap" }}>
                <span><span style={{ display: "inline-block", width: 12, height: 2, background: "#166534", verticalAlign: "middle" }}></span> Media</span>
                <span><span style={{ display: "inline-block", width: 12, height: 2, background: "#DC2626", verticalAlign: "middle" }}></span> UCL/LCL (±3σ)</span>
                <span><span style={{ display: "inline-block", width: 12, borderTop: "1px dashed #6B7280", verticalAlign: "middle" }}></span> Spec (LSE/LIE)</span>
              </div>
            </div>
            <ControlChart values={values} mean={stats.mean} sd={stats.sd} lse={lse} lie={lie} alertsByIdx={alertsByIdx} dataPoints={dataPoints} />
          </Card>

          {/* Alertas Nelson */}
          {nelson.length > 0 && (
            <Card style={{ background: "#FEF3C7", border: "1px solid #FCD34D" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <AlertCircle size={16} color="#92400E" />
                <span style={{ fontSize: 13, fontWeight: 700, color: "#78350F" }}>Alertas de proceso ({nelson.length})</span>
              </div>
              <div style={{ maxHeight: 180, overflowY: "auto" }}>
                <table style={{ width: "100%", fontSize: 12, borderCollapse: "collapse" }}>
                  <thead><tr>
                    <th style={{ padding: "4px 8px", textAlign: "left", color: "#78350F", fontWeight: 600 }}>Punto</th>
                    <th style={{ padding: "4px 8px", textAlign: "left", color: "#78350F", fontWeight: 600 }}>Lote</th>
                    <th style={{ padding: "4px 8px", textAlign: "left", color: "#78350F", fontWeight: 600 }}>Fecha</th>
                    <th style={{ padding: "4px 8px", textAlign: "left", color: "#78350F", fontWeight: 600 }}>Regla</th>
                    <th style={{ padding: "4px 8px", textAlign: "left", color: "#78350F", fontWeight: 600 }}>Detalle</th>
                  </tr></thead>
                  <tbody>
                    {nelson.map((a, i) => {
                      const p = dataPoints[a.idx];
                      return (
                        <tr key={i} style={{ borderBottom: "1px dashed #FCD34D" }}>
                          <td style={{ padding: "4px 8px" }}>#{a.idx + 1}</td>
                          <td style={{ padding: "4px 8px", fontWeight: 600 }}>{p?.entry.batchCode || "—"}</td>
                          <td style={{ padding: "4px 8px" }}>{p ? fmt(p.entry.date) : "—"}</td>
                          <td style={{ padding: "4px 8px" }}>R{a.rule}</td>
                          <td style={{ padding: "4px 8px" }}>{a.msg}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </Card>
          )}

          {/* Análisis de retest */}
          {retestData.length > 0 && (
            <Card>
              <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>Análisis de retest para este parámetro</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, fontSize: 13 }}>
                <div>
                  <div style={{ fontSize: 11, color: V.gray, fontWeight: 600 }}>Cantidad de retests</div>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>{retestData.length}</div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: V.gray, fontWeight: 600 }}>Rescatados por retest</div>
                  <div style={{ fontSize: 18, fontWeight: 700, color: V.greenDark }}>{retestRescued}</div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: V.gray, fontWeight: 600 }}>Tasa recuperación</div>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>{retestData.length > 0 ? ((retestRescued / retestData.length) * 100).toFixed(0) : "—"}%</div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: V.gray, fontWeight: 600 }}>Diferencia promedio 1° vs retest</div>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>{avgDiff != null ? avgDiff.toFixed(3) : "—"}{param.unit ? " " + param.unit : ""}</div>
                </div>
              </div>
              <div style={{ marginTop: 10, fontSize: 11, color: V.gray, paddingTop: 8, borderTop: `1px solid ${V.grayMid}` }}>
                Nota: los valores mostrados en el análisis usan el retest cuando existe (regla definida). Diferencia alta puede indicar problema de instrumento u operador.
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

// ── Gráfico de control SVG ──
function ControlChart({ values, mean, sd, lse, lie, alertsByIdx, dataPoints }) {
  const w = 700, h = 320, padL = 46, padR = 12, padT = 14, padB = 32;
  const n = values.length;
  const ucl = mean + 3*sd, lcl = mean - 3*sd;
  const u1 = mean + sd, l1 = mean - sd;
  const u2 = mean + 2*sd, l2 = mean - 2*sd;

  // Escala Y: usar min entre los datos y LCL/LIE, max entre datos y UCL/LSE
  const allVals = [...values, ucl, lcl];
  if (lse != null) allVals.push(lse);
  if (lie != null) allVals.push(lie);
  const vMin = Math.min(...allVals);
  const vMax = Math.max(...allVals);
  const pad = (vMax - vMin) * 0.08 || 1;
  const yMin = vMin - pad, yMax = vMax + pad;
  const scaleY = (v) => padT + (h - padT - padB) * (1 - (v - yMin) / (yMax - yMin));
  const scaleX = (i) => padL + (w - padL - padR) * (n === 1 ? 0.5 : i / (n - 1));

  const linePath = values.map((v, i) => `${i === 0 ? "M" : "L"} ${scaleX(i)} ${scaleY(v)}`).join(" ");

  const yTicks = 5;
  const tickVals = Array.from({length: yTicks}, (_, i) => yMin + (i / (yTicks - 1)) * (yMax - yMin));

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto", maxHeight: 380 }}>
      {/* Grid Y + ticks */}
      {tickVals.map((v, i) => (
        <g key={i}>
          <line x1={padL} y1={scaleY(v)} x2={w - padR} y2={scaleY(v)} stroke="#F3F4F6" strokeWidth="0.5" />
          <text x={padL - 4} y={scaleY(v) + 3} fontSize="9" fill="#6B7280" textAnchor="end">{v.toFixed(2)}</text>
        </g>
      ))}

      {/* Zonas ±1σ y ±2σ (fondo suave) */}
      <rect x={padL} y={scaleY(u2)} width={w - padL - padR} height={scaleY(l2) - scaleY(u2)} fill="#FEF3C7" opacity="0.3" />
      <rect x={padL} y={scaleY(u1)} width={w - padL - padR} height={scaleY(l1) - scaleY(u1)} fill="#DCFCE7" opacity="0.4" />

      {/* Media */}
      <line x1={padL} y1={scaleY(mean)} x2={w - padR} y2={scaleY(mean)} stroke="#166534" strokeWidth="1.5" />
      <text x={w - padR + 2} y={scaleY(mean) + 3} fontSize="9" fill="#166534" fontWeight="700">μ={mean.toFixed(2)}</text>

      {/* UCL/LCL */}
      <line x1={padL} y1={scaleY(ucl)} x2={w - padR} y2={scaleY(ucl)} stroke="#DC2626" strokeWidth="1.2" />
      <text x={w - padR + 2} y={scaleY(ucl) + 3} fontSize="9" fill="#DC2626" fontWeight="700">UCL</text>
      <line x1={padL} y1={scaleY(lcl)} x2={w - padR} y2={scaleY(lcl)} stroke="#DC2626" strokeWidth="1.2" />
      <text x={w - padR + 2} y={scaleY(lcl) + 3} fontSize="9" fill="#DC2626" fontWeight="700">LCL</text>

      {/* Spec */}
      {lse != null && (
        <>
          <line x1={padL} y1={scaleY(lse)} x2={w - padR} y2={scaleY(lse)} stroke="#6B7280" strokeWidth="1" strokeDasharray="4 3" />
          <text x={padL + 4} y={scaleY(lse) - 3} fontSize="9" fill="#6B7280">LSE={lse}</text>
        </>
      )}
      {lie != null && (
        <>
          <line x1={padL} y1={scaleY(lie)} x2={w - padR} y2={scaleY(lie)} stroke="#6B7280" strokeWidth="1" strokeDasharray="4 3" />
          <text x={padL + 4} y={scaleY(lie) + 10} fontSize="9" fill="#6B7280">LIE={lie}</text>
        </>
      )}

      {/* Serie */}
      <path d={linePath} fill="none" stroke="#1F2937" strokeWidth="1" opacity="0.6" />
      {values.map((v, i) => {
        const hasAlert = alertsByIdx[i] && alertsByIdx[i].length > 0;
        const outOfCtrl = v > ucl || v < lcl;
        const outOfSpec = (lse != null && v > lse) || (lie != null && v < lie);
        const color = outOfSpec ? "#DC2626" : outOfCtrl ? "#DC2626" : hasAlert ? "#F59E0B" : "#166534";
        const p = dataPoints[i];
        const title = `${p?.entry.batchCode || "#" + (i+1)} · ${p ? fmt(p.entry.date) : ""} · ${v}${hasAlert ? " · ⚠ " + alertsByIdx[i].map(a => "R"+a.rule).join(",") : ""}`;
        return (
          <g key={i}>
            <title>{title}</title>
            <circle cx={scaleX(i)} cy={scaleY(v)} r={hasAlert || outOfCtrl ? 5 : 3.5} fill={color} stroke="white" strokeWidth="1" />
          </g>
        );
      })}

      {/* Ejes */}
      <line x1={padL} y1={padT} x2={padL} y2={h - padB} stroke="#9CA3AF" strokeWidth="1" />
      <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#9CA3AF" strokeWidth="1" />
      <text x={padL + (w - padL - padR) / 2} y={h - 8} fontSize="10" fill="#6B7280" textAnchor="middle">Lote (orden cronológico) · n = {n}</text>
    </svg>
  );
}

// ══ MAIN APP ═════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
// Pantalla sola para la carga inicial y para cuando el servidor no contesta.
function PantallaCentral({ titulo, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: 16, fontFamily: "'Montserrat', sans-serif", background: "#F9FAFB" }}>
      <Card style={{ maxWidth: 440, width: "100%", textAlign: "center" }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: V.red, letterSpacing: "0.1em", textTransform: "uppercase" }}>Vessena S.A.</div>
        <h1 style={{ fontSize: 18, fontWeight: 700, margin: "6px 0 12px" }}>{titulo}</h1>
        {children}
      </Card>
    </div>
  );
}

const botonHeader = {
  background: "transparent", color: "#E5E7EB", border: "1px solid #374151", borderRadius: 6,
  padding: "4px 10px", fontSize: 12, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", textDecoration: "none",
};

function App() {
  const [view, setView] = useState("dashboard");
  const [specs, setSpecs] = useState([]);
  const [entries, setEntries] = useState([]);
  const [permisos, setPermisos] = useState([]);
  const [usuario, setUsuario] = useState(null);
  const [estado, setEstado] = useState("cargando"); // cargando | listo | sin-conexion
  const [errorConexion, setErrorConexion] = useState("");
  const [viewPayload, setViewPayload] = useState(null);
  const [aviso, setAviso] = useState(null);

  const avisar = useCallback((texto, tipo = "ok") => {
    const id = Date.now();
    setAviso({ texto, tipo, id });
    setTimeout(() => setAviso(a => (a && a.id === id ? null : a)), tipo === "error" ? 7000 : 2500);
  }, []);

  const aplicarDatos = (d) => {
    setPermisos(d.permisos || []);
    setSpecs(d.specs || []);
    setEntries(d.muestras || []);
  };

  const cargar = useCallback(async () => {
    setEstado("cargando");
    try {
      const r = await fetch("/api/auth/yo", { credentials: "same-origin" });
      if (!r.ok) {
        // Sin sesión se vuelve al portal, que es donde está el acceso.
        location.href = "/?volver=" + encodeURIComponent(location.pathname);
        return;
      }
      const yo = await r.json();
      const d = await api("/datos");
      const rec = yo.recursos && yo.recursos["aprobacion-graneles"];
      setUsuario({ nombre: yo.nombre || yo.usuario, rol: rec ? rec.rol : "" });
      aplicarDatos(d);
      setEstado("listo");
    } catch (e) {
      // Sin servidor no se muestra una app vacía: haría creer que no hay muestras.
      setErrorConexion(e.message);
      setEstado("sin-conexion");
    }
  }, []);

  useEffect(() => { cargar(); }, [cargar]);

  // Trae lo que hayan cargado otras personas desde que se abrió la pestaña.
  const actualizar = async () => {
    try {
      aplicarDatos(await api("/datos"));
      avisar("Datos actualizados");
    } catch (e) {
      avisar("No se pudieron actualizar los datos: " + e.message, "error");
    }
  };

  const salir = async () => {
    // Se cierra en el servidor: si no, la sesión seguiría viva en otra pestaña.
    try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {}
    location.href = "/";
  };

  const puede = (accion) => permisos.includes(accion);

  /* ─── Escrituras ───────────────────────────────────────────────────────────
     Siempre igual: se manda al servidor y recién con su respuesta se actualiza
     la pantalla, con el registro tal como quedó guardado. Devuelven lo guardado,
     o null si falló (el aviso de error ya se mostró). */
  const reemplazarMuestra = (m) => setEntries(prev =>
    prev.some(e => e.id === m.id) ? prev.map(e => (e.id === m.id ? m : e)) : [m, ...prev]
  );

  const escribir = async (fn, textoOk) => {
    try {
      const r = await fn();
      if (textoOk) avisar(textoOk);
      return r;
    } catch (e) {
      avisar(e.message, "error");
      return null;
    }
  };

  const acciones = {
    guardarSpec: (spec) => escribir(async () => {
      const d = await api("/especificaciones", { method: "POST", body: JSON.stringify(spec) });
      setSpecs(prev => prev.some(s => s.id === d.spec.id) ? prev.map(s => (s.id === d.spec.id ? d.spec : s)) : [...prev, d.spec]);
      return d.spec;
    }, "Especificación guardada"),
    borrarSpec: (id) => escribir(async () => {
      await api(`/especificaciones/${encodeURIComponent(id)}`, { method: "DELETE" });
      setSpecs(prev => prev.filter(s => s.id !== id));
      return true;
    }, "Especificación eliminada"),
    crearMuestra: (m) => escribir(async () => {
      const d = await api("/muestras", { method: "POST", body: JSON.stringify(m) });
      reemplazarMuestra(d.muestra);
      return d.muestra;
    }, "Muestra registrada"),
    guardarMuestra: (id, campos) => escribir(async () => {
      const d = await api(`/muestras/${encodeURIComponent(id)}`, { method: "PUT", body: JSON.stringify(campos) });
      reemplazarMuestra(d.muestra);
      return d.muestra;
    }, "Cambios guardados"),
    disponer: (id, status, campos) => escribir(async () => {
      const d = await api(`/muestras/${encodeURIComponent(id)}/disposicion`, { method: "POST", body: JSON.stringify({ ...campos, status }) });
      reemplazarMuestra(d.muestra);
      return d.muestra;
    }, status === STATUS.APPROVED ? "Lote aprobado" : "Lote rechazado"),
    borrarMuestra: (id) => escribir(async () => {
      await api(`/muestras/${encodeURIComponent(id)}`, { method: "DELETE" });
      setEntries(prev => prev.filter(e => e.id !== id));
      return true;
    }, "Muestra eliminada"),
  };

  const navigate = (v, payload = null) => { setView(v); setViewPayload(payload); };

  const nav = [
    { id: "dashboard", label: "Dashboard", icon: BarChart3 },
    { id: "specs", label: "Especificaciones", icon: FlaskConical },
    puede("cargar") && { id: "new-entry", label: "Nueva Muestra", icon: PackagePlus },
    { id: "bitacora", label: "Bitácora", icon: ClipboardList },
    { id: "kpis", label: "KPIs", icon: BarChart3 },
    { id: "stats", label: "Análisis", icon: BarChart3 },
  ].filter(Boolean);

  if (estado === "cargando") return (
    <PantallaCentral titulo="Aprobación de Graneles">
      <p style={{ color: V.gray, fontSize: 13, margin: 0 }}>Cargando datos…</p>
    </PantallaCentral>
  );

  if (estado === "sin-conexion") return (
    <PantallaCentral titulo="No se pudo conectar con el servidor">
      <p style={{ color: V.gray, fontSize: 13, lineHeight: 1.5 }}>
        Las muestras y especificaciones se guardan en el servidor de calidad para que todas vean lo mismo.
        Sin conexión con él no hay nada que mostrar.
      </p>
      {errorConexion && (
        <div style={{ background: "#FEE2E2", border: "1px solid #FCA5A5", color: "#991B1B", borderRadius: 6, padding: "8px 10px", fontSize: 12, marginBottom: 12, wordBreak: "break-word" }}>{errorConexion}</div>
      )}
      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
        <Btn onClick={cargar}>Reintentar</Btn>
        <a href="/" style={{ ...botonHeader, color: V.dark, border: `1px solid ${V.grayMid}`, padding: "7px 14px", fontSize: 13 }}>Ir al portal</a>
      </div>
    </PantallaCentral>
  );

  return (
    <div style={{ fontFamily: "'Montserrat', sans-serif", background: "#F9FAFB", minHeight: "100vh", color: V.dark }}>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />

      {aviso && (
        <div role="status" style={{
          position: "fixed", top: 14, right: 14, left: 14, marginLeft: "auto", zIndex: 2000, maxWidth: 380,
          padding: "10px 14px", borderRadius: 8, fontSize: 13, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,.15)",
          background: aviso.tipo === "error" ? "#FEE2E2" : "#DCFCE7",
          color: aviso.tipo === "error" ? "#991B1B" : "#166534",
          border: `1px solid ${aviso.tipo === "error" ? "#FCA5A5" : "#86EFAC"}`,
        }}>{aviso.texto}</div>
      )}

      {/* Header */}
      <header style={{
        background: V.dark, color: V.white, padding: "12px 24px",
        display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10,
        borderBottom: `3px solid ${V.red}`,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <FlaskConical size={22} color={V.redLight} />
          <span style={{ fontWeight: 700, fontSize: 16, letterSpacing: -0.3 }}>Aprobación de Graneles</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontSize: 12, color: "#D1D5DB", marginRight: 4 }}>
            {usuario?.nombre}{usuario?.rol ? ` · ${ROL_LABEL[usuario.rol] || usuario.rol}` : ""}
          </span>
          <button type="button" onClick={actualizar} style={botonHeader}>Actualizar</button>
          <a href="/" style={botonHeader}>Portal</a>
          <button type="button" onClick={salir} style={botonHeader}>Salir</button>
        </div>
      </header>

      {/* Nav tabs */}
      <nav style={{
        background: V.white, borderBottom: `1px solid ${V.grayMid}`,
        display: "flex", gap: 0, padding: "0 16px", overflowX: "auto",
      }}>
        {nav.map(n => {
          const active = view === n.id || (view === "detail" && n.id === "bitacora");
          return (
            <button key={n.id} onClick={() => navigate(n.id)} style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "12px 16px", fontSize: 13, fontWeight: active ? 700 : 500,
              color: active ? V.red : V.gray, background: "transparent", border: "none",
              borderBottom: active ? `2px solid ${V.red}` : "2px solid transparent",
              cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap",
            }}>
              <n.icon size={15} /> {n.label}
            </button>
          );
        })}
      </nav>

      {/* Content */}
      <main style={{ padding: 20, maxWidth: 1100, margin: "0 auto" }}>
        {view === "dashboard" && <Dashboard entries={entries} specs={specs} navigate={navigate} />}
        {view === "specs" && <SpecsManager specs={specs} onSave={acciones.guardarSpec} onDelete={acciones.borrarSpec} canAdmin={puede("administrar")} />}
        {view === "new-entry" && puede("cargar") && <NewEntry specs={specs} entries={entries} acciones={acciones} usuario={usuario} navigate={navigate} />}
        {view === "bitacora" && <Bitacora entries={entries} specs={specs} navigate={navigate} />}
        {view === "kpis" && <KpiDashboard entries={entries} specs={specs} />}
        {view === "stats" && <StatAnalysis entries={entries} specs={specs} />}
        {view === "detail" && <Detail entry={viewPayload} specs={specs} entries={entries} acciones={acciones} puede={puede} usuario={usuario} navigate={navigate} />}
      </main>
    </div>
  );
}

// ══ DASHBOARD ════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function Dashboard({ entries, specs, navigate }) {
  const counts = {
    total: entries.length,
    pending: entries.filter(e => e.status === STATUS.PENDING).length,
    approved: entries.filter(e => e.status === STATUS.APPROVED).length,
    rejected: entries.filter(e => e.status === STATUS.REJECTED).length,
  };
  const recent = [...entries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);

  const cards = [
    { label: "Total Muestras", value: counts.total, color: V.dark, bg: V.grayLight },
    { label: "Pendientes", value: counts.pending, color: "#92400E", bg: "rgb(254 243 199)" },
    { label: "Aprobados", value: counts.approved, color: V.greenDark, bg: "rgb(220 252 231)" },
    { label: "Rechazados", value: counts.rejected, color: "#991B1B", bg: "rgb(254 226 226)" },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14 }}>
        {cards.map(c => (
          <Card key={c.label} style={{ background: c.bg, borderColor: "transparent" }}>
            <div style={{ fontSize: 28, fontWeight: 700, color: c.color }}>{c.value}</div>
            <div style={{ fontSize: 12, fontWeight: 600, color: c.color, marginTop: 2 }}>{c.label}</div>
          </Card>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <Card>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12, color: V.dark }}>Últimas muestras</div>
          {recent.length === 0 ? (
            <p style={{ color: V.gray, fontSize: 13 }}>Sin muestras registradas. <span onClick={() => navigate("new-entry")} style={{ color: V.red, cursor: "pointer", fontWeight: 600 }}>Crear la primera.</span></p>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {recent.map(e => (
                <div key={e.id} onClick={() => navigate("detail", e)} style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                  padding: "8px 10px", borderRadius: 6, background: V.grayLight, cursor: "pointer",
                  fontSize: 13,
                }}>
                  <div>
                    <span style={{ fontWeight: 600 }}>{e.batchCode}</span>
                    <span style={{ color: V.gray, marginLeft: 8 }}>{e.productCode}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 11, color: V.gray }}>{fmt(e.date)}</span>
                    <Badge status={e.status} />
                  </div>
                </div>
              ))}
            </div>
          )}
        </Card>

        <Card>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12, color: V.dark }}>Productos registrados</div>
          <div style={{ fontSize: 28, fontWeight: 700, color: V.red }}>{specs.length}</div>
          <p style={{ color: V.gray, fontSize: 12, marginTop: 4 }}>especificaciones cargadas</p>
          <Btn variant="secondary" size="sm" onClick={() => navigate("specs")} style={{ marginTop: 12 }}>
            <FlaskConical size={13} /> Gestionar especificaciones
          </Btn>
        </Card>
      </div>
    </div>
  );
}
