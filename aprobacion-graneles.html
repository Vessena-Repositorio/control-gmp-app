// ══ SPECS MANAGER ════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function SpecsManager({ specs, onSave, onDelete, canAdmin }) {
  const [editing, setEditing] = useState(null); // null | "new" | spec object
  const [search, setSearch] = useState("");
  const [brandFilter, setBrandFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [expanded, setExpanded] = useState(null);

  const brands = [...new Set(specs.map(s => s.brand).filter(Boolean))].sort();

  const filtered = specs.filter(s => {
    if (brandFilter && s.brand !== brandFilter) return false;
    if (categoryFilter && s.category !== categoryFilter) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    const commercial = (s.commercialBrands || []).join(" ").toLowerCase();
    return s.code.toLowerCase().includes(q) ||
      s.name.toLowerCase().includes(q) ||
      (s.brand || "").toLowerCase().includes(q) ||
      (s.docRef || "").toLowerCase().includes(q) ||
      commercial.includes(q);
  });

  // El editor queda abierto si el servidor rechaza el guardado, para no perder lo escrito.
  const handleSave = async (spec) => {
    const guardada = await onSave(spec);
    if (guardada) setEditing(null);
  };

  const handleDelete = async (id) => {
    const s = specs.find(x => x.id === id);
    if (confirm(`¿Eliminar la especificación ${s ? s.code : ""}? Las muestras ya cargadas conservan la especificación con la que se evaluaron.`)) {
      await onDelete(id);
    }
  };

  if (editing !== null) {
    return <SpecEditor spec={editing === "new" ? null : editing} onSave={handleSave} onCancel={() => setEditing(null)} existingCodes={specs.map(s => s.code)} editingId={editing === "new" ? null : editing.id} />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", flex: "1 1 auto" }}>
          <div style={{ position: "relative", flex: "1 1 220px", maxWidth: 320 }}>
            <Search size={14} style={{ position: "absolute", left: 10, top: 10, color: V.gray }} />
            <Input placeholder="Buscar por código, nombre, marca…" value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
          <Select value={brandFilter} onChange={e => setBrandFilter(e.target.value)} style={{ width: 160 }}>
            <option value="">Todas las marcas</option>
            {brands.map(b => <option key={b} value={b}>{b}</option>)}
          </Select>
          <Select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)} style={{ width: 150 }}>
            <option value="">Todas las categorías</option>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </Select>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 12, color: V.gray }}>{filtered.length} de {specs.length}</span>
          {canAdmin && <Btn onClick={() => setEditing("new")}><Plus size={14} /> Nuevo producto</Btn>}
        </div>
      </div>

      {filtered.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 40 }}>
          <FlaskConical size={36} color={V.grayMid} style={{ margin: "0 auto 10px" }} />
          <p style={{ color: V.gray, fontSize: 14 }}>
            {specs.length === 0 ? "Sin especificaciones. Crea la primera para comenzar." : "Sin resultados para la búsqueda."}
          </p>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {filtered.map(s => (
            <Card key={s.id} style={{ padding: 0, overflow: "hidden" }}>
              <div style={{
                display: "flex", justifyContent: "space-between", alignItems: "center",
                padding: "12px 16px", cursor: "pointer", gap: 10,
              }} onClick={() => setExpanded(expanded === s.id ? null : s.id)}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
                  {expanded === s.id ? <ChevronDown size={14} color={V.gray} /> : <ChevronRight size={14} color={V.gray} />}
                  <span style={{ fontWeight: 700, fontSize: 13, color: V.red, background: V.redBg, padding: "3px 8px", borderRadius: 5, whiteSpace: "nowrap" }}>{s.code}</span>
                  <span style={{ fontSize: 13, fontWeight: 600, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</span>
                  {s.brand && <span style={{ fontSize: 11, color: V.gray, background: V.grayLight, padding: "2px 8px", borderRadius: 99, whiteSpace: "nowrap" }}>{s.brand}</span>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {s.docRef && <span style={{ fontSize: 11, color: V.gray, whiteSpace: "nowrap" }}>{s.docRef}{s.docVersion ? ` v${s.docVersion}` : ""}</span>}
                  <span style={{ fontSize: 11, color: V.gray, whiteSpace: "nowrap" }}>{s.parameters.length}p</span>
                  {canAdmin && <>
                    <Btn variant="ghost" size="sm" onClick={e => { e.stopPropagation(); setEditing(s); }}><Edit3 size={13} /></Btn>
                    <Btn variant="ghost" size="sm" onClick={e => { e.stopPropagation(); handleDelete(s.id); }}><Trash2 size={13} color="#991B1B" /></Btn>
                  </>}
                </div>
              </div>

              {expanded === s.id && (
                <div style={{ borderTop: `1px solid ${V.grayMid}`, padding: 16, background: V.grayLight }}>
                  {/* Meta info */}
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: "8px 20px", marginBottom: 12, fontSize: 12 }}>
                    <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Categoría</span>{s.category}</div>
                    {s.brand && <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Marca</span>{s.brand}</div>}
                    {s.shelfLife && <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Vida útil</span>{s.shelfLife}</div>}
                    {s.supplier && <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Proveedor</span>{s.supplier}</div>}
                    {s.specType && <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Tipo</span>{s.specType}</div>}
                    {s.sharedSpecsWith && s.sharedSpecsWith.length > 0 && <div><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Comparte specs</span>{Array.isArray(s.sharedSpecsWith) ? s.sharedSpecsWith.join(", ") : s.sharedSpecsWith}</div>}
                    {s.commercialBrands && s.commercialBrands.length > 0 && <div style={{ gridColumn: "1 / -1" }}><span style={{ color: V.gray, display: "block", fontSize: 10, textTransform: "uppercase", letterSpacing: 0.3, fontWeight: 600 }}>Marcas comerciales</span>{s.commercialBrands.map(b => <span key={b} style={{ display: "inline-block", background: "#EEF2FF", color: "#3730A3", padding: "2px 8px", borderRadius: 99, fontSize: 11, marginRight: 4, marginTop: 2, fontWeight: 600 }}>{b}</span>)}</div>}
                  </div>
                  {s.docNote && <div style={{ background: "#FEF3C7", borderLeft: "3px solid #F59E0B", padding: "8px 12px", borderRadius: 4, fontSize: 12, color: "#78350F", marginBottom: 12 }}>{s.docNote}</div>}
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead>
                      <tr style={{ textAlign: "left" }}>
                        {["Parámetro", "Método", "Unidad", "Mín", "Máx", "Objetivo"].map(h => (
                          <th key={h} style={{ padding: "6px 8px", borderBottom: `1px solid ${V.grayMid}`, fontWeight: 600, color: V.gray }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {s.parameters.map(p => (
                        <tr key={p.id}>
                          <td style={{ padding: "6px 8px", fontWeight: 600 }}>{p.name}</td>
                          <td style={{ padding: "6px 8px", color: V.gray }}>{p.method || "—"}</td>
                          <td style={{ padding: "6px 8px", color: V.gray }}>{p.unit || "—"}</td>
                          <td style={{ padding: "6px 8px" }}>{p.min !== "" && p.min != null ? p.min : "—"}</td>
                          <td style={{ padding: "6px 8px" }}>{p.max !== "" && p.max != null ? p.max : "—"}</td>
                          <td style={{ padding: "6px 8px" }}>{p.target !== "" && p.target != null ? p.target : "—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Spec Editor ──
function SpecEditor({ spec, onSave, onCancel, existingCodes, editingId }) {
  const [form, setForm] = useState(spec || {
    code: "", name: "", category: CATEGORIES[0],
    brand: "", docRef: "", docVersion: "", shelfLife: "",
    commercialBrands: [], supplier: "", specType: "", docNote: "",
    sharedSpecsWith: null,
    parameters: [emptyParam()],
  });

  const [guardando, setGuardando] = useState(false);

  function emptyParam() {
    return { id: uid(), name: "", method: "", unit: "", min: "", max: "", target: "", type: "numeric", note: "" };
  }

  const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const setParam = (idx, k, v) => {
    setForm(f => {
      const p = [...f.parameters];
      p[idx] = { ...p[idx], [k]: v };
      return { ...f, parameters: p };
    });
  };
  const addParam = () => setForm(f => ({ ...f, parameters: [...f.parameters, emptyParam()] }));
  const removeParam = (idx) => setForm(f => ({ ...f, parameters: f.parameters.filter((_, i) => i !== idx) }));

  const codeUsed = existingCodes.filter(c => editingId ? c !== spec?.code : true).includes(form.code.trim());
  const valid = form.code.trim() && form.name.trim() && form.parameters.length > 0 && form.parameters.every(p => p.name.trim()) && !codeUsed;

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, margin: 0 }}>
          {spec ? `Editar ${spec.code}` : "Nuevo producto"}
        </h3>
        <Btn variant="ghost" onClick={onCancel}><X size={16} /></Btn>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
        <Field label="Código de granel *">
          <Input value={form.code} onChange={e => setField("code", e.target.value.toUpperCase())} placeholder="G000000" />
          {codeUsed && <span style={{ fontSize: 11, color: "#991B1B" }}>Código ya existe</span>}
        </Field>
        <Field label="Nombre del producto *">
          <Input value={form.name} onChange={e => setField("name", e.target.value)} placeholder="Limpiador multiusos" />
        </Field>
        <Field label="Categoría">
          <Select value={form.category} onChange={e => setField("category", e.target.value)}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </Select>
        </Field>
        <Field label="Marca">
          <Input value={form.brand || ""} onChange={e => setField("brand", e.target.value)} placeholder="Cristal" />
        </Field>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 2fr", gap: 12, marginBottom: 20 }}>
        <Field label="Ref. documento">
          <Input value={form.docRef || ""} onChange={e => setField("docRef", e.target.value)} placeholder="ESP-DOM-000" />
        </Field>
        <Field label="Versión">
          <Input value={form.docVersion || ""} onChange={e => setField("docVersion", e.target.value)} placeholder="1.0" />
        </Field>
        <Field label="Vida útil">
          <Input value={form.shelfLife || ""} onChange={e => setField("shelfLife", e.target.value)} placeholder="24 meses" />
        </Field>
        <Field label="Nota (opcional)">
          <Input value={form.docNote || ""} onChange={e => setField("docNote", e.target.value)} placeholder="Aclaraciones sobre esta especificación" />
        </Field>
      </div>

      <div style={{ marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontWeight: 700, fontSize: 13 }}>Parámetros de control</span>
        <Btn variant="secondary" size="sm" onClick={addParam}><Plus size={12} /> Agregar parámetro</Btn>
      </div>

      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, minWidth: 640 }}>
          <thead>
            <tr>
              {["Parámetro *", "Tipo", "Método", "Unidad", "Mín", "Máx", "Objetivo", ""].map(h => (
                <th key={h} style={{ padding: "6px 4px", textAlign: "left", fontWeight: 600, color: V.gray, borderBottom: `1px solid ${V.grayMid}` }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {form.parameters.map((p, i) => (
              <tr key={p.id}>
                <td style={{ padding: "4px" }}>
                  <Input value={p.name} onChange={e => setParam(i, "name", e.target.value)} placeholder="pH" />
                </td>
                <td style={{ padding: "4px" }}>
                  <Select value={p.type || "numeric"} onChange={e => setParam(i, "type", e.target.value)} style={{ minWidth: 90 }}>
                    <option value="numeric">Numérico</option>
                    <option value="text">Texto</option>
                  </Select>
                </td>
                <td style={{ padding: "4px" }}>
                  <Input value={p.method} onChange={e => setParam(i, "method", e.target.value)} placeholder="Potenciométrico" />
                </td>
                <td style={{ padding: "4px" }}>
                  <Input value={p.unit} onChange={e => setParam(i, "unit", e.target.value)} placeholder="cps" style={{ width: 60 }} />
                </td>
                <td style={{ padding: "4px" }}>
                  <Input value={p.min} onChange={e => setParam(i, "min", e.target.value)} placeholder="—"
                    disabled={p.type === "text"} style={{ width: 70 }} />
                </td>
                <td style={{ padding: "4px" }}>
                  <Input value={p.max} onChange={e => setParam(i, "max", e.target.value)} placeholder="—"
                    disabled={p.type === "text"} style={{ width: 70 }} />
                </td>
                <td style={{ padding: "4px" }}>
                  {/* Habilitado también para texto: es lo que guarda "Conforme" (ej. "Incoloro"). */}
                  <Input value={p.target} onChange={e => setParam(i, "target", e.target.value)} placeholder="—"
                    style={{ width: p.type === "text" ? 140 : 70 }} />
                </td>
                <td style={{ padding: "4px" }}>
                  {form.parameters.length > 1 && (
                    <Btn variant="ghost" size="sm" onClick={() => removeParam(i)}><Trash2 size={12} color="#991B1B" /></Btn>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "flex-end" }}>
        <Btn variant="secondary" onClick={onCancel}>Cancelar</Btn>
        <Btn disabled={!valid || guardando} onClick={async () => { setGuardando(true); await onSave(form); setGuardando(false); }}>
          <Save size={14} /> Guardar especificación
        </Btn>
      </div>
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════
// ══ NEW ENTRY ════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function NewEntry({ specs, entries, acciones, usuario, navigate }) {
  const [form, setForm] = useState({ batchCode: "", productCode: "", analyst: "", date: today(), timeFactory: "", timeIn: nowTime(), timeEnd: "", observations: "" });
  const [results, setResults] = useState([]);
  const [matchedSpec, setMatchedSpec] = useState(null);
  const [qrOpen, setQrOpen] = useState(false);
  const [qrToast, setQrToast] = useState("");
  const [guardando, setGuardando] = useState(false);

  const handleQrScan = (rawText) => {
    const parsed = parseQrPayload(rawText);
    if (!parsed.batchCode && !parsed.productCode) {
      setQrToast("❌ El QR no tuvo formato reconocido. Verificá el contenido.");
      setTimeout(() => setQrToast(""), 4000);
      setQrOpen(false);
      return;
    }
    setForm(f => ({
      ...f,
      batchCode: parsed.batchCode || f.batchCode,
      productCode: parsed.productCode || f.productCode,
      timeFactory: parsed.timeFactory || f.timeFactory,
      timeIn: nowTime(), // hora entrada a control = ahora
    }));
    if (parsed.productCode) {
      // Cargar specs del producto escaneado
      const spec = specs.find(s => s.code === parsed.productCode);
      setMatchedSpec(spec || null);
      if (spec) {
        setResults(spec.parameters.map(p => ({
          paramId: p.id, paramName: p.name, value: "", pass: null,
          retestValue: "", retestPass: null,
          type: p.type || "numeric",
        })));
      }
    }
    setQrOpen(false);
    const partes = [];
    if (parsed.batchCode) partes.push("lote " + parsed.batchCode);
    if (parsed.productCode) partes.push("granel " + parsed.productCode);
    if (parsed.timeFactory) partes.push("salida " + parsed.timeFactory);
    setQrToast("✓ QR leído: " + partes.join(" · "));
    setTimeout(() => setQrToast(""), 4000);
  };

  const selectProduct = (code) => {
    setForm(f => ({ ...f, productCode: code }));
    const spec = specs.find(s => s.code === code);
    setMatchedSpec(spec || null);
    if (spec) {
      setResults(spec.parameters.map(p => ({
        paramId: p.id, paramName: p.name, value: "", pass: null,
        retestValue: "", retestPass: null,
        type: p.type || "numeric",
      })));
    } else {
      setResults([]);
    }
  };

  const setResult = (idx, val, isRetest = false) => {
    setResults(prev => {
      const r = [...prev];
      const param = matchedSpec.parameters.find(p => p.id === r[idx].paramId);
      if (isRetest) {
        r[idx] = { ...r[idx], retestValue: val, retestPass: evalValue(param, val) };
      } else {
        // Cambiar 1ra medición: si vuelve a estar dentro, limpiar retest
        const p = evalValue(param, val);
        r[idx] = { ...r[idx], value: val, pass: p };
        if (p === true || p === null) {
          r[idx].retestValue = "";
          r[idx].retestPass = null;
        }
      }
      return r;
    });
  };
  // Marcar parámetro tipo texto como conforme / no conforme
  const setTextResult = (idx, isConforme, hallazgo) => {
    setResults(prev => {
      const r = [...prev];
      const param = matchedSpec.parameters.find(p => p.id === r[idx].paramId);
      if (isConforme === true) {
        r[idx] = { ...r[idx], value: param?.target || "Conforme", pass: true };
      } else if (isConforme === false) {
        r[idx] = { ...r[idx], value: hallazgo !== undefined ? hallazgo : (r[idx].pass === false ? r[idx].value : ""), pass: false };
      } else {
        r[idx] = { ...r[idx], value: "", pass: null };
      }
      return r;
    });
  };

  const batchExists = entries.some(e => e.batchCode === form.batchCode.trim());
  const canSave = form.batchCode.trim() && matchedSpec && !batchExists && !guardando;

  // El analista, la especificación que queda guardada y el estado los pone el servidor.
  const handleSave = async () => {
    setGuardando(true);
    const muestra = await acciones.crearMuestra({ ...form, batchCode: form.batchCode.trim(), results });
    setGuardando(false);
    if (muestra) navigate("detail", muestra);
  };

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, margin: 0 }}>Registrar nueva muestra</h3>
        <Btn variant="secondary" onClick={() => setQrOpen(true)}>
          📷 Escanear QR de fabricación
        </Btn>
      </div>
      {qrToast && (
        <div style={{
          padding: "8px 12px", borderRadius: 6, fontSize: 12, marginBottom: 12,
          background: qrToast.startsWith("✓") ? "#DCFCE7" : "#FEE2E2",
          border: qrToast.startsWith("✓") ? "1px solid #86EFAC" : "1px solid #FCA5A5",
          color: qrToast.startsWith("✓") ? "#166534" : "#991B1B",
        }}>{qrToast}</div>
      )}
      {qrOpen && <QrScanner onScan={handleQrScan} onCancel={() => setQrOpen(false)} />}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 12 }}>
        <Field label="Código de lote *">
          <Input value={form.batchCode} onChange={e => setForm(f => ({ ...f, batchCode: e.target.value.toUpperCase() }))} placeholder="L2609-001" />
          {batchExists && <span style={{ fontSize: 11, color: "#991B1B" }}>Lote ya registrado</span>}
        </Field>
        <Field label="Código de granel *">
          <Select value={form.productCode} onChange={e => selectProduct(e.target.value)}>
            <option value="">— Seleccionar —</option>
            {[...specs].sort((a, b) => (a.brand || "").localeCompare(b.brand || "") || a.code.localeCompare(b.code)).map(s => (
              <option key={s.id} value={s.code}>
                {s.code} — {s.name}{s.brand ? ` [${s.brand}]` : ""}
              </option>
            ))}
          </Select>
        </Field>
        <Field label="Analista">
          <Input value={usuario?.nombre || ""} readOnly title="Firma quien tiene la sesión abierta"
            style={{ background: V.grayLight, color: V.gray }} />
        </Field>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 20 }}>
        <Field label="Fecha">
          <Input type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))} />
        </Field>
        <Field label="Hora salida fabricación">
          <Input type="time" value={form.timeFactory} onChange={e => setForm(f => ({ ...f, timeFactory: e.target.value }))} />
        </Field>
        <Field label="Hora ingreso muestra (a control)">
          <Input type="time" value={form.timeIn} onChange={e => setForm(f => ({ ...f, timeIn: e.target.value }))} />
        </Field>
        <Field label="Hora fin de análisis">
          <Input type="time" value={form.timeEnd} onChange={e => setForm(f => ({ ...f, timeEnd: e.target.value }))} />
        </Field>
      </div>

      {matchedSpec && (
        <>
          <div style={{
            padding: "10px 14px", background: V.redBg, borderRadius: 8,
            fontSize: 13, marginBottom: 16, display: "flex", alignItems: "center", gap: 8,
            border: `1px solid #FECACA`,
          }}>
            <FlaskConical size={14} color={V.red} />
            <span>Especificaciones cargadas para <strong>{matchedSpec.name}</strong> ({matchedSpec.parameters.length} parámetros)</span>
          </div>

          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 16 }}>
            <thead>
              <tr style={{ background: V.grayLight }}>
                {["Parámetro", "Método", "Rango", "Objetivo", "Resultado", "Estado"].map(h => (
                  <th key={h} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, fontSize: 12, color: V.gray, borderBottom: `1px solid ${V.grayMid}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {results.map((r, i) => {
                const param = matchedSpec.parameters.find(p => p.id === r.paramId);
                const rangeStr = param?.type === "text" ? "Texto" :
                  `${param?.min ?? "—"} – ${param?.max ?? "—"} ${param?.unit || ""}`.trim();
                const fp = finalPass(r);
                const needsRetest = r.pass === false && (param?.type || "numeric") !== "text";
                const rowBg = fp === false ? "rgb(254 242 242)" : (needsRetest && r.retestValue === "" ? "rgb(255 251 235)" : "transparent");
                return (
                  <tr key={r.paramId} style={{ borderBottom: `1px solid ${V.grayMid}`, background: rowBg }}>
                    <td style={{ padding: "8px 10px", fontWeight: 600 }}>{r.paramName}</td>
                    <td style={{ padding: "8px 10px", color: V.gray }}>{param?.method || "—"}</td>
                    <td style={{ padding: "8px 10px", fontSize: 12 }}>{rangeStr}</td>
                    <td style={{ padding: "8px 10px", fontSize: 12 }}>{param?.target || "—"}</td>
                    <td style={{ padding: "8px 10px" }}>
                      {(param?.type || "numeric") === "text" ? (
                        <TextResultButtons result={r} onChange={(isConf, hallazgo) => setTextResult(i, isConf, hallazgo)} />
                      ) : (
                        <>
                          <Input value={r.value} onChange={e => setResult(i, e.target.value)}
                            placeholder="0.00"
                            style={{ width: 120, borderColor: r.pass === false ? "#F87171" : V.grayMid }} />
                          {needsRetest && (
                            <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}>
                              <span style={{ fontSize: 10, color: "#92400E", fontWeight: 600, minWidth: 46 }}>Retest:</span>
                              <Input value={r.retestValue || ""} onChange={e => setResult(i, e.target.value, true)}
                                placeholder="2° medición"
                                style={{ width: 120, borderColor: r.retestPass === false ? "#F87171" : (r.retestPass === true ? "#86EFAC" : "#F59E0B") }} />
                            </div>
                          )}
                        </>
                      )}
                    </td>
                    <td style={{ padding: "8px 10px" }}>
                      {fp === true && (
                        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                          <CheckCircle2 size={18} color="#166534" />
                          {r.pass === false && r.retestPass === true && <span style={{ fontSize: 10, color: "#166534", fontWeight: 600 }}>retest OK</span>}
                        </div>
                      )}
                      {fp === false && <AlertCircle size={18} color="#991B1B" />}
                      {fp === null && r.pass === false && (
                        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                          <AlertCircle size={16} color="#F59E0B" />
                          <span style={{ fontSize: 10, color: "#92400E", fontWeight: 600 }}>retest pend.</span>
                        </div>
                      )}
                      {fp === null && r.pass === null && <span style={{ color: V.grayMid }}>—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </>
      )}

      <Field label="Observaciones" style={{ marginBottom: 16 }}>
        <textarea value={form.observations} onChange={e => setForm(f => ({ ...f, observations: e.target.value }))}
          rows={2} placeholder="Observaciones adicionales…"
          style={{ padding: "7px 10px", borderRadius: 6, border: `1px solid ${V.grayMid}`, fontSize: 13, fontFamily: "inherit", resize: "vertical", width: "100%", boxSizing: "border-box" }} />
      </Field>

      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        <Btn variant="secondary" onClick={() => navigate("dashboard")}>Cancelar</Btn>
        <Btn disabled={!canSave} onClick={handleSave}>
          <Save size={14} /> Guardar muestra
        </Btn>
      </div>
    </Card>
  );
}

// ══════════════════════════════════════════════════════════════════
// ══ BITÁCORA ═════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function Bitacora({ entries, specs, navigate }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const filtered = entries.filter(e => {
    const matchSearch = e.batchCode.toLowerCase().includes(search.toLowerCase()) ||
      e.productCode.toLowerCase().includes(search.toLowerCase()) ||
      e.analyst.toLowerCase().includes(search.toLowerCase());
    const matchStatus = statusFilter === "all" || e.status === statusFilter;
    return matchSearch && matchStatus;
  });

  const exportCSV = () => {
    const rows = [];
    filtered.forEach(e => {
      const spec = e.spec || specs.find(s => s.code === e.productCode);
      e.results.forEach(r => {
        const param = spec?.parameters.find(p => p.id === r.paramId);
        const fp = finalPass(r);
        rows.push({
          Fecha: fmt(e.date),
          "Hora salida fábrica": e.timeFactory || "",
          "Hora Ingreso (control)": e.timeIn || "",
          "Hora Fin": e.timeEnd || "",
          Duración: calcDuration(e.timeIn, e.timeEnd),
          Lote: e.batchCode, Producto: e.productCode,
          Analista: e.analyst, Parámetro: r.paramName,
          Mín: param?.min ?? "", Máx: param?.max ?? "",
          Resultado: r.value,
          "1° Cumple": r.pass === true ? "Sí" : r.pass === false ? "No" : "",
          "Retest": r.retestValue || "",
          "Retest cumple": r.retestPass === true ? "Sí" : r.retestPass === false ? "No" : "",
          "Estado final": fp === true ? "Cumple" : fp === false ? "Fuera de spec" : (r.pass === false ? "Pendiente retest" : ""),
          Estado: STATUS_LABEL[e.status], Observaciones: e.observations || "",
        });
      });
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Bitácora");
    XLSX.writeFile(wb, `bitacora_graneles_${today()}.csv`, { bookType: "csv" });
  };

  const exportXLSX = () => {
    const rows = [];
    filtered.forEach(e => {
      const spec = e.spec || specs.find(s => s.code === e.productCode);
      e.results.forEach(r => {
        const param = spec?.parameters.find(p => p.id === r.paramId);
        const fp = finalPass(r);
        rows.push({
          Fecha: fmt(e.date),
          "Hora salida fábrica": e.timeFactory || "",
          "Hora Ingreso (control)": e.timeIn || "",
          "Hora Fin": e.timeEnd || "",
          Duración: calcDuration(e.timeIn, e.timeEnd),
          Lote: e.batchCode, "Código Producto": e.productCode,
          Analista: e.analyst, Parámetro: r.paramName, Método: param?.method ?? "",
          Unidad: param?.unit ?? "", Mín: param?.min ?? "", Máx: param?.max ?? "",
          Objetivo: param?.target ?? "", Resultado: r.value,
          "1° Cumple": r.pass === true ? "Sí" : r.pass === false ? "No" : "",
          "Retest (2° medición)": r.retestValue || "",
          "Retest cumple": r.retestPass === true ? "Sí" : r.retestPass === false ? "No" : "",
          "Estado final": fp === true ? "Cumple" : fp === false ? "Fuera de spec" : (r.pass === false ? "Pendiente retest" : ""),
          "Estado General": STATUS_LABEL[e.status], Observaciones: e.observations || "",
        });
      });
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = Object.keys(rows[0] || {}).map(() => ({ wch: 15 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Bitácora");
    XLSX.writeFile(wb, `bitacora_graneles_${today()}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 8, flex: "1 1 400px", alignItems: "center" }}>
          <div style={{ position: "relative", flex: 1, maxWidth: 300 }}>
            <Search size={14} style={{ position: "absolute", left: 10, top: 10, color: V.gray }} />
            <Input placeholder="Buscar lote, producto, analista…" value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
          <Select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ width: 140 }}>
            <option value="all">Todos</option>
            <option value="pending">Pendientes</option>
            <option value="approved">Aprobados</option>
            <option value="rejected">Rechazados</option>
          </Select>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <Btn variant="secondary" size="sm" onClick={exportCSV} disabled={filtered.length === 0}>
            <Download size={13} /> CSV
          </Btn>
          <Btn variant="secondary" size="sm" onClick={exportXLSX} disabled={filtered.length === 0}>
            <FileSpreadsheet size={13} /> Excel
          </Btn>
        </div>
      </div>

      {filtered.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 40 }}>
          <ClipboardList size={36} color={V.grayMid} style={{ margin: "0 auto 10px" }} />
          <p style={{ color: V.gray, fontSize: 14 }}>
            {entries.length === 0 ? "Sin registros en la bitácora." : "Sin resultados para el filtro."}
          </p>
        </Card>
      ) : (
        <Card style={{ padding: 0, overflow: "hidden" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ background: V.grayLight }}>
                {["Fecha", "Hora Ingreso", "Duración", "Código Lote", "Producto", "Cargado por", "Resultado", "Estado", ""].map(h => (
                  <th key={h} style={{ padding: "10px 12px", textAlign: "left", fontWeight: 600, fontSize: 12, color: V.gray, borderBottom: `1px solid ${V.grayMid}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.sort((a, b) => b.date.localeCompare(a.date)).map(e => {
                const filled = e.results.filter(r => r.value !== "");
                const passed = e.results.filter(r => finalPass(r) === true).length;
                const failed = e.results.filter(r => finalPass(r) === false).length;
                const retestPend = e.results.filter(retestPendiente).length;
                return (
                  <tr key={e.id} style={{ borderBottom: `1px solid ${V.grayMid}`, cursor: "pointer" }} onClick={() => navigate("detail", e)}>
                    <td style={{ padding: "10px 12px" }}>{fmt(e.date)}</td>
                    <td style={{ padding: "10px 12px", fontSize: 12 }}>{e.timeIn || "—"}</td>
                    <td style={{ padding: "10px 12px", fontSize: 12, color: V.gray }}>{calcDuration(e.timeIn, e.timeEnd) || "—"}</td>
                    <td style={{ padding: "10px 12px", fontWeight: 700 }}>{e.batchCode}</td>
                    <td style={{ padding: "10px 12px" }}>{e.productCode}</td>
                    <td style={{ padding: "10px 12px" }}>{e.analyst}</td>
                    <td style={{ padding: "10px 12px", fontSize: 12 }}>
                      {filled.length > 0 ? (
                        <span>
                          <span style={{ color: V.greenDark }}>{passed}✓</span>
                          {failed > 0 && <span style={{ color: "#991B1B", marginLeft: 6 }}>{failed}✗</span>}
                          {retestPend > 0 && <span style={{ color: "#92400E", marginLeft: 6, fontWeight: 600 }}>{retestPend}⚠retest</span>}
                          <span style={{ color: V.gray, marginLeft: 6 }}>{filled.length}/{e.results.length}</span>
                        </span>
                      ) : <span style={{ color: V.gray }}>Sin datos</span>}
                    </td>
                    <td style={{ padding: "10px 12px" }}><Badge status={e.status} /></td>
                    <td style={{ padding: "10px 12px" }}><Eye size={14} color={V.gray} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
// ══ DETAIL VIEW ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
function Detail({ entry: initialEntry, specs, entries, acciones, puede, usuario, navigate }) {
  const liveEntry = entries.find(e => e.id === initialEntry?.id) || initialEntry;
  const [results, setResults] = useState(liveEntry?.results || []);
  const [observations, setObservations] = useState(liveEntry?.observations || "");
  const [timeFactory, setTimeFactory] = useState(liveEntry?.timeFactory || "");
  const [timeIn, setTimeIn] = useState(liveEntry?.timeIn || "");
  const [timeEnd, setTimeEnd] = useState(liveEntry?.timeEnd || "");
  const [ocupado, setOcupado] = useState(false);
  // La especificación con la que se creó la muestra, no la vigente: si después
  // se corrige un rango, este análisis se sigue leyendo contra el que se usó.
  const spec = liveEntry?.spec || specs.find(s => s.code === liveEntry?.productCode);
  const editable = !!liveEntry && liveEntry.status === STATUS.PENDING && puede("cargar");

  if (!liveEntry) return <Card><p>Entrada no encontrada.</p></Card>;

  const setResult = (idx, val, isRetest = false) => {
    setResults(prev => {
      const r = [...prev];
      const param = spec?.parameters.find(p => p.id === r[idx].paramId);
      if (isRetest) {
        r[idx] = { ...r[idx], retestValue: val, retestPass: evalValue(param, val) };
      } else {
        const p = evalValue(param, val);
        r[idx] = { ...r[idx], value: val, pass: p };
        if (p === true || p === null) {
          r[idx].retestValue = "";
          r[idx].retestPass = null;
        }
      }
      return r;
    });
  };
  const setTextResult = (idx, isConforme, hallazgo) => {
    setResults(prev => {
      const r = [...prev];
      const param = spec?.parameters.find(p => p.id === r[idx].paramId);
      if (isConforme === true) {
        r[idx] = { ...r[idx], value: param?.target || "Conforme", pass: true };
      } else if (isConforme === false) {
        r[idx] = { ...r[idx], value: hallazgo !== undefined ? hallazgo : (r[idx].pass === false ? r[idx].value : ""), pass: false };
      } else {
        r[idx] = { ...r[idx], value: "", pass: null };
      }
      return r;
    });
  };

  const campos = (extra = {}) => ({ results, observations, timeFactory, timeIn, timeEnd, ...extra });

  const saveResults = async (exitAfter = false) => {
    // Al guardar y salir, si no hay hora fin la marca en ese momento (fin del análisis)
    const finalTimeEnd = (exitAfter && !timeEnd) ? nowTime() : timeEnd;
    setOcupado(true);
    const m = await acciones.guardarMuestra(liveEntry.id, campos({ timeEnd: finalTimeEnd }));
    setOcupado(false);
    if (!m) return;
    // Lo que quedó guardado: el servidor normaliza la coma decimal y descarta un
    // retest que ya no corresponde.
    setResults(m.results);
    setTimeEnd(m.timeEnd);
    if (exitAfter) navigate("bitacora");
  };

  // La disposición guarda también lo que hay en pantalla, y no se deshace.
  const changeStatus = async (status) => {
    const verbo = status === STATUS.APPROVED ? "aprobar" : "rechazar";
    if (!confirm(`Vas a ${verbo} el lote ${liveEntry.batchCode} con la firma de ${usuario?.nombre || "tu usuario"}. No se puede deshacer. ¿Seguir?`)) return;
    setOcupado(true);
    const m = await acciones.disponer(liveEntry.id, status, campos());
    setOcupado(false);
    if (m) setResults(m.results);
  };

  const borrar = async () => {
    if (!confirm(`¿Eliminar la muestra del lote ${liveEntry.batchCode}? Queda registrado quién la eliminó.`)) return;
    setOcupado(true);
    const ok = await acciones.borrarMuestra(liveEntry.id);
    setOcupado(false);
    if (ok) navigate("bitacora");
  };

  const allFilled = results.length > 0 && results.every(r => r.pass !== null);
  const anyFailed = results.some(r => finalPass(r) === false);
  const anyRetestPending = results.some(retestPendiente);
  const allPassed = results.length > 0 && results.every(r => finalPass(r) === true);
  const canApprove = allFilled && !anyFailed && !anyRetestPending && !!timeEnd;
  // Las mismas condiciones que exige el servidor, dichas para quien aprueba.
  const faltaParaAprobar = [
    !allFilled && "completar todos los resultados",
    anyRetestPending && "hacer el retest pendiente",
    anyFailed && "no puede haber parámetros fuera de especificación",
    !timeEnd && "cargar la hora de fin de análisis",
  ].filter(Boolean);

  const exportSingle = () => {
    const rows = results.map(r => {
      const param = spec?.parameters.find(p => p.id === r.paramId);
      const fp = finalPass(r);
      return {
        Parámetro: r.paramName, Método: param?.method ?? "", Unidad: param?.unit ?? "",
        Mín: param?.min ?? "", Máx: param?.max ?? "", Objetivo: param?.target ?? "",
        Resultado: r.value,
        "1° Cumple": r.pass === true ? "Sí" : r.pass === false ? "No" : "",
        "Retest (2° medición)": r.retestValue || "",
        "Retest cumple": r.retestPass === true ? "Sí" : r.retestPass === false ? "No" : "",
        "Estado final": fp === true ? "Cumple" : fp === false ? "Fuera de spec" : (r.pass === false ? "Pendiente retest" : ""),
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = Object.keys(rows[0] || {}).map(() => ({ wch: 14 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Análisis");

    const info = XLSX.utils.aoa_to_sheet([
      ["Informe de Análisis de Granel"],
      ["Lote:", liveEntry.batchCode],
      ["Producto:", `${liveEntry.productCode}${spec ? " — " + spec.name : ""}`],
      ["Fecha:", fmt(liveEntry.date)],
      ["Hora salida fabricación:", timeFactory || "—"],
      ["Hora ingreso muestra (control):", timeIn || "—"],
      ["Hora fin de análisis:", timeEnd || "—"],
      ["Duración:", calcDuration(timeIn, timeEnd) || "—"],
      ["Analista:", liveEntry.analyst],
      ["Estado:", STATUS_LABEL[liveEntry.status]],
      ["Aprobado por:", liveEntry.approvedBy || "—"],
      ["Fecha aprobación:", fmt(liveEntry.approvedDate)],
      ["Observaciones:", observations || "—"],
    ]);
    XLSX.utils.book_append_sheet(wb, info, "Info");
    XLSX.writeFile(wb, `analisis_${liveEntry.batchCode}_${today()}.xlsx`);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Btn variant="ghost" onClick={() => navigate("bitacora")}><ArrowLeft size={16} /> Bitácora</Btn>
      </div>

      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 16 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
              <h3 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Lote {liveEntry.batchCode}</h3>
              <Badge status={liveEntry.status} />
            </div>
            <div style={{ fontSize: 13, color: V.gray }}>
              {liveEntry.productCode}{spec ? ` — ${spec.name}` : ""} · {fmt(liveEntry.date)} · Analista: {liveEntry.analyst}
            </div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {puede("administrar") && (
              <Btn variant="ghost" size="sm" onClick={borrar} disabled={ocupado}>
                <Trash2 size={13} color="#991B1B" /> Eliminar
              </Btn>
            )}
            <Btn variant="secondary" size="sm" onClick={exportSingle}>
              <FileSpreadsheet size={13} /> Exportar Excel
            </Btn>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 12, marginBottom: 16, padding: "12px 14px", background: V.grayLight, borderRadius: 8 }}>
          <Field label="Hora salida fabricación">
            <Input type="time" value={timeFactory} onChange={e => setTimeFactory(e.target.value)} disabled={!editable} />
          </Field>
          <Field label="Hora ingreso muestra (a control)">
            <Input type="time" value={timeIn} onChange={e => setTimeIn(e.target.value)} disabled={!editable} />
          </Field>
          <Field label="Hora fin de análisis">
            <div style={{ display: "flex", gap: 6 }}>
              <Input type="time" value={timeEnd} onChange={e => setTimeEnd(e.target.value)} disabled={!editable} style={{ flex: 1 }} />
              {editable && (
                <button type="button" onClick={() => setTimeEnd(nowTime())} style={{
                  padding: "5px 10px", borderRadius: 6, border: `1px solid ${V.grayMid}`,
                  background: V.white, color: V.gray, fontSize: 11, fontWeight: 600,
                  fontFamily: "inherit", cursor: "pointer", whiteSpace: "nowrap"
                }}>Ahora</button>
              )}
            </div>
          </Field>
          <Field label="Duración">
            <div style={{ padding: "7px 10px", fontSize: 13, fontWeight: 600, color: V.dark }}>
              {calcDuration(timeIn, timeEnd) || "—"}
            </div>
          </Field>
        </div>

        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 16 }}>
          <thead>
            <tr style={{ background: V.grayLight }}>
              {["Parámetro", "Método", "Rango", "Objetivo", "Resultado", "Estado"].map(h => (
                <th key={h} style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, fontSize: 12, color: V.gray, borderBottom: `1px solid ${V.grayMid}` }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {results.map((r, i) => {
              const param = spec?.parameters.find(p => p.id === r.paramId);
              const isText = (param?.type || "numeric") === "text";
              const rangeStr = isText ? "Texto" : `${param?.min ?? "—"} – ${param?.max ?? "—"} ${param?.unit || ""}`.trim();
              const fp = finalPass(r);
              const needsRetest = r.pass === false && !isText;
              const rowBg = fp === false ? "rgb(254 242 242)" : (needsRetest && !r.retestValue ? "rgb(255 251 235)" : "transparent");
              return (
                <tr key={r.paramId} style={{
                  borderBottom: `1px solid ${V.grayMid}`,
                  background: rowBg,
                }}>
                  <td style={{ padding: "8px 10px", fontWeight: 600 }}>{r.paramName}</td>
                  <td style={{ padding: "8px 10px", color: V.gray }}>{param?.method || "—"}</td>
                  <td style={{ padding: "8px 10px", fontSize: 12 }}>{rangeStr}</td>
                  <td style={{ padding: "8px 10px", fontSize: 12 }}>{param?.target || "—"}</td>
                  <td style={{ padding: "8px 10px" }}>
                    {isText ? (
                      <TextResultButtons result={r} onChange={(isConf, hallazgo) => setTextResult(i, isConf, hallazgo)} disabled={!editable} />
                    ) : (
                      <>
                        <Input value={r.value} onChange={e => setResult(i, e.target.value)}
                          placeholder="0.00"
                          style={{ width: 120, borderColor: r.pass === false ? "#F87171" : V.grayMid }}
                          disabled={!editable} />
                        {needsRetest && (
                          <div style={{ marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontSize: 10, color: "#92400E", fontWeight: 600, minWidth: 46 }}>Retest:</span>
                            <Input value={r.retestValue || ""} onChange={e => setResult(i, e.target.value, true)}
                              placeholder="2° medición"
                              style={{ width: 120, borderColor: r.retestPass === false ? "#F87171" : (r.retestPass === true ? "#86EFAC" : "#F59E0B") }}
                              disabled={!editable} />
                          </div>
                        )}
                      </>
                    )}
                  </td>
                  <td style={{ padding: "8px 10px" }}>
                    {fp === true && (
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <CheckCircle2 size={18} color="#166534" />
                        {r.pass === false && r.retestPass === true && <span style={{ fontSize: 10, color: "#166534", fontWeight: 600 }}>retest OK</span>}
                      </div>
                    )}
                    {fp === false && <AlertCircle size={18} color="#991B1B" />}
                    {fp === null && r.pass === false && (
                      <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <AlertCircle size={16} color="#F59E0B" />
                        <span style={{ fontSize: 10, color: "#92400E", fontWeight: 600 }}>retest pend.</span>
                      </div>
                    )}
                    {fp === null && r.pass === null && <span style={{ color: V.grayMid }}>—</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

        <Field label="Observaciones" style={{ marginBottom: 16 }}>
          <textarea value={observations} onChange={e => setObservations(e.target.value)}
            rows={2} disabled={!editable}
            style={{ padding: "7px 10px", borderRadius: 6, border: `1px solid ${V.grayMid}`, fontSize: 13, fontFamily: "inherit", resize: "vertical", width: "100%", boxSizing: "border-box" }} />
        </Field>

        {liveEntry.status === STATUS.PENDING && (puede("cargar") || puede("aprobar")) && (
          <div style={{ borderTop: `1px solid ${V.grayMid}`, paddingTop: 16, display: "flex", flexDirection: "column", gap: 14 }}>
            {/* Analista: guardar y salir */}
            {puede("cargar") && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                <div style={{ fontSize: 12, color: V.gray }}>
                  <strong style={{ color: V.dark }}>Analista:</strong> guardá los cambios y la muestra queda pendiente para revisión del supervisor.
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn variant="secondary" onClick={() => saveResults(false)} disabled={ocupado}>
                    <Save size={14} /> Solo guardar
                  </Btn>
                  <Btn onClick={() => saveResults(true)} disabled={ocupado}>
                    <Save size={14} /> Guardar y volver
                  </Btn>
                </div>
              </div>
            )}

            {/* Supervisor: aprobar o rechazar, con la firma de la sesión */}
            {puede("aprobar") && (
              <div style={{ background: V.grayLight, padding: "12px 14px", borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
                <div>
                  <div style={{ fontSize: 12, color: V.gray, marginBottom: 6 }}>
                    <strong style={{ color: V.dark }}>Supervisor:</strong> revisar y aprobar o rechazar el lote.
                  </div>
                  <div style={{ fontSize: 12, color: V.dark }}>Firma: <strong>{usuario?.nombre}</strong></div>
                  {faltaParaAprobar.length > 0 && (
                    <div style={{ fontSize: 11, color: "#92400E", marginTop: 4 }}>Para aprobar falta: {faltaParaAprobar.join(" · ")}</div>
                  )}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn variant="danger" onClick={() => changeStatus(STATUS.REJECTED)} disabled={ocupado}>
                    <X size={14} /> Rechazar
                  </Btn>
                  <Btn variant="success" onClick={() => changeStatus(STATUS.APPROVED)} disabled={!canApprove || ocupado}>
                    <Check size={14} /> Aprobar
                  </Btn>
                </div>
              </div>
            )}
          </div>
        )}

        {liveEntry.status !== STATUS.PENDING && liveEntry.approvedBy && (
          <div style={{
            borderTop: `1px solid ${V.grayMid}`, paddingTop: 12, fontSize: 13, color: V.gray,
            display: "flex", gap: 16,
          }}>
            <span><strong>Disposición:</strong> {STATUS_LABEL[liveEntry.status]}</span>
            <span><strong>Por:</strong> {liveEntry.approvedBy}</span>
            <span><strong>Fecha:</strong> {fmt(liveEntry.approvedDate)}</span>
          </div>
        )}

        {allFilled && (
          <div style={{
            marginTop: 12, padding: "10px 14px", borderRadius: 8, fontSize: 13,
            display: "flex", alignItems: "center", gap: 8,
            background: allPassed ? "rgb(220 252 231)" : anyFailed ? "rgb(254 226 226)" : anyRetestPending ? "rgb(254 243 199)" : V.grayLight,
            border: `1px solid ${allPassed ? "#86EFAC" : anyFailed ? "#FECACA" : anyRetestPending ? "#FCD34D" : V.grayMid}`,
            color: allPassed ? V.greenDark : anyFailed ? "#991B1B" : anyRetestPending ? "#92400E" : V.dark,
          }}>
            {allPassed ? <CheckCircle2 size={16} /> : <AlertCircle size={16} />}
            {allPassed
              ? (results.some(r => r.pass === false && r.retestPass === true)
                  ? "Todos los parámetros dentro de especificación (incluye retest confirmado)."
                  : "Todos los parámetros dentro de especificación.")
              : anyFailed
                ? `${results.filter(r => finalPass(r) === false).length} parámetro(s) confirmado(s) fuera de especificación tras retest.`
                : `${results.filter(retestPendiente).length} parámetro(s) fuera de spec — realizar retest antes de aprobar.`
            }
          </div>
        )}
      </Card>
    </div>
  );
}


// Montaje
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Ocultar splash
setTimeout(() => {
  const el = document.getElementById('loading');
  if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 300); }
}, 100);
</script>
</body>
</html>
