<style>

body{font-family:'Inter',-apple-system,system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;min-height:100%;font-variant-numeric:tabular-nums}

/* Login */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1B1E25,#2D3748);padding:20px}
.login-card{background:#fff;color:#1B1E25;border-radius:16px;width:100%;max-width:400px;padding:40px;box-shadow:0 24px 80px rgba(0,0,0,.3)}

/* Layout */
.side{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--side);display:flex;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--srf);border:1px solid var(--brd);border-radius:9px;padding:14px 16px}

/* Filtros y tabla */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}

/* Modal */
.md-fondo{position:fixed;inset:0;background:rgba(15,20,27,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px;overflow-y:auto}
.md{background:var(--srf);border-radius:12px;width:100%;max-width:760px;padding:22px 24px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.md .md-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}

.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}

@media (max-width:640px){.grilla{grid-template-columns:repeat(2,minmax(0,1fr))}}

.guia .paso b{display:block;font-size:13px;margin-bottom:2px}
.guia ol{padding-left:18px;font-size:12.5px;color:var(--txS);line-height:1.6}

<body>
<div id="app"></div>
<script>
"use strict";
/* Datos Logísticos PT — la ficha de alta de producto.

   Esta pantalla reemplaza al artefacto de Claude que había armado otra
   persona. Lo que hacía bien se conserva tal cual: el cálculo del pallet con
   su dibujo, la lista de datos pendientes, las alertas de valores raros y las
   exportaciones (la de trabajo y la del formato ASU).

   Lo que cambia:
     · los datos están en el servidor (/api/datos-logisticos), no en la nube de
       Claude ni en el navegador de cada PC;
     · se entra con la sesión del portal y los permisos son por recurso: no hay
       usuarios ni contraseñas propios de esta app;
     · la ficha tiene un circuito —borrador, pendiente, aprobada— y al
       aprobarse sale sola a Finanzas con el Excel adjunto;
     · los registros sanitarios (habilitación MSP) se cargan con su documento y
       guardan el histórico de renovaciones. */

const API = "/api/datos-logisticos";
const PESO_SEPARADOR=0.58, PESO_BASE_PALLET=25, ALTO_TACO=0.10, PALLET_L=1.0, PALLET_A=1.2;

const NAV=[{k:"panel",l:"Panel",i:"📊"},{k:"prod",l:"Productos",i:"📦"},{k:"pend",l:"Datos pendientes",i:"⚠"},
  {k:"fichas",l:"Fichas a revisar",i:"✍"},{k:"msp",l:"Habilitaciones MSP",i:"🩺"},{k:"trail",l:"Historial",i:"📜"},{k:"guide",l:"Guía de uso",i:"❓"}];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,dec)=>v===null||v===undefined||v===""||Number.isNaN(v)?"":(typeof v==="number"?v.toLocaleString("es-UY",{minimumFractionDigits:dec??0,maximumFractionDigits:dec??3}):String(v));
const fdt=d=>d?new Date(d).toLocaleString("es-UY",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const fd=d=>d?new Date(String(d).slice(0,10)+"T00:00").toLocaleDateString("es-UY"):"—";
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

/* ---------- Estado ---------- */
let productos=[], logs=[], yo=null, PERMISOS=[], pagina="panel", HAY_ALMACEN=false, DIAS_MSP=30;
let downloads=null;                 // lo usaba el artefacto; acá se descarga con un <a>
const filtro={texto:"",grupo:"",cat:"",pend:false,bajas:false,orden:"sku",dir:1};
const puedeEditar=()=>PERMISOS.includes("cargar");
const puedeAprobar=()=>PERMISOS.includes("aprobar");
const esAdmin=()=>PERMISOS.includes("administrar");
const conectado=true;
const tienePend=p=>faltantes(p).length>0||!!p.nota;
const ESTADOS={borrador:{t:"Borrador",c:"var(--txS)",b:"var(--brdL)"},
  pendiente:{t:"Esperando revisión",c:"var(--wrn)",b:"var(--wrnL)"},
  aprobada:{t:"Aprobada",c:"var(--grn)",b:"var(--grnL)"}};
const sello=p=>{const e=ESTADOS[p.estado]||ESTADOS.borrador;return `<span class="bg" style="background:${e.b};color:${e.c}">${e.t}</span>`;};

/* ---------- Servidor ---------- */
async function api(ruta,opciones){
  const r=await fetch(API+ruta,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opciones||{}));
  let d=null;try{d=await r.json();}catch(e){}
  if(r.status===401){location.href="/?volver="+encodeURIComponent(location.pathname);throw new Error("La sesión venció");}
  if(!r.ok||(d&&d.ok===false))throw new Error((d&&d.error)||("Error "+r.status));
  return d;
}
/** Sube un archivo tal cual (el servidor lo guarda en el volumen). */
async function subir(sku,tipo,nombre,blob){
  const r=await fetch(`${API}/productos/${encodeURIComponent(sku)}/documentos?tipo=${tipo}&nombre=${encodeURIComponent(nombre)}`,
    {method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/octet-stream"},body:blob});
  let d=null;try{d=await r.json();}catch(e){}
  if(!r.ok||(d&&d.ok===false))throw new Error((d&&d.error)||("No se pudo subir el archivo (error "+r.status+")"));
  return d;
}
/**
 * El producto como lo espera la pantalla: lo que guarda `extra` al mismo nivel
 * (las marcas de "no aplica" y las alertas desestimadas), la habilitación MSP
 * como "Si"/"No" —que es lo que muestran los desplegables y el formato ASU— y
 * las fechas recortadas a aaaa-mm-dd, que es lo que leen los campos de fecha.
 */
const soloFecha=f=>(f?String(f).slice(0,10):null);
function dePantalla(p){
  const q=Object.assign({},p.extra||{},p);
  q.msp=p.msp===true?"Si":p.msp===false?"No":"";
  q.mspVence=soloFecha(p.mspVence);
  q.registros=(p.registros||[]).map(r=>Object.assign({},r,{vence:soloFecha(r.vence),emitido:soloFecha(r.emitido)}));
  return q;
}
async function cargarProductos(){
  const d=await api("/productos");
  productos=(d.productos||[]).map(dePantalla);
}
async function cargarHistorial(){
  try{const d=await api("/actividad?dias=365");
    logs=(d.actividad||[]).map(a=>({ts:a.ts,usuario:a.usuario,accion:a.accion,entidad:a.sku?"SKU "+a.sku:"",detalle:a.detalles||""}));
  }catch(e){logs=[];}
}
/* El artefacto registraba cada cosa en su propia colección; acá lo hace el
   servidor en dl_actividad, así que no hay nada que escribir desde la pantalla. */
const alog=async()=>{};

/**
 * Guarda los cambios de un producto. Recibe el objeto entero (así lo llaman
 * las pantallas que venían del artefacto) y manda solo lo que cambió.
 */
async function guardar(o,accion,ant){
  // SKU nuevo: va entero, no por diferencias.
  if(!productos.some(x=>x.sku===o.sku)){
    const cuerpo={};
    CAMPOS.forEach(c=>{if(o[c.k]!==undefined&&o[c.k]!==null&&o[c.k]!=="")cuerpo[c.k]=o[c.k];});
    cuerpo.sku=o.sku;
    const d=await api("/productos",{method:"POST",body:JSON.stringify(cuerpo)});
    reemplazar(d.producto);cerrar();refrescar();
    aviso(`SKU ${o.sku} creado. Cuando esté completo, mandalo a revisar.`,"success");
    return;
  }
  const previo=ant||productos.find(x=>x.sku===o.sku)||{};
  const cuerpo={};
  CAMPOS.forEach(c=>{const k=c.k;if(k==="sku")return;
    const a=previo[k]===undefined?null:previo[k], b=o[k]===undefined?null:o[k];
    if(String(a??"")!==String(b??""))cuerpo[k]=b;});
  if((o.activo!==false)!==(previo.activo!==false))cuerpo.activo=o.activo!==false;
  // Las marcas que no son campos de la ficha (alertas desestimadas, "no aplica")
  const extra={};
  ["alertasOk","noAplica","baseConfirmada","altoConfirmado"].forEach(k=>{
    if(JSON.stringify(o[k]??null)!==JSON.stringify(previo[k]??null))extra[k]=o[k]??null;});
  if(Object.keys(extra).length)cuerpo.extra=extra;
  if(!Object.keys(cuerpo).length)return;
  const d=await api("/productos/"+encodeURIComponent(o.sku),{method:"PUT",body:JSON.stringify(cuerpo)});
  reemplazar(d.producto);
  cerrar();
  if(d.vuelveARevision)aviso("La ficha ya había salido a Finanzas: con este cambio vuelve a quedar pendiente de revisión.","warn");
  refrescar();
}
function reemplazar(p){
  const q=dePantalla(p);const i=productos.findIndex(x=>x.sku===q.sku);
  if(i>=0)productos[i]=q;else productos.push(q);
  return q;
}

/* ---------- Avisos arriba de la pantalla ---------- */
function aviso(texto,clase){
  const d=document.createElement("div");
  d.className="ctx-help"+(clase?" "+clase:"");
  d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:60;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.18)";
  d.textContent=texto;document.body.appendChild(d);
  setTimeout(()=>d.remove(),6000);
}

/* ---------- Layout ---------- */
function arrancar(){
  $("#app").innerHTML=`<aside class="side"><div class="cab"><div class="marca">Vessena S.A.</div><div class="tit">Datos Logísticos PT</div></div>
    <div class="yo"><b>${esc(yo.nombre)}</b>${esc(yo.rol)}</div>
    <nav id="nav"></nav>
    <div class="pie"><a class="salir" href="/" style="display:block;text-decoration:none">← Volver al portal</a></div></aside>
    <main class="main" id="main"></main><div id="modal"></div>`;
  pintarNav(); ir(pagina);
}
function pintarNav(){
  $("#nav").innerHTML=NAV.map(n=>{
    const extra=n.k==="pend"?productos.filter(p=>p.activo!==false&&tienePend(p)).length
      :n.k==="fichas"?productos.filter(p=>p.estado==="pendiente").length:0;
    return `<button data-k="${n.k}" ${pagina===n.k?'aria-current="page"':""}><span>${n.i}</span>${n.l}${extra?` <b style="margin-left:auto;background:var(--wrnL);color:var(--wrn);border-radius:9px;padding:0 6px;font-size:11px">${extra}</b>`:""}</button>`;
  }).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>ir(b.dataset.k));
}

/* ---------- Cálculos ---------- */
function calc(p){
  const r = {};
  r.cajasPal = p.unPal && p.unx ? p.unPal / p.unx : null;
  const altoBulto = p.acostada ? p.cA : p.cH;
  r.pHcarga = altoBulto && p.estiba ? altoBulto * p.estiba / 100 : null;
  r.pH = r.pHcarga != null ? r.pHcarga + ALTO_TACO : null;
  r.pHcm = r.pH != null ? Math.round(r.pH * 1000) / 10 : null;
  r.pHcargaCm = r.pHcarga != null ? Math.round(r.pHcarga * 1000) / 10 : null;
  r.pesoCajaCerr = p.unx && p.pesoPT ? p.unx * p.pesoPT + (p.pesoCaja || 0) : null;
  r.pesoSep = p.sep != null ? p.sep * PESO_SEPARADOR : null;
  r.filmP = p.filmU != null && p.unPal ? p.filmU * p.unPal : null;
  r.pesoPal = (p.filmU != null && r.cajasPal && r.pesoCajaCerr) ? r.cajasPal * r.pesoCajaCerr + (r.pesoSep || 0) + r.filmP + PESO_BASE_PALLET : null;
  return r;
}
const SIN_DATO = v => v === null || v === undefined || v === "" || /^(na|n\/a|nc|n\/d|no aplica)$/i.test(String(v).trim());
function faltantes(p){
  const f = [];
  const req = [["ean","EAN13"],["dun","DUN14"],["unx","unidades por bulto"],["cL","largo de caja"],["cA","ancho de caja"],["cH","alto de caja"],
    ["porPiso","bultos por piso"],["estiba","pisos"],["unPal","unidades por pallet"],["pesoPT","peso PT"],["uL","largo PT"],["uA","ancho PT"],["uH","alto PT"]];
  req.push(["marca","marca"],["contenido","contenido neto"]);
  if (p.grupo === "Nacionales") req.push(["codCaja","código de caja o funda"],["pesoCaja","peso de caja o funda vacía"],["sep","separadores"],["filmU","film stretch"]);
  const na = p.noAplica || [];
  req.forEach(([k,t]) => { if (SIN_DATO(p[k]) && !na.includes(k)) f.push(t); });
  return f;
}
function faltantesK(p){
  const req = [["ean","EAN13"],["dun","DUN14"],["unx","unidades por bulto"],["cL","largo de caja"],["cA","ancho de caja"],["cH","alto de caja"],
    ["porPiso","bultos por piso"],["estiba","pisos"],["unPal","unidades por pallet"],["pesoPT","peso PT"],["uL","largo PT"],["uA","ancho PT"],["uH","alto PT"],["marca","marca"],["contenido","contenido neto"]];
  if (p.grupo === "Nacionales") req.push(["codCaja","código de caja o funda"],["pesoCaja","peso de caja o funda vacía"],["sep","separadores"],["filmU","film stretch"]);
  return req.filter(([k]) => SIN_DATO(p[k]));
}
const NOMBRE_CAMPO = k => (faltantesK({grupo:"Nacionales"}).find(x=>x[0]===k)||[k,k])[1];

/* ---------- 6. Alertas de valores fuera de lo normal ---------- */
const PESO_MAX_PALLET = 1000, ALTO_MAX_PALLET = 2.2, TOLERANCIA_BASE = 1.10;
const NOMBRE_ALERTA={peso:"peso del pallet",alto:"alto del pallet",base:"bultos por piso / base del pallet",contenido:"peso PT vs. contenido neto"};
const alertaDesestimada=(p,k)=>(p.alertasOk||[]).includes(k)||(k==="base"&&p.baseConfirmada)||(k==="alto"&&p.altoConfirmado);
function alertasK(p,todas){
  const a = [], cp = calc(p), ok = k => todas || !alertaDesestimada(p,k);
  if (cp.pesoPal && cp.pesoPal > PESO_MAX_PALLET && ok("peso")) a.push({k:"peso",t:`El pallet pesa ${fmt(cp.pesoPal,1)} kg: supera los ${PESO_MAX_PALLET} kg.`});
  if (cp.pH && cp.pH > ALTO_MAX_PALLET && ok("alto")) a.push({k:"alto",t:`El pallet mide ${fmt(cp.pHcm,1)} cm con el taco: supera los ${fmt(ALTO_MAX_PALLET*100)} cm.`});
  const largo = p.cL, ancho = p.acostada ? p.cH : p.cA;
  if (p.porPiso && largo && ancho && ok("base")) {
    const ocupa = p.porPiso * largo * ancho, base = PALLET_L*100 * PALLET_A*100;
    if (ocupa > base * TOLERANCIA_BASE) a.push({k:"base",t:`${fmt(p.porPiso)} bultos de ${fmt(largo)} × ${fmt(ancho)} cm ocupan ${fmt(Math.round(ocupa/100)/100,2)} m², más que la base del pallet (1,20 m²).`});
  }
  if (p.pesoPT && p.contenido && p.contenidoUM && ok("contenido")) {
    const kg = {ml:0.001,cc:0.001,l:1,g:0.001,kg:1}[p.contenidoUM] * p.contenido;
    const liquido = ["ml","cc","l"].includes(p.contenidoUM);
    const min = liquido ? kg*0.8 : kg, max = kg*1.5 + 0.15;
    if (kg && (p.pesoPT < min || p.pesoPT > max)) a.push({k:"contenido",t:`El peso PT (${fmt(p.pesoPT,3)} kg) no se corresponde con el contenido neto (${fmt(p.contenido)} ${p.contenidoUM}).`});
  }
  return a;
}
function alertas(p){return alertasK(p).map(x=>x.t);}
function desestimadas(p){return ["peso","alto","base","contenido"].filter(k=>alertaDesestimada(p,k));}
function errorCodigo(v,largos,nombre){
  if(!/^\d+$/.test(v))return `El ${nombre} solo puede tener números (sin espacios, letras ni guiones).`;
  if(!largos.includes(v.length))return `El ${nombre} tiene que tener ${largos.join(" o ")} dígitos (tiene ${v.length}).`;
  if(!digitoOk(v)){const b=v.slice(0,-1);let t=0;[...b].reverse().forEach((d,i)=>t+=Number(d)*(i%2===0?3:1));
    return `El dígito verificador del ${nombre} no es válido: termina en ${v.slice(-1)} y debería terminar en ${(10-t%10)%10}.`;}
  return null;
}
function digitoOk(c){
  if (!/^\d{13,14}$/.test(c)) return false;
  const b = c.slice(0,-1); let t = 0;
  [...b].reverse().forEach((d,i) => t += Number(d) * (i % 2 === 0 ? 3 : 1));
  return (10 - t % 10) % 10 === Number(c.slice(-1));
}


function dibujoPallet(p, cp){
  const pisos = p.estiba || 0, porPiso = p.porPiso || 0;
  if (!pisos || !cp.pH) return `<p class="meta">Sin estiba o alto de caja: no se puede dibujar el pallet.</p>`;
  const W = 480, base = 26, altoMax = 200, escala = altoMax / Math.max(cp.pHcarga, 1.4);
  const altoCarga = Math.min(cp.pHcarga, 2.4) * escala, h = altoCarga / pisos;
  const cols = Math.min(Math.max(Math.round(Math.sqrt(porPiso * 1.2)), 1), 8);
  const x0 = 24, anchoCarga = W - 120, w = anchoCarga / cols, yBase = altoMax + 16;
  let s = `<svg viewBox="0 0 ${W} ${yBase+base+6}" role="img" aria-label="Pallet de ${pisos} pisos y ${fmt(cp.pHcm,1)} cm de alto total">`;
  for (let i = 0; i < pisos; i++){ const y = yBase - (i+1) * h;
    for (let j = 0; j < cols; j++) s += `<rect x="${x0+j*w+1}" y="${y+1}" width="${w-2}" height="${h-2}" rx="2" fill="var(--cartonL)" stroke="var(--carton)"/>`; }
  s += `<rect x="${x0-6}" y="${yBase}" width="${anchoCarga+12}" height="7" fill="var(--madera)"/>`;
  [0,.5,1].forEach(f => s += `<rect x="${x0-6+f*(anchoCarga-18)}" y="${yBase+7}" width="30" height="${base-14}" fill="var(--madera)"/>`);
  s += `<rect x="${x0-6}" y="${yBase+base-7}" width="${anchoCarga+12}" height="7" fill="var(--madera)"/>`;
  const yTop = yBase - altoCarga, xl = x0 + anchoCarga + 22;
  s += `<line x1="${xl}" y1="${yTop}" x2="${xl}" y2="${yBase+base}" stroke="var(--txt)"/><line x1="${xl-6}" y1="${yTop}" x2="${xl+6}" y2="${yTop}" stroke="var(--txt)"/><line x1="${xl-6}" y1="${yBase+base}" x2="${xl+6}" y2="${yBase+base}" stroke="var(--txt)"/>`;
  s += `<text x="${xl+12}" y="${(yTop+yBase)/2+5}" font-size="16" font-weight="700" fill="var(--txt)" font-family="IBM Plex Sans Condensed, Arial Narrow, sans-serif">${fmt(cp.pHcm,1)} cm</text>`;
  return s + `</svg>`;
}

function listar(soloPend){

  const l=productos.filter(p=>((filtro.bajas&&!soloPend)?p.activo===false:p.activo!==false)&&(!filtro.grupo||p.grupo===filtro.grupo)&&(!filtro.cat||p.cat===filtro.cat)&&
    (!(filtro.pend||soloPend)||tienePend(p))&&(!q||[p.sku,p.desc,p.ean,p.dun].some(x=>x&&String(x).toLowerCase().includes(q))));
  const k=filtro.orden,d=filtro.dir,col=COLS.find(c=>c.k===k),val=p=>col&&col.c?calc(p)[k]:p[k];
  return l.sort((a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    if(k==="sku"){const nx=+x,ny=+y;if(!isNaN(nx)&&!isNaN(ny))return(nx-ny)*d;}
    return(typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"es"))*d;});

function formulario(p,base){
  const LIMPIAR=["sku","ean","dun","estadoAlta","altaFecha","altaPor","modificado","modificadoPor","packsLM","packsV3","msp","mspNum","mspVence"];
  const copia=base?(()=>{const c={...base};LIMPIAR.forEach(k=>delete c[k]);c.activo=true;c.copiaDe=base.sku;return c;})():null;
  const nuevo=!p;p=p||copia||{grupo:"Nacionales",vida:24,activo:true,acostada:false,cm:true,tipoEmpaque:"Caja",tempCerrado:"Temperatura Ambiente",tempAbierto:"Temperatura Ambiente"};
  const campo=c=>{const v=p[c.k];
    if(c.op)return `<label class="fd ${c.cls||""}"><span>${c.t}</span><select class="in" name="${c.k}">${c.op.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select></label>`;
    if(c.chk)return `<label class="chk ${c.cls||""}" style="margin:22px 0 10px"><input type="checkbox" name="${c.k}"${v?" checked":""}> ${c.t}</label>`;
    if(c.area)return `<label class="fd ${c.cls||""}"><span>${c.t}</span><textarea class="in" name="${c.k}" rows="2">${esc(v)}</textarea></label>`;
    return `<label class="fd ${c.cls||""}"><span>${c.t}</span><input class="in" name="${c.k}" ${c.tipo==="date"?'type="date"':""} ${c.n?'inputmode="decimal"':""} value="${esc(typeof v==="number"?String(v).replace(".",","):v)}" ${c.k==="sku"&&!nuevo?"readonly":""}></label>`;};
  modal(`<div class="md-cab"><h1 class="pag">${nuevo?(copia?"Nuevo SKU (copia de "+esc(copia.copiaDe)+")":"Nuevo SKU"):"Editar SKU "+esc(p.sku)}</h1><button class="btn sm" data-x>✕ Cerrar</button></div>
    ${copia?`<div class="ctx-help success">⧉ Se copiaron los datos del SKU ${esc(copia.copiaDe)}. Completá el SKU nuevo, el EAN13 y el DUN14, y revisá la descripción y lo que cambie.</div>`:""}
    <div class="ctx-help">💡 Los cálculos (bultos por pallet, alto y peso del pallet) se actualizan mientras completás. Si el bulto va acostado, marcá la opción y el alto del pallet se calcula con el ancho.</div>
    <form id="fm" novalidate><div class="grilla">${CAMPOS.map(campo).join("")}</div><div class="calc" id="calc"></div><div id="alertas"></div><ul class="errores" id="err"></ul>
    <div class="acc"><button type="button" class="btn g" data-x>Cancelar</button><button type="submit" class="btn">${nuevo?"Crear SKU":"Guardar cambios"}</button></div></form>`);
  const f=$("#fm");
  const leer=()=>{const o={...p};CAMPOS.forEach(c=>{const el=f.elements[c.k];
    if(c.chk)o[c.k]=el.checked;else if(c.n){let t=el.value.trim();if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");o[c.k]=t===""?null:Number(t);}else o[c.k]=el.value.trim()||null;});return o;};
  const act=()=>{const cp=calc(leer());$("#calc").textContent=`Cálculo: ${fmt(cp.cajasPal)||"—"} bultos por pallet · alto ${fmt(cp.pHcm,1)||"—"} cm · bulto cerrado ${fmt(cp.pesoCajaCerr,2)||"—"} kg · pallet ${fmt(cp.pesoPal,1)||"—"} kg`;};
  // Unidades por pallet: se calcula sola con unidades por bulto × bultos por piso × pisos, salvo que se escriba a mano
  let unPalManual=!nuevo||!!(copia&&copia.unPal!=null&&!(copia.unx&&copia.porPiso&&copia.estiba&&copia.unx*copia.porPiso*copia.estiba===copia.unPal));
  const elUP=f.elements.unPal, nota=document.createElement("small");
  nota.style.cssText="display:block;font-size:11px;color:var(--txS);margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400";
  elUP.parentNode.appendChild(nota);
  const autoUP=()=>{const o=leer();
    if(!unPalManual&&o.unx&&o.porPiso&&o.estiba){elUP.value=String(o.unx*o.porPiso*o.estiba);nota.textContent="Calculado: unidades por bulto × bultos por piso × pisos";}
    else if(!nuevo&&unPalManual){nota.textContent="Valor cargado. Se recalcula si cambiás unidades por bulto, bultos por piso o pisos.";}
    else if(unPalManual){nota.innerHTML='Cargado a mano. <a href="#" id="upAuto">Volver a calcular</a>';const a=$("#upAuto");if(a)a.onclick=e=>{e.preventDefault();unPalManual=false;autoUP();act();};}
    else nota.textContent="Se calcula al completar unidades por bulto, bultos por piso y pisos";};
  elUP.addEventListener("input",()=>{unPalManual=elUP.value.trim()!=="";autoUP();});
  // Control de EAN13 y DUN14 mientras se escribe
  const chequeo=(k,largos,nombre)=>{const el=f.elements[k],msg=document.createElement("small");
    msg.style.cssText="display:block;font-size:11px;margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400";el.parentNode.appendChild(msg);
    const ver=()=>{const v=el.value.trim();if(!v){msg.textContent="";el.removeAttribute("aria-invalid");return;}
      if(!nuevo&&v===String(p[k]??"")){msg.textContent="Código ya cargado";msg.style.color="var(--txS)";el.removeAttribute("aria-invalid");return;}
      const e=errorCodigo(v,largos,nombre);msg.textContent=e||"✓ Formato y dígito verificador correctos";msg.style.color=e?"var(--red)":"var(--grn)";
      e?el.setAttribute("aria-invalid","true"):el.removeAttribute("aria-invalid");};
    el.addEventListener("input",ver);ver();};
  chequeo("ean",[13],"EAN13");chequeo("dun",[14],"DUN14");
  f.addEventListener("input",e=>{if(["unx","porPiso","estiba"].includes(e.target.name)){unPalManual=false;autoUP();}});
  autoUP();
  const actAl=()=>{const a=alertas(leer());$("#alertas").innerHTML=a.length?`<div class="ctx-help warn">⚠ <span>Revisá: ${a.map(esc).join(" ")}</span></div>`:"";};
  f.addEventListener("input",actAl);
  f.oninput=act;act();actAl();
  f.onsubmit=async e=>{e.preventDefault();const o=leer(),err=[];f.querySelectorAll(".in").forEach(i=>i.removeAttribute("aria-invalid"));const mk=k=>f.elements[k]?.setAttribute("aria-invalid","true");
    if(!o.sku||!/^[A-Za-z0-9._-]+$/.test(o.sku)){err.push("El SKU es obligatorio y solo admite letras, números, punto, guion y guion bajo.");mk("sku");}
    else if(nuevo&&productos.some(x=>x.sku===o.sku)){err.push(`El SKU ${o.sku} ya existe.`);mk("sku");}
    if(!o.desc){err.push("La descripción es obligatoria.");mk("desc");}

/** Lo que falta para que salga el aviso a Ventas (el servidor manda lo mismo). */
function loQueFaltaParaVentas(p){
  const falta=[];
  if(p.estado!=="aprobada")falta.push("que se apruebe la ficha");
  if(!docVigente(p,"certificado"))falta.push("el certificado MSP");
  if(!docVigente(p,"seguridad"))falta.push("la ficha de seguridad");
  return falta;
}

async function baja(p){
  const b=p.activo!==false;
  if(!confirm(b?`¿Dar de baja el SKU ${p.sku}? Deja de contar en el panel, pero no se borra.`:`¿Reactivar el SKU ${p.sku}?`))return;
  try{const d=await api("/productos/"+encodeURIComponent(p.sku),{method:"PUT",body:JSON.stringify({activo:!b})});
    reemplazar(d.producto);cerrar();}
  catch(e){alert(e.message);}
}

/* ---------- El circuito ---------- */
async function mandarARevision(p){
  if(!confirm(`¿Mandar a revisar la ficha del SKU ${p.sku}?\n\nLa van a revisar Antonella o Claudia. Si la aprueban, sale sola a Finanzas.`))return;
  try{
    await generarYSubirFicha(p);
    const d=await api(`/productos/${encodeURIComponent(p.sku)}/revision`,{method:"POST",body:"{}"});
    reemplazar(d.producto);cerrar();aviso("Quedó esperando revisión.","success");
  }catch(e){alert(e.message);}
}
async function aprobarFicha(p){
  if(!confirm(`¿Aprobar la ficha del SKU ${p.sku}?\n\nAl aprobarla sale sola a Finanzas (Marianela) con la ficha de alta adjunta.`))return;
  try{
    await generarYSubirFicha(p);
    const d=await api(`/productos/${encodeURIComponent(p.sku)}/aprobar`,{method:"POST",body:"{}"});
    reemplazar(d.producto);cerrar();
    const f=d.finanzas||{};
    aviso(f.enviado?"Ficha aprobada y enviada a Finanzas."
      :"Ficha aprobada, pero el correo a Finanzas no salió: "+(f.motivo||"revisá la configuración de correo."),f.enviado?"success":"warn");
    if(d.ventas&&d.ventas.enviado)aviso("También salió el aviso a Ventas y Logística.","success");
  }catch(e){alert(e.message);}
}
async function devolverFicha(p){
  const motivo=prompt(`¿Qué hay que corregir en la ficha del SKU ${p.sku}?\n\nLo ve quien la armó.`);
  if(motivo===null)return;
  try{const d=await api(`/productos/${encodeURIComponent(p.sku)}/devolver`,{method:"POST",body:JSON.stringify({motivo})});
    reemplazar(d.producto);cerrar();aviso("Devuelta para corregir.","warn");}
  catch(e){alert(e.message);}
}

/* ---------- Documentos y registros sanitarios ---------- */
async function subirDocumento(p,tipo,archivo){
  if(!archivo)return;
  if(!HAY_ALMACEN){alert("Falta configurar en el servidor dónde se guardan los documentos (DOC_DIR).");return;}
  try{
    const r=await subir(p.sku,tipo,archivo.name,archivo);
    const d=await api("/productos/"+encodeURIComponent(p.sku));
    reemplazar(d.producto);cerrar();ficha(p.sku);
    if(r.ventas&&r.ventas.enviado)aviso("Ya estaba todo: salió el aviso a Ventas y Logística.","success");
    else if(r.falta&&r.falta.length)aviso("Guardado. Para avisarle a Ventas falta: "+r.falta.join(", ")+".");
  }catch(e){alert(e.message);}
}
function formRegistro(p){
  modal(`<div class="md-cab"><h1 class="pag">🩺 Habilitación MSP — ${esc(p.sku)}</h1><button class="btn sm" data-x>✕ Cerrar</button></div>
    <p class="pag-sub">Una renovación se carga como un registro nuevo: el anterior queda guardado con su documento.</p>
    <div class="dos">
      <label class="fd"><span>N.º de habilitación</span><input class="in" id="rNum" placeholder="Ej.: 12345/2026"></label>
      <label class="fd"><span>Vence</span><input class="in" id="rVence" type="date" value="${hoyISO()}"></label>
      <label class="fd"><span>Emitida (opcional)</span><input class="in" id="rEmit" type="date"></label>
      <label class="fd"><span>Documento (PDF)</span><input class="in" id="rDoc" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></label>
    </div>
    <label class="fd"><span>Nota (opcional)</span><input class="in" id="rNota" placeholder="Lo que haya que aclarar"></label>
    <div class="acc"><button class="btn g" data-x>Cancelar</button><button class="btn" id="rGuardar">Guardar</button></div>`);
  $("#rGuardar").onclick=async()=>{
    const numero=$("#rNum").value.trim(), vence=$("#rVence").value, emitido=$("#rEmit").value;
    if(!numero){alert("Falta el número de la habilitación.");return;}
    if(!vence){alert("Falta la fecha de vencimiento.");return;}
    const b=$("#rGuardar");b.disabled=true;b.textContent="Guardando…";
    try{
      let documentoId=null;
      const f=$("#rDoc").files[0];
      if(f){
        if(!HAY_ALMACEN)throw new Error("Falta configurar en el servidor dónde se guardan los documentos (DOC_DIR).");
        documentoId=(await subir(p.sku,"registro",f.name,f)).id;
      }
      const d=await api(`/productos/${encodeURIComponent(p.sku)}/registros`,
        {method:"POST",body:JSON.stringify({numero,vence,emitido:emitido||null,nota:$("#rNota").value.trim(),documentoId})});
      reemplazar(d.producto);cerrar();ficha(p.sku);
    }catch(e){alert(e.message);b.disabled=false;b.textContent="Guardar";}
  };

async function borrarRegistro(p,id){
  if(!confirm("¿Borrar este registro sanitario? Se borra solo si se cargó por error: una renovación no reemplaza a la anterior."))return;
  try{const d=await api("/registros/"+id,{method:"DELETE"});reemplazar(d.producto);cerrar();ficha(p.sku);}
  catch(e){alert(e.message);}
}

/* ---------- La ficha de alta en Excel ----------
   Son las dos hojas del formulario que usa Finanzas: "ALTA PRODUCTO", que es
   lo que Marianela carga en iDempiere, y "FICHA SKU", que ademas lleva el
   paletizado y las medidas en milimetros. Las celdas estan en el mismo lugar
   que en el formulario de papel para que se lea igual. */
const VENCIMIENTO_DIAS=p=>(p.vida!=null?Math.round(p.vida*365/12):null);
const VOLUMEN_L=p=>{const u=String(p.contenidoUM||"").toLowerCase();
  if(p.contenido==null)return null;
  if(u==="ml"||u==="cc")return Math.round(p.contenido)/1000;
  if(u==="l")return p.contenido;
  return null;};
const MM=v=>(v==null?null:Math.round(v*10));

function hojaAlta(p){
  const f=[];const poner=(fila,col,v)=>{f[fila]=f[fila]||[];f[fila][col]=v===undefined?null:v;};
  poner(1,0,"ALTA DE PRODUCTO");
  poner(3,0,"PRODUCTO");
  poner(4,0,"CODIGO");poner(4,1,String(p.sku));
  poner(5,0,"NOMBRE");poner(5,1,p.desc||"");
  poner(6,0,"NOTAS");poner(6,1,p.nota||"");
  poner(8,0,"Tipo de Producto");poner(8,1,p.tipoProducto||"");poner(8,3,'Marcar "ACTIVO"');
  poner(9,0,"Categoría del Impuesto");poner(9,1,p.categoriaImpuesto||"");poner(9,3,'Marcar "Maneja lista de materiales"');
  poner(10,0,"Impuesto Compra/Venta");poner(10,1,p.impuestoCV||"");
  poner(11,0,"Categoría de Producto");poner(11,1,p.categoriaProducto||"");poner(11,3,"Marca");poner(11,4,p.marca||"");
  poner(12,0,"Línea de Producto");poner(12,1,p.linea||"");poner(12,3,"Sublínea de Producto");poner(12,4,p.sublinea||"");
  poner(13,0,"Familia de Producto");poner(13,1,p.familia||"");poner(13,3,"Subfamilia de Producto");poner(13,4,p.subfamilia||"");
  poner(15,0,'Marcar "Se Compra" / "Se vende" / "Se almacena"');
  poner(17,0,"Unidades de Medida");
  poner(18,0,"Unidad de Medida");poner(18,1,p.umBase||"Unidad");
  poner(19,0,"Unidades por Funda/Caja");poner(19,1,p.unx??null);poner(19,3,"Unidades por Pallet");poner(19,4,p.unPal??null);
  poner(20,0,"Peso (unidad)");poner(20,1,p.pesoPT??null);poner(20,3,"Volumen (unidad)");poner(20,4,VOLUMEN_L(p));
  poner(22,0,'NOTA: A MEDIDA QUE VAYAMOS TENIENDO EL PRODUCTO TERMINADO IR COMPLETANDO EL CAMPO "Peso"/"Volumen"');
  poner(24,0,"CONVERSION UNIDAD DE MEDIDA");
  poner(25,0,"UNIDAD DE MEDIDA");poner(25,1,p.umBase||"Unidad");
  poner(26,0,"UM Destino");poner(26,1,p.umDestino||(p.unx?"CX"+p.unx:""));
  poner(27,0,"Factor de Destino a Base");poner(27,1,p.unx??null);poner(27,3,"(cantidad por funda o por caja)");
  poner(28,0,"TASA MULTIPLICADORA");poner(28,1,p.unx?Math.round(1/p.unx*1e7)/1e7:null);
  poner(31,0,"OTROS");
  poner(32,0,"CODIGO DE BARRAS EAN 13");poner(32,1,p.ean||"");poner(32,3,"(etiqueta)");
  poner(33,0,"CODIGO DUN 14");poner(33,1,p.dun||"");poner(33,3,"(funda/caja)");
  poner(34,0,"VENCIMIENTO");poner(34,1,VENCIMIENTO_DIAS(p));poner(34,3,"(dias)");
  return f;
}

  poner(25,0,"TASA MULTIPLICADORA");poner(25,1,p.unx?Math.round(1/p.unx*1e7)/1e7:null);
  poner(28,0,"OTROS");
  poner(29,0,"CODIGO DE BARRAS EAN 13");poner(29,1,p.ean||"");poner(29,3,"(etiqueta)");
  poner(30,0,"CODIGO DUN 14");poner(30,1,p.dun||"");poner(30,3,"(funda/caja)");
  poner(31,0,"VENCIMIENTO");poner(31,1,VENCIMIENTO_DIAS(p));
  poner(33,0,"MEDIDAS (mm)");
  poner(34,1,"LARGO");poner(34,2,"ANCHO");poner(34,3,"ALTURA");
  poner(35,0,"CAJA/FUNDA");poner(35,1,MM(p.cL));poner(35,2,MM(p.cA));poner(35,3,MM(p.cH));
  poner(36,0,"UNID");poner(36,1,MM(p.uL));poner(36,2,MM(p.uA));poner(36,3,MM(p.uH));
  // Lo que la ficha de papel no tenia y Finanzas pide igual
  poner(38,0,"HABILITACION MSP");poner(38,1,p.msp||"");
  poner(39,0,"N.º HABILITACION");poner(39,1,p.mspNum||"");
  poner(40,0,"VENCE HABILITACION");poner(40,1,p.mspVence?String(p.mspVence).slice(0,10):"");
  return f;
}
/* La ficha sale sobre la plantilla de Finanzas: el formulario en blanco que se
   sube una vez (migración 062). Se le escriben los valores en las celdas que
   van a mano y las fórmulas del propio formulario hacen el resto, así Marianela
   recibe siempre el mismo formato al que está acostumbrada. */
let PLANTILLA=null;
async function estadoPlantilla(){
  try{const d=await api("/plantilla/estado");PLANTILLA=d.hay?d.plantilla:null;}catch(e){PLANTILLA=null;}
}
/* Las celdas que se escriben. El resto del formulario son formulas:
   E20 (unidades por pallet) y B29 (tasa multiplicadora) en ALTA PRODUCTO, y
   casi toda la hoja FICHA SKU, que se completa desde la primera. */
const CELDAS_ALTA=p=>({
  B5:String(p.sku), B6:p.desc||"", B7:p.nota||"",
  B9:p.tipoProducto||"", B10:p.categoriaImpuesto||"", B11:p.impuestoCV||"",
  B12:p.categoriaProducto||"", E12:p.marca||"", B13:p.linea||"", E13:p.sublinea||"",
  B14:p.familia||"", E14:p.subfamilia||"",
  B19:p.umBase||"Unidad", B20:p.unx??null, B21:p.pesoPT??null, E21:VOLUMEN_L(p),
  B26:p.umBase||"Unidad", B27:p.umDestino||(p.unx?"CX"+p.unx:""), B28:p.unx??null,
  B33:p.ean||"", B34:p.dun||"", B35:VENCIMIENTO_DIAS(p)});
const CELDAS_SKU=p=>({
  B16:p.estiba??null, B17:p.porPiso??null,
  B36:MM(p.cL), C36:MM(p.cA), D36:MM(p.cH),
  B37:MM(p.uL), C37:MM(p.uA), D37:MM(p.uH)});

async function libroDesdePlantilla(p){
  if(!window.ExcelJS||!PLANTILLA)return null;
  const r=await fetch(API+"/plantilla",{credentials:"same-origin"});
  if(!r.ok)return null;
  const wb=new ExcelJS.Workbook();
  await wb.xlsx.load(await r.arrayBuffer());
  const poner=(hoja,celdas)=>{const ws=wb.getWorksheet(hoja);if(!ws)return false;
    Object.entries(celdas).forEach(([c,v])=>{ws.getCell(c).value=(v===""||v===undefined?null:v);});
    return true;};
  if(!poner("ALTA PRODUCTO",CELDAS_ALTA(p)))return null;   // no es la plantilla esperada
  poner("FICHA SKU",CELDAS_SKU(p));
  // Que Excel recalcule las fórmulas del formulario al abrirlo
  wb.calcProperties=Object.assign({},wb.calcProperties,{fullCalcOnLoad:true});
  return new Blob([await wb.xlsx.writeBuffer()],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
/** La ficha: sobre la plantilla si está cargada, dibujada si todavía no. */
async function libroFicha(p){
  try{const b=await libroDesdePlantilla(p);if(b)return b;}
  catch(e){console.error("No se pudo usar la plantilla:",e);}
  return libroDibujado(p);
}
/** Sin plantilla: los mismos datos en las mismas celdas, sin el formato. */
function libroDibujado(p){
  if(!window.XLSX)throw new Error("Para armar la ficha en Excel hace falta conexión a internet (se usa la librería de Excel).");
  const wb=XLSX.utils.book_new();
  const h1=XLSX.utils.aoa_to_sheet(hojaAlta(p));h1["!cols"]=[{wch:30},{wch:42},{wch:4},{wch:28},{wch:22}];
  const h2=XLSX.utils.aoa_to_sheet(hojaSku(p));h2["!cols"]=[{wch:30},{wch:42},{wch:12},{wch:28},{wch:22}];
  XLSX.utils.book_append_sheet(wb,h1,"ALTA PRODUCTO");
  XLSX.utils.book_append_sheet(wb,h2,"FICHA SKU");
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const nombreFicha=p=>`${p.sku} ${String(p.desc||"").replace(/[\\/:*?"<>|]/g,"").slice(0,60)}.xlsx`.trim();

function bajarArchivo(blob,nombre){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function bajarFichaAlta(p){
  try{bajarArchivo(await libroFicha(p),nombreFicha(p));}catch(e){alert(e.message);}
}
/** Arma la ficha y la deja guardada: es la que se le manda a Finanzas. */
async function generarYSubirFicha(p){
  if(!HAY_ALMACEN)throw new Error("Falta configurar en el servidor dónde se guardan los documentos (DOC_DIR): sin eso no se puede mandar la ficha.");
  await subir(p.sku,"ficha",nombreFicha(p),await libroFicha(p));
}
